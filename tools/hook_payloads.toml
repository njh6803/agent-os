# --- hook_push_behind_main (PreToolUse Bash|PowerShell) ---
# 둘 다 origin 이 임시 bare 저장소라 네트워크와 이 저장소의 브랜치에 기대지 않는다. 침묵은 같은 뒤처진 저장소에서
# 지우는 푸시라, 뒤처짐이 아니라 명령 판정에서 걸러지는 것을 본다.
[[case]]
hook = "hook_push_behind_main.py"
expect = "deny"
note = "origin/main 보다 한 커밋 뒤처진 작업 브랜치의 첫 푸시 — 이 세션이 PR 을 열 때 친 모양"
payload = { tool_name = "Bash", tool_input = { command = "git push -u origin chore/x" }, cwd = "${BEHIND_REPO}" }

[[case]]
hook = "hook_push_behind_main.py"
expect = "silent"
note = "실제로 친 병합 뒤 원격 브랜치 지우기(일지 2026-10-13-38) — 뒤처진 저장소에서도 막지 않는다"
payload = { tool_name = "Bash", tool_input = { command = "git push origin --delete chore/ci-wait-background" }, cwd = "${BEHIND_REPO}" }

[[case]]
hook = "hook_push_behind_main.py"
expect = "silent"
note = "셀프 리뷰의 명세 축 리뷰어가 확인하려고 친 도움말 — 뒤처진 저장소에서도 푸시하지 않는다(대기열 300, 일지 2026-10-16-27)"
payload = { tool_name = "Bash", tool_input = { command = "git push -h" }, cwd = "${BEHIND_REPO}" }

# --- hook_push_delete_open_pr (PreToolUse Bash|PowerShell) ---
# origin 이 임시 bare 저장소라 훅은 gh 대신 ls-remote 의 merge ref 로 열린 PR 을 가린다. 네트워크에 기대지 않는다.
# 침묵은 병합이 끝난 뒤의 실제 지우기다. 그 원격에는 PR 의 ref 가 없다.
[[case]]
hook = "hook_push_delete_open_pr.py"
expect = "deny"
contains = ["#7", "pulls/7 -f state=closed"]
note = "병합과 한 묶음으로 보낸 원격 브랜치 지우기(대기열 262, 일지 2026-10-15-01 의 꼴. 번호와 커밋은 재구성)"
payload = { tool_name = "Bash", tool_input = { command = "gh pr merge 7 --squash --match-head-commit abc && git push origin --delete chore/x" }, cwd = "${OPEN_PR_REPO}" }

[[case]]
hook = "hook_push_delete_open_pr.py"
expect = "deny"
contains = ["#7"]
note = "PowerShell 의 지우기 refspec — 매처의 둘째 도구"
payload = { tool_name = "PowerShell", tool_input = { command = "git push origin :chore/x" }, cwd = "${OPEN_PR_REPO}" }

[[case]]
hook = "hook_push_delete_open_pr.py"
expect = "deny"
contains = ["#7"]
note = "원격 앞에 `=` 없이 쓴 --recurse-submodules — git 이 다음 낱말을 값으로 먹는다(대기열 296. 첫 판은 그 값을 원격으로 읽어 지나갔다)"
payload = { tool_name = "Bash", tool_input = { command = "git push --recurse-submodules check origin --delete chore/x" }, cwd = "${OPEN_PR_REPO}" }

[[case]]
hook = "hook_push_delete_open_pr.py"
expect = "silent"
note = "실제로 친 병합 뒤 원격 브랜치 지우기(일지 2026-10-13-38) — 열린 PR 이 없다"
payload = { tool_name = "Bash", tool_input = { command = "git push origin --delete chore/ci-wait-background" }, cwd = "${BEHIND_REPO}" }

[[case]]
hook = "hook_push_delete_open_pr.py"
expect = "silent"
note = "열린 PR 의 머리를 지우는 꼴에 도움말을 붙였다 — git 이 사용법을 내고 끝나 지우지 않는다(대기열 300)"
payload = { tool_name = "Bash", tool_input = { command = "git push -h origin --delete chore/x" }, cwd = "${OPEN_PR_REPO}" }

