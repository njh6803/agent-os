# 훅 페이로드 표. tools/run_hooks.py 가 훅마다 자식을 띄워 기대와 대조한다(pre-commit, always_run).
# 훅 하나에 발동 하나와 침묵 하나 이상. 침묵은 그 훅이 실제로 받을 입력 중 발동하지 말아야 할 것으로(반례의 축을 빼지 않게).
# 자리표시자 ${ROOT} ${MAIN_REPO} ${WORK_REPO} ${UNPUSHED_REPO} ${NEW_TRANSCRIPT} ${USED_TRANSCRIPT} ${MIDTURN_TRANSCRIPT} ${KOREAN_HEREDOC_45} ${RUFF_PROJECT} ${LOOSE_PY} ${OPEN_JOURNAL} ${CLOSED_JOURNAL} 는 러너가 채운다.
# 러너는 자식 환경에서 CLAUDE_CODE_ENTRYPOINT 를 벗긴다. SDK 세션의 침묵(hook_stop_korean, hook_midturn_korean)은 표가 아니라 tests/tools 가 본다.
# 기대: deny | block | context | silent. 왜 그 기대인지는 각 훅의 독스트링이 원천이고 note 는 한 줄 표지다.

# --- hook_env_read (PreToolUse Bash|Grep) ---
[[case]]
hook = "hook_env_read.py"
expect = "deny"
note = "cat .env"
payload = { tool_name = "Bash", tool_input = { command = "cat .env" } }

[[case]]
hook = "hook_env_read.py"
expect = "deny"
note = "경로 없는 저장소 전체 grep"
payload = { tool_name = "Bash", tool_input = { command = "grep -rn ANTHROPIC ." } }

[[case]]
hook = "hook_env_read.py"
expect = "deny"
note = "Grep 도구의 .env 경로"
payload = { tool_name = "Grep", tool_input = { pattern = "KEY", path = ".env" } }

[[case]]
hook = "hook_env_read.py"
expect = "silent"
note = ".env.example 은 허용"
payload = { tool_name = "Bash", tool_input = { command = "cat .env.example" } }

[[case]]
hook = "hook_env_read.py"
expect = "silent"
note = "LLM 테스트의 --env-file 은 읽기가 아니다"
payload = { tool_name = "Bash", tool_input = { command = "uv run --env-file .env pytest -m llm" } }

[[case]]
hook = "hook_env_read.py"
expect = "silent"
note = "Grep 도구의 하위 경로"
payload = { tool_name = "Grep", tool_input = { pattern = "KEY", path = "src" } }

# --- hook_git_main_commit (PreToolUse Bash|PowerShell) ---
[[case]]
hook = "hook_git_main_commit.py"
expect = "deny"
note = "main 위의 커밋"
payload = { tool_name = "Bash", tool_input = { command = "git add -A && git commit -m 'feat: x'" }, cwd = "${MAIN_REPO}" }

[[case]]
hook = "hook_git_main_commit.py"
expect = "silent"
note = "작업 브랜치의 커밋 — 이 저장소의 브랜치가 아니라 임시 저장소라 어디서 돌려도 같다"
payload = { tool_name = "Bash", tool_input = { command = "git commit -m 'feat: x'" }, cwd = "${WORK_REPO}" }

[[case]]
hook = "hook_git_main_commit.py"
expect = "silent"
note = "문자열 안의 git commit"
payload = { tool_name = "Bash", tool_input = { command = "echo 'git commit 은 나중에'" }, cwd = "${MAIN_REPO}" }

# --- hook_pr_head_sync (PreToolUse Bash|PowerShell) ---
# 발동은 선택자 없는 요청이라 gh 를 부르기 전에 로컬에서 판정한다. gh 의 길은 네트워크라 발동으로 두지 않는다.
# 침묵 둘은 실제로 친 명령이다. 둘 다 명령 판정(`--undo`, 언급 없음)에서 걸러져 git 도 gh 도 부르지 않는다.
[[case]]
hook = "hook_pr_head_sync.py"
expect = "deny"
note = "푸시하지 않은 커밋 위에서 선택자 없이 ready(대기열 86)"
payload = { tool_name = "Bash", tool_input = { command = "gh pr ready" }, cwd = "${UNPUSHED_REPO}" }

[[case]]
hook = "hook_pr_head_sync.py"
expect = "deny"
note = "PowerShell 로 남긴 CodeRabbit 요청 — 매처의 둘째 도구"
payload = { tool_name = "PowerShell", tool_input = { command = "gh pr comment --body \"@coderabbitai review\"" }, cwd = "${UNPUSHED_REPO}" }

[[case]]
hook = "hook_pr_head_sync.py"
expect = "silent"
note = "실제로 친 draft 되돌리기(PR #78 세션)"
payload = { tool_name = "Bash", tool_input = { command = "gh pr ready 78 --undo 2>&1 | tail -1 && uv run pip list 2>/dev/null | grep -i pytest" }, cwd = "${UNPUSHED_REPO}" }

[[case]]
hook = "hook_pr_head_sync.py"
expect = "silent"
note = "실제로 남긴, CodeRabbit 을 부르지 않는 코멘트(PR #94 세션)"
payload = { tool_name = "Bash", tool_input = { command = "gh pr comment 94 --body \"claude-review 둘을 d3bf5bd 로 반영했다. GIT_* 목록은 tools/run_hooks.py 의 REPO_LOCATION_VARS 하나가 원천이고 tests/conftest.py 가 import 한다. CLI 진입점 테스트 둘은 이미 import 한 ROOT 를 쓴다.\"" }, cwd = "${UNPUSHED_REPO}" }

