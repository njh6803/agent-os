[[case]]
hook = "hook_git_main_commit.py"
expect = "silent"
note = "커밋이 없는 저장소의 main 위의 첫 커밋 — KICKOFF.md 8단계의 명령"
payload = { tool_name = "Bash", tool_input = { command = 'git add -A && git commit -m "chore: 하네스 킥오프 (헌법, CLAUDE.md, 코딩 표준, 스킬)"' }, cwd = "${EMPTY_MAIN_REPO}" }

[[case]]
hook = "hook_git_main_commit.py"
expect = "silent"
note = "작업 브랜치의 커밋 — 이 저장소의 브랜치가 아니라 임시 저장소라 어디서 돌려도 같다"
payload = { tool_name = "Bash", tool_input = { command = "git commit -m 'feat: x'" }, cwd = "${WORK_REPO}" }

[[case]]
hook = "hook_git_main_commit.py"
expect = "silent"
note = "문자열 안의 git commit"
payload = { tool_name = "Bash", tool_input = { command = "echo 'git commit 은 나중에'" }, cwd = "${MAIN_REPO}" }

# --- hook_pr_head_sync (PreToolUse Bash|PowerShell) ---
# 발동은 선택자 없는 요청이라 gh 를 부르기 전에 로컬에서 판정한다. gh 의 길은 네트워크라 발동으로 두지 않는다.
# 침묵 둘은 실제로 친 명령이다. 둘 다 명령 판정(`--undo`, 언급 없음)에서 걸러져 git 도 gh 도 부르지 않는다.
[[case]]
hook = "hook_pr_head_sync.py"
expect = "deny"
note = "푸시하지 않은 커밋 위에서 선택자 없이 ready(대기열 86)"
payload = { tool_name = "Bash", tool_input = { command = "gh pr ready" }, cwd = "${UNPUSHED_REPO}" }

[[case]]
hook = "hook_pr_head_sync.py"
expect = "deny"
note = "PowerShell 로 남긴 CodeRabbit 요청 — 매처의 둘째 도구"
payload = { tool_name = "PowerShell", tool_input = { command = "gh pr comment --body \"@coderabbitai review\"" }, cwd = "${UNPUSHED_REPO}" }

[[case]]
hook = "hook_pr_head_sync.py"
expect = "silent"
note = "실제로 친 draft 되돌리기(PR #78 세션)"
payload = { tool_name = "Bash", tool_input = { command = "gh pr ready 78 --undo 2>&1 | tail -1 && uv run pip list 2>/dev/null | grep -i pytest" }, cwd = "${UNPUSHED_REPO}" }

[[case]]
hook = "hook_pr_head_sync.py"
expect = "silent"
note = "실제로 남긴, CodeRabbit 을 부르지 않는 코멘트(PR #94 세션)"
payload = { tool_name = "Bash", tool_input = { command = "gh pr comment 94 --body \"claude-review 둘을 d3bf5bd 로 반영했다. GIT_* 목록은 tools/run_hooks.py 의 REPO_LOCATION_VARS 하나가 원천이고 tests/conftest.py 가 import 한다. CLI 진입점 테스트 둘은 이미 import 한 ROOT 를 쓴다.\"" }, cwd = "${UNPUSHED_REPO}" }

