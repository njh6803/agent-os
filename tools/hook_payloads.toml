expect = "block"
note = "사용자가 '한국어로 말해줘'라고 고친 답(일지 2026-10-01-07)"
payload = { hook_event_name = "Stop", stop_hook_active = false, last_assistant_message = "The new comment is just CodeRabbit confirming it received the review request, so there's nothing to fix or reply to. All three checks for `98f1ed0` (`verify`, `claude-review`, CodeRabbit) are still running. When they finish, I'll check the results, merge, and finish journal 07." }

[[case]]
hook = "hook_stop_korean.py"
expect = "silent"
note = "식별자가 섞인 한국어 답 — 비율 0.391, 막지 않은 답 724개 중 둘째로 낮다(가장 낮은 0.340 은 스킬 이름 목록, 트랜스크립트 39159309, 2026-10-01 측정)"
payload = { hook_event_name = "Stop", stop_hook_active = false, last_assistant_message = "새 커밋의 CI가 통과했습니다. Claude Code Review와 CodeRabbit을 기다립니다." }

[[case]]
hook = "hook_stop_korean.py"
expect = "silent"
note = "멈춤을 한 번 막은 뒤의 Stop — stop_hook_active 가 참(stop_payload 탐침)"
payload = { hook_event_name = "Stop", stop_hook_active = true, last_assistant_message = "Now merge." }

