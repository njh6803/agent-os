payload = { tool_name = "AskUserQuestion", tool_input = { questions = [ { question = "어느 쪽으로 할까요?", header = "탐침", options = [ { label = "빨강", description = "서버 하나에 약 4.5초가 든다." }, { label = "파랑", description = "지금 코드는 그대로 둔다." } ], multiSelect = false } ] } }

[[case]]
hook = "hook_choice_facts.py"
expect = "silent"
note = "선택 화면이 아닌 도구 — 매처를 넓혀도 도구 이름으로 거른다"
payload = { tool_name = "Skill", tool_input = { skill = "grill-with-docs", args = "admin-foo" } }

# --- hook_session_web_deps (SessionStart startup|resume) ---
# 러너는 CLAUDE_CODE_REMOTE 를 벗긴다. 클라우드 사례만 env 로 그 값과 CLAUDE_PROJECT_DIR 을 준다.
[[case]]
hook = "hook_session_web_deps.py"
expect = "context"
note = "클라우드 세션의 이어짐, cwd 가 루트 아래 — 루트를 CLAUDE_PROJECT_DIR 로 찾고, 픽스처 저장소에 git 훅을 깐 뒤 잠금 파일이 어긋나 web 설치가 실패해 알린다"
env = { CLAUDE_CODE_REMOTE = "true", CLAUDE_PROJECT_DIR = "${BROKEN_WEB}" }
payload = { hook_event_name = "SessionStart", source = "resume", cwd = "${BROKEN_WEB}/web" }

[[case]]
hook = "hook_session_web_deps.py"
expect = "silent"
note = "로컬 세션의 시작(CLAUDE_CODE_REMOTE 없음) — 아무것도 하지 않는다"
payload = { hook_event_name = "SessionStart", source = "startup", cwd = "${BROKEN_WEB}" }

# --- hook_session_usage (SessionStart startup|resume|clear|compact|fork) ---
# 러너는 CLAUDE_CODE_SESSION_ATTENDED 를 벗긴다. 사례마다 CLAUDE_PROJECT_DIR 을 ${USAGE_REPO} 로, 홈(USERPROFILE·HOME)을 ${USAGE_HOME} 으로 줘 실제 장부와 요약의 표지, 사람의 .claude.json 에 닿지 않는다.
# 세 사례가 한 요약을 나눠 쓴다. 헤드리스 사례를 발동 사례 앞에 둔다 — 헤드리스가 표지를 가져가면 발동 사례가 침묵으로 어긋난다.
# 페이로드의 모양은 .scratch/token-usage/probes/session_start_payload/start.jsonl 이다(헤드리스에는 model 이 없었다).
[[case]]
hook = "hook_session_usage.py"
expect = "silent"
note = "데스크톱 세션 안에서 띄운 claude -p(카나리아)의 시작 — 계정만 남기고 요약의 표지를 가져가지 않는다"
env = { CLAUDE_PROJECT_DIR = "${USAGE_REPO}", USERPROFILE = "${USAGE_HOME}", HOME = "${USAGE_HOME}", CLAUDE_CODE_SESSION_ATTENDED = "0" }
payload = { session_id = "66655714-0000-0000-0000-000000000001", transcript_path = "${USAGE_HOME}/66655714-0000-0000-0000-000000000001.jsonl", cwd = "${USAGE_REPO}", hook_event_name = "SessionStart", source = "startup" }

[[case]]
hook = "hook_session_usage.py"
expect = "notice"
contains = ["보고서 날짜:", "경보 없음"]
note = "새 요약 뒤 처음 시작한 대화형 세션 — 요약을 사람에게만 보인다"
env = { CLAUDE_PROJECT_DIR = "${USAGE_REPO}", USERPROFILE = "${USAGE_HOME}", HOME = "${USAGE_HOME}", CLAUDE_CODE_SESSION_ATTENDED = "1" }
payload = { session_id = "9ff05852-0000-0000-0000-000000000002", transcript_path = "${USAGE_HOME}/9ff05852-0000-0000-0000-000000000002.jsonl", cwd = "${USAGE_REPO}", hook_event_name = "SessionStart", source = "startup", model = "claude-opus-5-5" }

[[case]]
hook = "hook_session_usage.py"
expect = "silent"
note = "이어 하기 — 계정만 남긴다"
env = { CLAUDE_PROJECT_DIR = "${USAGE_REPO}", USERPROFILE = "${USAGE_HOME}", HOME = "${USAGE_HOME}", CLAUDE_CODE_SESSION_ATTENDED = "1" }
payload = { session_id = "9ff05852-0000-0000-0000-000000000002", transcript_path = "${USAGE_HOME}/9ff05852-0000-0000-0000-000000000002.jsonl", cwd = "${USAGE_REPO}", hook_event_name = "SessionStart", source = "resume", model = "claude-opus-5-5" }

# --- hook_worktree_skill_overrides (PostToolUse EnterWorktree) ---
# 페이로드의 모양은 claude 2.1.303 의 `claude -p` 세션에서 PostToolUse 훅이 받은 EnterWorktree 입력이다(일지 2026-10-19-14). 사례마다 CLAUDE_PROJECT_DIR 을 ${WORKTREE_SKILLS_REPO} 로 줘 이 저장소의 local 설정에 닿지 않는다.
[[case]]
hook = "hook_worktree_skill_overrides.py"
expect = "notice"
contains = ["스킬 사본 2개", ".claude/settings.local.json"]
note = "주 체크아웃에서 워크트리 side 에 들어갔다 — 사본 둘을 끄는 키를 적고 사람에게만 알린다"
env = { CLAUDE_PROJECT_DIR = "${WORKTREE_SKILLS_REPO}" }
payload = { session_id = "ea9c8772-0000-0000-0000-000000000003", cwd = "${WORKTREE_SKILLS_REPO}/.claude/worktrees/side", hook_event_name = "PostToolUse", tool_name = "EnterWorktree", tool_input = { path = "${WORKTREE_SKILLS_REPO}/.claude/worktrees/side" }, tool_response = { worktreePath = "${WORKTREE_SKILLS_REPO}/.claude/worktrees/side", worktreeBranch = "side", message = "Entered worktree at “${WORKTREE_SKILLS_REPO}/.claude/worktrees/side” on branch “side”." }, tool_use_id = "toolu_01Qjqeu14hRffGRpJVDuRNHy" }

[[case]]
hook = "hook_worktree_skill_overrides.py"
expect = "silent"
note = "클라우드 세션의 같은 진입 — 그 체크아웃에는 local 을 무시하는 ignore 가 없어 쓰지 않는다"
env = { CLAUDE_PROJECT_DIR = "${WORKTREE_SKILLS_REPO}", CLAUDE_CODE_REMOTE = "true" }
payload = { session_id = "ea9c8772-0000-0000-0000-000000000004", cwd = "${WORKTREE_SKILLS_REPO}/.claude/worktrees/side", hook_event_name = "PostToolUse", tool_name = "EnterWorktree", tool_input = { path = "${WORKTREE_SKILLS_REPO}/.claude/worktrees/side" }, tool_response = { worktreePath = "${WORKTREE_SKILLS_REPO}/.claude/worktrees/side", worktreeBranch = "side", message = "Entered worktree at “${WORKTREE_SKILLS_REPO}/.claude/worktrees/side” on branch “side”." }, tool_use_id = "toolu_01Qjqeu14hRffGRpJVDuRNHz" }

[[case]]
hook = "hook_worktree_skill_overrides.py"
expect = "silent"
note = "주 체크아웃의 워크트리 자리 밖에 판 워크트리에 들어갔다 — 목록이 붙일 접두를 몰라 적지 않는다"
env = { CLAUDE_PROJECT_DIR = "${WORKTREE_SKILLS_REPO}" }
payload = { session_id = "ea9c8772-0000-0000-0000-000000000005", cwd = "${MAIN_REPO}", hook_event_name = "PostToolUse", tool_name = "EnterWorktree", tool_input = { path = "${MAIN_REPO}" }, tool_response = { worktreePath = "${MAIN_REPO}", worktreeBranch = "main", message = "Entered worktree at “${MAIN_REPO}” on branch “main”." }, tool_use_id = "toolu_01Qjqeu14hRffGRpJVDuRNH0" }
