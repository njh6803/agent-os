# 훅 페이로드 표. tools/run_hooks.py 가 훅마다 자식을 띄워 기대와 대조한다(pre-commit, always_run).
# 훅 하나에 발동 하나와 침묵 하나 이상. 침묵은 그 훅이 실제로 받을 입력 중 발동하지 말아야 할 것으로(반례의 축을 빼지 않게).
# 문자열 값의 자리표시자(${...})는 러너가 채운다. 목록과 뜻은 tools/run_hooks.py 의 모듈 독스트링이 원천이다.
# 러너는 자식 환경에서 CLAUDE_CODE_ENTRYPOINT 를 벗긴다. SDK 세션의 침묵(hook_stop_korean, hook_midturn_korean)은 표가 아니라 tests/tools 가 본다.
# 기대: deny | block | context | notice | silent. notice 는 사용자에게만 가는 systemMessage 하나다(additionalContext 가 함께 있으면 context). 왜 그 기대인지는 각 훅의 독스트링이 원천이고 note 는 한 줄 표지다.
# 선택 칸 contains 는 훅이 낸 문장(이유·계기)에 모두 들어야 하는 조각이다. 사례가 재려는 동작이 판정의 종류만으로 갈리지 않을 때 단다 — 옛 훅도 같은 종류를 낸 지시문 사례가 그랬다(대기열 130). 침묵 사례에는 둘 수 없다.

# --- hook_env_read (PreToolUse Bash|Grep) ---
[[case]]
hook = "hook_env_read.py"
expect = "deny"
note = "cat .env"
payload = { tool_name = "Bash", tool_input = { command = "cat .env" } }

[[case]]
hook = "hook_env_read.py"
expect = "deny"
note = "경로 없는 저장소 전체 grep"
payload = { tool_name = "Bash", tool_input = { command = "grep -rn ANTHROPIC ." } }

[[case]]
hook = "hook_env_read.py"
expect = "deny"
note = "Grep 도구의 .env 경로"
payload = { tool_name = "Grep", tool_input = { pattern = "KEY", path = ".env" } }

[[case]]
hook = "hook_env_read.py"
expect = "silent"
note = ".env.example 은 허용"
payload = { tool_name = "Bash", tool_input = { command = "cat .env.example" } }

[[case]]
hook = "hook_env_read.py"
expect = "silent"
note = "LLM 테스트의 --env-file 은 읽기가 아니다"
payload = { tool_name = "Bash", tool_input = { command = "uv run --env-file .env pytest -m llm" } }

[[case]]
hook = "hook_env_read.py"
expect = "silent"
note = "Grep 도구의 하위 경로"
payload = { tool_name = "Grep", tool_input = { pattern = "KEY", path = "src" } }

[[case]]
hook = "hook_env_read.py"
expect = "deny"
note = "Claude Code 가 묻지 않고 돌린 읽기 명령의 glob 읽기를 래퍼 옵션 뒤에 둔 모양(대기열 162, review_git_read.py 의 `column .gi*/config` 를 .env 로)"
payload = { tool_name = "Bash", tool_input = { command = "nice -n5 column -t .e*" } }

[[case]]
hook = "hook_env_read.py"
expect = "silent"
note = "래퍼 `command` 의 -v 는 명령을 찾기만 하고 돌리지 않는다 — 찾을 이름 뒤에 .env 가 있어도 읽지 않는다"
payload = { tool_name = "Bash", tool_input = { command = "command -v column .env" } }

# --- hook_user_settings_read (PreToolUse Bash|PowerShell|Read|Grep) ---
# 대상의 경로만 풀고 파일은 열지 않는다. 사용자 설정을 읽지 않고도 판정이 갈린다.
[[case]]
hook = "hook_user_settings_read.py"
expect = "deny"
contains = ["키 이름만"]
note = "사용자 설정의 Read — update-config 가 사용자 범위에서 여는 자리"
payload = { tool_name = "Read", tool_input = { file_path = "${USER_HOME}/.claude/settings.json" } }

[[case]]
hook = "hook_user_settings_read.py"
expect = "deny"
contains = ["호출 전체가 돌지 않았다"]
note = "설정의 한 갈래를 통째로 출력(대기열 272. 사건의 명령은 공개 저장소라 일지가 적지 않아 같은 꼴로 재구성)"
payload = { tool_name = "PowerShell", tool_input = { command = "Get-Content $HOME\\.claude\\settings.json -Raw | ConvertFrom-Json | Select-Object -ExpandProperty env" } }

[[case]]
hook = "hook_user_settings_read.py"
expect = "silent"
note = "update-config 가 이 저장소에서 여는 프로젝트 설정(반례 축)"
payload = { tool_name = "Read", tool_input = { file_path = "${ROOT}/.claude/settings.json" } }

[[case]]
hook = "hook_user_settings_read.py"
expect = "silent"
note = "막을 때 안내하는 키 이름 명령(keys_command 의 꼴)"
payload = { tool_name = "Bash", tool_input = { command = "uv run python -c \"import json, pathlib; d = json.loads(pathlib.Path('${USER_HOME}/.claude/settings.json').read_text(encoding='utf-8')); print({k: sorted(v)[:20] if isinstance(v, dict) else type(v).__name__ for k, v in d.items()})\"" } }

# --- hook_git_main_commit (PreToolUse Bash|PowerShell) ---
