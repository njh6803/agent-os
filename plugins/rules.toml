# 운영자의 규칙 파일(ADR 0044). 에이전트가 도구를 부를 때마다 이 규칙으로 막고, 묻고, 그냥 부른다.
# 규칙 줄은 세 꼴이다. `add` 는 서버 가리지 않고 그 이름의 도구, `everything:*` 는 그 서버 플러그인의
# 모든 도구, `everything:add` 는 그 서버의 그 도구 하나다. 도구 이름의 `*` 는 패턴이다(`send_*`).
# 차례는 deny(막는다) → 에이전트 저자의 requires_approval(묻는다) → ask(묻는다) → allow(그냥 부른다)
# 이고, 어디에도 맞지 않으면 묻는다. 공통 표 `[common]` 과 에이전트 표 `[agents.<이름>]` 는 합집합이라
# 어느 표에 적었는지는 차례에 들지 않는다. allow 는 서버를 붙인 두 꼴만 온다.
schema_version = "1"

[agents.calc]
allow = ["everything:*"]

[agents.assistant]
allow = ["doc-search:search"]
ask = ["doc-search:get_document"]
deny = ["doc-search:list_knowledge_bases"]
