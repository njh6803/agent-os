[project]
name = "widget-admin"
version = "0.0.0"
description = "위젯 관리 서버. 위젯 설정을 자기 PostgreSQL에 두고 위젯이 토큰 없이 읽게 한다"
requires-python = "==3.12.*"
# 범위는 루트 pyproject.toml 의 같은 이름 줄과 같은 글자다. 잠금 파일이 하나라 같은 판이 깔리지만,
# 글자를 맞춰 두면 루트의 범위를 올릴 때 이 줄도 함께 보인다(ADR 0064). 개발 의존성은 두지 않는다.
# 루트의 개발 묶음 하나가 든다.
dependencies = [
    "fastapi>=0.140.8",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.1.8,<3",
    "asyncpg>=0.32,<1",
    "alembic>=1.20.1,<2",
]

[project.scripts]
widget-admin = "widget_admin.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/widget_admin"]
