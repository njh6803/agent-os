# 규칙 `.claude/rules/widget-admin.md` 에 더한 시작 점검 항목이 `paths` 에 맞는 파일(widget-admin/src/widget_admin/main.py)을
# Read 로 열 때 실리는지(widget-admin-server 티켓 03). 실험군은 규칙의 paths 안, 대조군은 밖(README.md)을 읽는다.
# 실험군은 이 체크아웃의 작업 트리(커밋 전), 대조군은 `--control-commit` 으로 꺼낸 병합 전 커밋이다.
# 최신 결과: 통과 4(2026-11-25, 이 PC, 규칙 파일을 커밋하기 전의 작업 트리로 돌렸다. 실험군 셋이 두 글을 그대로 옮겼고 대조군은 "없음"이었다).
# 돌리는 법: uv run python tools/canary.py --control-commit HEAD .scratch/widget-admin-server/probes/canary/widget_admin_rule_startup.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 위젯 관리 서버의 멈출 때의 글을 짓는 함수와 상수를 다루는 항목이 있으면 두 가지를 글자 그대로 옮겨라.
(1) 그 함수와 상수를 어떻게 두라고 했는지 적은 괄호 앞의 구절. (2) 시험에서 수명과 라우트를 각각 무엇으로 보라고 했는지 적은 문장 뒤의 짧은 문장.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["자리표시자로 부를 수 있게 공개로 둔다", "둘을 섞지 않는다"]
source = ".claude/rules/widget-admin.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "widget-admin/src/widget_admin/main.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
