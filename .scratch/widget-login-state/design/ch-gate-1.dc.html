<x-dc>

<div data-theme="nokcheong" data-mode="light" style="width: 416px; height: 800px; box-sizing: border-box; padding: 48px; background: var(--bg); color: var(--text); font-family: var(--sans);">

<x-import component-from-global-scope="AgentOsUi.Switch" label="다크 모드" checked="{{no}}"></x-import>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" disabled="{{yes}}">새 대화</x-import>

<div role="group" aria-label="로그인 상태" class="flex items-center gap-2 shrink-0" style="min-height: 48px; box-sizing: border-box; padding: var(--spacing-2) var(--spacing-2) var(--spacing-2) var(--spacing-4); border-bottom: 1px solid var(--border);">
<span class="text-small text-text-muted ellipsis" style="flex: 1;">로그인하지 않음</span>

<p class="text-body" style="margin: 0;">로그인하면 질문과 출력이 그 계정과 함께 기록됩니다.</p>
<div class="grid fill">
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary">로그인하고 질문하기</x-import>
</div>
</div>
