# release-image 명세가 고른 프록시 설정 조합(proxy_config 프로브). http 문맥에 실린다
# (/etc/nginx/conf.d/default.conf 자리에 얹는다). bridge_edge/nginx/edge.conf 에서 셋만 바꿨다.
# 1. 뒷단은 공유 메모리 영역(zone)을 둔 upstream 묶음이고, server 에 resolve 를 붙여 Docker 내장
#    DNS 에서 이름을 다시 푼다(ipv6=off 라 A 레코드만 묻는다).
# 2. 모든 proxy_pass 는 upstream 이름에 URI 를 붙인 꼴이라 nginx 가 정규화한 경로를 넘긴다(ADR 0024).
# 3. 토큰 끝점의 정규식 location 을 없애고, 빈도 제한의 열쇠를 map 으로 경로에 따라 가른다.
# 측정 전용으로 더한 것은 접근 기록 형식의 rid= 와 uri= 둘이고, up= 는 따옴표로 쌌다(nginx 가 여러
# 주소를 쉼표와 빈칸으로 잇는다). 뒷단의 이름과 포트, 수치는 bridge_edge 의 시제품과 같다.

log_format edge '$remote_addr [$time_iso8601] "$request" $status limit=$limit_req_status '
                'up="$upstream_addr" rid=$http_x_probe_rid uri="$uri"';

resolver 127.0.0.11 valid=5s ipv6=off;

upstream up_serve {
    zone up_serve 64k;
    server serve:8000 resolve;
}
upstream up_widget {
    zone up_widget 64k;
    server widget:3000 resolve;
}
upstream up_portal {
    zone up_portal 64k;
    server portal:3000 resolve;
}

# 토큰 끝점이면 접속 주소, 아니면 빈 값이다. 빈 열쇠의 요청은 세지 않는다(nginx limit_req 모듈 문서).
# $uri 는 nginx 가 정규화한 경로다(질의를 뺀다).
map $uri $portal_token_key {
    "~^/portal/sites/[^/]+/token$" $binary_remote_addr;
    default "";
}
limit_req_zone $portal_token_key zone=portal_token:10m rate=30r/m;

server_tokens off;

# 80 은 443 으로 넘기기만 한다.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    access_log /dev/stdout edge;

    return 308 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;
    access_log /dev/stdout edge;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # add_header 는 location 에 하나라도 적으면 server 의 것이 물려지지 않는다. location 에는 적지 않는다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 받은 값에 덧붙이지 않고 덮어쓴다(ADR 0024).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    limit_req_status 429;

    location /end-user/ {
        proxy_pass http://up_serve/end-user/;
    }

    location = /widget {
        proxy_pass http://up_widget/widget;
    }
    location /widget/ {
        proxy_pass http://up_widget/widget/;
    }

    location = / {
        proxy_pass http://up_portal/;
    }
    # 토큰 끝점도 이 location 이다. 열쇠가 빈 요청(토큰 끝점이 아닌 경로)은 세지 않는다.
    location /portal/ {
        limit_req zone=portal_token burst=10 nodelay;
        proxy_pass http://up_portal/portal/;
    }

    location = /end-user {
        return 404;
    }
    location = /portal {
        return 404;
    }

    location / {
        return 404;
    }
}
