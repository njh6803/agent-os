# 항목 10 의 양성 대조와 항목 0 의 대조(proxy_config 프로브). proxy.conf 에서 upstream 묶음과
# resolver 를 빼고 뒷단 이름을 proxy_pass 에 바로 쓴 꼴이다(bridge_edge/nginx/edge.conf 의 꼴).
# nginx 는 뜰 때 시스템 resolver(getaddrinfo)로 이름을 한 번 풀어 나온 주소(A 와 AAAA)를 모두 쓴다.
# 측정에 쓰는 세 location 만 두고, 접근 기록 형식은 proxy.conf 와 같다.

log_format edge '$remote_addr [$time_iso8601] "$request" $status limit=$limit_req_status '
                'up="$upstream_addr" rid=$http_x_probe_rid uri="$uri"';

server_tokens off;

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;
    access_log /dev/stdout edge;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /end-user/ {
        proxy_pass http://serve:8000/end-user/;
    }
    location /widget/ {
        proxy_pass http://widget:3000/widget/;
    }
    location /portal/ {
        proxy_pass http://portal:3000/portal/;
    }
    location / {
        return 404;
    }
}
