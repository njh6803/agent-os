# 측정 전용 덧씌움(항목 8). 프록시의 443 과 80 을 IPv4(0.0.0.0)에만 발행한다. 안쪽 네트워크는 IPv4
# 그대로다. `!override` 는 앞 파일들의 ports 목록을 잇지 않고 이것으로 바꾼다. 그래서 compose.probe.yml
# 의 8081 도 빠진다. 바뀌었는지는 run.py 가 `docker port` 로 본다(0.0.0.0 의 두 줄뿐이어야 떴다고 센다).

services:
  proxy:
    ports: !override
      - "0.0.0.0:443:8443"
      - "0.0.0.0:80:8080"
