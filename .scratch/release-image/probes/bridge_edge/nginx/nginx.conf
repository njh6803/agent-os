# 프록시 설정 시제품의 바깥 틀. 공식 nginx 이미지를 root 가 아닌 사용자(uid 101)로 돌릴 때 쓴다.
# 공식 이미지의 기본 nginx.conf 는 pid 와 임시 폴더를 root 만 쓰는 자리에 두므로 이 파일로 바꿔 끼운다.
# nginxinc/nginx-unprivileged 이미지는 제 기본 nginx.conf 가 같은 일을 하므로 이 파일 없이 edge.conf 만 얹는다.
# 잰 판은 같은 폴더의 README.md 에 있다.

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # root 가 아니면 /var/cache/nginx 에 쓰지 못한다. 임시 파일은 /tmp 아래에 둔다.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
