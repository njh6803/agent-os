# 프록시 설정 시제품. http 문맥에 실린다(/etc/nginx/conf.d/default.conf 자리에 얹는다).
# 뒷단의 이름과 포트(serve:8000, widget:3000, portal:3000)와 수치(빈도 제한, 본문 상한, HSTS 기간)는
# 측정을 위해 넣은 값이고 명세가 정한다. 무엇을 쟀는지는 같은 폴더의 README.md 에 있다.

log_format edge '$remote_addr [$time_iso8601] "$request" $status limit=$limit_req_status up=$upstream_addr';

# 접속 주소별 빈도 제한의 구역. 열쇠는 nginx 가 본 TCP 상대 주소다.
limit_req_zone $binary_remote_addr zone=portal_token:10m rate=30r/m;

server_tokens off;

# 80 은 443 으로 넘기기만 한다. 안으로는 아무것도 넘기지 않고 인증서 발급의 확인 경로도 두지 않는다.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    access_log /dev/stdout edge;

    return 308 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;
    access_log /dev/stdout edge;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # add_header 는 location 에 하나라도 적으면 server 의 것이 물려지지 않는다. location 에는 적지 않는다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 받은 값에 덧붙이지 않고 덮어쓴다(ADR 0024).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    limit_req_status 429;

    # 최종 사용자 접두사는 serve 로. proxy_pass 에 URI 를 붙여 nginx 가 정규화한 경로를 넘긴다(ADR 0024).
    location /end-user/ {
        proxy_pass http://serve:8000/end-user/;
    }

    # 위젯 경로는 위젯의 Next 로. 끝 슬래시 없는 경로는 정확히 맞춘다(ADR 0024).
    location = /widget {
        proxy_pass http://widget:3000/widget;
    }
    location /widget/ {
        proxy_pass http://widget:3000/widget/;
    }

    # 위젯 미리보기 페이지는 `= /` 와 `/portal/` 둘이다(ADR 0050).
    location = / {
        proxy_pass http://portal:3000/;
    }
    # 토큰 끝점. 정규식 location 의 proxy_pass 에는 URI 를 붙일 수 없어 받은 원문을 넘긴다.
    location ~ ^/portal/sites/[^/]+/token$ {
        limit_req zone=portal_token burst=10 nodelay;
        proxy_pass http://portal:3000;
    }
    location /portal/ {
        proxy_pass http://portal:3000/portal/;
    }

    # 접두사 location 이 proxy_pass 로 끝나면 nginx 는 끝 슬래시 없는 요청을 301 로 되돌린다. 404 로 막는다.
    location = /end-user {
        return 404;
    }
    location = /portal {
        return 404;
    }

    # 그 밖은 404 다. 관리 API 와 관리 화면은 넘기지 않는다.
    location / {
        return 404;
    }
}
