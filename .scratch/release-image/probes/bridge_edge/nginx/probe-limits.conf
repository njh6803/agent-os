# 측정 전용. 시제품이 아니다. 빈도 제한의 조합을 한 번에 재려고 조합마다 구역과 경로를 따로 둔다.
# 구역을 함께 쓰면 조합끼리 셈이 섞이므로 구역도 조합마다 하나다. 8081 은 평문이고 compose.probe.yml 이 발행한다.

limit_req_zone $binary_remote_addr zone=r10b0:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=r10b5:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=r30b10:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=r60b20:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=r60b3q:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=r60b0d:1m rate=60r/m;

server {
    listen 8081;
    listen [::]:8081;
    server_name _;
    access_log /dev/stdout edge;

    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /limit/r10b0/ {
        limit_req zone=r10b0;
        limit_req_status 429;
        proxy_pass http://portal:3000/portal/sites/demo/token;
    }
    location /limit/r10b5/ {
        limit_req zone=r10b5 burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://portal:3000/portal/sites/demo/token;
    }
    location /limit/r30b10/ {
        limit_req zone=r30b10 burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://portal:3000/portal/sites/demo/token;
    }
    location /limit/r60b20/ {
        limit_req zone=r60b20 burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://portal:3000/portal/sites/demo/token;
    }
    # nodelay 없음: burst 안의 요청을 거부하지 않고 속도에 맞춰 늦춘다.
    location /limit/r60b3q/ {
        limit_req zone=r60b3q burst=3;
        limit_req_status 429;
        proxy_pass http://portal:3000/portal/sites/demo/token;
    }
    # limit_req_status 를 적지 않은 기본값.
    location /limit/r60b0d/ {
        limit_req zone=r60b0d;
        proxy_pass http://portal:3000/portal/sites/demo/token;
    }
    # 제한을 걸지 않은 경로.
    location /free/ {
        proxy_pass http://portal:3000/portal/;
    }
    location / {
        return 404;
    }
}
