# release-image netns 프로브의 프록시 설정. compose.shared.yml 이 /etc/nginx/nginx.conf 로 얹는다.
#
# 8080 은 공개 면(app 으로), 8081 은 관리 면(admin 으로)이다. 둘 다 같은 네트워크 이름공간의 루프백 상류로 넘긴다.
# 접근 기록은 run.py 가 요청마다 붙인 rid 로 줄을 찾아 $remote_addr 를 읽는다. 오류 기록(notice)에서는
# limit_req 의 'limiting requests' 줄과 상류 연결 실패 줄을 찾는다. 둘 다 컨테이너의 표준 출력·오류로 낸다.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    default_type text/plain;
    log_format probe 'probe-access addr=$remote_addr listen=$server_port status=$status rid=$arg_rid';
    access_log /dev/stdout probe;

    # 접속 주소별 빈도 제한. 분당 2회(30초에 하나)이고 burst 가 없어, 받아들인 요청 뒤 30초 안의 요청은 거부된다.
    # 기본 상태 코드를 보는 구역과 limit_req_status 429 를 보는 구역을 따로 둔다(서로의 셈에 끼지 않게).
    limit_req_zone $binary_remote_addr zone=per_addr_default:1m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=per_addr_429:1m rate=2r/m;

    server {
        listen 8080;

        location / {
            proxy_pass http://127.0.0.1:8000;
        }

        location /limited-default/ {
            limit_req zone=per_addr_default;
            proxy_pass http://127.0.0.1:8000/;
        }

        location /limited-429/ {
            limit_req zone=per_addr_429;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8000/;
        }
    }

    server {
        listen 8081;

        location / {
            proxy_pass http://127.0.0.1:8001;
        }
    }
}
