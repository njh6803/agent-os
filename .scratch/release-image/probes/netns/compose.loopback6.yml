# release-image netns 프로브(덧붙인 항목 6): 이름공간 공유 배치에서 서버가 IPv6 루프백(::1)에만 묶일 때.
# 네 프로세스의 규칙이 127.0.0.1 과 ::1 을 모두 받으므로, ::1 쪽도 같은 배치에서 닿는지 본다.
# run.py 가 NETNS_* 환경 변수를 채워 띄운다.

services:
  proxy:
    image: ${NETNS_NGINX_IMAGE:?}
    pull_policy: never
    ports:
      - "127.0.0.1:${NETNS_LOOPBACK6_PORT:?}:8080"
    volumes:
      - ./nginx.loopback6.conf:/etc/nginx/nginx.conf:ro

  app6:
    image: ${NETNS_PYTHON_IMAGE:?}
    pull_policy: never
    init: true
    stop_grace_period: 2s
    network_mode: "service:proxy"
    environment:
      PROBE_TOKEN: ${NETNS_TOKEN:?}
    command:
      - sh
      - -c
      - >-
        mkdir -p /tmp/site &&
        printf 'app6:%s' "$$PROBE_TOKEN" > /tmp/site/marker.txt &&
        exec python -m http.server --bind ::1 --directory /tmp/site 8002
