# release-image netns 프로브: 프로세스마다 컨테이너를 두고, 모두가 proxy 의 네트워크 이름공간을 함께 쓰는 배치.
# run.py 가 NETNS_* 환경 변수(이미지, 포트, 회차 토큰)를 채워 띄운다. 항목 1·3·4·5 가 쓴다.
#
# - proxy  nginx. 호스트의 127.0.0.1 에만 포트 셋을 연다. 8080(공개 면), 8081(관리 면), 그리고 app 의 루프백
#          포트 8000 을 그대로 발행해 보는 갈래(항목 4. 닿지 않을 것으로 보고 잰다)
# - app    루프백(127.0.0.1:8000)에만 묶인 서버. proxy 의 이름공간을 빌린다
# - admin  루프백(127.0.0.1:8001)에만 묶인 둘째 서버. 바깥에 공개하지 않는 프로세스 노릇이다(프로필 full)
# - peer   compose 네트워크의 보통 컨테이너. 다른 주소에서 온 요청을 nginx 가 어떻게 보는지 대 본다(프로필 full)
#
# 서버는 시작할 때 /tmp/site/marker.txt 에 '<이름>:<회차 토큰>' 을 쓴다. run.py 는 그 본문으로 누가 답했는지 가른다.

x-server: &server
  image: ${NETNS_PYTHON_IMAGE:?}
  pull_policy: never
  init: true
  stop_grace_period: 2s
  command:
    - sh
    - -c
    - >-
      mkdir -p /tmp/site &&
      printf '%s:%s' "$$PROBE_WHO" "$$PROBE_TOKEN" > /tmp/site/marker.txt &&
      exec python -m http.server --bind "$$PROBE_BIND" --directory /tmp/site "$$PROBE_PORT"

services:
  proxy:
    image: ${NETNS_NGINX_IMAGE:?}
    pull_policy: never
    environment:
      # 값을 바꾸면 proxy 의 구성이 바뀐 것이 되어 `up -d` 가 proxy 를 다시 만든다(항목 3 의 갈래)
      PROBE_REV: ${NETNS_PROXY_REV:-0}
    ports:
      - "127.0.0.1:${NETNS_PUBLIC_PORT:?}:8080"
      - "127.0.0.1:${NETNS_ADMIN_PORT:?}:8081"
      - "127.0.0.1:${NETNS_DIRECT_PORT:?}:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  app:
    <<: *server
    network_mode: "service:proxy"
    environment:
      PROBE_WHO: app
      PROBE_TOKEN: ${NETNS_TOKEN:?}
      PROBE_BIND: 127.0.0.1
      PROBE_PORT: "8000"

  admin:
    <<: *server
    profiles: ["full"]
    network_mode: "service:proxy"
    environment:
      PROBE_WHO: admin
      PROBE_TOKEN: ${NETNS_TOKEN:?}
      PROBE_BIND: 127.0.0.1
      PROBE_PORT: "8001"

  peer:
    image: ${NETNS_PYTHON_IMAGE:?}
    pull_policy: never
    profiles: ["full"]
    init: true
    stop_grace_period: 2s
    command: ["sleep", "infinity"]
