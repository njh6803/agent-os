# release-image netns 프로브(항목 7)의 프록시 설정. compose.holder.yml 과 compose.reload-conf.yml 이
# /etc/nginx/nginx.conf 로 얹는다. nginx.conf 에서 빈도 제한을 빼고 8080 의 server 에 include 한 줄을 더했다.
#
# 8080 은 공개 면(app 으로), 8081 은 관리 면(admin 으로)이다. 둘 다 같은 네트워크 이름공간의 루프백 상류로 넘긴다.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    default_type text/plain;
    log_format probe 'probe-access addr=$remote_addr listen=$server_port status=$status rid=$arg_rid';
    access_log /dev/stdout probe;

    server {
        listen 8080;

        # 다시 읽기(nginx -s reload) 갈래가 컨테이너 안의 이 폴더에 location 하나를 써 넣는다. 처음에는 폴더가
        # 없어 아무것도 들이지 않는다(맞는 파일이 없는 무늬는 오류가 아니다).
        include /tmp/probe-extra/*.conf;

        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }

    server {
        listen 8081;

        location / {
            proxy_pass http://127.0.0.1:8001;
        }
    }
}
