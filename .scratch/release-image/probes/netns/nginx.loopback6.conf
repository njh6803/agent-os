# release-image netns 프로브(덧붙인 항목 6)의 프록시 설정. compose.loopback6.yml 이 /etc/nginx/nginx.conf 로 얹는다.
# 상류가 IPv6 루프백이다.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    default_type text/plain;
    access_log /dev/stdout;

    server {
        listen 8080;

        location / {
            proxy_pass http://[::1]:8002;
        }
    }
}
