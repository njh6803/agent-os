# 위젯 실행 중 값 프로브의 셋째 사이트 파일(measure.mjs 의 element 단계). 요청 글자 수 상한이 자리표다. 이 값으로 지은
# element.js 에서 자리표의 숫자를 다른 상한으로 바꿔 넣은 파일이, 그 상한으로 바로 지은 파일과 같은지 본다. 자리표는
# 끝에 0 이 없어 압축기가 지수 꼴로 줄이지 않고, 번들의 다른 자리에 나오지 않을 수로 골랐다. 허용 출처와 공개 키는
# sites_b.toml 과 같다(페이지 안 번들은 둘 다 읽지 않는다).
