# 변형 (다). upstream 블록의 server 에 resolve 를 주고 zone 을 둔다.
# nginx 가 resolver 로 이름을 주기적으로(valid) 다시 풀어 upstream 의 주소를 바꾼다.
# 오픈 소스 nginx 는 1.27.3 부터 받는다고 알려져 있다(프로브가 이 판에서 nginx -t 로 본다).
resolver 127.0.0.11 valid=5s ipv6=off;

upstream up_serve {
    zone up_serve 64k;
    server serve:8000 resolve;
}
upstream up_admin {
    zone up_admin 64k;
    server admin:3000 resolve;
}
upstream up_widget {
    zone up_widget 64k;
    server widget:3000 resolve;
}
upstream up_portal {
    zone up_portal 64k;
    server portal:3000 resolve;
}

server {
    listen 8080;

    location /serve/ {
        proxy_pass http://up_serve;
    }
    location /admin/ {
        proxy_pass http://up_admin;
    }
    location /widget/ {
        proxy_pass http://up_widget;
    }
    location /portal/ {
        proxy_pass http://up_portal;
    }
    location = /proxy-alive {
        return 200 "proxy-alive upstream\n";
    }
    location / {
        return 404;
    }
}
