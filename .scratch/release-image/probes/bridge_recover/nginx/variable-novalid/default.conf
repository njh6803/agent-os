# 변형 (나)의 갈래. valid 를 주지 않는다. nginx 는 DNS 응답의 TTL 동안 주소를 기억한다.
# valid 가 없으면 얼마나 오래 옛 주소를 쓰는지를 가르는 갈래다.
resolver 127.0.0.11 ipv6=off;

server {
    listen 8080;

    location /serve/ {
        set $backend_serve serve;
        proxy_pass http://$backend_serve:8000;
    }
    location /admin/ {
        set $backend_admin admin;
        proxy_pass http://$backend_admin:3000;
    }
    location /widget/ {
        set $backend_widget widget;
        proxy_pass http://$backend_widget:3000;
    }
    location /portal/ {
        set $backend_portal portal;
        proxy_pass http://$backend_portal:3000;
    }
    location = /proxy-alive {
        return 200 "proxy-alive variable-novalid\n";
    }
    location / {
        return 404;
    }
}
