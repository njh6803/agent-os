# 변형 (나). Docker 의 내장 DNS 를 resolver 로 두고 proxy_pass 에 변수를 쓴다.
# nginx 는 요청 때 이름을 풀고, 푼 주소를 valid 동안만 기억한다. 시작할 때는 이름을 풀지 않는다.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;

    location /serve/ {
        set $backend_serve serve;
        proxy_pass http://$backend_serve:8000;
    }
    location /admin/ {
        set $backend_admin admin;
        proxy_pass http://$backend_admin:3000;
    }
    location /widget/ {
        set $backend_widget widget;
        proxy_pass http://$backend_widget:3000;
    }
    location /portal/ {
        set $backend_portal portal;
        proxy_pass http://$backend_portal:3000;
    }
    location = /proxy-alive {
        return 200 "proxy-alive variable\n";
    }
    location / {
        return 404;
    }
}
