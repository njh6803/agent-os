# 변형 (가). 이름을 proxy_pass 에 그대로 쓴 정적 설정.
# nginx 는 설정을 읽을 때(시작, reload) 이름을 한 번 풀어 그 주소를 계속 쓴다.
# 공식 이미지의 /etc/nginx/nginx.conf 가 http 블록 안에서 이 파일을 include 한다.
server {
    listen 8080;

    location /serve/ {
        proxy_pass http://serve:8000;
    }
    location /admin/ {
        proxy_pass http://admin:3000;
    }
    location /widget/ {
        proxy_pass http://widget:3000;
    }
    location /portal/ {
        proxy_pass http://portal:3000;
    }
    location = /proxy-alive {
        return 200 "proxy-alive static\n";
    }
    location / {
        return 404;
    }
}
