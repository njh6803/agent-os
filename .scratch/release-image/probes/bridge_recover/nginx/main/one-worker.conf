# auto.conf 와 같고 작업 프로세스를 하나로 둔다(worker_processes 1).
# nginx 의 resolver 는 푼 주소를 작업 프로세스마다 따로 기억한다(어림. 코드는 읽지 않았다). 작업
# 프로세스가 여럿이면 조작 직전에 한 요청이 기억시킨 옛 주소를 다음 요청이 다른 프로세스에서 비켜
# 갈 수 있다. 하나로 두어 옛 주소를 기억한 프로세스가 다음 요청을 꼭 받게 하는 갈래다.
user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  probe  'probe-access uri=$request_uri status=$status upstream=$upstream_addr '
                       'upstream_status=$upstream_status took=$request_time pid=$pid';
    access_log  /var/log/nginx/access.log  probe;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
