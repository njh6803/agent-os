# 프록시의 주 설정(/etc/nginx/nginx.conf). 공식 이미지의 것과 같고 접근 기록의 모양만 다르다.
# nginx 가 실제로 건 상류 주소($upstream_addr)와 요청을 맡은 작업 프로세스($pid)를 찍는다.
# 프로브는 이 줄로 "nginx 가 옛 주소로 보냈다"를 본다. 상태 499 는 nginx 가 상류의 답을 기다리는
# 동안 요청한 쪽(프로브의 wget, 8초 제한)이 먼저 끊은 것이다.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  probe  'probe-access uri=$request_uri status=$status upstream=$upstream_addr '
                       'upstream_status=$upstream_status took=$request_time pid=$pid';
    access_log  /var/log/nginx/access.log  probe;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
