# 덧씌움. 뒷단 넷에 healthcheck 를 둔다. compose.depends*.yml 과 함께 쓴다.
x-health: &health
  test:
    - CMD
    - python
    - -c
    - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['BACKEND_PORT'] + '/health', timeout=2)"
  interval: 2s
  timeout: 3s
  retries: 60
  start_period: 0s

services:
  serve:
    healthcheck: *health
  admin:
    healthcheck: *health
  widget:
    healthcheck: *health
  portal:
    healthcheck: *health
