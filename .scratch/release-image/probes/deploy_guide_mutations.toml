# 단독 배포 안내와 틀의 정합 시험(티켓 10, `tests/tools/test_deploy_guide.py`)의 빨강을 본다. 시험은 안내를 쓴
# 뒤에 썼으므로 빨강을 본 적이 없다. 안내의 소유 명령이 컨테이너 사용자와 어긋나는 것, 필수 낱말이 빠지는
# 것, 저장소 안의 말이 새는 것, compose 가 우리 이미지에 user 를 더하는 것, 위젯 미리보기 페이지 설정의
# 개인 키 경로가 안내와 어긋나는 것을 하나씩 넣는다.
#
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/release-image/probes/deploy_guide_mutations.toml
#
# 표지는 단언의 메시지에 값이 실린 줄이다(`안내에 없는 명령: …`처럼 시험 원문에는 값 없이 조각으로만 있다).

[[mutation]]
name = "프록시 키의 그룹을 컨테이너 사용자와 다르게 적는다"
tests = ["tests/tools/test_deploy_guide.py", "-k", "소유의_그룹"]
expect = "red"
expect_output = ["안내에 없는 명령: sudo chown root:101 tls/privkey.pem"]

[[mutation.edit]]
file = "deploy/standalone/README.md"
old = '''
sudo chown root:101 tls/privkey.pem
'''
new = '''
sudo chown root:100 tls/privkey.pem
'''

[[mutation]]
name = "위젯 미리보기 페이지 개인 키의 그룹을 컨테이너 사용자와 다르게 적는다"
tests = ["tests/tools/test_deploy_guide.py", "-k", "소유의_그룹"]
expect = "red"
expect_output = ["안내에 없는 명령: sudo chown root:10001 portal/keys/portal.pem"]

[[mutation.edit]]
file = "deploy/standalone/README.md"
old = '''
sudo chown root:10001 portal/keys/portal.pem
'''
new = '''
sudo chown root:1000 portal/keys/portal.pem
'''

[[mutation]]
name = "서버 메모리 여유를 보라는 말에서 수치를 지운다"
tests = ["tests/tools/test_deploy_guide.py", "-k", "넘겨받은_항목"]
expect = "red"
expect_output = ["안내에 없는 항목: ['1.6GiB: 서버의 메모리']"]

[[mutation.edit]]
file = "deploy/standalone/README.md"
old = "메모리를 1.6GiB 가까이 씁니다"
new = "메모리를 많이 씁니다"

[[mutation]]
name = "안내에 저장소 안의 말을 흘린다"
tests = ["tests/tools/test_deploy_guide.py", "-k", "저장소_안의_말을_쓰지_않는다"]
expect = "red"
expect_output = ["안내에 샌 저장소 안의 말: ['ADR']"]

[[mutation.edit]]
file = "deploy/standalone/README.md"
old = "올리는 운영자를 위한 안내입니다."
new = "올리는 운영자를 위한 안내입니다. ADR 0056을 따릅니다."

[[mutation]]
name = "compose 가 우리 이미지에 user 를 더한다"
tests = ["tests/tools/test_deploy_guide.py", "-k", "user를_더하지"]
expect = "red"
expect_output = ["compose 가 user 를 더한 서비스: ['serve']"]

[[mutation.edit]]
file = "deploy/standalone/compose.yaml"
old = '''
    # 이미지의 기본 명령에는 --site-file 과 --host 가 없다. 명령을 바꾸면 전체를 적어야 한다.
'''
new = '''
    # 이미지의 기본 명령에는 --site-file 과 --host 가 없다. 명령을 바꾸면 전체를 적어야 한다.
    user: "1000:1000"
'''

[[mutation]]
name = "위젯 미리보기 페이지 설정의 개인 키 경로가 안내와 어긋난다"
tests = ["tests/tools/test_deploy_guide.py", "-k", "개인_키의_이름"]
expect = "red"
expect_output = ["안내에 없는 개인 키 경로: portal/keys/other.pem"]

[[mutation.edit]]
file = "deploy/standalone/portal/portal.toml"
old = '''
private_key = "keys/portal.pem"
'''
new = '''
private_key = "keys/other.pem"
'''
