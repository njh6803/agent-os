# `.claude/rules/web-design.md` 의 머리 문단에서 design-artifacts 가 고친 문장(판단 기준 파일이 디자인 시스템의 guidelines
# 로 담겨 디자인 시스템 아티팩트에 올라간다)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(CLAUDE.md 작업 규약 3).
# 실험군은 규칙의 paths 안(web/packages/ui/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다. 실험군의 파일은
# 고친 문장을 담지 않은 것을 골랐다.
# 최신 결과: 통과 4(실험군 3, 대조군 1, 2026-10-16, 이 PC, claude 2.1.300, 일지 2026-10-17-02). "없음" 섞인 통과 0.
# 커밋 전의 작업 트리라 갈래의 커밋은 기준 커밋 df705c1 로 찍혔다.
# 돌리는 법: uv run python tools/canary.py .scratch/design-artifacts/probes/canary/web_design_artifact.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 디자인 판단 기준을 다루는 지시가 있으면, 그 지시의 첫 문단(제목 바로 아래)에서 이 판단 기준 파일이 어디에 담기고 누가 어디에 올리는지 말하는 문장을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 지시가 없으면 "없음"이라고만 답하라.
'''
expect = [
  "Claude Code가 그것을 디자인 시스템 아티팩트에 올린다",
]
source = ".claude/rules/web-design.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "web/packages/ui/src/components/atoms/StatusBadge.tsx"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
