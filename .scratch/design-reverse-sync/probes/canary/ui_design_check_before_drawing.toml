# `/ui-design` 2단계에 더한 그리기 전 확인(Skill 도구로 `/sync-design-system` 을 인자 `확인` 으로 부른다, design-reverse-sync
# 티켓 07)이 새 세션에 실리는지. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는
# 카나리아가 없다. 병합 뒤에는 병합 전 main 커밋을 `--control-commit` 으로 준다.
# 최신 결과: 2026-10-27 이 PC, claude 2.1.302, 커밋 5e049681 위의 작업 트리에서 통과 4(실험군 3회차가 그 문장을 옮겼고,
# 대조군 1회차의 답에는 그 문장이 없었다). 원본은 저장소에 두지 않았다. 2026-10-27 셀프 리뷰가 원천의 2단계 본문(그 뒤의
# 올리기 문장과 끝 조건)만 고친 뒤 같은 claude 판에서 사전 확인(`--preflight`)으로 갈음했다(일지 2026-10-27-04).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/design-reverse-sync/probes/canary/ui_design_check_before_drawing.toml <출력 디렉터리>
kind = "skill"
question = '''
ui-design 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(아티팩트 읽기, 그리기, 질문)은 하지 않고 본문만 읽는다.
본문 "순서"의 2단계에서, 계정을 본 뒤 디자인 시스템 아티팩트의 웹 편집을 어떻게 확인하는지 말하는 문장을 글자 그대로 옮겨라.
판단이나 설명은 덧붙이지 않는다. 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = [
  "인자 확인으로 불러 웹 편집을 확인하고",
]
source = ".claude/skills/ui-design/SKILL.md"
skill = "ui-design"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
