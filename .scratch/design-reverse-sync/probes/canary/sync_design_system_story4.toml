# 스토리 4: 사람이 스킬 이름 없이 디자인 시스템을 웹에서 고쳤다고만 말해도 `/sync-design-system` 이 불리는지(design-reverse-sync
# 티켓 07). 질문은 스킬 이름을 들지 않고, 카나리아는 설명에 없고 본문의 인자 표에만 있는 글이다(`tools/canary.py` 의
# 못 보는 것: 설명에도 있는 낱말이면 가르지 못한다). 같은 낱말을 든 `/ui-design`(웹에서 고친 목업을 다시 들일 때)을
# 고르면 `skill` 판정이 실패한다. 실험군은 이 워크트리, 대조군은 이 스킬이 없는 주 체크아웃이다.
# 못 보는 것: 질문이 "다루는 스킬이 있으면 Skill 도구로 불러라"를 이르므로, 그 말이 없는 자연 입력에서 세션이 스스로
# Skill 을 부르는지는 재지 않는다. 이 틀은 슬래시 명령으로 넣지 않는 `kind = "skill"` 명세가 모두 쓰는 것이고, 본문의
# 카나리아를 옮기라는 요청 없이는 답이 설명에서 왔는지 가를 수 없다(PR #400 CodeRabbit 첫 회차가 짚었다).
# 최신 결과: 2026-10-27 이 PC, claude 2.1.302, 커밋 7d9674d1 위의 작업 트리(티켓 08이 "확인" 2와 "재지 못한 것"을 고친
# 판)에서 대조군을 `--control-commit 5e049681`(이 스킬이 없는 병합 전 main)로 주어 통과 4(실험군 3회차가 이 스킬을 불러 그
# 칸을 옮겼고, 대조군 1회차는 `/ui-design` 을 불러 "없음"이었다). 실험군 셋은 "없음" 섞인 통과로 표시됐다. 셋 다 인자 표를
# 머리째 옮겨 인자 칸("없음, 또는 사람이 …")까지 실었기 때문이다(러너가 찍은 답의 머리를 손으로 봤다). 원본은 저장소에 두지
# 않았다. 그 뒤 셀프 리뷰가 원천의 본문("재지 못한 것")만 고쳐 같은 claude 판에서 사전 확인(`--preflight`)으로
# 갈음했다(일지 2026-10-27-12). 티켓 07의 판(PR #400)도 통과 4였다(일지 2026-10-27-04).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/design-reverse-sync/probes/canary/sync_design_system_story4.toml <출력 디렉터리>
kind = "skill"
question = '''
Claude 아티팩트의 디자인 시스템을 웹에서 고쳤어. 이 일을 다루는 스킬이 있으면 Skill 도구로 불러 본문만 읽어라. 스킬이 시키는 일(아티팩트 읽기, 스크립트 실행, 질문)은 하지 않는다.
그 본문의 "인자" 표에서 부르는 쪽이 import 인 줄의 "하는 일" 칸을 글자 그대로 옮겨라.
판단이나 설명은 덧붙이지 않는다. 그런 스킬이나 표가 없으면 "없음"이라고만 답하라.
'''
expect = [
  "확인 뒤 찾은 것을 들인다",
]
source = ".claude/skills/sync-design-system/SKILL.md"
skill = "sync-design-system"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
