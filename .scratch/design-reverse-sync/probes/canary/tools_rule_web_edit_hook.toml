# `.claude/rules/tools.md` 의 Write·Edit 훅 목록에 더한 웹 편집 확인 계기 훅의 문장(design-reverse-sync 티켓 09)이
# `tools/` 의 파일을 Read 로 열 때 실리는지(CLAUDE.md 작업 규약 3). 처음 판은 실험군이 이 워크트리, 대조군이 병합 전의 주 체크아웃
# (`35028cba`, `--control-commit`)이었다. 지금 판은 실험군이 규칙의 paths 안(tools/), 대조군이 밖(README.md)을 읽는다.
# 선례는 `.scratch/harness/probes/canary/tools_rule_ui_design_hook.toml` 이다.
# 2026-11-05 에 harness 티켓 042 가 시간 항목을 하위 항목으로 나눠 "여덟째도"로 시작하는 괄호가 `hook_web_edit_check` 항목이 됐다.
#   물음을 훅 이름으로 고치고, 그 문장이 이 PR 전의 main 에도 있어 대조군을 주 체크아웃 대신 규칙의 paths 밖(README.md)으로 바꿨다.
# 최신 결과: 통과 4, 실패 0, "없음" 섞인 통과 0(2026-11-05, 이 PC, claude 2.1.318, 러너가 찍은 커밋 77bb7c59 위의 커밋하지 않은 판,
#   대조군은 "없음", 일지 2026-11-05-05, harness 티켓 042).
# 그 전 결과: 2026-10-27 이 PC, claude 2.1.302, 커밋 35028cba 위의 커밋하지 않은 작업 트리에서 통과 4(실험군 3회차가 그
# 문장을 옮겼고, 대조군 1회차는 "없음"이었다). 원본은 저장소에 두지 않았다.
# 돌리는 법: uv run python tools/canary.py .scratch/design-reverse-sync/probes/canary/tools_rule_web_edit_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, Write·Edit 에 붙는 PostToolUse 훅 `hook_web_edit_check` 을 설명한 항목에서 그 훅이 경로를 보고
화면 코드일 때 무엇을 한다고 적은 문장을 글자 그대로 옮겨라. 읽은 파일에서 추측하지 않는다. 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["처음 판정할 때만 고친 파일에서 위로"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/sibling_overlap.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
