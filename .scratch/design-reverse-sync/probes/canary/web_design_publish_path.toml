# `.claude/rules/web-design.md` 머리 문단의 올리는 길을 `/sync-design-system` 으로 고친 문장(design-reverse-sync 티켓 07)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지(CLAUDE.md 작업 규약 3). 실험군은 규칙의 paths 안(web/packages/ui/), 대조군은
# 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다. 실험군의 파일은 고친 문장을 담지 않은 것을 골랐다. 앞 판의 카나리아는
# `.scratch/design-artifacts/probes/canary/web_design_artifact.toml` 이고 그 문장은 이 티켓이 바꿨다.
# 최신 결과: 2026-10-27 이 PC, claude 2.1.302, 커밋 5e049681 위의 작업 트리에서 통과 4(실험군 3회차가 그 문장을 옮겼고,
# 대조군 1회차는 "없음"이었다). 원본은 저장소에 두지 않았다.
# 돌리는 법: uv run python tools/canary.py .scratch/design-reverse-sync/probes/canary/web_design_publish_path.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 디자인 판단 기준을 다루는 지시가 있으면, 그 지시의 첫 문단(제목 바로 아래)에서 이 판단 기준 파일이 디자인 시스템 아티팩트에 오르는 길을 말하는 문장을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 지시가 없으면 "없음"이라고만 답하라.
'''
expect = [
  "올리는 길은 프로젝트 스킬 /sync-design-system의 올리기다",
]
source = ".claude/rules/web-design.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "web/packages/ui/src/components/atoms/StatusBadge.tsx"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
