# design-reverse-sync 티켓 04 의 변이 표(`web/tools/sync-design-system` 의 들이기 명령과 색 변환). 들이기와 색 변환의
# 테스트는 구현 전에 모듈이 없어 모두 빨갰을 뿐 단언 하나하나의 빨강은 보지 못했고, 일부 사례(색상의 0~360, 벌마다 다르게
# 바꾼 원색, 기준본이 벌마다 다르던 자리, 그리고 셀프 리뷰를 반영하며 더한 §7.3 의 파랑·노랑, 쉼표 꼴, hsl() 의 음수 채도,
# 가장 가까운 통과 값의 차례, 소수 끝에 0 이 붙은 px, 충돌의 webReason, 제안 자리의 답)는 구현 뒤에 썼다. 변이마다 그
# 단언이 재는 줄 하나만 바꾸고 그 사례 하나로 좁혀(`-t`) 빨개지는지 본다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-reverse-sync/probes/import_command_mutations.toml [번호 ...]
# 재지 않은 것: 답 파일의 글이 아닌 답, 통과 값이 없는 제안 자리에서 suggested 를 고르는 답, 판정한 명암비를 둘째 자리에서
# 내리는 것(정확한 비를 단언하는 사례가 없다). 도는 별칭과 없는 토큰은 명암비 모듈 안에서 풀려, 그 오류를
# CommandError 가 아닌 Error 로 던져도 `measure` 가 `input` 오류로 감싸 문구가 남는다(그 변이가 초록이었다). 그래서
# 도는 별칭의 변이는 오류 대신 값을 돌려준다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

