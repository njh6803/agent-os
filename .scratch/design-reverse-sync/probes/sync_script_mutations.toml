# design-reverse-sync 티켓 02 의 변이 표(`web/tools/sync-design-system`). 짓기와 맞대기의 테스트는 구현 전에 모듈이 없어
# 모두 빨갰을 뿐 단언 하나하나의 빨강은 보지 못했고, CSS 풀기의 캐스케이드 사례와 진입의 옵션 사례는 구현 뒤에 썼다.
# 변이마다 그 단언이 재는 줄 하나만 바꾸고 그 사례 하나로 좁혀(`-t`) 빨개지는지 본다. 티켓 03 이 더한 변이는 끝 절이다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-reverse-sync/probes/sync_script_mutations.toml [번호 ...]
# 재지 않은 것: 맞대는 몫 밖의 칸(이름, 판, 테마의 표시 이름) 사례는 정규 꼴이 그 칸을 애초에 읽지 않아 깰 줄이 없다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

