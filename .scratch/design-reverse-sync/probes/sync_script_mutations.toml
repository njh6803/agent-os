# --- 티켓 03 이 설명 주석과 함께 더하거나 고친 사례 ------------------------------------------------------------
# 번호가 밀리지 않게 끝에 둔다. 빈 설명이 없다는 단언은 주석을 달기 전에 빨간 것을 봤고, 한 줄이라는 단언, 주석을 벗긴
# 사본의 가드, 실제 설명을 고치기 전의 설명으로 든 맞대기 사례는 주석을 단 뒤에 썼다. 같은 사례의 토큰 수 단언은 주석
# 전후 모두 112 라 빨강을 본 적이 없어 마지막 변이가 잰다. 실제 디자인 토큰 CSS 사례의 두
# 단언은 같은 꼴(이름 목록과 빈 배열)을 맞대어, 표지는 단언의 메시지까지 든 실패 머리다. 원문은 모두 설명 앞까지만 들어
# 리뷰가 설명을 고쳐도 그대로 돈다.

[[mutation]]
name = "설명 하나가 두 줄이면 실제 디자인 토큰 CSS 사례가 빨갛다"
runner = "node"
tests = ["tools/sync-design-system/build.test.ts", "-t", "설명이 빈 토큰이 없고"]
expect = "red"
expect_output = ["AssertionError: 설명이 여러 줄인 토큰: expected [ 'gray-50' ] to deeply equal []"]

