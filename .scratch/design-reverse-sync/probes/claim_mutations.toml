# design-reverse-sync 티켓 06 의 변이 표(`web/tools/sync-design-system`). claim 쓰기·비우기(`claim.ts`, `sync-record.ts`),
# 확인의 claim 맞대기(`check.ts`), 이어받을 기준본(`tokens-overlay.ts`), 보낼 것(`upload.ts`), 기록 명령(`record.ts`),
# 결정표(`decide.ts`)의 시험은 구현 뒤에 쓰거나 모듈이 없어 빨갰을 뿐이라 단언 하나하나의 빨강은 보지 못했다. 변이마다
# 그 단언이 재는 줄 하나만 바꾸고 그 사례 하나로 좁혀(`-t`) 빨개지는지 본다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-reverse-sync/probes/claim_mutations.toml [번호 ...]
# 재지 않은 것: 이 표는 단언이 재는 줄이 있는 갈래에만 변이를 둔다. 시험 사례가 없거나 사례가 오류 문구만 보는
# 갈래는 변이가 없다. 예는 기록 명령이 병합된 claim 에 더 고친 몫이 있을 때 --overwrite 없는 --claim-merged 를 거절하는
# 갈래, 웹의 tokens.json 이 없고 claim 의 사본도 없을 때 claimed 로 가르는 갈래, claim.ts 의 usage·input 거절(웹 편집
# 있음에 덮을 claim 이나 이어받을 기준본을 준 것, 들이는 중에 덮을 claim 이 없는 것, 자기 claim 에 기준본을 준 것, 받은
# tokens.json 이 풀리지 않는 것), record claim --clear 가 다른 옵션을 거절하는 갈래, check paths 가 --branch 를 거절하는
# 갈래, check judge --inherit-out 이 파일을 쓰고 보고에 경로를 싣는 명령 수준의 길이다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

