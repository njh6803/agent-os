# design-reverse-sync 티켓 05 의 변이 표(`web/tools/sync-design-system`). 맞대는 값, 기록, 보낼 것, 확인, 기록 명령의
# 시험은 구현 전에 모듈이 없어 모두 빨갰을 뿐 단언 하나하나의 빨강은 보지 못했다. 변이마다 그 단언이 재는 줄 하나만
# 바꾸고 그 사례 하나로 좁혀(`-t`) 빨개지는지 본다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-reverse-sync/probes/record_check_mutations.toml [번호 ...]
# 재지 않은 것: 기록이 없을 때 원 바이트의 sha256 과 맞대는 자리에 맞대는 값을 쓰는 변이. 시험의 파일이 뿌리 README 와
# tokens.json 밖이라 두 값이 같다. 그 변이는 늘 더 보내는 쪽이라 틀린 판정을 내지 않는다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

