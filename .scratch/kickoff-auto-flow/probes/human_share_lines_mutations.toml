# 티켓 02(사람 몫 줄 검사 `tools/check_human_share_lines.py`)의 변이 표. 테스트는 구현 전에 썼지만 그때의
# 빨강은 import 의 수집 오류뿐이라, 지키는 동작이 틀려서 빨개진 것을 본 적이 없다. 명세 "사람 몫 검사"의
# 1~6, 펜스의 CommonMark 규칙 넷(틸드, 길이, 정보 문자열의 백틱, 들여쓰기 세 칸), 근사 모양의 공백과
# 내용, CLI 의 인자, 그리고 못 보는 것 하나(들여 쓴 줄을 세지 않는다)에 변이 하나씩을 겨누고 그 가드의
# 테스트만 돌린다. 끝의 여덟은 리뷰 뒤에 더한 것을 겨눈다. 셀프 리뷰 뒤의 넷은 표지를 붙인 사람 몫 줄과
# 머리가 없을 때의 조기 반환, PR 직전 리뷰 뒤의 넷은 강조 표지의 소유 한정과 닫는 펜스의 조건 셋이다.
