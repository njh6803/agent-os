# design-refresh 티켓 03 의 변이 표. 구현 전의 스토리는 새 쓰임새 토큰이 없어 첫 계산값 도우미 호출에서 던졌으므로, 색을
# 맞대는 단언 하나하나의 빨강은 보지 못했다. 구현 뒤에 쓴 사례(HelperScope)와 사진 비교의 누름 단언은 빨강을 본 적이 없다.
# 변이마다 그 단언이 재는 클래스나 값 하나만 바꾸고 그 단언이 든 스토리나 사진 사례 하나로 좁혀(`-t`, 사진은 `-g`) 그것이
# 빨개지는지 본다. 한 스토리 안의 어느 단언이 실패했는지는 판정이 가르지 않는다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-refresh/probes/theme_colors_mutations.toml [번호 ...]
# 계산값으로 가를 수 없는 짝(design-refresh 명세)은 같은 값인 벌의 스토리에서는 초록이고 값이 다른 벌의 스토리에서
# 빨갛다. 그 쌍을 같은 변이의 대조군(초록)과 시험(빨강)으로 둔다.
# visual 러너는 Docker 와 판을 고정한 이미지가 있어야 하고 정적 빌드부터 다시 짓는다. 누름 단언의 변이는 정답 사진을 모두
# 다시 쓰는 갱신(`--update-snapshots=all`)으로 돌린다. 구현자가 정답을 다시 만들어도 그 단언이 홀로 잡는지 보기 위해서다.
# 갱신이 쓴 사진은 `restore` 가 되돌린다.
# 2026-10-22(design-reverse-sync 01): 계산 함수가 `styles/contrast.ts` 로 옮겨 그 변이의 `file` 을 옮겼고, 표를 커밋하며
# 앞 PR 들이 썩힌 원문을 지금 코드에 맞췄다. 상태 배지의 클래스 조각 둘, 사진 루프의 모드·밀도 가드, 그리고 밀도 두
# 벌(#221) 뒤로 이름에 밀도가 붙은 되돌릴 사진이다(일지 2026-10-22-24).

[runner.storybook]
command = ["pnpm", "exec", "vitest", "run", "--project", "storybook"]
cwd = "web"
judge = "vitest"

[runner.visual]
command = ["pnpm", "-C", "web", "visual"]
judge = "playwright"

