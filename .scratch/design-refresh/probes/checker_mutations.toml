# 사용 규약 검사기(.design-sync/check-conventions.mjs)의 티켓 05 판정(빼는 목록, 기초 카드와 목록 타일,
# data-density)이 빨개지는 것을 변이로 본다. 검사기는 종료 코드로 말해(0 맞다, 1 어긋난다) exit 판정을
# 쓰고, 변이마다 기대한 메시지를 표지로 본다(대기열 253). 기준선은 0 과 집계 줄이다.
#
# 전제: 검사기는 생성물을 읽는다. 변환기로 지은 `ds-bundle/`, 참조 Storybook 의 색인
# (`.design-sync/sb-reference/index.json`), `ds-bundle/` 에 복사한 카드와 목록 타일이다(.design-sync/NOTES.md).
# 둘 다 추적하지 않아, 돌릴 때뿐 아니라 원문 확인(`--check`, pre-commit 의 check-mutations)도 그것이 있는
# 체크아웃에서 한다. 없는 체크아웃에서 이 표를 커밋하면 그 파일을 읽지 못했다고 막는다.
#
# 사용(생성물이 든 분리 임시 워크트리에서, tools/mutate.py 의 제자리가 아닌 실행):
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-refresh/probes/checker_mutations.toml
#
# 옮기지 못한 것: 파일을 만들거나 지우는 변이 둘(기초 카드 폴더의 HTML 이 둘, 폴더 삭제)은 원문 치환으로
# 표현하지 못해 `checker_mutations.mjs` 에 남는다.
#
# 원래 프로브와 다른 것: "보여 주기용 태그를 모두 걷는다" 는 색인 전체의 태그를 걷고 첫 컴포넌트(Button)의
# 메시지를 봤다. 여기서는 Button 의 보여 주기용 스토리 둘의 태그만 걷는다. 원문이 정확히 한 번이어야 하고,
# 메시지가 그 컴포넌트의 것임을 더 좁게 단언한다.
# 카드 변수·첫 줄·목록 타일의 변이는 복사 판정에 먼저 걸리지 않게 `ds-bundle/` 의 사본도 같이 고친다.

[runner.checker]
command = ["node", ".design-sync/check-conventions.mjs"]
judge = "exit"
red_exit = 1
baseline_output = ["빼는 목록이 맞다: 컴포넌트 9"]

[[mutation]]
name = "변형 스토리 하나를 빼는 목록에서 걷는다"
runner = "checker"
expect = "red"
expect_output = ["변형 스토리가 빼는 목록에 없다: Button atoms-button--narrow-row"]

[[mutation.edit]]
file = ".design-sync/config.json"
old = '''
        "atoms-button--narrow-row"
'''
new = ""

[[mutation.edit]]
file = ".design-sync/config.json"
old = '"atoms-button--focus",'
new = '"atoms-button--focus"'

[[mutation]]
name = "빼는 목록에 없는 스토리 id 를 든다"
runner = "checker"
expect = "red"
expect_output = ["빼는 목록의 스토리가 없다: Card atoms-card--gone"]

[[mutation.edit]]
file = ".design-sync/config.json"
old = '"atoms-card--default",'
new = '''"atoms-card--default",
        "atoms-card--gone",'''

[[mutation]]
name = "보여 주기용 스토리를 빼는 목록에 든다"
runner = "checker"
expect = "red"
expect_output = ["보여 주기용 스토리를 뺀다: Icon atoms-icon--showcase-nav-items"]

[[mutation.edit]]
file = ".design-sync/config.json"
old = '"atoms-icon--decorative",'
new = '''"atoms-icon--decorative",
        "atoms-icon--showcase-nav-items",'''

[[mutation]]
name = "Button 의 보여 주기용 태그를 걷는다"
runner = "checker"
expect = "red"
expect_output = ["보여 주기용 스토리가 없다: Button"]

[[mutation.edit]]
file = ".design-sync/sb-reference/index.json"
old = '"id":"atoms-button--showcase-approval-pair","name":"쓰임: 승인 묻기의 버튼 쌍","title":"atoms/Button","importPath":"./src/components/atoms/Button.stories.tsx","componentPath":"./src/components/atoms/Button.tsx","tags":["dev","test","manifest","showcase"]'
new = '"id":"atoms-button--showcase-approval-pair","name":"쓰임: 승인 묻기의 버튼 쌍","title":"atoms/Button","importPath":"./src/components/atoms/Button.stories.tsx","componentPath":"./src/components/atoms/Button.tsx","tags":["dev","test","manifest","other"]'

[[mutation.edit]]
file = ".design-sync/sb-reference/index.json"
old = '"id":"atoms-button--showcase-admin-actions","name":"쓰임: 새로 고침과 토큰 지우기","title":"atoms/Button","importPath":"./src/components/atoms/Button.stories.tsx","componentPath":"./src/components/atoms/Button.tsx","tags":["dev","test","manifest","showcase"]'
new = '"id":"atoms-button--showcase-admin-actions","name":"쓰임: 새로 고침과 토큰 지우기","title":"atoms/Button","importPath":"./src/components/atoms/Button.stories.tsx","componentPath":"./src/components/atoms/Button.tsx","tags":["dev","test","manifest","other"]'

[[mutation]]
name = "기초 카드가 없는 변수를 읽는다"
runner = "checker"
expect = "red"
expect_output = ["카드의 변수가 없다: --radius-xs"]

[[mutation.edit]]
file = ".design-sync/foundations/spacing/index.html"
old = '<i style="border-radius: var(--radius-s)">'
new = '<i style="border-radius: var(--radius-xs)">'

[[mutation.edit]]
file = "ds-bundle/foundations/spacing/index.html"
old = '<i style="border-radius: var(--radius-s)">'
new = '<i style="border-radius: var(--radius-xs)">'

[[mutation]]
name = "기초 카드의 첫 줄이 @dsCard 가 아니다"
runner = "checker"
expect = "red"
expect_output = ["첫 줄이 @dsCard 가 아니다"]

[[mutation.edit]]
file = ".design-sync/foundations/type/index.html"
old = '''
<!-- @dsCard group="Type" -->
'''
new = ""

[[mutation.edit]]
file = "ds-bundle/foundations/type/index.html"
old = '''
<!-- @dsCard group="Type" -->
'''
new = ""

[[mutation]]
name = "목록 타일이 없는 테마를 단다"
runner = "checker"
expect = "red"
expect_output = ["data-theme 선택자가 없다: jadu"]

[[mutation.edit]]
file = ".design-sync/thumbnail.html"
old = 'data-theme="jacho"'
new = 'data-theme="jadu"'

[[mutation.edit]]
file = "ds-bundle/thumbnail.html"
old = 'data-theme="jacho"'
new = 'data-theme="jadu"'

[[mutation]]
name = "카드를 ds-bundle 에 복사하지 않았다"
runner = "checker"
expect = "red"
expect_output = ["ds-bundle 에 복사되지 않았다"]

[[mutation.edit]]
file = ".design-sync/foundations/density/index.html"
old = "<h1>"
new = "<h1 data-x>"

[[mutation]]
name = "규약이 없는 밀도 키를 든다"
runner = "checker"
expect = "red"
expect_output = ["data-density 선택자가 없다: dense"]

[[mutation.edit]]
file = ".design-sync/conventions.md"
old = "`data-density`(`compact` 촘촘"
new = "`data-density`(`dense` 촘촘"
