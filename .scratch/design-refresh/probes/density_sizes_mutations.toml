# --- 그림자 ----------------------------------------------------------------------------------------------------

# 대조군. 처음에는 빨강을 기대했는데 초록이었다. Tailwind 가 그림자 값을 유틸리티에 풀어 써 두 블록의 `.shadow-float`
# 규칙이 같고, 다른 것은 뿌리에 `--shadow-float` 선언이 나오는지뿐이다(같은 폴더의 `shadow.mjs`).
[[mutation]]
name = "그림자를 @theme static 으로 옮겨도 유틸리티가 같아 FloatShadow 는 초록이다"
runner = "storybook"
tests = ["packages/ui/src/styles/DesignTokens.stories.tsx", "-t", "떠 있는 것의 그림자"]
expect = "green"

[[mutation.edit]]
file = "web/packages/ui/src/styles/theme.css"
old = '''
  --shadow-float: 0 8px 24px var(--shadow-color), 0 1px 2px var(--shadow-color);
'''
new = ""

[[mutation.edit]]
file = "web/packages/ui/src/styles/theme.css"
old = '''
  --container-wide: 360px;
'''
new = '''
  --container-wide: 360px;
  --shadow-float: 0 8px 24px var(--shadow-color), 0 1px 2px var(--shadow-color);
'''

[[mutation]]
name = "그림자 색을 모드와 무관한 원색으로 두면 FloatShadow 가 빨갛다"
runner = "storybook"
tests = ["packages/ui/src/styles/DesignTokens.stories.tsx", "-t", "떠 있는 것의 그림자"]
expect = "red"

[[mutation.edit]]
file = "web/packages/ui/src/styles/theme.css"
old = '''
  --shadow-float: 0 8px 24px var(--shadow-color), 0 1px 2px var(--shadow-color);
'''
new = '''
  --shadow-float: 0 8px 24px var(--overlay-black-12), 0 1px 2px var(--overlay-black-12);
'''

