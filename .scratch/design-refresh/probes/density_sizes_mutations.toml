# design-refresh 티켓 04 의 변이 표. 구현 전의 스토리는 밀도 변수와 새 치수가 없어 스토리마다 첫 단언에서 빨갰으므로, 그
# 뒤 단언(감싼 요소의 별칭, 여덟 벌에서 같은 밀도 변수, 호스트의 밀도 짝, 그림자의 색 등)과 구현 뒤에 쓴 단언(ShadowRoot 의
# 호스트 속성)은 빨강을 본 적이 없다. 사진 비교의 밀도 가드와 미디어 특성의 창 폭 사례도 그렇다. 변이마다 그 단언이 재는
# 선택자나 값 하나만 바꾸고 그 단언이 든 스토리나 사진 사례 하나로 좁혀(`-t`, 사진은 `-g`) 그것이 빨개지는지 본다. 한
# 스토리 안의 어느 단언이 실패했는지는 판정이 가르지 않는다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-refresh/probes/density_sizes_mutations.toml [번호 ...]
# visual 러너는 Docker 와 판을 고정한 이미지가 있어야 하고 정적 빌드부터 다시 짓는다.

[runner.storybook]
command = ["pnpm", "exec", "vitest", "run", "--project", "storybook"]
cwd = "web"
judge = "vitest"

[runner.visual]
command = ["pnpm", "-C", "web", "visual"]
judge = "playwright"

# --- 밀도 선택자와 Density -------------------------------------------------------------------------------------

[[mutation]]
name = "촘촘 선택자를 빼면 보통 조상 안의 촘촘 표본이 Density 에서 빨갛다"
runner = "storybook"
tests = ["packages/ui/src/styles/DesignTokens.stories.tsx", "-t", "data-density 가 촘촘과 보통이면"]
