# `.claude/rules/web-design.md` 에서 design-refresh 티켓 03 이 고친 문장(판정하는 벌, 사진의 기본 테마, 보조·위험 버튼의
# 누름 바탕, 기본 테마가 아닌 테마에서 재는 스토리)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(CLAUDE.md 작업 규약 3).
# 실험군은 규칙의 paths 안(web/packages/ui/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다. 실험군의 파일은
# 고친 문장을 담지 않은 것을 골랐다(버튼과 스토리 도우미의 주석에는 비슷한 문장이 있다).
# 최신 결과: 통과 4(2026-10-13, 이 PC, claude 2.1.296, 일지 2026-10-13-15). 그 뒤 셀프 리뷰가 같은 원천의 같은 항목(계산값을
# 가를 수 없는 짝)에서 본문 문구만 고쳐 다시 돌리지 않고 사전 확인(`--preflight`) 통과로 갈음했다.
# 돌리는 법: uv run python tools/canary.py .scratch/design-refresh/probes/canary/web_design_colors.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 디자인 판단 기준을 다루는 지시가 있으면, 그 지시에서 네 문장을 각각 글자 그대로 옮겨라.
첫째, "판정하는 것" 절의 첫 문장.
둘째, "판정하는 것" 절에서 사진 비교가 어느 테마의 어느 모드로 찍는지 말하는 문장.
셋째, "컴포넌트 공통" 절에서 보조 버튼과 위험 버튼을 말하는 항목에서 누름을 말하는 문장.
넷째, "컴포넌트 공통" 절에서 판정 스토리와 음성 사례의 태그를 말하는 항목의 마지막 문장.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 지시가 없으면 "없음"이라고만 답하라.
'''
expect = [
  "여덟 벌(테마 넷 × 모드 둘)의 명암비",
  "기본 테마(녹청)의 라이트·다크로 찍어",
  "누름은 보조가",
  "군청의 주 버튼",
]
source = ".claude/rules/web-design.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "web/packages/ui/src/components/atoms/StatusBadge.tsx"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
