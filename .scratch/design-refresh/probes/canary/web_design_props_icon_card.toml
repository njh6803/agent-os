# `.claude/rules/web-design.md` 에서 design-refresh 티켓 02 가 고친 세 문장(props 의 계약, 아이콘의 선과 크기, 카드의
# 그림자)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(CLAUDE.md 작업 규약 3).
# 실험군은 규칙의 paths 안(web/packages/ui/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다. 실험군의 파일은
# 고친 문장을 담지 않은 것을 골랐다(props.ts 머리 주석과 Icon.md 에는 비슷한 문장이 있다).
# 최신 결과: 통과 4(2026-10-12, 이 PC, claude 2.1.296, 일지 2026-10-13-05).
# 돌리는 법: uv run python tools/canary.py .scratch/design-refresh/probes/canary/web_design_props_icon_card.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 디자인 판단 기준을 다루는 지시가 있으면, 그 지시에서 세 문장을 각각 글자 그대로 옮겨라.
첫째, "컴포넌트 공통" 절에서 컴포넌트가 받는 props 의 계약이 어디에 있는지 말하는 항목의 첫 문장.
둘째, "쓰는 법" 절에서 아이콘의 선 굵기를 말하는 문장.
셋째, "쓰는 법" 절에서 카드를 말하는 문장.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 지시가 없으면 "없음"이라고만 답하라.
'''
expect = [
  "props는 지금 코드가 계약이다",
  "선은 크기와 상관없이 화면 1.5px이다",
  "카드는 그림자 없이 바탕과 테두리로 선다",
]
source = ".claude/rules/web-design.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "web/packages/ui/src/components/atoms/StatusBadge.tsx"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
