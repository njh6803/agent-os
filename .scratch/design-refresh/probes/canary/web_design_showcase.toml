# `.claude/rules/web-design.md` 에서 design-refresh 티켓 05 가 더한 두 항목(보여 주기용 스토리를 두는 법, 카드에서 변형
# 스토리를 빼는 목록)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(CLAUDE.md 작업 규약 3). 둘째 항목은 design-card-build
# 티켓 04 가 짓기 명령이 showcase 태그로 카드를 고르는 문장으로 고쳐, 둘째 물음과 기대를 그 문장에 맞췄다.
# 실험군은 규칙의 paths 안(web/packages/ui/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다. 실험군의 파일은
# 더한 문장을 담지 않은 것을 골랐다(스토리 파일과 미리보기 본체의 주석에는 비슷한 문장이 있다).
# 최신 결과: 통과 4(실험군 3, 대조군 1, 2026-10-30, 이 PC, claude 2.1.312, 일지 2026-10-30-10). "없음" 섞인 통과 0.
# 고친 둘째 물음과 기대로 처음 돈 결과다. 커밋 전의 작업 트리라 갈래의 커밋은 기준 커밋 fcf808fa 로 찍혔다.
# 그 전: 통과 4(2026-10-13, claude 2.1.296, 일지 2026-10-13-62, 기준 커밋 25fe55e).
# 돌리는 법: uv run python tools/canary.py .scratch/design-refresh/probes/canary/web_design_showcase.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 디자인 판단 기준을 다루는 지시가 있으면, 그 지시에서 두 문장을 각각 글자 그대로 옮겨라.
첫째, "컴포넌트 공통" 절에서 보여 주기용 스토리의 태그와 이름을 말하는 문장.
둘째, "컴포넌트 공통" 절에서 디자인 시스템 아티팩트의 컴포넌트 카드에 무엇이 오르는지 말하는 문장.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 지시가 없으면 "없음"이라고만 답하라.
'''
expect = [
  "태그 `\"showcase\"`를 달고 이름을 `쓰임: …`으로 짓는다",
  "태그 `\"showcase\"`가 든 보여 주기용 스토리만 오르고",
]
source = ".claude/rules/web-design.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "web/packages/ui/src/components/atoms/StatusBadge.tsx"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
