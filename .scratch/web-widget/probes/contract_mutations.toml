# 티켓 01(calling 항목과 limit 종류, 위젯 클라이언트)의 변이 표. 구현 뒤에 쓴 테스트와 구현 전부터 초록이던 가드가
# 빨강을 볼 수 있는지 잰다. 빨강의 판정은 `tools/mutate.py` 의 독스트링이다. tsc 는 변이마다 적은 파일
# (`diagnostic_in`)에서 진단이 날 때만 빨강이다.
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/web-widget/probes/contract_mutations.toml [이름 ...]
# 네트워크를 타지 않는다. TS 변이는 `pnpm -C web install` 이 된 체크아웃에서 돈다.

[runner.vitest]
command = ["pnpm", "exec", "vitest", "run"]
cwd = "web"
judge = "vitest"

[runner.tsc]
command = ["pnpm", "exec", "tsc", "--noEmit", "-p", "packages/api-client"]
cwd = "web"
judge = "tsc"

# --- 계약: 스트림 라우트의 에러 문서와 429 의 봉투 ----------------------------------------

[[mutation]]
name = "스트림 라우트의 에러 문서가 이벤트 스트림 아래에 실린다"
tests = ["tests/channel/http/test_end_user.py", "-k", "경로_넷이_지은_operation_id"]
expect = "red"

[[mutation.edit]]
file = "src/agent_os/http/routes.py"
old = '''
    media_type = None
'''
new = '''
'''

[[mutation]]
name = "상한의 실패가 종류를 봉투로 넘기지 않는다"
tests = ["tests/test_server.py", "-k", "상한의_문구는_세_가지이고"]
expect = "red"

[[mutation.edit]]
file = "src/agent_os/http/errors.py"
old = '''
                limit=error.limit,
'''
new = '''
'''

# --- api-client: 위젯 클라이언트 ---------------------------------------------------------

[[mutation]]
name = "위젯 클라이언트가 운영자와 관리의 경로도 안다"
runner = "tsc"
tests = []
