diagnostic_in = "clients.test-d.ts"

[[mutation.edit]]
file = "web/packages/api-client/src/clients.ts"
old = 'export type WidgetPaths = Pick<paths, EndUserPath>;'
new = 'export type WidgetPaths = paths;'

[[mutation]]
name = "429 의 limit 이 아무 문자열이다"
runner = "tsc"
tests = []
expect = "red"
diagnostic_in = "clients.test-d.ts"

[[mutation.edit]]
file = "web/packages/api-client/src/generated/openapi.ts"
old = '      limit: components["schemas"]["LimitKind"];'
new = '      limit: string;'

[[mutation]]
name = "위젯 클라이언트가 토큰을 들고 요청마다 싣는다"
runner = "vitest"
tests = ["packages/api-client/src/clients.test.ts"]
expect = "red"

[[mutation.edit]]
file = "web/packages/api-client/src/clients.ts"
old = '  return createClient<WidgetPaths>({ baseUrl: baseUrl.href });'
new = '  return createClient<WidgetPaths>({ baseUrl: baseUrl.href, headers: bearer("site") });'

# --- api-client: 최종 사용자 스트림의 수명. 위젯은 요청의 signal 로 연결을 끊는다 ----------

[[mutation]]
name = "최종 사용자 스트림이 에러로 끝나면 에러를 삼킨다"
runner = "vitest"
tests = ["packages/api-client/src/stream.test.ts"]
expect = "red"

[[mutation.edit]]
file = "web/packages/api-client/src/stream.ts"
old = '''
      yield closed ? endUserFrame(lines) : unclosedFrame(lines);
    }
  } finally {'''
new = '''
      yield closed ? endUserFrame(lines) : unclosedFrame(lines);
    }
  } catch (error) {
    void error;
  } finally {'''

[[mutation]]
name = "최종 사용자 스트림이 에러로 끝나면 잠금을 풀지 않는다"
runner = "vitest"
tests = ["packages/api-client/src/stream.test.ts"]
expect = "red"

[[mutation.edit]]
file = "web/packages/api-client/src/stream.ts"
old = '''
      yield closed ? endUserFrame(lines) : unclosedFrame(lines);
    }
  } finally {
    reader.releaseLock();
  }'''
new = '''
      yield closed ? endUserFrame(lines) : unclosedFrame(lines);
    }
  } catch (error) {
    throw error;
  }
  reader.releaseLock();'''

# 끝까지 읽거나 에러로 끝날 때만 풀고, 루프에서 멈춘 반복자의 `return()` 에서는 풀지 않는다. 독스트링의
# "수명과 끊는 길은 `readFrames` 와 같다"에 드는 세 길 가운데 셀프 리뷰가 짚은 셋째다.
[[mutation]]
name = "최종 사용자 스트림을 읽다 멈추면 잠금을 풀지 않는다"
runner = "vitest"
tests = ["packages/api-client/src/stream.test.ts"]
expect = "red"
expect_output = ["최종 사용자 스트림 읽기 > 읽는 쪽이 도중에 멈추면"]

[[mutation.edit]]
file = "web/packages/api-client/src/stream.ts"
old = '''
      yield closed ? endUserFrame(lines) : unclosedFrame(lines);
    }
  } finally {
    reader.releaseLock();
  }'''
new = '''
      yield closed ? endUserFrame(lines) : unclosedFrame(lines);
    }
  } catch (error) {
    reader.releaseLock();
    throw error;
  }
  reader.releaseLock();'''

[[mutation]]
name = "최종 사용자 스트림의 잠금을 풀지 않는다"
runner = "vitest"
tests = ["packages/api-client/src/stream.test.ts"]
expect = "red"

[[mutation.edit]]
file = "web/packages/api-client/src/stream.ts"
old = '''
      yield closed ? endUserFrame(lines) : unclosedFrame(lines);
    }
  } finally {
    reader.releaseLock();
  }'''
new = '''
      yield closed ? endUserFrame(lines) : unclosedFrame(lines);
    }
  } finally {
    void reader;
  }'''
