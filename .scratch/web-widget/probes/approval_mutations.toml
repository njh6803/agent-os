'''

[[mutation]]
name = "상한을 넘은 사유로도 거부할 수 있으면 상한의 시험이 빨갛다"
runner = "pages"
tests = ["apps/widget/components/pages/WidgetApproval.test.tsx", "-t", "상한의 90%"]
