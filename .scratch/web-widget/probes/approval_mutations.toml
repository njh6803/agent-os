# web-widget 티켓 08 의 변이 표. 승인 묻기의 시험 가운데 구현 뒤에 쓰거나 처음부터 초록이던 것이 무엇을 재는지
# 변이로 본다. 앞의 열셋은 화면 동작 테스트(`widget-pages`), 뒤의 셋은 위젯 스토리(`widget-storybook`)다.
# 처음부터 빨강을 본 시험(카드, 인자의 글, pause_index, 결정 뒤 한 줄, 거절의 알림 문구)은 넣지 않았다.
# 빨강을 기대한 변이는 모두 고른 단언이 빨개졌다는 것을 그 단언의 실패 머리나 값이 든 줄(`expect_output`)로 본다.
# 표지는 변이를 하나씩 스크래치 스크립트로 넣어 실패 출력을 손으로 본 뒤 골랐다. 첫째는 고른 시험 둘(U+0085, U+FEFF)이
# 저마다 단언 하나라 시험 이름을 표지로 쓰고, 열여섯째는 같은 스토리의 다른 `toBeLessThanOrEqual`(가로 스크롤)과 가르려고
# 실패한 단언의 자리를 쓴다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/web-widget/probes/approval_mutations.toml [번호 ...]
# stories 러너는 chromium 이 Playwright 의 브라우저 캐시에 있어야 한다.

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "widget-pages"]
cwd = "web"
judge = "vitest"

[runner.stories]
command = ["pnpm", "exec", "vitest", "run", "--project", "widget-storybook"]
cwd = "web"
judge = "vitest"

# --- 사유 ---------------------------------------------------------------------------------------------------------

[[mutation]]
name = "사유를 JS trim 으로 가르면 다듬는 글자의 시험이 빨갛다"
runner = "pages"
tests = ["apps/widget/components/pages/WidgetApproval.test.tsx", "-t", "는 '거부'가"]
expect = "red"
# 시험 이름만 적으면 통과한 시험도 트리 줄(`✓ 이름`)에 실려 표지가 되지 못한다. 실패 머리(`FAIL … > 이름`)의 `> ` 까지 든다.
expect_output = ["> U+0085 만 든 사유는 '거부'가 막힌다", "> U+FEFF 만 든 사유는 '거부'가 막히지 않는다"]

[[mutation.edit]]
file = "web/apps/widget/lib/approval.ts"
old = '''
  return Array.from(reason).every((char) => PYTHON_SPACE.has(char));
'''
new = '''
  return reason.trim() === "";
'''

[[mutation]]
name = "사유를 다듬어 보내면 적은 그대로 보내는 시험이 빨갛다"
