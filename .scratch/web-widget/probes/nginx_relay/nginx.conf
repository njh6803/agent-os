# web-widget nginx 중계 측정의 설정 틀. measure.py 가 골뱅이로 감싼 자리 표시를 채워 임시 prefix 의 conf/nginx.conf 로 쓴다.
#
# 서버 블록 하나가 변형 하나다. 블록마다 평문, TLS, TLS+HTTP/2 포트를 같이 듣는다(자리 표시는 HTTP_, TLS_, H2_ 뒤에 변형 이름).
#   a_* : nginx -> 파이썬(sse_app.py) 직접
#   b_* : nginx -> Next(next_app/, rewrites, compress: false) -> 파이썬
# a_default 와 b_default 가 경로 허용 목록 후보이기도 하다. /chat/ 과 위젯(/widget, /widget/)만 넘기고 나머지는
# nginx 가 404 로 답한다. 변형 블록은 허용 목록 대신 측정에 필요한 위치만 둔다.
#
# 블록에 적지 않은 지시어는 nginx 의 기본값이다: proxy_buffering on, gzip off, proxy_read_timeout 60s,
# proxy_ignore_client_abort off. 설정 파일이 아니라 nginx 의 기본값이다. proxy_http_version 의 기본값은 판에 따라
# 다르다. 1.29.6 까지 1.0(상류 연결은 요청마다 닫힌다), 1.29.7 부터 1.1 이고 상류 keepalive 가 기본으로 켜진다
# (nginx CHANGES 1.29.7). *_h10, *_h11 블록이 그 값을 명시해 판과 갈라 본다.
# 우분투 패키지의 /etc/nginx/nginx.conf 는 gzip on 을 켠다(gzip_types 는 기본 text/html). a_gzip_on 이 그 모양이다.
#
# 오류 기록은 info 수준이다. 'client prematurely closed', 'upstream timed out' 같은 줄을 measure.py 가 요청의
# probe 값으로 찾아 표에 옮긴다. 임시 경로는 prefix 아래로 둔다(리눅스 패키지의 컴파일 기본값이 /var 아래라).

worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log info;

events {
    worker_connections 512;
}

http {
    default_type text/plain;
    access_log logs/access.log;
    # 측정용 표지. 상류가 답했으면 그 주소가 실리고 nginx 가 스스로 답했으면(값이 비면) 빠진다.
    # 서버·위치 블록에 add_header 가 없어 모든 블록이 이것을 물려받는다.
    add_header X-Probe-Upstream $upstream_addr always;
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;

    ssl_certificate @CERT@;
    ssl_certificate_key @KEY@;

    upstream python {
        server 127.0.0.1:@PY_PORT@;
    }

    upstream next {
        server 127.0.0.1:@NEXT_PORT@;
    }

    # 허용 목록 후보 A. /chat/ 은 파이썬으로, 위젯 페이지와 그 자산(basePath /widget)은 Next 로 간다.
    # proxy_pass 에 URI 를 붙이지 않아 nginx 는 받은 요청 줄의 URI 를 그대로 넘긴다.
    # location = /widget 은 슬래시 함정 때문이다(w_slash_only 와 비교). Next 는 /widget/ 을 /widget 으로 308 하고,
    # 슬래시로 끝나는 접두사 위치만 있으면 nginx 는 /widget 을 /widget/ 로 301 한다.
    server {
        listen 127.0.0.1:@HTTP_a_default@;
        listen 127.0.0.1:@TLS_a_default@ ssl;
        listen 127.0.0.1:@H2_a_default@ ssl http2;

        location /chat/ {
            proxy_pass http://python;
        }
        location = /widget {
            proxy_pass http://next;
        }
        location /widget/ {
            proxy_pass http://next;
        }
        location / {
            return 404 "nginx-allowlist: blocked\n";
        }
    }

    server {
        listen 127.0.0.1:@HTTP_a_buffering_off@;
        listen 127.0.0.1:@TLS_a_buffering_off@ ssl;
        listen 127.0.0.1:@H2_a_buffering_off@ ssl http2;
        location /chat/ {
            proxy_pass http://python;
            proxy_buffering off;
        }
    }

    # 상류가 X-Accel-Buffering: no 를 보내지 않을 때의 모양. 헤더를 무시시켜 proxy_buffering on 이 실제로 걸린다.
    server {
        listen 127.0.0.1:@HTTP_a_ignore_xab@;
        listen 127.0.0.1:@TLS_a_ignore_xab@ ssl;
        listen 127.0.0.1:@H2_a_ignore_xab@ ssl http2;
        location /chat/ {
            proxy_pass http://python;
            proxy_ignore_headers X-Accel-Buffering;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_a_gzip_on@;
        listen 127.0.0.1:@TLS_a_gzip_on@ ssl;
        listen 127.0.0.1:@H2_a_gzip_on@ ssl http2;
        gzip on;
        location /chat/ {
            proxy_pass http://python;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_a_gzip_sse@;
        listen 127.0.0.1:@TLS_a_gzip_sse@ ssl;
        listen 127.0.0.1:@H2_a_gzip_sse@ ssl http2;
        gzip on;
        gzip_types text/event-stream;
        location /chat/ {
            proxy_pass http://python;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_a_gzip_sse_ignore_xab@;
        listen 127.0.0.1:@TLS_a_gzip_sse_ignore_xab@ ssl;
        listen 127.0.0.1:@H2_a_gzip_sse_ignore_xab@ ssl http2;
        gzip on;
        gzip_types text/event-stream;
        location /chat/ {
            proxy_pass http://python;
            proxy_ignore_headers X-Accel-Buffering;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_a_gzip_sse_buffering_off@;
        listen 127.0.0.1:@TLS_a_gzip_sse_buffering_off@ ssl;
        listen 127.0.0.1:@H2_a_gzip_sse_buffering_off@ ssl http2;
        gzip on;
        gzip_types text/event-stream;
        location /chat/ {
            proxy_pass http://python;
            proxy_buffering off;
        }
    }

    # 허용 목록 후보 B. /chat/ 도 Next 로 가고 Next 의 rewrites 가 파이썬으로 넘긴다.
    server {
        listen 127.0.0.1:@HTTP_b_default@;
        listen 127.0.0.1:@TLS_b_default@ ssl;
        listen 127.0.0.1:@H2_b_default@ ssl http2;

        location /chat/ {
            proxy_pass http://next;
        }
        location = /widget {
            proxy_pass http://next;
        }
        location /widget/ {
            proxy_pass http://next;
        }
        location / {
            return 404 "nginx-allowlist: blocked\n";
        }
    }

    server {
        listen 127.0.0.1:@HTTP_b_buffering_off@;
        listen 127.0.0.1:@TLS_b_buffering_off@ ssl;
        listen 127.0.0.1:@H2_b_buffering_off@ ssl http2;
        location /chat/ {
            proxy_pass http://next;
            proxy_buffering off;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_b_ignore_xab@;
        listen 127.0.0.1:@TLS_b_ignore_xab@ ssl;
        listen 127.0.0.1:@H2_b_ignore_xab@ ssl http2;
        location /chat/ {
            proxy_pass http://next;
            proxy_ignore_headers X-Accel-Buffering;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_b_gzip_sse@;
        listen 127.0.0.1:@TLS_b_gzip_sse@ ssl;
        listen 127.0.0.1:@H2_b_gzip_sse@ ssl http2;
        gzip on;
        gzip_types text/event-stream;
        location /chat/ {
            proxy_pass http://next;
        }
    }

    # 상류 HTTP 판을 명시한 쌍. 1.0 이면 상류 응답이 연결 닫힘으로 끝나는 본문이라 nginx 가 잘림을 정상 끝과
    # 가르지 못한다. 1.1 이면 청크 끝 표시가 없을 때 'upstream prematurely closed' 다.
    server {
        listen 127.0.0.1:@HTTP_a_h10@;
        listen 127.0.0.1:@TLS_a_h10@ ssl;
        listen 127.0.0.1:@H2_a_h10@ ssl http2;
        location /chat/ {
            proxy_pass http://python;
            proxy_http_version 1.0;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_a_h11@;
        listen 127.0.0.1:@TLS_a_h11@ ssl;
        listen 127.0.0.1:@H2_a_h11@ ssl http2;
        location /chat/ {
            proxy_pass http://python;
            proxy_http_version 1.1;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_a_ignore_xab_h10@;
        listen 127.0.0.1:@TLS_a_ignore_xab_h10@ ssl;
        listen 127.0.0.1:@H2_a_ignore_xab_h10@ ssl http2;
        location /chat/ {
            proxy_pass http://python;
            proxy_ignore_headers X-Accel-Buffering;
            proxy_http_version 1.0;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_a_ignore_xab_h11@;
        listen 127.0.0.1:@TLS_a_ignore_xab_h11@ ssl;
        listen 127.0.0.1:@H2_a_ignore_xab_h11@ ssl http2;
        location /chat/ {
            proxy_pass http://python;
            proxy_ignore_headers X-Accel-Buffering;
            proxy_http_version 1.1;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_b_h10@;
        listen 127.0.0.1:@TLS_b_h10@ ssl;
        listen 127.0.0.1:@H2_b_h10@ ssl http2;
        location /chat/ {
            proxy_pass http://next;
            proxy_http_version 1.0;
        }
    }

    server {
        listen 127.0.0.1:@HTTP_b_h11@;
        listen 127.0.0.1:@TLS_b_h11@ ssl;
        listen 127.0.0.1:@H2_b_h11@ ssl http2;
        location /chat/ {
            proxy_pass http://next;
            proxy_http_version 1.1;
        }
    }

    # 슬래시 함정의 대조군. 위젯 위치가 /widget/ 하나뿐이다.
    server {
        listen 127.0.0.1:@HTTP_w_slash_only@;
        listen 127.0.0.1:@TLS_w_slash_only@ ssl;
        listen 127.0.0.1:@H2_w_slash_only@ ssl http2;
        location /widget/ {
            proxy_pass http://next;
        }
        location / {
            return 404 "nginx-allowlist: blocked\n";
        }
    }
}
