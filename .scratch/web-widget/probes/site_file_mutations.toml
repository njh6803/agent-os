# web-widget 티켓 04 의 변이 표. 사이트 파일을 두 언어가 같은 규칙으로 읽는다는 시험 가운데 빨강을 본 적이 없는 것을
# 겨눈다. 파이썬의 지나는 표기와 TOML 픽스처 시험은 구현 전부터 초록이었고(지금 코드는 '*' 만 막았다), Node 의 지나는
# 표기와 URL 파서 대조와 시작 래퍼의 경로 풀기는 판정 없는 껍데기에서도 초록이거나 구현과 함께 썼다. 막히는 표기와 모양의
# 시험은 판정 없는 껍데기와 구현 전 코드에서 빨강을 봤다(일지 2026-10-24-05). 끝 점의 사례는 CSP3 를 읽은 뒤 더해 두 언어에서
# 넷씩 빨강을 본 뒤 고쳤고, 끝 점 변이 넷은 그 고침의 자리(끝 점을 라벨로 세지 않기, IPv4 정규형은 끝 점째 보기)를 겨눈다.
# 호스트 규칙을 WHATWG URL 의 금지된 도메인 글자로 되돌린 뒤(셀프 리뷰 명세 축 1), 금지된 글자의 경계(공백, %, DEL, 밑줄)를
# 두 언어에서 하나씩 겨누고, 필수 키를 보는 Node 시험(셀프 리뷰 명세 축 5)을 겨눈다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/web-widget/probes/site_file_mutations.toml [번호 ...]
# 네트워크를 타지 않는다. node 러너는 `pnpm -C web install` 이 된 체크아웃에서 돈다. 마지막 변이는 실제 next build 를
# 띄운다(설정 파일을 읽다 멈춘다).

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

