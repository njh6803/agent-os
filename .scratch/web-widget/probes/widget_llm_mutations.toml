# web-widget 티켓 11 의 변이 표. 실제 모델 e2e 를 감싸는 시험(tests/test_widget_llm.py)의 기준 다섯과, 프로젝트 llm 을
# 세우는 조건(web/apps/widget/playwright.config.ts), 토큰 합계와 기본 실행의 제외(tests/conftest.py, pyproject.toml)를
# 되돌려 빨개지는지 본다(원칙 II). 앞의 셋과 9 는 실제 모델과 위젯 빌드를 지나 변이 하나가 1~3분이고 모델을 부른다(2 는
# 키를 빼서 부르지 못한다).
#   PYTHONUTF8=1 uv run --env-file ../../../.env python tools/mutate.py .scratch/web-widget/probes/widget_llm_mutations.toml [번호 ...]
# 워크트리(.claude/worktrees/<이름>/)에서 친다. 주 체크아웃이면 --env-file .env 다. chromium 이 Playwright 의 브라우저
# 캐시에 있어야 한다.
#
# 표지는 고른 단언이 실패할 때만 나오는 문구다. pytest 는 실패한 시험 함수의 원문을 통째로 찍어, 그 원문에 글자 그대로
# 있는 문구는 고르지 않는다. 앞의 셋은 `_failures` 가 값을 넣어 지은 글(사전의 repr, 트레이스의 수, 목록의 repr)이다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

# --- 실제 모델 e2e 의 기준 셋(한 바퀴에서 모아 알린다) ---------------------------------------------------------

[[mutation]]
name = "Playwright 의 llm 시험을 건너뛰면 통과 1 건너뜀 0 기준이 빨갛다"
tests = ["tests/test_widget_llm.py", "-m", "llm_widget"]
expect = "red"
expect_output = ["{'expected': 0, 'skipped': 1"]

[[mutation.edit]]
file = "web/apps/widget/e2e/calc.llm.ts"
old = '''test("계산 에이전트가 위젯에서 보낸 요청 하나에'''
new = '''test.skip("계산 에이전트가 위젯에서 보낸 요청 하나에'''

[[mutation]]
name = "serve 의 환경에서 키를 빼면 llm_called 기준이 빨갛다"
tests = ["tests/test_widget_llm.py", "-m", "llm_widget"]
expect = "red"
expect_output = ["트레이스 1개에 llm_called 가 없다"]

[[mutation.edit]]
