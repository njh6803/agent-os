# web-widget 티켓 03 의 변이 표. 위젯 앱의 시험(질의 읽기, 페이지, 빌드 설정, 글꼴 복사, 시작 래퍼, 스토리 테스트, 사진
# 비교)과 사진 비교 도구의 워크스페이스 링크가 무엇을 재는지 변이로 본다. 테스트를 먼저 쓴 것도 첫 빨강은 모듈이 없어서였을
# 뿐이라, 단언마다 그 단언이 겨눈 변경에서 빨개지는지 본다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/web-widget/probes/widget_app_mutations.toml [번호 ...]
# stories 러너는 chromium 이 Playwright 의 브라우저 캐시에, visual 러너는 Docker 와 판을 고정한 이미지와 커밋한 위젯의
# 정답 사진이 있어야 한다. visual 러너는 변이마다 위젯의 정적 빌드를 다시 지어 컨테이너에서 돈다.
# 루프백 변이는 프로세스를 띄우는 start.spawn.test.ts 를 고르지 않는다. 판정을 지난 next dev 가 실제로 선다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "widget-pages"]
cwd = "web"
judge = "vitest"

[runner.stories]
command = ["pnpm", "exec", "vitest", "run", "--project", "widget-storybook"]
cwd = "web"
judge = "vitest"

[runner.visual]
command = ["pnpm", "-C", "web", "visual:widget"]
judge = "playwright"

