# web-widget 티켓 07 의 변이 표. 실패 알림, 거절의 갈래, 상한의 띠의 시험 가운데 구현 뒤에 쓰거나 처음부터 초록이던
# 것이 무엇을 재는지 변이로 본다. 앞의 여덟은 화면 동작 테스트(`widget-pages`), 뒤의 일곱은 위젯 스토리
# (`widget-storybook`)다.
# 처음부터 빨강을 본 시험(원인마다의 알림, 404·409, 422·429 의 되돌림, 띠의 읽기와 숫자)은 넣지 않았다.
# 빨강을 기대한 열넷은 모두 고른 단언이 빨개졌다는 것을 그 단언의 실패 머리나 값이 든 줄(`expect_output`)로 본다.
# 첫 판은 열셋 가운데 셋에만 표지가 있어 셀프 리뷰가 짚었고, 변이를 하나씩 손으로 넣어 실패 출력을 본 뒤 골랐다.
# 여덟째(기다림 도중의 끊김)는 셀프 리뷰를 반영하며 더했다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/web-widget/probes/failures_mutations.toml [번호 ...]
# stories 러너는 chromium 이 Playwright 의 브라우저 캐시에 있어야 한다.

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "widget-pages"]
cwd = "web"
judge = "vitest"

[runner.stories]
command = ["pnpm", "exec", "vitest", "run", "--project", "widget-storybook"]
cwd = "web"
judge = "vitest"

# --- 처리하지 못한 것(500 행) ---------------------------------------------------------------------------------

[[mutation]]
name = "표 밖의 상태를 409 로 그리면 500 행의 시험이 빨갛다"
runner = "pages"
tests = ["apps/widget/components/pages/WidgetFailures.test.tsx", "-t", "요청을 처리하지 못했습니다"]
expect = "red"
expect_output = ["에이전트를 지금 쓸 수 없습니다"]

[[mutation.edit]]
file = "web/apps/widget/lib/conversation.ts"
old = '''
        default:
          return settleError(state);
'''
new = '''
        default:
          return settle(state, { kind: "unavailable" });
'''

[[mutation]]
name = "결말 없이 끝난 스트림을 409 로 그리면 스트림 행의 시험이 빨갛다"
runner = "pages"
tests = ["apps/widget/components/pages/WidgetFailures.test.tsx", "-t", "끝난 스트림"]
expect = "red"
expect_output = ["에이전트를 지금 쓸 수 없습니다"]

[[mutation.edit]]
file = "web/apps/widget/lib/conversation.ts"
old = '''
    case "ended":
      return settleError(state);
'''
new = '''
    case "ended":
      return settle(state, { kind: "unavailable" });
'''

