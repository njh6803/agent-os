# web-widget 티켓 05 의 변이 표. 대화 화면의 시험(토큰 손잡이, 대화 규칙, 입력 자리, 읽기 영역, 스크롤, 빌드 값)이
# 무엇을 재는지 변이로 본다. 첫 20 의 시험은 구현 뒤에 써서 빨강을 본 적이 없으므로, 단언마다 그 단언이 겨눈 변경에서
# 빨개지는지 본다. 끝의 여섯은 셀프 리뷰 뒤에 더했다. 넷(id, 다시 보내기, 멈춘 입력창, aria-atomic)은 고치기 전에 시험이
# 빨갰고, 둘(떠나면 끊기, 시작 뒤에 결말 없이 끝난 스트림)은 이미 있던 코드를 지키는 시험이라 처음부터 초록이었다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/web-widget/probes/conversation_mutations.toml [번호 ...]
# stories 러너는 chromium 이 Playwright 의 브라우저 캐시에 있어야 한다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "widget-pages"]
cwd = "web"
judge = "vitest"

[runner.stories]
command = ["pnpm", "exec", "vitest", "run", "--project", "widget-storybook"]
cwd = "web"
judge = "vitest"

