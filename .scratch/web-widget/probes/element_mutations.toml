# web-widget 티켓 10 의 변이 표. 페이지 안 방식(web/apps/widget/element/, tools/element.ts, 시작 래퍼, next 설정)의 시험
# 가운데 구현과 함께 쓰거나 구현 뒤에 써서 빨강을 본 적이 없는 것을 겨눈다. 위젯 e2e 의 페이지 안 사례
# (web/apps/widget/e2e/element.e2e.ts)는 구현 뒤에 써 처음부터 초록이었다(크기 사례는 측정 범위를 고친 뒤 초록, 일지).
# `expect_output` 은 겨눈 단언이 실패할 때만 나오는 문구(실패 머리, `Received:`·`Locator:` 줄, 차이의 `+`·`-` 줄)로 고른다.
# 거른 시험 안에 단언이 하나뿐이면 그 단언의 실패 머리로 족하다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/web-widget/probes/element_mutations.toml [번호 ...]
# node·pages 러너는 `pnpm -C web install` 이 된 체크아웃에서 돈다. pages 러너는 jsdom 을 띄우는 데 1분쯤 걸린다. e2e
# 러너는 준비가 위젯을 다시 빌드해 변이 하나가 1~2분이고, Playwright 의 chromium 과 uv 의 가상 환경이 있어야 한다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "widget-pages"]
cwd = "web"
judge = "vitest"

[runner.e2e]
command = ["pnpm", "exec", "playwright", "test"]
cwd = "web/apps/widget"
judge = "playwright"

