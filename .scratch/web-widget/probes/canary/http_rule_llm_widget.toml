# 티켓 11이 `.claude/rules/http.md` 의 테스트 항목에서 "유일한 자리"를 풀고, 실제 소켓을 재는 것들의 목록 끝에
# 더한 `-m llm_widget` 시험이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지. 실험군은 규칙의 paths 안
# (src/agent_os/server.py), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-11-26, 이 PC, claude 2.1.325, 일지 2026-11-26-1553. admin-login 티켓 03 이 같은 규칙에 운영자 경로의 짧은 JWT 항목과 공개 경로 셋과 테스트 항목의 계정 저장소 문장을 더한 뒤, 커밋하기 전의 작업 트리로 돌렸다. 기대는 그대로이고 나열의 마지막 항목은 여전히 `llm_portal` 이다). 앞 판은 통과 4(2026-11-25, 이 PC, claude 2.1.325, 일지 2026-11-25-1440. widget-admin-server 티켓 01 이 같은 규칙의 첫 항목(공용 배관은 `agent_os` 안이고 둘째 묶음은 자기 사본을 든다)에 한 줄을 더한 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-11-20, 이 PC, 일지 2026-11-20-1918. postgres-foundation 티켓 03 이 같은 규칙의 앱 조립·미들웨어 순서·테스트 항목에 데이터베이스 확인을 더한 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-11-16, 이 PC, 일지 2026-11-16-1447. release-image 티켓 09 가 같은 파일의 테스트 항목 괄호에 단독 배포 e2e 의 실행 조건을 더한 뒤, 커밋하기 전의 작업 트리로 돌렸다. 기대는 그대로이고 나열의 마지막 항목은 여전히 `llm_portal` 이다). 앞 판은 통과 4(2026-11-15, 이 PC, 일지 2026-11-15-1637-openai-compatible-adapter-and-local-model-test. local-model 05 가 같은 항목의 나열 뒤에 `-m llm_local` 이 `serve` 를 띄우지 않아 들지 않는다는 괄호를 더한 뒤, 커밋하기 전의 작업 트리로 돌렸다. 기대는 그대로이고 나열의 마지막 항목은 여전히 `llm_portal` 이다). 앞 판은 통과 4(2026-11-10, 이 PC, 일지 2026-11-10-1958-real-model-calc-on-portal. pilot-portal 09 가 같은 나열 끝에 `-m llm_portal` 의 `tests/test_portal_llm.py` 를 더하고 기대를 그 항목으로 고친 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-11-10, claude 2.1.318, 일지 2026-11-10-1459. pilot-portal 06 이 같은 파일의 "두 e2e" 괄호를 세 e2e 로 고친 뒤, 커밋하기 전의 작업 트리로 돌렸다). 그 앞 판은 통과 4(2026-10-24, claude 2.1.302, 일지 2026-10-24-13). PR 직전 리뷰가 같은 줄의
# "모델을 부르지 않는 두 e2e" 괄호를 위젯의 프로젝트 `chromium` 으로 좁힌 뒤, 커밋하기 전의 작업 트리로 다시 돌려 통과 4였다(같은 날, 같은 판).
# 돌리는 법: uv run python tools/canary.py .scratch/web-widget/probes/canary/http_rule_llm_widget.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, uvicorn 이 실제로 포트를 열고 소켓으로 응답을 흘리는 것을 무엇이 재는지 나열한
문장이 있으면, 그 나열의 마지막 항목을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["위젯 미리보기 페이지 e2e를 실제 모델로 돌리는 -m llm_portal의 tests/test_portal_llm.py"]
source = ".claude/rules/http.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/server.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
