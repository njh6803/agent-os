# 티켓 11이 `.claude/rules/http.md` 의 테스트 항목에서 "유일한 자리"를 풀고, 실제 소켓을 재는 것들의 목록 끝에
# 더한 `-m llm_widget` 시험이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지. 실험군은 규칙의 paths 안
# (src/agent_os/server.py), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-10-24, 이 PC, claude 2.1.302, 일지 2026-10-24-13).
# 돌리는 법: uv run python tools/canary.py .scratch/web-widget/probes/canary/http_rule_llm_widget.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, uvicorn 이 실제로 포트를 열고 소켓으로 응답을 흘리는 것을 무엇이 재는지 나열한
문장이 있으면, 그 나열의 마지막 항목을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["위젯 e2e를 실제 모델로 돌리는 -m llm_widget의 tests/test_widget_llm.py"]
source = ".claude/rules/http.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/server.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
