# `.claude/rules/web-design.md` 에서 web-widget 티켓 03 이 고친 문단(앱의 Storybook 과 위젯의 스토리 테스트·사진 비교)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지(CLAUDE.md 작업 규약 3). 그 문단은 "앱의 components에는 아직 스토리가
# 없다"던 문장을 위젯의 자리로 바꿨다. 실험군은 규칙의 paths 안(web/packages/ui/), 대조군은 밖(pyproject.toml)을 읽는다.
# 둘 다 이 체크아웃이다. 실험군의 파일은 고친 문단을 담지 않은 것을 골랐다. 대조군을 README.md 로 두지 않은 것은 그
# 파일이 같은 티켓에서 위젯의 사진 비교 명령을 적어, 카나리아는 아니어도 답의 재료를 흘릴 수 있어서다.
# 최신 결과: 통과 4(실험군 3, 대조군 1, 2026-10-23, 이 PC, claude 2.1.302, 일지 2026-10-23-50). "없음" 섞인 통과 0.
# 셀프 리뷰를 반영해 문단에 "패키지를 바꾸면 `visual:widget`도 친다"를 더한 판으로 다시 돈 결과이고, 실험군 하나가
# 그 문장을 옮겼다. 커밋 전의 작업 트리라 갈래의 커밋은 기준 커밋 8a026f3c 로 찍혔다.
# 돌리는 법: uv run python tools/canary.py .scratch/web-widget/probes/canary/web_design_app_storybook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 디자인 판단 기준을 다루는 지시가 있으면, 앱이 자기 Storybook 을 두는 것을 말하는 문단에서 위젯의 정답 사진이 놓이는 경로와, 그 문단이 드는 명령 가운데 정답 사진을 다시 만드는 명령을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문단이 없으면 "없음"이라고만 답하라.
'''
expect = [
  "web/apps/widget/visual/snapshots/",
  "visual:widget:update",
]
source = ".claude/rules/web-design.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "web/packages/ui/src/components/atoms/StatusBadge.tsx"

[[arm]]
name = "paths-밖"
role = "control"
target = "pyproject.toml"
