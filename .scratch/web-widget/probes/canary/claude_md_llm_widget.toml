# 티켓 11이 CLAUDE.md 검증 명령 절에 더한 두 곳(테스트 줄 첫 괄호의 `-m llm_widget` 안내, pre-commit 이 갈음하지
# 않는 것을 든 문장의 `-m llm_widget`)이 새 세션에 실리는지. CLAUDE.md 는 매 세션 실리므로 규칙 갈래의 모양만
# 빌린다. 두 갈래 모두 같은 README.md 를 읽고 체크아웃만 다르다. 대조군은 바뀌기 전 판이고 거기에는 카나리아가 없다.
# 워크트리 세션에는 주 체크아웃의 `CLAUDE.md`가 실리지 않아(`.scratch/harness/probes/claude_md_parent.py`,
# 대기열 171) 실험군의 통과는 워크트리 사본이 실렸다는 뜻이다.
# 최신 결과: 통과 4(2026-10-24, 이 PC, claude 2.1.302, 대조군 `148652ef`, 일지 2026-10-24-13). 대조군은 옛 문장을 옮겼다.
# 셀프 리뷰가 첫 문장에 "항목의 투영"을 더하고 기대에 그 대목을 넣은 뒤 다시 돌려 통과 4였다(같은 날, 같은 판). 실험군은
# 그 낱말이 든 문장을, 대조군은 그 낱말 없는 옛 문장을 옮겼다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 148652ef .scratch/web-widget/probes/canary/claude_md_llm_widget.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 프로젝트 지시의 "검증 명령" 절에서 두 가지를 글자 그대로 옮겨라.
첫째, 테스트 줄의 첫 괄호 안에서 LLM 호출 테스트의 명령 바로 다음에 오는 문장.
둘째, 커밋의 pre-commit 결과로 갈음되지 않는 것을 든 문장.
읽은 파일에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 그 자리에 "없음"이라고만 답하라.
'''
expect = [
    "서버의 최종 사용자 경로와 항목의 투영을 건드렸으면",
    "위젯의 실제 모델 e2e인 -m llm_widget도 친다",
    "-m llm·-m llm_widget·e2e·사진 비교",
]
source = "CLAUDE.md"

[[arm]]
name = "워크트리"
role = "experiment"
target = "README.md"

[[arm]]
name = "옛-판"
role = "control"
target = "README.md"
