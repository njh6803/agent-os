# --- 셀프 리뷰가 더한 시험 ------------------------------------------------------------------------------------------
#
# 리뷰가 짚은 갈래(만료와 멈춤 뒤의 새로 고침, 구독의 422 와 표 밖의 상태, 용량이 뺀 다시 붙을 교환의 요청 글)를 지키는
# 시험은 처음부터 초록이라 여기 넣었다. 구독의 404 사이에 다른 거절이 끼는 시험은 고치기 전에 빨강을 봐서 넣지 않았다.

[[mutation]]
name = "결정의 두 번째 404 가 다시 붙을 실행을 비우지 않으면 새로 고친 뒤 구독해 빨갛다"
runner = "pages"
tests = ["apps/widget/components/pages/WidgetReconnect.test.tsx", "-t", "결정이 두 번 404 여서"]
expect = "red"
# 구독 목록이 빈 단언이 빨개진다. 받은 쪽의 Last-Event-ID 줄(처음부터 받는 구독)을 본다.
expect_output = ["expected [ { …(4) } ] to deeply equal []", "+     \"lastEventId\": null,"]

