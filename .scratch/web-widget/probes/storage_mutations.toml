# web-widget 티켓 09 의 변이 표. 저장과 다시 잇기의 화면 동작 테스트(`widget-pages`) 가운데 구현 뒤에 쓰거나 처음부터
# 초록이던 것이 무엇을 재는지 변이로 본다. 처음부터 빨강을 본 시험(저장의 모양, 다시 잇기의 띠와 간격, 구독의 거절)은
# 넣지 않았다. 표지는 변이를 손으로 넣어 실패 출력을 본 뒤 골랐다. 6 은 45초 끊기를 타이머 콜백에서 하던 판으로 되돌려,
# 화면 동작 시험에서 뒤의 테스트의 요청이 망가진 연결로 나가던 것(probes/msw_abort_order.mjs)을 다시 본다. 7 부터는 셀프
# 리뷰가 더한 시험이다(아래 절의 머리).
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/web-widget/probes/storage_mutations.toml [번호 ...]

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "widget-pages"]
cwd = "web"
judge = "vitest"

# --- 새 탭과 묶음 견주기 ---------------------------------------------------------------------------------------------

[[mutation]]
name = "저장이 없어도 토큰을 물으면 새 탭과 지운 저장의 시험이 빨갛다"
runner = "pages"
tests = ["apps/widget/components/pages/WidgetStorage.test.tsx", "-t", "토큰을 묻지 않고"]
expect = "red"
# 새 탭은 받은 요청 목록이 빈 것을, 판이 다르거나 모양이 어긋난 저장은 요청 수가 저장 전과 같은 것을 단언한다.
expect_output = ["expected [ Array(1) ] to deeply equal []", "to have a length of 2 but got 3"]

