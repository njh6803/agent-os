<!-- @dsCard group="atoms" -->
<p id="ko" style="font-family: var(--font-sans, sans-serif); font-size: 16px; margin: 0 0 8px">결정을 기다리는 실행이 3개입니다 Agg 0123</p>
<pre id="diag" style="font: 11px/1.45 monospace; white-space: pre-wrap; margin: 0">DIAG 기다리는 중</pre>
<script>
(async () => {
  const out = document.getElementById("diag");
  const ko = document.getElementById("ko");
  try {
    await document.fonts.ready;
    await new Promise((r) => setTimeout(r, 2000));
    await document.fonts.ready;
    const strip = (s) => String(s || "").replace(/^https?:\/\/[^/]+/, "");
    const html = document.documentElement;
    const cs = getComputedStyle(html);
    const fontRes = performance.getEntriesByType("resource").map((e) => e.name).filter((n) => /\.woff2?(\?|$)/.test(n));
    const faces = [...document.fonts];
    const loaded = faces.filter((f) => f.status === "loaded");
    const failed = faces.filter((f) => f.status === "error");
    out.textContent = [
      "DIAG v2 done",
      "gray50=" + cs.getPropertyValue("--gray-50").trim() + " bg=" + cs.getPropertyValue("--bg").trim(),
      "react=" + (window.React && window.React.version) + " reactdom=" + (window.ReactDOM && window.ReactDOM.version),
      "data-theme=" + html.getAttribute("data-theme") + " data-mode=" + html.getAttribute("data-mode"),
      "color-scheme=" + cs.colorScheme + " htmlbg=" + cs.backgroundColor + " bodybg=" + getComputedStyle(document.body).backgroundColor,
      "ko-family=" + getComputedStyle(ko).fontFamily + " check=" + document.fonts.check('16px "Noto Sans KR"', "결"),
      "faces=" + faces.length + " loaded=" + loaded.length + " error=" + failed.length + " families=" + [...new Set(loaded.map((f) => f.family))].join(","),
      "fontres=" + fontRes.length + " first=" + strip(fontRes[0]),
      "baseURI=" + strip(document.baseURI).slice(0, 120),
      "links=" + [...document.querySelectorAll("link[rel=stylesheet]")].map((l) => strip(l.href)).join(" | "),
      "styles=" + document.querySelectorAll("style").length + " scripts=" + [...document.querySelectorAll("script[src]")].map((s) => strip(s.src)).join(" | "),
      "AgentOsUi=" + (window.AgentOsUi ? Object.keys(window.AgentOsUi).length : "none"),
    ].join("\n");
  } catch (e) {
    out.textContent = "DIAG error " + e;
  }
})();
</script>
