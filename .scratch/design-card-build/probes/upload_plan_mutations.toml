# design-card-build 티켓 03 의 변이 표(`web/tools/sync-design-system`의 `upload.ts`·`record.ts`). 첫 정식 올리기,
# 목록만 옛것일 때, 나누기, 보낼 색인의 시험은 구현 전에 함수와 칸이 없어 빨갰을 뿐 단언 하나하나의 빨강은 보지
# 못했다. 옛 별칭 48개를 지우는 사례는 구현 전부터 초록이었다(명세가 계획을 고치지 않아도 지운다고 한 그대로). 변이마다
# 그 판정의 줄 하나만 바꾸고 그 사례 하나로 좁혀(`-t`) 빨개지는지 본다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-card-build/probes/upload_plan_mutations.toml [번호 ...]
# 재지 않은 것: 마지막 몫이 빌지 않게 하나를 남기는 한도(`take(rest.length - 1)`)와, 첫 몫이 아니면 빈 몫을 내지 않고
# 멈추는 조건(`!first`). 앞의 것을 끄면 남은 것이 중간 몫에는 들고 마지막 몫의 예약(경로 둘, 기록·색인 한도)에는 들지
# 않는 폭에서만 빈 마지막 몫이 더 나고, 뒤의 것을 끄면 빈 몫을 끝없이 쌓는다(어떻게 끝나는지는 돌려 보지 않았다).
# 멈출 때의 오류 종류와 물러설 길 둘은 아래 변이가 본다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

# --- 첫 정식 올리기 ----------------------------------------------------------------------------------------------

