name = "첫 정식 올리기를 가르지 않으면 tokens.json 을 보내는 사례가 빨갛다"
runner = "node"
tests = ["tools/sync-design-system/upload.test.ts", "-t", "첫 정식 올리기라 지문이 같아도"]
expect = "red"
expect_output = ["AssertionError: expected false to be true"]

