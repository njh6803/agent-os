# design-card-build 티켓 01 의 변이 표(`web/tools/sync-design-system/assemble.ts`). 짓기 명령의 시험은 구현 전에 모듈이
# 없어 모두 빨갰을 뿐 단언 하나하나의 빨강은 보지 못했다. 변이마다 그 단언이 재는 짓기나 판정의 줄을 바꾸고 그 사례로
# 좁혀(`-t`) 빨개지는지 본다. 짓기가 시험 파일의 beforeAll 에서 한 번 돌아, 좁혀도 변이 하나에 짓기 한 번이 든다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-card-build/probes/assemble_mutations.toml [번호 ...]
# 재지 않은 것: "지은 산출은 판정을 지난다"(대조). 판정이 지은 산출을 잘못 막는 변이는 명령 안의 같은 판정이 짓기를
# 오류로 끝내 beforeAll 이 빨개지고, 그 사례만의 빨강이 되지 못한다. 명령이 판정을 부르는 줄(`assertAssembled(stage)`)을
# 지우는 변이도 두지 않았다. 지은 산출이 판정을 지나 어느 사례도 빨개지지 않는다(판정의 갈래는 규칙 판정 사례가 같은
# 함수를 불러 잰다).

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

