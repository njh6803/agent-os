# `/sync-design-system` 의 올리기 절차(`upload.md`)가 늘 짓기 명령으로 산출을 짓고, 보낸 뒤 카드를 보는 단계를 든 판이 새
# 세션에 실리는지(design-card-build 티켓 04, CLAUDE.md 작업 규약 3). 실험군은 이 워크트리, 대조군은 이 티켓 전의 main 커밋
# `fcf808fa` 다. 그 판의 "산출" 절은 빌린 빌드의 산출 스크립트를 들고 "보낸 뒤" 에 카드 보기가 없어, 대조군은 1 에 옛 명령이나
# "없음", 2 에 "없음" 을 답해야 한다. 본문이 하위 파일에 있어 하위 파일 갈래(`skill_body = "files"`)다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-30, 이 PC, claude 2.1.312, 대조군 `--control-commit fcf808fa`, 실험군은 `fcf808fa` 위의 커밋 전
#   변경, 일지 2026-10-30-10). 실험군 세 회차 모두 스킬을 부르고 `upload.md`를 Read로 열어 두 문장을 옮겼고, 대조군은 1 에
#   옛 산출 스크립트(`.design-sync/upload-output.mjs`)를, 2 에 "없음"을 답했다. 원본은 저장소에 두지 않았다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit fcf808fa .scratch/design-card-build/probes/canary/sync_design_system_upload_assembles.toml <출력 디렉터리>
kind = "skill"
question = '''
sync-design-system 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(아티팩트 읽기, 스크립트 실행, 질문)은 하지 않는다.
본문의 인자 표가 올리기 인자에서 가리키는 하위 파일 하나를 Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
1. "산출" 절에서 산출 폴더를 지으려고 치는 명령을 백틱 안의 글자 그대로 옮겨라.
2. 보낸 뒤의 확인을 다루는 항목에서, 앱 안 브라우저로 Components 절을 여는 조건 가운데 보낸 파일에 무엇이 들었는지를 말하는 부분을 글자 그대로 옮겨라.
'''
expect = [
  "assemble --out <작업 폴더>/out --paths <작업 폴더>/output-paths.json",
  "`project/components/` 아래 경로나 `project/_ds_bundle.*`가 들었으면",
]
source = ".claude/skills/sync-design-system/upload.md"
skill = "sync-design-system"
skill_body = "files"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "티켓-전-main"
role = "control"
checkout = "../../.."
