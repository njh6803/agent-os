# 새 마이그레이션 PR 검사(티켓 04)의 시험이 지키는 코드를 하나씩 깨는 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/postgres-foundation/probes/migration_guard_mutations.toml
# 시험은 구현 뒤에 쓴 것도 있어 빨강을 본 적이 없다. 변이마다 그 시험이 빨개지는지 본다.

# --- 노트 검사의 짝(tools/check_notes.py) -------------------------------------

[[mutation]]
name = "짝이 보는 폴더의 경로를 틀리게 한다"
tests = ["tests/tools/test_check_notes.py", "-k", "짝 or 마이그레이션"]
expect = "red"
expect_output = ['versionz 에 마이그레이션 파일이']
[[mutation.edit]]
file = "tools/check_notes.py"
old = '''PRODUCT_MIGRATIONS = "src/agent_os/adapters/postgres/migrations/versions"'''
new = '''PRODUCT_MIGRATIONS = "src/agent_os/adapters/postgres/migrations/versionz"'''

[[mutation]]
name = "짝이 보는 폴더의 경로를 틀리게 하면 꼴 시험도 훑을 파일이 없다고 한다"
tests = ["tests/test_postgres_migration_shape.py"]
expect = "red"
expect_output = ['versionz']
[[mutation.edit]]
file = "tools/check_notes.py"
old = '''PRODUCT_MIGRATIONS = "src/agent_os/adapters/postgres/migrations/versions"'''
new = '''PRODUCT_MIGRATIONS = "src/agent_os/adapters/postgres/migrations/versionz"'''

[[mutation]]
name = "느낌표 없는 제목에서 마이그레이션 짝을 묻지 않는다"
tests = ["tests/tools/test_check_notes.py", "-k", "짝 or 마이그레이션"]
expect = "red"
expect_output = ["Right contains one more item: 'src/agent_os/adapters/postgres/migrations/versions/0002_second.py'"]
[[mutation.edit]]
file = "tools/check_notes.py"
old = '''        for path in migrations
'''
new = '''        for path in []
'''

[[mutation]]
name = "제품 폴더 밖의 src 파일도 짝의 대상으로 센다"
tests = ["tests/tools/test_check_notes.py", "-k", "짝"]
expect = "red"
expect_output = ['postgres/migrations/env.py` 를 새로 더했다']
[[mutation.edit]]
file = "tools/check_notes.py"
old = '''c.path.startswith(tuple(f"{f}/" for f in PRODUCT_MIGRATION_FOLDERS))'''
new = '''c.path.startswith(("src/agent_os/adapters/postgres/", f"{WIDGET_MIGRATIONS}/"))'''

[[mutation]]
name = "고치기만 한 제품 마이그레이션도 새로 더한 것으로 센다"
tests = ["tests/tools/test_check_notes.py", "-k", "짝 or 마이그레이션"]
expect = "red"
expect_output = ['versions/0002_second.py` 를 새로 더했다']
[[mutation.edit]]
file = "tools/check_notes.py"
old = '''c.status == "A" and c.path.startswith(tuple(f"{f}/" for f in PRODUCT_MIGRATION_FOLDERS))'''
new = '''c.status != "D" and c.path.startswith(tuple(f"{f}/" for f in PRODUCT_MIGRATION_FOLDERS))'''

[[mutation]]
name = "위젯 쪽 마이그레이션 폴더를 짝의 대상에서 뺀다"
tests = ["tests/tools/test_check_notes.py", "-k", "위젯_쪽_마이그레이션_폴더의_새_파일"]
expect = "red"
expect_output = ["Right contains one more item: 'widget-admin/src/widget_admin/migrations/versions/0002_second.py'"]
[[mutation.edit]]
file = "tools/check_notes.py"
old = '''PRODUCT_MIGRATION_FOLDERS = (PRODUCT_MIGRATIONS, WIDGET_MIGRATIONS)'''
new = '''PRODUCT_MIGRATION_FOLDERS = (PRODUCT_MIGRATIONS,)'''

