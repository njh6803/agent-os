# approval-rules 05 의 검사 셋(마스킹과 묻기의 충돌, 에이전트 표의 줄, 재개의 서버 대조)을 재는 변이 표.
# 구현과 같은 티켓에서 시험을 먼저 쓴 터라 빨강을 본 뒤 시험이 무엇을 재는지 변이로 다시 본다.
# 실행: PYTHONUTF8=1 uv run python tools/mutate.py <이 파일> [번호 ...]
# 변이마다 겨눈 시험을 -k 로 좁혀 두었다. 표지(expect_output)는 변이를 손으로 넣어 본 실패 출력에서
# 골랐다 — 시험 파일의 원문에 없고, 고른 단언이 받은 값이 찍힌 줄이다.

