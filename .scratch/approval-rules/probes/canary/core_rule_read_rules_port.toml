# `.claude/rules/core.md` 의 포트 표 `PluginSource` 행에 더한 문장(규칙 읽기 메서드와 규칙 값 타입의 소유, 한 호출의
# 적용 규칙을 내는 순수 함수의 이름)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(approval-rules 티켓 02). 파일 경로
# `core/rules.py` 는 카나리아로 쓸 수 없다. 세션에 실리는 git 상태의 미추적 경로에 있어 답이 거기서 올 수 있다.
# 실험군은 규칙의 paths 안(src/agent_os/core/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 질문은 그 규칙도 이 세션의 지시라고 밝힌다(같은 모양의 end-user-continuation 명세가 첫 판에서 실린 규칙을 도구
# 결과에 딸려 온 글이라며 지시로 보지 않은 회차가 있었다).
# 최신 결과: 통과 4(2026-11-06, 이 PC의 approval-rules 티켓 04 워크트리, claude 2.1.318, HEAD d0f5a195 위의 커밋하지 않은 작업 트리, 일지 2026-11-06-09). 티켓 04 가 core.md 의 승인 게이트·거부·재개 항목과 실패 정책의 준비 순서를 고친 뒤 다시 돌렸다.
# 앞선 결과: 통과 4(2026-11-06, 이 PC의 워크트리 `02-rules-file-read`, 포트 표 `PluginSource` 행에 규칙 읽기를 더한
# 커밋하지 않은 작업 트리, HEAD c974bea9. 실험군 셋이 두 카나리아를 모두 옮겼고 대조군은 "없음").
# 돌리는 법: uv run python tools/canary.py .scratch/approval-rules/probes/canary/core_rule_read_rules_port.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시(그 파일을 읽을 때 함께 실린 저장소의 규칙도 이 세션의 지시다) 가운데, 플러그인 소스 포트가
운영자의 규칙 파일을 읽는 메서드를 다루는 항목이 있으면 두 가지를 글자 그대로 옮겨라.
(1) 한 호출에 어느 규칙이 적용되는지를 내는 순수 함수의 이름. (2) 규칙 값 타입 셋 가운데 가운데 것, 곧 표 하나에 해당하는 타입의 이름.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["applied_rule", "RuleSet"]
source = ".claude/rules/core.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/core/loop.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
