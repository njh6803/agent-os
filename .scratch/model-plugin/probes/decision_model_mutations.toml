# 티켓 06(관리 화면 모델 켜고 끄기와 결정 미리보기)의 변이 표 3개. 구현 전부터 초록이던 시험 셋(고르지 않은
# 모델이 꺼진 것, model 을 적지 않은 에이전트, 모델 행이 표지)이 빨강을 볼 수 있는지 잰다. 돌리는 법:
# PYTHONUTF8=1 uv run python tools/mutate.py .scratch/model-plugin/probes/decision_model_mutations.toml
# 2026-11-28 admin-login 11 이 `RunDecision.tsx` 를 걷어, 판정이 `organisms/disabledPlugins.ts` 로, 시험이 같은 자리의
# `disabledPlugins.test.ts` 로 옮겨 갔다. 원문과 시험 이름을 그 자리로 옮겼다(코드는 줄 그대로다).

[runner.vitest_node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

[[mutation]]
name = "에이전트가 고르지 않은 모델의 꺼짐도 센다"
runner = "vitest_node"
tests = ["apps/admin/components/organisms/disabledPlugins.test.ts", "-t", "고르지 않은 모델이 꺼진 것은"]
expect = "red"
expect_output = ["expected [ '모델 sonnet' ] to deeply equal []"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/disabledPlugins.ts"
old = '''
        other.kind === "model" && other.name === model && "manifest" in other && !other.enabled,
'''
new = '''
        other.kind === "model" && "manifest" in other && !other.enabled,
'''

[[mutation]]
name = "model 을 적지 않은 에이전트에도 꺼진 모델을 더한다"
runner = "vitest_node"
tests = ["apps/admin/components/organisms/disabledPlugins.test.ts", "-t", "model 을 적지 않은 에이전트는"]
expect = "red"
expect_output = ["expected [ '모델 null' ] to deeply equal []"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/disabledPlugins.ts"
old = '''
    model !== null &&
    rows.some(
      (other) =>
        other.kind === "model" && other.name === model && "manifest" in other && !other.enabled,
'''
new = '''
    rows.some(
      (other) =>
        other.kind === "model" && "manifest" in other && !other.enabled,
'''

[[mutation]]
name = "모델 행이 표지여도 꺼짐으로 센다"
runner = "vitest_node"
tests = ["apps/admin/components/organisms/disabledPlugins.test.ts", "-t", "고른 모델의 행이 표지면"]
expect = "red"
expect_output = ["expected [ '모델 sonnet' ] to deeply equal []"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/disabledPlugins.ts"
old = '''
        other.kind === "model" && other.name === model && "manifest" in other && !other.enabled,
'''
new = '''
        other.kind === "model" && other.name === model && !other.enabled,
'''
