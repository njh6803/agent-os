runner = "vitest"
tests = ["tools/generate-api-client.test.ts"]
expect = "red"
restore = ["web/packages/api-client/src/generated/openapi.ts"]

[[mutation.edit]]
file = "web/tools/generate-api-client.ts"
old = '''
async function staleness(contract: string): Promise<string | null> {
  const generated = await generate(contract);
'''
new = '''
async function staleness(contract: string): Promise<string | null> {
  const generated = await generate(contract);
  const before = existsSync(GENERATED) ? readFileSync(GENERATED, "utf-8") : "";
  writeFileSync(GENERATED, generated);
  if (before !== generated) {
    return "pnpm -C web run generate:api-client";
  }
'''

