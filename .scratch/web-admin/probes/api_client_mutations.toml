# 티켓 03(생성 클라이언트)의 TS 테스트가 무엇을 재는지 변이로 본다. 처음에는 `tools/mutate.py` 가 pytest 만 돌아서
# 같은 규약의 JS 러너(`api_client_mutations.mjs`)로 지었고, 그 도구가 pytest 밖의 명령을 돌게 되며 여기로 옮겼다
# (대기열 59). 빨강의 판정은 도구의 독스트링이다. Vitest 는 실패한 테스트가 셀 때만, tsc 는 변이마다 적은 파일
# (`diagnostic_in`)에서 진단이 날 때만 빨강이다.
#
# 판정자·tsconfig 검사·최신성 검사의 위반 사례는 테스트가 스스로 만들어 넣어 매 실행이 빨강을 다시 잰다. 여기 있는
# 것은 그 테스트들이 기대는 코드와 설정 쪽(최신성 검사의 보고와 쓰기, 판정자의 범위)의 변이다.
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/web-admin/probes/api_client_mutations.toml [이름 ...]
# 네트워크를 타지 않는다. `pnpm -C web install` 이 된 체크아웃에서 돈다.

[runner.vitest]
command = ["pnpm", "exec", "vitest", "run"]
cwd = "web"
judge = "vitest"

[runner.tsc]
command = ["pnpm", "exec", "tsc", "--noEmit", "-p", "packages/api-client"]
cwd = "web"
judge = "tsc"

[runner.typecheck]
command = ["pnpm", "run", "typecheck"]
cwd = "web"
judge = "tsc"

