# 보고는 그대로 하되(종료 1과 안내) 생성물을 사본의 결과로 덮어쓴다. "고쳐 쓰지 않는다" 테스트 하나만
# 빨개야 한다. 명령이 생성물을 덮어쓰므로 되돌리기는 생성물도 쥔다.
[[mutation]]
