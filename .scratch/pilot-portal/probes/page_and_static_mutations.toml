runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "정적 경로와 루트의 다른 메서드는 405"]
expect = "red"
expect_output = ["AssertionError: /portal/fonts/font-a.woff2: expected 200 to be 405"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''  if (request.method !== "GET") {
    return methodNotAllowed("GET");
  }
  if (matches(request, font.etag)) {'''
new = '''  if (matches(request, font.etag)) {'''

