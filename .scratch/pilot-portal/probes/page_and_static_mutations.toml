# --- ESLint: 페이지 스크립트 한 파일만 fetch 를 푼다 -------------------------------------------------------------

[[mutation]]
name = "예외 글롭을 앱 전체로 넓히면 페이지 스크립트가 아닌 파일의 fetch 사례가 빨갛다"
runner = "node"
tests = ["eslint.config.test.ts", "-t", "질문 페이지"]
expect = "red"
expect_output = ["expected [] to include 'no-restricted-globals'"]

[[mutation.edit]]
file = "web/eslint.config.mjs"
old = '''const PORTAL_PAGE_SCRIPT = "**/apps/portal/browser/portal.ts";'''
new = '''const PORTAL_PAGE_SCRIPT = "**/apps/portal/**/*.ts";'''
