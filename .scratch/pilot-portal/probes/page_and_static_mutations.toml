# pilot-portal 티켓 06(질문 페이지가 위젯을 그린다)의 변이 표. 페이지·정적 파일·글꼴·루트 넘김·중계 상류의 시험은 구현 전에
# 모듈이 없어 빨갰을 뿐이라 단언 하나하나의 빨강은 보지 못했다. 변이마다 그 단언이 재는 줄 하나만 바꾸고 그 사례로 좁혀(`-t`)
# 빨개지는지 본다. ESLint 설정 변이 하나는 `web/eslint.config.test.ts` 의 사례 이름 머리 "질문 페이지" 로 좁힌다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/pilot-portal/probes/page_and_static_mutations.toml [번호 ...]
# 표지는 변이를 넣어 본 실패 출력에서 고른 것이다(표지를 맞지 않는 값으로 둔 사본으로 돌려 `표지 없음` 줄 밑의 출력을 읽었다).
# 네트워크를 타지 않는다. `uv sync` 와 `pnpm -C web install` 이 된 체크아웃에서 돈다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

# --- 처리기: 페이지 응답 ----------------------------------------------------------------------------------------

[[mutation]]
name = "CSP 에서 frame-ancestors 를 빼면 글자 그대로 견주는 사례가 빨갛다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "Content-Security-Policy 는 글자 그대로다"]
expect = "red"
expect_output = ["img-src 'self'; base-uri 'none'"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''frame-ancestors 'none'; base-uri 'none''''
new = '''base-uri 'none''''

[[mutation]]
name = "페이지 응답에서 CSP 머리글을 빼면 글자 그대로 견주는 사례가 빨갛다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "Content-Security-Policy 는 글자 그대로다"]
expect = "red"
expect_output = ["AssertionError: expected undefined to be 'default-src"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''      return staticFile(request, assets.page, { "Content-Security-Policy": PAGE_CSP });'''
new = '''      return staticFile(request, assets.page);'''

[[mutation]]
name = "루트의 302 가 질의를 버리면 질의를 지키는 사례가 빨갛다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "루트는 질의를 그대로 붙여"]
expect = "red"
expect_output = ["expected '/portal/' to be '/portal/?site=other&x=1'"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''      Location: `${PAGE}${request.query}`,'''
new = '''      Location: PAGE,'''

[[mutation]]
name = "루트가 POST 도 넘기면 405 사례가 빨갛다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "정적 경로와 루트의 다른 메서드는 405"]
expect = "red"
expect_output = ["AssertionError: /: expected 302 to be 405"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''    return request.method === "GET" ? redirectToPage(request) : methodNotAllowed("GET");'''
new = '''    return redirectToPage(request);'''

# --- 처리기: 조건부 요청 ----------------------------------------------------------------------------------------

[[mutation]]
name = "약한 표시(W/)를 벗기지 않으면 W/ ETag 가 304 가 아니다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "가 붙은 같은 ETag 도 304 다"]
expect = "red"
expect_output = ["AssertionError: expected 200 to be 304"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''.map((tag) => tag.trim().replace(/^W\//u, ""))'''
new = '''.map((tag) => tag.trim())'''

[[mutation]]
name = "별표를 맞는 것으로 치지 않으면 If-None-Match * 가 304 가 아니다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "별표는 어느 ETag 와도 맞아"]
expect = "red"
expect_output = ["AssertionError: expected 200 to be 304"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''.some((tag) => tag === "*" || tag === etag);'''
new = '''.some((tag) => tag === etag);'''

[[mutation]]
name = "쉼표로 가르지 않으면 목록 가운데의 ETag 가 304 가 아니다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "쉼표로 이은 목록의 가운데"]
expect = "red"
expect_output = ["AssertionError: expected 200 to be 304"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''    .split(",")'''
new = '''    .split(";")'''

[[mutation]]
name = "304 가 Cache-Control 을 빼면 조건부 요청 사례가 빨갛다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "조건부 요청이 같은 ETag 를 보내면"]
expect = "red"
expect_output = ["AssertionError: /portal/: expected undefined to be 'no-cache'"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''    headers: { ...SECURITY_HEADERS, ETag: etag, "Cache-Control": NO_CACHE },'''
new = '''    headers: { ...SECURITY_HEADERS, ETag: etag },'''

[[mutation]]
name = "정적 파일이 Cache-Control 을 빼면 no-cache 사례가 빨갛다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "no-cache 와 ETag 와 nosniff"]
expect = "red"
expect_output = ["AssertionError: /portal/: expected undefined to be 'no-cache'"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''    "Cache-Control": NO_CACHE,
    ETag: file.etag,'''
new = '''    ETag: file.etag,'''

[[mutation]]
name = "정적 파일이 메서드를 보지 않으면 405 사례가 빨갛다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "정적 경로와 루트의 다른 메서드는 405"]
expect = "red"
expect_output = ["AssertionError: /portal/: expected 200 to be 405"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''  if (request.method !== "GET") {
    return methodNotAllowed("GET");
  }
  if (matches(request, file.etag)) {'''
new = '''  if (matches(request, file.etag)) {'''

# --- 처리기: 글꼴 ----------------------------------------------------------------------------------------------

[[mutation]]
