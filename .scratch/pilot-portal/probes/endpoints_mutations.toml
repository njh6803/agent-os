new = '''const UUID_V4 = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu;'''

[[mutation]]
name = "Secure 를 늘 붙이면 http 공개 출처의 쿠키에도 붙는다"
