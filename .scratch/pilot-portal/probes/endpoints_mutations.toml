# pilot-portal 티켓 05(고지 확인과 토큰 끝점)의 변이 표. 끝점과 토큰의 시험은 구현 전에 모듈이 없어 빨갰을 뿐이라 단언
# 하나하나의 빨강은 보지 못했다. 변이마다 그 단언이 재는 줄 하나만 바꾸고 그 사례 하나로 좁혀(`-t`) 빨개지는지 본다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/pilot-portal/probes/endpoints_mutations.toml [번호 ...]
# 표지는 변이를 넣어 본 실패 출력에서 고른 것이다(표지를 맞지 않는 값으로 둔 사본으로 돌려 `표지 없음` 줄 밑의 출력을
# 읽었다). 시험 원문에 글자 그대로 있는 문구는 쓰지 않았다. 네트워크를 타지 않는다. `uv sync` 와
# `pnpm -C web install` 이 된 체크아웃에서 돈다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

# --- 고지 확인의 Origin 검사 ----------------------------------------------------------------------------------

[[mutation]]
name = "Origin 을 견주지 않으면 다른 출처의 고지 확인이 204 로 받아들여진다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "Origin 이 공개 출처와 다르면 쿠키 없이 403"]
expect = "red"
expect_output = ['''"http://evil.example": expected 204 to be 403''']

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''  if (request.headers["origin"] !== context.publicOrigin) {'''
new = '''  if (false) {'''

[[mutation]]
name = "Origin 이 없는 요청을 같은 출처로 보면 쿠키 없이 403 이어야 하는 사례가 빨갛다"
runner = "node"
tests = ["apps/portal/server/handler.test.ts", "-t", "Origin 이 없으면 쿠키 없이 403"]
expect = "red"
expect_output = ["AssertionError: expected 204 to be 403"]

[[mutation.edit]]
file = "web/apps/portal/server/handler.ts"
old = '''  if (request.headers["origin"] !== context.publicOrigin) {'''
new = '''  if (request.headers["origin"] !== undefined && request.headers["origin"] !== context.publicOrigin) {'''

# --- 쿠키 판정 -----------------------------------------------------------------------------------------------

[[mutation]]
