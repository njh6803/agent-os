# pilot-portal 티켓 08(사이트 바꾸기, 보증 모드, 다크 모드, 보고서 링크)의 변이 표. 질문 페이지 e2e(web/apps/portal/e2e/sites.e2e.ts)의
# 사례를 먼저 쓰고 빨강을 본 뒤 구현해 초록을 만들었다(원칙 II). 이 표는 사례마다 그 사례가 겨눈 판정을 되돌려 빨개지는지 다시 본다.
# 사례 가운데 넷(상태 답이 200이 아닐 때 덮개, 연결이 끊겼을 때 덮개, 둘 다 사이트의 Tab 차례, 사이트 하나의 둘째 인스턴스)은 07 의
# 구현이 이미 만족해 구현 전에도 초록이었다(구현 세션의 일지 2026-11-10-2055 가 구현 전 실행에서 읽은 것이다. 프로브가 재지 않았다).
# 그래서 변이가 그 넷의 빨강을 처음 보인다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/pilot-portal/probes/site_switching_mutations.toml [번호 ...]
# chromium 이 Playwright 의 브라우저 캐시에 있어야 하고 uv 의 가상 환경이 서 있어야 한다. 준비가 위젯과 질문 페이지를 띄운다.
# 표지는 고른 단언이 실패할 때만 나오는 문구(호출 기록의 `Expect "…" 위치` 줄, `Expected:` 줄, strict 위반 줄)다. 다른 단언이 실패해도
# 실리는 실패 줄 주변의 코드 조각의 문구는 고르지 않았다(.claude/rules/probes.md 첫 항목).

[runner.e2e]
command = ["pnpm", "exec", "playwright", "test"]
cwd = "web/apps/portal"
judge = "playwright"

[[mutation]]
name = "앞 사이트의 늦게 온 상태 답을 가리는 번호를 없애면 지금 화면의 덮개가 걷혀 빨갛다"
runner = "e2e"
tests = ["-g", "늦게 온 상태 답"]
expect = "red"
expect_output = ["Expect \"toBeVisible\" getByRole('region', { name: '질문하기 전에 읽어 주세요' })"]

