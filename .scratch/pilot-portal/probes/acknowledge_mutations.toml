# pilot-portal 티켓 07(고지 확인 흐름)의 변이 표. 질문 페이지 e2e(web/apps/portal/e2e/acknowledge.e2e.ts)의 사례는 구현과 함께
# 써서 처음부터 초록이었다. 사례마다 그 사례가 겨눈 판정을 되돌려 빨개지는지 본다(원칙 II). 준비가 위젯과 질문 페이지를 띄우므로
# 변이 하나가 30초 안팎 걸린다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/pilot-portal/probes/acknowledge_mutations.toml [번호 ...]
# chromium 이 Playwright 의 브라우저 캐시에 있어야 하고 uv 의 가상 환경이 서 있어야 한다.
# 8번(위젯 요소의 tabindex)은 Tab 으로 입력창에 닿는 단언이 먼저 빨개져 "tabindex 속성이 없다"는 단언 자체는 따로 빨강을 보이지
# 못한다. 이 표가 보이지 않는 것은 상태를 묻다 실패했을 때의 모습(명세가 정하지 않았다)과, 늦은 답이 지금 화면을 덮지 못하게 하는
# 모습이다. 이 표의 `-g` 대상에 없는 사례(사이트 고지 글이 전문이 되는 것, 새로 고침, 쿠키 삭제, 시간당 상한, 출력의 쿠키·토큰
# 부재, 확인 사례의 트레이스 주체 해시와 쿠키 원문 부재)도 단언마다의 빨강을 보지 못했다.

[runner.e2e]
command = ["pnpm", "exec", "playwright", "test"]
cwd = "web/apps/portal"
judge = "playwright"

[[mutation]]
name = "확인이 기록돼도 포커스를 위젯 자리로 옮기지 않으면 빨갛다"
runner = "e2e"
tests = ["-g", "확인하면 덮개가 걷히고"]
expect = "red"
expect_output = ["Expect \"toBeFocused\" locator('#pp-widget')"]

[[mutation.edit]]
file = "web/apps/portal/browser/portal.ts"
old = '''
          show(parts, "widget");
          parts.box.focus();
'''
new = '''
          show(parts, "widget");
'''

