<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비밀번호 정하기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; box-sizing: border-box; padding: 96px var(--spacing-4) var(--spacing-8); display: flex; justify-content: center; background: var(--bg); color: var(--text); font-family: var(--sans);">
<main style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: var(--spacing-6);">
<div class="font-semibold text-body">Agent OS</div>
<div class="flex flex-col gap-2">
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">비밀번호 정하기</h1>
<p class="text-body text-text-muted" style="margin: 0;">시스템 관리자가 준 링크로 열었다. 정한 비밀번호로 로그인한다.</p>
</div>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<form class="flex flex-col gap-4" style="margin: 0;">
<x-import component-from-global-scope="AgentOsUi.TextField" label="새 비밀번호" type="password" value="Refund2026" autocomplete="new-password"></x-import>
<ul aria-label="비밀번호 규칙" class="flex flex-col gap-1" style="margin: 0; padding: 0; list-style: none;">
<li class="flex items-center gap-2 text-small"><span class="text-success flex items-center"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle-check" size="16"></x-import></span><span>8자 이상</span><span class="text-small text-text-muted" style="margin-left: auto;">맞음</span></li>
<li class="flex items-center gap-2 text-small"><span class="text-success flex items-center"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle-check" size="16"></x-import></span><span>영문 대문자 1자 이상</span><span class="text-small text-text-muted" style="margin-left: auto;">맞음</span></li>
<li class="flex items-center gap-2 text-small"><span class="text-success flex items-center"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle-check" size="16"></x-import></span><span>숫자 1자 이상</span><span class="text-small text-text-muted" style="margin-left: auto;">맞음</span></li>
<li class="flex items-center gap-2 text-small text-text-muted"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><circle vector-effect="non-scaling-stroke" cx="12" cy="12" r="10"></circle></svg><span>특수문자 1자 이상</span><span style="margin-left: auto;">아직</span></li>
</ul>
<x-import component-from-global-scope="AgentOsUi.TextField" label="새 비밀번호 다시" type="password" autocomplete="new-password"></x-import>
<div class="flex justify-end">
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit">비밀번호 정하기</x-import>
</div>
</form>
</x-import>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
