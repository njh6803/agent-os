<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비밀번호 바꾸기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; display: flex; background: var(--bg); color: var(--text); font-family: var(--sans);">
<nav aria-label="관리 화면" style="width: var(--spacing-nav); flex-shrink: 0; box-sizing: border-box; padding: var(--spacing-4) var(--spacing-3); display: flex; flex-direction: column; gap: var(--spacing-1); background: var(--bg-raised); border-right: 1px solid var(--border);">
<div class="font-semibold text-body" style="height: var(--spacing-nav-item); display: flex; align-items: center; padding: 0 var(--spacing-3); margin-bottom: var(--spacing-3);">Agent OS</div>
<a href="#" class="flex items-center gap-2 text-body" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;"><x-import component-from-global-scope="AgentOsUi.Icon" name="plug" size="16"></x-import>플러그인</a>
<a href="#" class="flex items-center gap-2 text-body" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>대화</a>
<a href="#" class="flex items-center gap-2 text-body" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;"><x-import component-from-global-scope="AgentOsUi.Icon" name="settings" size="16"></x-import>설정</a>
<div style="margin-top: auto; padding-top: var(--spacing-3); border-top: 1px solid var(--border);">
<button type="button" aria-haspopup="menu" aria-expanded="false" class="flex items-center gap-2 w-full" style="min-height: 48px; padding: var(--spacing-2) var(--spacing-3); border: 0; border-radius: var(--radius-m); background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer;">
<span class="flex flex-col flex-1 min-w-0"><span class="font-mono text-mono font-medium">kim.dev</span><span class="text-small text-text-muted">관리자</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: var(--text-muted);"><path vector-effect="non-scaling-stroke" d="m7 15 5 5 5-5"></path><path vector-effect="non-scaling-stroke" d="m7 9 5-5 5 5"></path></svg>
</button>
</div>
</nav>
<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: var(--spacing-8);">
<div style="max-width: 440px; display: flex; flex-direction: column; gap: var(--spacing-6);">
<header class="flex flex-col gap-1">
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">비밀번호 바꾸기</h1>
<p class="text-body text-text-muted" style="margin: 0;"><span class="font-mono text-mono">kim.dev</span>의 비밀번호를 바꾼다.</p>
</header>
<x-import component-from-global-scope="AgentOsUi.Alert" tone="danger" title="비밀번호를 바꾸지 못했다">지금 비밀번호가 맞지 않는다.</x-import>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<form class="flex flex-col gap-4" style="margin: 0;">
<x-import component-from-global-scope="AgentOsUi.TextField" label="지금 비밀번호" type="password" autocomplete="current-password"></x-import>
<x-import component-from-global-scope="AgentOsUi.TextField" label="새 비밀번호" type="password" value="xxxxxxxxxxxx" autocomplete="new-password"></x-import>
<ul aria-label="비밀번호 규칙" class="flex flex-col gap-1" style="margin: 0; padding: 0; list-style: none;">
<li class="flex items-center gap-2 text-small"><span class="text-success flex items-center"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle-check" size="16"></x-import></span><span>8자 이상</span><span class="text-text-muted" style="margin-left: auto;">맞음</span></li>
<li class="flex items-center gap-2 text-small"><span class="text-success flex items-center"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle-check" size="16"></x-import></span><span>영문 대문자 1자 이상</span><span class="text-text-muted" style="margin-left: auto;">맞음</span></li>
<li class="flex items-center gap-2 text-small"><span class="text-success flex items-center"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle-check" size="16"></x-import></span><span>숫자 1자 이상</span><span class="text-text-muted" style="margin-left: auto;">맞음</span></li>
<li class="flex items-center gap-2 text-small"><span class="text-success flex items-center"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle-check" size="16"></x-import></span><span>특수문자 1자 이상</span><span class="text-text-muted" style="margin-left: auto;">맞음</span></li>
</ul>
<x-import component-from-global-scope="AgentOsUi.TextField" label="새 비밀번호 다시" type="password" value="xxxxxxxxxxxx" autocomplete="new-password"></x-import>
<p class="text-small text-text-muted" style="margin: 0;">바꾸면 이 계정의 다른 로그인은 모두 끊긴다. 이 브라우저의 로그인은 그대로다.</p>
<div class="flex justify-end">
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit">바꾸기</x-import>
</div>
</form>
</x-import>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
