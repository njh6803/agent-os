<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인 모바일</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; box-sizing: border-box; padding: 48px var(--spacing-4) var(--spacing-8); display: flex; justify-content: center; background: var(--bg); color: var(--text); font-family: var(--sans);">
<main style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: var(--spacing-6);">
<div class="font-semibold text-body">Agent OS</div>
<div class="flex flex-col gap-2">
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">로그인</h1>
<p class="text-body text-text-muted" style="margin: 0;">운영자 계정으로 로그인한다.</p>
</div>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<form class="flex flex-col gap-4" style="margin: 0;">
<x-import component-from-global-scope="AgentOsUi.TextField" label="계정 이름" autocomplete="username"></x-import>
<x-import component-from-global-scope="AgentOsUi.TextField" label="비밀번호" type="password" autocomplete="current-password"></x-import>
<div class="flex flex-col">
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit">로그인</x-import>
</div>
</form>
</x-import>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
