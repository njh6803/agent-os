<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인 알림 넷</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; box-sizing: border-box; padding: 48px; background: var(--bg); color: var(--text); font-family: var(--sans);">
<div style="display: grid; grid-template-columns: repeat(4, 360px); gap: 48px; align-items: start;">

<section class="flex flex-col gap-4">
<p class="text-small text-text-muted" style="margin: 0;">가. 로그아웃한 뒤</p>
<div class="font-semibold text-body">Agent OS</div>
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">로그인</h1>
<x-import component-from-global-scope="AgentOsUi.Alert" tone="info" title="로그아웃했다"></x-import>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<div class="flex flex-col gap-4">
<x-import component-from-global-scope="AgentOsUi.TextField" label="계정 이름"></x-import>
<x-import component-from-global-scope="AgentOsUi.TextField" label="비밀번호" type="password"></x-import>
<div class="flex justify-end"><x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit">로그인</x-import></div>
</div>
</x-import>
</section>

<section class="flex flex-col gap-4">
<p class="text-small text-text-muted" style="margin: 0;">나. 로그인이 끝난 뒤</p>
<div class="font-semibold text-body">Agent OS</div>
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">로그인</h1>
<x-import component-from-global-scope="AgentOsUi.Alert" tone="info" title="로그인이 끝났다">오래 쓰지 않았거나 서버가 로그인을 끊었다. 다시 로그인한다.</x-import>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<div class="flex flex-col gap-4">
<x-import component-from-global-scope="AgentOsUi.TextField" label="계정 이름"></x-import>
<x-import component-from-global-scope="AgentOsUi.TextField" label="비밀번호" type="password"></x-import>
<div class="flex justify-end"><x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit">로그인</x-import></div>
</div>
</x-import>
</section>

<section class="flex flex-col gap-4">
<p class="text-small text-text-muted" style="margin: 0;">다. 링크로 비밀번호를 정한 뒤</p>
<div class="font-semibold text-body">Agent OS</div>
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">로그인</h1>
<x-import component-from-global-scope="AgentOsUi.Alert" tone="info" title="비밀번호를 정했다">정한 비밀번호로 로그인한다.</x-import>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<div class="flex flex-col gap-4">
<x-import component-from-global-scope="AgentOsUi.TextField" label="계정 이름"></x-import>
<x-import component-from-global-scope="AgentOsUi.TextField" label="비밀번호" type="password"></x-import>
<div class="flex justify-end"><x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit">로그인</x-import></div>
</div>
</x-import>
</section>

<section class="flex flex-col gap-4">
<p class="text-small text-text-muted" style="margin: 0;">라. https가 아닌 주소로 열었을 때</p>
<div class="font-semibold text-body">Agent OS</div>
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">로그인</h1>
<x-import component-from-global-scope="AgentOsUi.Alert" tone="warning" title="이 주소에서는 로그인할 수 없다">로그인은 https 주소나 이 서버 자신(localhost)에서만 된다.</x-import>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<div class="flex flex-col gap-4">
<x-import component-from-global-scope="AgentOsUi.TextField" label="계정 이름" disabled="{{yes}}"></x-import>
<x-import component-from-global-scope="AgentOsUi.TextField" label="비밀번호" type="password" disabled="{{yes}}"></x-import>
<div class="flex justify-end"><x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit" disabled="{{yes}}">로그인</x-import></div>
</div>
</x-import>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true };
}
}
</script>
</body>
</html>
