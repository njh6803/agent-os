<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대화 결말 없는 대화를 연 화면</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--text)}
.req{align-self:flex-end;max-width:80%;padding:var(--spacing-2) var(--spacing-3);background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-l)}
</style>
</helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; display: flex; background: var(--bg); color: var(--text); font-family: var(--sans);">
<nav aria-label="관리 화면" style="width: var(--spacing-nav); flex-shrink: 0; box-sizing: border-box; padding: var(--spacing-4) var(--spacing-3); display: flex; flex-direction: column; gap: var(--spacing-1); background: var(--bg-raised); border-right: 1px solid var(--border);">
<div class="font-semibold text-body" style="height: var(--spacing-nav-item); display: flex; align-items: center; padding: 0 var(--spacing-3); margin-bottom: var(--spacing-3);">Agent OS</div>
<a href="#" class="flex items-center gap-2 text-body" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;"><x-import component-from-global-scope="AgentOsUi.Icon" name="plug" size="16"></x-import>플러그인</a>
<a href="#" aria-current="page" class="flex items-center gap-2 text-body font-medium" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); background: var(--bg-selected); color: var(--text); text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>대화</a>
<a href="#" class="flex items-center gap-2 text-body" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle vector-effect="non-scaling-stroke" cx="9" cy="7" r="4"></circle><path vector-effect="non-scaling-stroke" d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path vector-effect="non-scaling-stroke" d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>계정</a>
<a href="#" class="flex items-center gap-2 text-body" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;"><x-import component-from-global-scope="AgentOsUi.Icon" name="settings" size="16"></x-import>설정</a>
<div style="margin-top: auto; padding-top: var(--spacing-3); border-top: 1px solid var(--border);">
<button type="button" aria-haspopup="menu" aria-expanded="false" class="flex items-center gap-2 w-full" style="min-height: 48px; padding: var(--spacing-2) var(--spacing-3); border: 0; border-radius: var(--radius-m); background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer;">
<span class="flex flex-col flex-1 min-w-0"><span class="font-mono text-mono font-medium">ops-lead</span><span class="text-small text-text-muted">시스템 관리자</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: var(--text-muted);"><path vector-effect="non-scaling-stroke" d="m7 15 5 5 5-5"></path><path vector-effect="non-scaling-stroke" d="m7 9 5-5 5 5"></path></svg>
</button>
</div>
</nav>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
<div style="flex: 1; box-sizing: border-box; padding: var(--spacing-8) var(--spacing-8) var(--spacing-6);">
<div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--spacing-8);">
<div class="flex flex-col gap-4">
<a href="#" class="text-body" style="align-self: flex-start;">대화 목록</a>
<header class="flex items-start justify-between gap-4">
<div class="flex flex-col gap-1 min-w-0">
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">대화</h1>
<p class="text-body text-text-muted" style="margin: 0;">에이전트 <span class="font-mono text-mono" style="color: var(--text);">calc</span></p>
<sc-if value="{{polling}}" hint-placeholder-val="{{ true }}">
<div role="status" class="text-small"><x-import component-from-global-scope="AgentOsUi.Progress" label="다시 확인하는 중"></x-import></div>
</sc-if>
</div>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary">새 대화</x-import>
</header>
</div>
<sc-if value="{{stale}}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="AgentOsUi.Alert" tone="info" title="끝맺지 못한 것으로 보인다"><div class="flex flex-col gap-2"><p style="margin: 0;">마지막 이벤트 뒤 10분 동안 새 이벤트가 없어 다시 읽기를 멈췄다. 실행 패널에서 새로 고칠 수 있다.</p><a href="#" class="text-body" style="align-self: flex-start;">자세히</a></div></x-import>
</sc-if>

<section aria-label="첫 실행" class="flex flex-col gap-4">
<div class="req text-body">11월 정산 합계를 주문 상태별로 셈해 줘</div>
<div class="flex items-center gap-2 text-table"><span class="text-text-muted flex items-center"><x-import component-from-global-scope="AgentOsUi.Icon" name="wrench" size="14"></x-import></span><span class="font-mono text-mono font-medium">orders.export</span><span class="flex items-center gap-1 text-success"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle-check" size="14"></x-import>성공</span></div>
<div class="flex items-center gap-3"><x-import component-from-global-scope="AgentOsUi.StatusBadge" status="no-outcome"></x-import><span class="font-mono text-mono text-text-muted">마지막 이벤트 16:04:10</span><a href="#" class="text-small">자세히</a></div>
</section>
</div>
</div>
<div style="box-sizing: border-box; padding: var(--spacing-4) var(--spacing-8) var(--spacing-6); border-top: 1px solid var(--border); background: var(--bg);">
<div style="max-width: 760px; margin: 0 auto;" class="flex items-end gap-2">
<div class="flex-1 min-w-0"><x-import component-from-global-scope="AgentOsUi.TextField" variant="multi" rows="2" label="요청" help="{{help}}" disabled="{{yes}}"></x-import></div>
<x-import component-from-global-scope="AgentOsUi.IconButton" icon="send" label="보내기" variant="primary" disabled="{{yes}}"></x-import>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stale":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
renderVals() {
const stale = this.props.stale ?? false;
return {
yes: true,
stale: stale,
polling: !stale,
help: stale ? "결말 없는 실행은 이어 가지 못한다. 새 대화를 연다." : "실행이 끝나면 보낼 수 있다."
};
}
}
</script>
</body>
</html>
