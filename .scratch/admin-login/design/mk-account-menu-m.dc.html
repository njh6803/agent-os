<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계정 메뉴 모바일</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans);">
<header style="position: relative; box-sizing: border-box; padding: var(--spacing-2) var(--spacing-4); display: flex; flex-direction: column; gap: var(--spacing-1); background: var(--bg-raised); border-bottom: 1px solid var(--border);">
<div class="flex items-center justify-between gap-2" style="position: relative; min-height: var(--control-h);">
<span class="font-semibold text-body">Agent OS</span>
<button type="button" aria-haspopup="menu" aria-expanded="true" class="flex items-center gap-1" style="height: var(--control-h); padding: 0 var(--spacing-2); border: 0; border-radius: var(--radius-m); background: var(--bg-active); color: var(--text); font: inherit; cursor: pointer;"><span class="font-mono text-mono font-medium">kim.dev</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-muted);"><path vector-effect="non-scaling-stroke" d="m7 15 5 5 5-5"></path><path vector-effect="non-scaling-stroke" d="m7 9 5-5 5 5"></path></svg></button>
<div role="menu" aria-label="kim.dev 계정" class="shadow-float flex flex-col" style="position: absolute; top: calc(100% + 4px); right: 0; z-index: 2; min-width: 200px; padding: var(--spacing-1); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-m);">
<div class="flex flex-col" style="padding: var(--spacing-2) var(--spacing-3);"><span class="font-mono text-mono font-medium">kim.dev</span><span class="text-small text-text-muted">관리자</span></div>
<div role="separator" style="height: 1px; margin: var(--spacing-1) 0; background: var(--border);"></div>
<button type="button" role="menuitem" class="text-body" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 0; border-radius: var(--radius-s); background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer;">비밀번호 바꾸기</button>
<button type="button" role="menuitem" class="flex items-center gap-2 text-body" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 0; border-radius: var(--radius-s); background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline vector-effect="non-scaling-stroke" points="16 17 21 12 16 7"></polyline><line vector-effect="non-scaling-stroke" x1="21" x2="9" y1="12" y2="12"></line></svg>로그아웃</button>
</div>
</div>
<nav aria-label="관리 화면" class="flex flex-wrap items-center gap-1">
<a href="#" aria-current="page" class="flex items-center text-body font-medium" style="height: var(--control-h); padding: 0 var(--spacing-2); border-radius: var(--radius-m); background: var(--bg-selected); color: var(--text); text-decoration: none;">플러그인</a>
<a href="#" class="flex items-center text-body" style="height: var(--control-h); padding: 0 var(--spacing-2); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;">대화</a>
<a href="#" class="flex items-center text-body" style="height: var(--control-h); padding: 0 var(--spacing-2); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;">설정</a>
</nav>
</header>
<main style="box-sizing: border-box; padding: var(--spacing-6) var(--spacing-4) var(--spacing-8); display: flex; flex-direction: column; gap: var(--spacing-6);">
<header class="flex items-start justify-between gap-3">
<div class="flex flex-col gap-1 min-w-0">
<div class="flex items-center gap-2"><h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">플러그인</h1><span class="text-body text-text-muted">5</span></div>
<p class="text-body text-text-muted" style="margin: 0;">종류마다 등록된 플러그인을 켜고 끈다.</p>
</div>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary">새로 고침</x-import>
</header>
<section class="flex flex-col gap-2">
<h2 class="text-body font-semibold" style="margin: 0;">에이전트 <span class="font-regular text-text-muted">2</span></h2>
<div style="border-top: 1px solid var(--border);">
<div class="flex items-center gap-4" style="min-height: var(--row-h); padding: 0 var(--spacing-3); border-bottom: 1px solid var(--border);">
<div class="flex-1 min-w-0"><x-import component-from-global-scope="AgentOsUi.Switch" label="calc" checked="{{yes}}"></x-import></div>
<a href="#" class="text-table">매니페스트</a>
</div>
<div class="flex items-center gap-4" style="min-height: var(--row-h); padding: 0 var(--spacing-3); border-bottom: 1px solid var(--border);">
<div class="flex-1 min-w-0"><x-import component-from-global-scope="AgentOsUi.Switch" label="support-bot" checked="{{yes}}"></x-import></div>
<a href="#" class="text-table">매니페스트</a>
</div>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true };
}
}
</script>
</body>
</html>
