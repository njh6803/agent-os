<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>첫 계정을 만든다</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; box-sizing: border-box; padding: 96px var(--spacing-4) var(--spacing-8); display: flex; justify-content: center; background: var(--bg); color: var(--text); font-family: var(--sans);">
<main style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: var(--spacing-6);">
<div class="font-semibold text-body">Agent OS</div>
<div class="flex flex-col gap-2">
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">첫 계정을 만든다</h1>
<p class="text-body text-text-muted" style="margin: 0;">아직 운영자 계정이 없다. 서버에서 아래 명령으로 시스템 관리자를 만든다. 비밀번호는 명령이 묻는다.</p>
</div>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<div class="flex flex-col gap-3">
<div class="flex items-start gap-2" style="padding: var(--spacing-2) var(--spacing-2) var(--spacing-2) var(--spacing-3); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-m);">
<code class="font-mono text-mono flex-1 min-w-0" style="padding: var(--spacing-1) 0; line-height: var(--table-lh); overflow-wrap: anywhere;">agent-os operator create-system-admin &lt;계정 이름&gt;</code>
<button type="button" aria-label="명령 복사" class="flex items-center justify-center shrink-0" style="width: var(--control-h); height: var(--control-h); border: 1px solid var(--border); border-radius: var(--radius-m); background: transparent; color: var(--text); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect vector-effect="non-scaling-stroke" width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path vector-effect="non-scaling-stroke" d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button>
</div>
<p class="text-small text-text-muted" style="margin: 0;">컨테이너로 띄웠으면 그 컨테이너 안에서 친다.</p>
</div>
</x-import>
<div class="flex items-center justify-between gap-3" style="padding-top: var(--spacing-4); border-top: 1px solid var(--border);">
<span class="text-body text-text-muted">만든 뒤 이 화면을 새로 고친다.</span>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary">새로 고침</x-import>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
