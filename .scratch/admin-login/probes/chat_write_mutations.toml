[[mutation.edit]]
file = "web/apps/admin/components/pages/ConversationPage.tsx"
old = '''
  const [panelRun, setPanelRun] = useRunQuery();
'''
new = '''
  const [panelRun, setPanelRun] = useRunQuery();
  const [, mutantTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => {
      mutantTick((n) => n + 1);
    }, 1000);
    return () => {
      clearInterval(id);
    };
  }, []);
'''
