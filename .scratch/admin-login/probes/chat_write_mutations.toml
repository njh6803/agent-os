# 티켓 11(대화 쓰기 화면: 새 대화, 이어 가기, 승인 묻기, 다시 보내기, 스트림 도중의 갱신, 옛 주소 옮기기)의 변이 표. 최종 사용자의 대화를
# 읽기만 되게 가르는 판정, 보내는 동안 막기, 주소 바꾸기, 승인과 거부가 싣는 값, 갱신의 때와 만료 알림은 시험을 구현 뒤에 맞춰 써서
# 빨강을 본 적이 없다. 변이마다 그 줄을 망가뜨려 해당 시험이 무는지 본다.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/admin-login/probes/chat_write_mutations.toml

[runner.vitest]
command = ["pnpm", "exec", "vitest", "run", "--project", "pages"]
cwd = "web"
judge = "vitest"

[runner.vitest_node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

[[mutation]]
name = "갱신이 수명의 80% 가 아니라 끝에서 걸린다"
runner = "vitest"
tests = ["apps/admin/components/pages/ConversationPage.write.test.tsx", "-t", "짧은 JWT 수명의 80% 가 지나면"]
expect = "red"
expect_output = ["expected +0 to be 1"]

[[mutation.edit]]
file = "web/apps/admin/hooks/queries/session/index.ts"
old = '''
const RENEW_AT = 0.8;
'''
new = '''
const RENEW_AT = 1;
'''

[[mutation]]
name = "갱신이 401 이어도 만료 알림이 붙지 않는다"
runner = "vitest"
tests = ["apps/admin/components/pages/ConversationPage.write.test.tsx", "-t", "갱신이 401 이면 지금 대화의 주소를 싣고"]
expect = "red"
expect_output = ["to contain 'notice=expired'"]

