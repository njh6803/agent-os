runner = "vitest"
tests = ["apps/admin/components/pages/ConversationPage.test.tsx", "-t", "마지막 이벤트 뒤 실행 제한 시간이 지나면"]
expect = "red"
expect_output = ["Unable to find an element with the text: 끝맺지 못한 것으로 보입니다"]

[[mutation.edit]]
