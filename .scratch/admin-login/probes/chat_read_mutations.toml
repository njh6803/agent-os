[[mutation]]
name = "일시정지가 결말로 세어지지 않는다"
runner = "vitest_node"
tests = ["apps/admin/api/conversation/turns.test.ts", "-t", "마지막 이벤트가 끝남, 실패, 일시정지면 결말이 있다"]
expect = "red"
expect_output = ["expected false to be true"]

[[mutation.edit]]
file = "web/apps/admin/api/conversation/turns.ts"
old = '''
  return (
    last?.type === "run_finished" || last?.type === "run_failed" || last?.type === "run_paused"
  );
'''
new = '''
  return last?.type === "run_finished" || last?.type === "run_failed";
'''

[[mutation]]
name = "앞의 일시정지가 남은 재개 실행을 결말로 센다"
runner = "vitest_node"
tests = ["apps/admin/api/conversation/turns.test.ts", "-t", "승인으로 다시 도는 실행은 앞의 일시정지가 남아 있어도 결말이 없다"]
expect = "red"
expect_output = ["expected true to be false"]

[[mutation.edit]]
file = "web/apps/admin/api/conversation/turns.ts"
old = '''
  return (
    last?.type === "run_finished" || last?.type === "run_failed" || last?.type === "run_paused"
  );
'''
new = '''
  return (
    last?.type === "run_finished" ||
    last?.type === "run_failed" ||
    trace.events.some((event) => event.type === "run_paused")
  );
'''
