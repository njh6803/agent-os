# 후보 설정. 관리 화면용 TLS 리스너 하나(9443)를 더한 모양이다. 방문자용 리스너(8443)는 배포의 site.conf 를 줄여
# 페이지 하나만 낸다(같은 이름의 다른 포트에서 온 요청을 재는 자리). 배포의 end-user, widget, portal 경로는 없다.

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream up_admin {
    zone up_admin 64k;
    server admin:3000 resolve;
}

server_tokens off;

# 방문자용 리스너의 자리. 배포에서는 호스트의 443 이 이 포트로 온다.
server {
    listen 8443 ssl;
    server_name _;
    access_log /dev/stdout probe;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /probe/visitor-page {
        default_type text/html;
        return 200 '<!doctype html><html><head><title>visitor</title></head><body>visitor</body></html>';
    }

    location / {
        return 404;
    }
}

# 관리 화면용 리스너(후보). 호스트의 8443(기본)이 이 포트로 온다. 안쪽 8443 은 이미 방문자용이라 9443 을 쓴다.
server {
    listen 9443 ssl;
    server_name _;
    access_log /dev/stdout probe;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # proxy_set_header 는 location 에 하나라도 적으면 server 의 것이 물려지지 않는다. location 에는 적지 않는다.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 받은 값에 덧붙이지 않고 덮어쓴다. 클라이언트가 지어 보낸 값은 뒤로 가지 않는다.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 프로브의 표지. 요청이 이 설정의 리스너를 지났다는 것과 nginx 의 $remote_addr 를 따로 싣는다. 후보의 일부가 아니다.
    proxy_set_header X-Probe-Hop candidate;
    proxy_set_header X-Probe-Remote-Addr $remote_addr;

    # 관리 화면 전체(페이지, 정적 파일, /api/*)를 넘긴다. URI 를 붙인 꼴이라 nginx 가 정규화한 경로를 넘긴다.
    location / {
        proxy_pass http://up_admin/;
    }
}
