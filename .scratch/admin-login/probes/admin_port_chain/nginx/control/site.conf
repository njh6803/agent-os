# 대조 설정. 후보의 관리 화면용 리스너와 같고 두 줄만 다르다.
# - X-Forwarded-For 를 덮지 않고 $proxy_add_x_forwarded_for 로 받은 값 뒤에 덧붙인다.
# - X-Real-IP 를 적지 않는다. nginx 는 적지 않은 머리를 받은 그대로 넘긴다.

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream up_admin {
    zone up_admin 64k;
    server admin:3000 resolve;
}

server_tokens off;

server {
    listen 9443 ssl;
    server_name _;
    access_log /dev/stdout probe;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Probe-Hop control;
    proxy_set_header X-Probe-Remote-Addr $remote_addr;

    location / {
        proxy_pass http://up_admin/;
    }
}
