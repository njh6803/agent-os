# 프로브의 주 설정. deploy/standalone/proxy/nginx.conf 와 같고 두 가지만 다르다.
# - 사이트 설정은 갈래마다 다른 폴더(candidate/, control/)에서 얹어 같은 경로로 읽는다.
# - 접근 기록의 꼴(probe). 클라이언트가 보낸 X-Forwarded-For, X-Real-IP, X-Forwarded-Proto 를 nginx 가 받은 그대로
#   적는다. 측정 스크립트가 "지어 보낸 값이 nginx 에 실제로 닿았다"는 표지를 여기서 읽는다.

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format probe 'probe remote=$remote_addr port=$server_port host="$http_host" '
                     'xff="$http_x_forwarded_for" xri="$http_x_real_ip" xfp="$http_x_forwarded_proto" '
                     '"$request" $status';

    include /etc/agent-os/proxy/site.conf;
}
