# 티켓 09(관리 화면의 로그인과 갱신 규칙)의 변이 표. 갱신 규칙(`api/session/rule.ts`), 주소 규칙(`address.ts`), 계정 메뉴의
# 닫힘 가드는 시험을 구현 뒤에 써서 빨강을 본 적이 없다. 변이마다 그 줄을 망가뜨려 해당 시험이 무는지 본다.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/admin-login/probes/login_rule_mutations.toml

[runner.vitest]
command = ["pnpm", "exec", "vitest", "run", "--project", "pages"]
cwd = "web"
judge = "vitest"

[runner.vitest_node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

[[mutation]]
name = "겹친 401 이 갱신을 각자 부른다"
runner = "vitest"
tests = ["apps/admin/components/pages/AdminScreen.refresh.test.tsx", "-t", "겹쳐 온 401 들은"]
expect = "red"
expect_output = ["expected 2 to be 1"]

