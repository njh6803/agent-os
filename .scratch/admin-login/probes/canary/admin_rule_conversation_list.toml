# `.claude/rules/admin.md` 에 더한 대화 목록 경로 항목이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(admin-login 티켓 07).
# 실험군은 규칙의 paths 안(src/agent_os/admin/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 질문은 선례 `.scratch/connection-check/probes/canary/admin_rule_first_item.toml` 처럼 Read 결과에 붙어 실린
# 규칙도 지시라고 밝힌다. 기대 구절은 더한 항목에만 있다(`traces.py` 에는 없다).
# 최신 결과: 통과 4(2026-11-27, 이 PC의 admin-login 티켓 06 워크트리, claude 2.1.325, HEAD c3ad162fc 위의 커밋하지 않은
# 작업 트리, 일지 2026-11-27-1647. 티켓 06 이 같은 규칙의 첫 항목에 409 문장을 고친 뒤 다시 돌렸고 기대는 그대로다).
# 앞 판은 통과 4(2026-11-26, 이 PC의 admin-login 티켓 07 워크트리, claude 2.1.325, HEAD 11343375b 위의 커밋하지 않은
# 작업 트리, 일지 2026-11-26-0140). 실험군 셋이 두 구절을 글자 그대로 옮겼고 대조군은 "없음"이었다.
# 돌리는 법: uv run python tools/canary.py .scratch/admin-login/probes/canary/admin_rule_conversation_list.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시(그 파일을 읽을 때 함께 실린 저장소의 규칙도 이 세션의 지시다) 가운데, 관리 API의 대화 목록
경로(`GET /conversations`)를 다루는 문장이 있으면 두 가지를 글자 그대로 옮겨라.
(1) 이 경로의 모양과 질의가 무엇과 같다고 말하는 구절. (2) 라우트가 묶는 일을 하는지를 말하는 구절.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["모양과 질의가 실행 목록과 같다", "라우트는 묶지 않는다"]
source = ".claude/rules/admin.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/admin/traces.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
