# `.claude/rules/adapters.md` 에 계정 저장소 어댑터(`adapters/postgres/accounts.py`)의 규칙 넷(이름 충돌은 반환값, 데이터베이스 예외는 원인을
# 잇지 않는 `AccountStoreError`, 시각은 받아서 적기, 판정은 `http` 몫)을 정하는 항목을 더한 문장이 `paths` 에 맞는 파일을 Read 로 열 때
# 실리는지(admin-login 티켓 02).
# 실험군은 규칙의 paths 안(src/agent_os/adapters/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 질문은 선례 `adapters_rule_model_check.toml` 처럼 Read 결과에 붙어 실린 규칙도 지시라고 밝힌다. 기대 구절은 더한 문장에만 있다
# (`clock.py` 에는 없다).
# 최신 결과: 통과 4(2026-11-26, 이 PC의 admin-login 티켓 02 워크트리, claude 2.1.325, 기준 브랜치 11343375b 위의 커밋하지 않은 작업 트리,
# 일지 2026-11-26-0131). 실험군 셋이 두 구절을 글자 그대로 옮겼고 대조군은 "없음"이었다. "없음" 섞임 0.
# 돌리는 법: uv run python tools/canary.py .scratch/admin-login/probes/canary/adapters_rule_account_store.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시(그 파일을 읽을 때 함께 실린 저장소의 규칙도 이 세션의 지시다) 가운데, 계정 저장소 어댑터가 이름 충돌과
데이터베이스 예외를 어떻게 다루는지를 정하는 문장이 있으면 두 가지를 글자 그대로 옮겨라.
(1) 이름 충돌을 SAVEPOINT 안에서 넣어 얻는 결과를 말하는 구절. (2) 데이터베이스 예외의 원인을 잇지 않는 까닭을 말하는 구절.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["위반이 바깥 트랜잭션을 망가뜨리지 않는다", "서버의 오류 DETAIL에 계정 이름과 해시가 실리기 때문이다"]
source = ".claude/rules/adapters.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/adapters/clock.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
