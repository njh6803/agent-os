# `.claude/rules/core.md` 에 더한 대화 목록 항목(묶는 규칙의 자리와 알려진 한계)이 `paths` 에 맞는 파일을 Read 로 열 때
# 실리는지(admin-login 티켓 07).
# 실험군은 규칙의 paths 안(src/agent_os/core/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 질문은 선례 `.scratch/connection-check/probes/canary/core_rule_port_table_check.toml` 처럼 Read 결과에 붙어 실린
# 규칙도 지시라고 밝힌다. 기대 구절은 더한 항목에만 있다(`rules.py` 에는 없다).
# 최신 결과: 통과 4(2026-11-26, 이 PC의 admin-login 티켓 07 워크트리, claude 2.1.325, HEAD 11343375b 위의 커밋하지 않은
# 작업 트리, 일지 2026-11-26-0140). 실험군 셋이 두 구절을 글자 그대로 옮겼고 대조군은 "없음"이었다.
# 돌리는 법: uv run python tools/canary.py .scratch/admin-login/probes/canary/core_rule_conversation_list.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시(그 파일을 읽을 때 함께 실린 저장소의 규칙도 이 세션의 지시다) 가운데, 대화 목록이
이어 가기로 이어진 실행들을 줄로 묶는 규칙을 다루는 문장이 있으면 두 가지를 글자 그대로 옮겨라.
(1) 묶는 규칙이 어디에 있는지를 말하는 구절. (2) 그 묶음에서 목록에 나타나지 않는 경우를 말하는 알려진 한계 구절.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["순수 함수 `list_conversations` 한 곳", "끝이 없어 목록에 나타나지 않는다"]
source = ".claude/rules/core.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/core/rules.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
