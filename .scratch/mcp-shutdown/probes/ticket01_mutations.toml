# 티켓 01의 셀프 리뷰가 더한 단언이 실제로 무는지 변이로 본다(implement 스킬, 대기열 29). 결과의 글
# 테스트와 한 번 누른 사례의 둘째 한 줄 없음 단언은 구현 뒤에 써서 빨강을 본 적이 없다. 사용:
# PYTHONUTF8=1 uv run python tools/mutate.py .scratch/mcp-shutdown/probes/ticket01_mutations.toml
# 표지는 변이를 손으로 넣어 본 실패 출력의 `E` 줄에서 골랐다. 고른 단언이 실패할 때만 나온다.

[[mutation]]
name = "결과의 글에서 텍스트 리소스를 뺀다"
tests = ["tests/adapters/test_mcp.py", "-k", "텍스트_리소스"]
expect = "red"
expect_output = ["assert '앞뒤' == '앞리소스뒤'"]

[[mutation.edit]]
file = "src/agent_os/adapters/mcp.py"
