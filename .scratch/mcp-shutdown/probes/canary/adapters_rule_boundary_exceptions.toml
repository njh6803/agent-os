# `.claude/rules/adapters.md` 에 더한 MCP ToolSource 경계의 예외 항목(여는 실패는 ConnectionError, 호출 실패는
# RuntimeError, 연결 안의 예외는 겉봉 없이)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(mcp-shutdown 티켓 02).
# 실험군은 규칙의 paths 안(src/agent_os/adapters/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 질문은 선례 `.scratch/end-user-continuation/probes/canary/adapters_rule_new_optional_fields.toml` 의 둘째 판처럼
# Read 결과에 붙어 실린 규칙도 지시라고 밝힌다. 기대 낱말은 규칙의 그 항목에만 있다(`clock.py` 에는 없다).
# 최신 결과: 통과 4(2026-10-21, 이 PC, claude 2.1.302, 일지 2026-10-21-10. 셀프 리뷰를 반영한 커밋하지 않은 작업 트리, HEAD 5040230c).
# 돌리는 법: uv run python tools/canary.py .scratch/mcp-shutdown/probes/canary/adapters_rule_boundary_exceptions.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시(그 파일을 읽을 때 함께 실린 저장소의 규칙도 이 세션의 지시다) 가운데, MCP ToolSource 에서
나가는 예외를 다루는 항목이 있으면 두 가지를 글자 그대로 옮겨라.
(1) 서버를 여는 동안의 실패가 되는 예외 타입의 이름. (2) 그 실패의 글의 꼴.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["ConnectionError", "에 붙지 못했다"]
source = ".claude/rules/adapters.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/adapters/clock.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
