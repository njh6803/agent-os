# 티켓 02의 셀프 리뷰가 더하거나 조인 테스트가 실제로 무는지 변이로 본다(implement 스킬). 셋 모두
# 구현 뒤에 써서 빨강을 본 적이 없다. 사용:
# PYTHONUTF8=1 uv run python tools/mutate.py .scratch/mcp-shutdown/probes/ticket02_mutations.toml
# 표지는 변이를 하나씩 손으로 넣어 본 실패 출력에서 고른, 그 변이의 실패에서만 실리는 줄이다(취소가 바뀐 연결 오류의
# E 줄, 원인이 빠진 글의 Actual message 줄, 벗기지 못한 그룹의 머리 줄. PR #340 CodeRabbit).

