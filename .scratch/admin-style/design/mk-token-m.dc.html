<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리 토큰 넣기 · 모바일</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; box-sizing: border-box; padding: 48px var(--spacing-4) var(--spacing-8); background: var(--bg); color: var(--text); font-family: var(--sans);">
<main style="display: flex; flex-direction: column; gap: var(--spacing-6);">
<div class="font-semibold text-body">Agent OS</div>
<div class="flex flex-col gap-2">
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">관리 토큰 넣기</h1>
<p class="text-body text-text-muted" style="margin: 0;"><code class="font-mono text-mono">agent-os serve</code>를 띄울 때 <code class="font-mono text-mono" style="overflow-wrap: anywhere;">AGENT_OS_ADMIN_TOKEN</code>에 준 값이다. 이 탭에만 남고 탭을 닫으면 사라진다.</p>
</div>
<x-import component-from-global-scope="AgentOsUi.Alert" tone="danger" title="서버에 닿지 못했다">agent-os serve가 떠 있는지 보고 다시 넣는다.</x-import>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<div class="flex flex-col gap-4">
<x-import component-from-global-scope="AgentOsUi.TextField" label="관리 토큰" type="password" autocomplete="off"></x-import>
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit">넣기</x-import>
</div>
</x-import>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
