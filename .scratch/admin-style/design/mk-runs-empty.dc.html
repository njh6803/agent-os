<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>실행 목록 · 빈 목록</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; display: flex; background: var(--bg); color: var(--text); font-family: var(--sans);">
<nav aria-label="관리 화면" style="width: var(--spacing-nav); flex-shrink: 0; box-sizing: border-box; padding: var(--spacing-4) var(--spacing-3); display: flex; flex-direction: column; gap: var(--spacing-1); background: var(--bg-raised); border-right: 1px solid var(--border);">
<div class="font-semibold text-body" style="height: var(--spacing-nav-item); display: flex; align-items: center; padding: 0 var(--spacing-3); margin-bottom: var(--spacing-3);">Agent OS</div>
<a href="#" class="flex items-center gap-2 text-body" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;"><x-import component-from-global-scope="AgentOsUi.Icon" name="plug" size="16"></x-import>플러그인</a>
<a href="#" aria-current="page" class="flex items-center gap-2 text-body font-medium" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); background: var(--bg-selected); color: var(--text); text-decoration: none;"><x-import component-from-global-scope="AgentOsUi.Icon" name="list" size="16"></x-import>실행</a>
<a href="#" class="flex items-center gap-2 text-body" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle vector-effect="non-scaling-stroke" cx="12" cy="12" r="3"></circle></svg>설정</a>
</nav>
<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: var(--spacing-8);">
<div style="display: flex; flex-direction: column; gap: var(--spacing-6);">
<header class="flex items-start justify-between gap-4">
<div class="flex flex-col gap-1 min-w-0">
<div class="flex items-center gap-2"><h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">실행</h1><span class="text-body text-text-muted">24</span></div>
<p class="text-body text-text-muted" style="margin: 0;">트레이스로 남은 실행이다. 새로 시작한 것이 위에 온다.</p>
</div>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary">새로 고침</x-import>
</header>
<fieldset class="flex flex-wrap items-center gap-2" style="margin: 0; padding: 0; border: 0;">
<legend class="text-small text-text-muted" style="float: left; margin-right: var(--spacing-2); padding: 0;">상태</legend>
<label class="flex items-center gap-2 text-body" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 1px solid var(--border-control); border-radius: var(--radius-full);"><input type="radio" name="status">전부</label>
<label class="flex items-center gap-2 text-body" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 1px solid var(--border-control); border-radius: var(--radius-full);"><input type="radio" name="status">일시정지</label>
<label class="flex items-center gap-2 text-body" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 1px solid var(--border-control); border-radius: var(--radius-full);"><input type="radio" name="status">끝남</label>
<label class="flex items-center gap-2 text-body font-medium" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 1px solid var(--text); border-radius: var(--radius-full); background: var(--bg-selected);"><input type="radio" name="status" checked="{{yes}}">실패</label>
<label class="flex items-center gap-2 text-body" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 1px solid var(--border-control); border-radius: var(--radius-full);"><input type="radio" name="status">결말 없음</label>
</fieldset>
<div class="flex flex-col items-center gap-3" style="padding: var(--spacing-8) var(--spacing-4); border: 1px dashed var(--border-control); border-radius: var(--radius-l); text-align: center;">
<x-import component-from-global-scope="AgentOsUi.Icon" name="circle-x" size="20"></x-import>
<div class="flex flex-col gap-1">
<p class="text-body font-medium" style="margin: 0;">실패한 실행이 없다</p>
<p class="text-body text-text-muted" style="margin: 0;">트레이스에 실패로 끝난 실행이 아직 없다. 다른 상태를 고르면 그 실행이 보인다.</p>
</div>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary">전부 보기</x-import>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":700}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, no: false };
}
}
</script>
</body>
</html>
