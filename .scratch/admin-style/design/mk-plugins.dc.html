<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>플러그인 목록 · A</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--text)}
</style>
</helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; display: flex; background: var(--bg); color: var(--text); font-family: var(--sans);">
<nav aria-label="관리 화면" style="width: var(--spacing-nav); flex-shrink: 0; box-sizing: border-box; padding: var(--spacing-4) var(--spacing-3); display: flex; flex-direction: column; gap: var(--spacing-1); background: var(--bg-raised); border-right: 1px solid var(--border);">
<div class="font-semibold text-body" style="height: var(--spacing-nav-item); display: flex; align-items: center; padding: 0 var(--spacing-3); margin-bottom: var(--spacing-3);">Agent OS</div>
<a href="#" aria-current="page" class="flex items-center gap-2 text-body font-medium" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); background: var(--bg-selected); color: var(--text); text-decoration: none;"><x-import component-from-global-scope="AgentOsUi.Icon" name="plug" size="16"></x-import>플러그인</a>
<a href="#" class="flex items-center gap-2 text-body" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;"><x-import component-from-global-scope="AgentOsUi.Icon" name="list" size="16"></x-import>실행</a>
<a href="#" class="flex items-center gap-2 text-body" style="height: var(--spacing-nav-item); padding: 0 var(--spacing-3); border-radius: var(--radius-m); color: var(--text-muted); text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle vector-effect="non-scaling-stroke" cx="12" cy="12" r="3"></circle></svg>설정</a>
</nav>
<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: var(--spacing-8);">
<div style="max-width: 880px; display: flex; flex-direction: column; gap: var(--spacing-8);">
<header class="flex items-start justify-between gap-4">
<div class="flex flex-col gap-1 min-w-0">
<div class="flex items-center gap-2"><h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">플러그인</h1><span class="text-body text-text-muted">5</span></div>
<p class="text-body text-text-muted" style="margin: 0;">종류마다 등록된 플러그인을 켜고 끈다.</p>
</div>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary">새로 고침</x-import>
</header>
<x-import component-from-global-scope="AgentOsUi.Alert" tone="danger" title="켜고 끄지 못했다: agent/support-bot"><div class="flex flex-col gap-1"><span>운영자 파일이 깨졌다: plugins/disabled.toml. 스위치는 다시 읽은 값이다.</span><span>추적 식별자: <code class="font-mono text-mono">4f1c9a2e7b3d4c5e8a6f0b1d2c3e4f5a</code></span></div></x-import>

<section class="flex flex-col gap-2">
<h2 class="text-body font-semibold" style="margin: 0;">에이전트 <span class="font-regular text-text-muted">2</span></h2>
<div style="border-top: 1px solid var(--border);">
<div class="flex items-center gap-4" style="min-height: var(--row-h); padding: 0 var(--spacing-3); border-bottom: 1px solid var(--border);">
<div class="flex-1 min-w-0"><x-import component-from-global-scope="AgentOsUi.Switch" label="calc" checked="{{yes}}"></x-import></div>
<a href="#" class="text-table">매니페스트</a>
</div>
<div class="flex items-center gap-4" style="min-height: var(--row-h); padding: 0 var(--spacing-3); border-bottom: 1px solid var(--border);">
<div class="flex-1 min-w-0"><x-import component-from-global-scope="AgentOsUi.Switch" label="support-bot" checked="{{no}}"></x-import></div>
<a href="#" class="text-table">매니페스트</a>
</div>
</div>
</section>

<section class="flex flex-col gap-2">
<h2 class="text-body font-semibold" style="margin: 0;">MCP <span class="font-regular text-text-muted">2</span></h2>
<div style="border-top: 1px solid var(--border);">
<div class="flex items-center gap-4" style="min-height: var(--row-h); padding: 0 var(--spacing-3); border-bottom: 1px solid var(--border);">
<div class="flex-1 min-w-0"><x-import component-from-global-scope="AgentOsUi.Switch" label="everything" checked="{{yes}}"></x-import></div>
<a href="#" class="text-table">매니페스트</a>
</div>
<div class="flex flex-col gap-1" style="padding: var(--spacing-2) var(--spacing-3); border-bottom: 1px solid var(--border);">
<div class="flex items-center gap-4">
<div class="flex-1 min-w-0"><x-import component-from-global-scope="AgentOsUi.Switch" label="filesystem" checked="{{yes}}"></x-import></div>
<a href="#" class="text-table">매니페스트</a>
</div>
<div class="flex items-center gap-2 text-small text-warning"><x-import component-from-global-scope="AgentOsUi.Icon" name="triangle-alert" size="14"></x-import><span>읽을 수 없는 매니페스트: [server] 표에 command가 없다</span></div>
</div>
</div>
</section>

<section class="flex flex-col gap-2">
<h2 class="text-body font-semibold" style="margin: 0;">스킬 <span class="font-regular text-text-muted">1</span></h2>
<div style="border-top: 1px solid var(--border);">
<div class="flex flex-col gap-1" style="padding: var(--spacing-2) var(--spacing-3); border-bottom: 1px solid var(--border);">
<div class="flex items-center gap-4">
<div class="flex-1 min-w-0"><x-import component-from-global-scope="AgentOsUi.Switch" label="refund-policy" checked="{{no}}"></x-import></div>
<a href="#" class="text-table">매니페스트</a>
</div>
<div class="flex items-center gap-2 text-small text-text-muted"><x-import component-from-global-scope="AgentOsUi.Icon" name="info" size="14"></x-import><span>로더가 생기기 전에는 효과가 없다</span></div>
</div>
</div>
</section>

<section class="flex flex-col gap-2">
<h2 class="text-body font-semibold" style="margin: 0;">모델 <span class="font-regular text-text-muted">0</span></h2>
<div class="flex items-center gap-2 text-body text-text-muted" style="min-height: var(--row-h); padding: 0 var(--spacing-3); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle-minus" size="16"></x-import><span>등록된 것이 없다</span></div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, no: false };
}
}
</script>
</body>
</html>
