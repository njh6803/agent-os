# 티켓 04(관리 화면의 틀과 공통 상태, 설정 화면)의 변이 표. 설정 화면과 탐색의 페이지 시험은 빨강을 먼저 봤지만, 공통
# 상태의 단언(0.3초 지연, 다시 확인하는 중, 실패 알림의 제목과 추적 식별자)과 스토리의 단언(포커스 링, 틀의 치수, 컨테이너,
# 지금 항목의 칠, 링크의 포인터 목표)은 구현과 함께 써서 빨강을 본 적이 없었다. 지연은 양쪽(0초, 1초)으로 깬다. 한쪽만
# 깨면 "0.3초 전에는 없다"와 "0.3초 뒤에 선다" 가운데 하나만 잰다. 열일곱째부터는 셀프 리뷰와 PR 봇의 지적 뒤 더했다(그 자리의 주석).
# 빨강의 판정은 `tools/mutate.py` 의 독스트링이다. 표지는 변이를 넣어 vitest 의 전체 출력을 한 번 본 뒤 고른 실패
# 머리의 메시지다(받은 값까지 든 것). 스토리 러너는 프로젝트의 스토리를 모두 돌려, 메시지가 다른 스토리에서도 날 수
# 있는 꼴(`expected false to be true`, 포커스 링의 기대 값)이면 실패한 스토리의 머리(`<파일> > <스토리>`)를 함께 든다.
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/admin-style/probes/frame_common_states_mutations.toml
# 네트워크를 타지 않는다. `uv sync` 와 `pnpm -C web install` 이 되고 Playwright 의 chromium 이 깔린 체크아웃에서 돈다.

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "pages"]
cwd = "web"
judge = "vitest"

[runner.narrow]
command = ["pnpm", "exec", "vitest", "run", "--project", "admin-storybook-narrow"]
cwd = "web"
judge = "vitest"

[runner.wide]
command = ["pnpm", "exec", "vitest", "run", "--project", "admin-storybook-wide"]
cwd = "web"
judge = "vitest"

