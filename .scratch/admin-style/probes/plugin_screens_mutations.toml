        </TextLink>'''
new = '''          열기
        </TextLink>'''

[[mutation]]
name = "스위치의 이름이 플러그인 이름이 아니면 빨갛다"
runner = "pages"
tests = ["apps/admin/components/pages/HomePage.test.tsx", "-t", "스위치의 이름은 플러그인 이름이고"]
expect = "red"
# 스위치의 이름은 보이는 이름이라, 이름을 바꾸면 행을 이름 글자로 찾는 도우미가 먼저 빨개진다.
expect_output = ["Error: 에이전트 묶음에 calc 행이 없다"]

