# 티켓 05(플러그인 목록과 플러그인 하나)의 변이 표. 페이지 시험의 이름·링크 단언은 구현 전에 빨강을 봤지만, 그 빨강은
# 대부분 종류 묶음의 이름에 개수가 붙지 않아서였다. 그래서 개수, 실패 중의 개수, 실패 알림에 더하는 글, 매니페스트 링크,
# 스위치의 이름, 제목 옆의 켜짐, 설명의 종류 이름, 최대 폭 content 를 하나씩 깨어 그 단언이 빨개지는지 본다.
# 빨강의 판정은 `tools/mutate.py` 의 독스트링이다. 표지는 변이를 넣어 vitest 의 실패 출력을 본 뒤 고른 실패 머리의
# 메시지다(받은 값까지 든 것).
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/admin-style/probes/plugin_screens_mutations.toml
# 네트워크를 타지 않는다. `uv sync` 와 `pnpm -C web install` 이 되고 Playwright 의 chromium 이 깔린 체크아웃에서 돈다.

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "pages"]
cwd = "web"
judge = "vitest"

[runner.wide]
command = ["pnpm", "exec", "vitest", "run", "--project", "admin-storybook-wide"]
cwd = "web"
judge = "vitest"

[[mutation]]
name = "목록 머리에 전체 개수가 없으면 빨갛다"
runner = "pages"
tests = ["apps/admin/components/pages/HomePage.test.tsx", "-t", "종류별로 묶여"]
expect = "red"
expect_output = ["expected '플러그인' to be '플러그인 5'"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/PluginList.tsx"
old = '''            <Counted label="플러그인" count={shownRows.length} />'''
new = '''            "플러그인"'''

[[mutation]]
name = "다시 읽다 실패해도 옛 개수를 붙이면 빨갛다"
runner = "pages"
tests = ["apps/admin/components/pages/HomePage.test.tsx", "-t", "개수가 걷힌다"]
expect = "red"
expect_output = ["expected '플러그인 5' to be '플러그인'"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/PluginList.tsx"
old = '''const shownRows = read.error === undefined ? read.data : undefined;'''
new = '''const shownRows = read.data;'''

[[mutation]]
name = "켜고 끄기의 실패 알림에 다시 읽은 값이라는 글이 없으면 빨갛다"
runner = "pages"
tests = ["apps/admin/components/pages/HomePage.test.tsx", "-t", "켜고 끄기가 실패하면 메시지와"]
expect = "red"
expect_output = ["to contain '스위치는 다시 읽은 값이다.'"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/PluginList.tsx"
old = '''<FailureAlert {...switchFailure} note={SWITCH_FAILURE_NOTE} />'''
new = '''<FailureAlert {...switchFailure} />'''

[[mutation]]
name = "줄 끝 링크의 글자가 매니페스트가 아니면 빨갛다"
runner = "pages"
tests = ["apps/admin/components/pages/HomePage.test.tsx", "-t", "매니페스트 링크가 있고"]
expect = "red"
expect_output = ['Unable to find an accessible element with the role "link" and name "매니페스트"']

[[mutation.edit]]
file = "web/apps/admin/components/organisms/PluginList.tsx"
