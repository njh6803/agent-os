# 티켓 06(실행 목록의 표와 카드, 이 브라우저의 시간대)의 변이 표. 페이지 시험의 머리·열·시각·읽을 수 없는 행·뼈대는 구현
# 전에 빨강을 봤지만, 그 빨강은 기능이 없어서 난 것이라 단언 하나하나가 그 자리를 무는지는 재지 않았다. 스토리의 단언(어느 폭에서
# 어느 갈래가 서는지, 행 높이, 뼈대가 숨는 것, 거른 빈 줄의 아이콘)과 e2e 의 시간대 단언은 구현 뒤에 써서 빨강을 본 적이
# 없었다. 시간대를 그 이름으로 박은 구현은 페이지 시험이 잡지 못하고 e2e 만 잡는다는 주장(runs.e2e.ts 의 주석)은 같은 변이를
# 두 러너에 넣어 본다(페이지는 초록, e2e 는 빨강).
#
# 빨강의 판정은 `tools/mutate.py` 의 독스트링이다. 표지는 출력을 미리 보지 않고 Chai 의 `expected … to …`, Testing Library 의
# `Unable to find role=…`, jest-dom 의 `Expected the element to …`, Playwright 의 받은 글 꼴을 따라 고른 실패 머리의 문구이거나,
# 고른 단언이 실패할 때 출력의 DOM 덤프나 받은 글에만 나오는 값이다(변이가 적게 하는 시각, 박은 시간대 이름). 열째와 열셋째는
# 처음 고른 `Unable to find role="…"` 가 첫 실행의 출력에 없어, 변이를 손으로 넣어 실패
# 머리를 본 뒤 `Unable to find an accessible element with the role "…"` 로 고쳤다. 스토리 러너는 이 티켓의 스토리 파일만 돌리고,
# 메시지가 다른 스토리에서도 날 수 있는 꼴이면 실패한 스토리의 머리(`<파일> > <스토리>`)를 함께 든다.
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/admin-style/probes/run_list_mutations.toml
# 네트워크를 타지 않는다. `uv sync` 와 `pnpm -C web install` 이 되고 Playwright 의 chromium 이 깔린 체크아웃에서 돈다. e2e 러너는
# 관리 화면 e2e 의 준비(e2e/stack.ts)가 앱을 빌드하고 serve 를 띄워 한 번에 1분 남짓 걸린다. 첫째의 표지는 고정을 걷은
# 시험이 이 PC 의 시간대(Asia/Seoul)를 든다는 것이라, 시간대가 다른 기계에서는 표지를 그 기계의 IANA 이름으로 바꿔 돌린다.

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "pages"]
cwd = "web"
judge = "vitest"

[runner.narrow]
command = ["pnpm", "exec", "vitest", "run", "--project", "admin-storybook-narrow"]
cwd = "web"
judge = "vitest"

[runner.wide]
command = ["pnpm", "exec", "vitest", "run", "--project", "admin-storybook-wide"]
cwd = "web"
judge = "vitest"

[runner.e2e]
command = ["pnpm", "exec", "playwright", "test"]
cwd = "web/apps/admin"
judge = "playwright"

[[mutation]]
name = "페이지 시험의 시간대 고정을 걷으면 머리 설명이 이 PC 의 시간대를 들어 빨갛다"
runner = "pages"
tests = ["apps/admin/components/pages/RunsPage.test.tsx", "-t", "설명이 이 브라우저의 시간대 이름을 든다"]
expect = "red"
expect_output = ["시간대(Asia/Seoul)로 적었다"]

