# 티켓 09(설정 화면의 테마)의 변이 표. 페이지 시험과 그리기 전 스크립트의 단위 시험은 구현 전에 빨강을 봤지만, 그때의
# 빨강은 카드나 스크립트 파일이 없어서였다. 그래서 단언 하나하나(저장 키와 목록, 예외 삼키기, 기본 테마도 적기, 다른 탭의
# 키 거르기, 마운트 때 되살리기와 그 목록 거르기, 셋업의 속성 걷기)는 빨강을 본 적이 없다. 스토리 단언(표본의 테마와 모드,
# inert, 고른 카드의 테두리, 넓은 폭의 한 줄 넷, 표본이 그 테마의 쓰임새 토큰을 받는 것)과 e2e 의 첫 그림 판정은 구현 뒤에
# 썼다.
# 빨강의 판정은 `tools/mutate.py` 의 독스트링이다. 표지는 변이를 넣어 전체 출력을 한 번 본 뒤 고른 실패 머리의 메시지다
# (받은 값까지 든 것). 같은 메시지를 그 시험의 다른 단언도 낼 수 있으면 실패 줄의 위치(`<파일>:<줄>:`)를 함께 든다. 그
# 위치는 시험 파일의 줄이 옮겨 가면 함께 고친다(다시 돌리면 `표지 없음` 으로 드러난다). 스토리 러너는 그 스토리 파일만 돌린다.
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/admin-style/probes/settings_theme_mutations.toml
# 네트워크를 타지 않는다. `uv sync` 와 `pnpm -C web install` 이 되고 Playwright 의 chromium 이 깔린 체크아웃에서 돈다.

[runner.node]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "pages"]
cwd = "web"
judge = "vitest"

[runner.narrow]
command = ["pnpm", "exec", "vitest", "run", "--project", "admin-storybook-narrow"]
cwd = "web"
judge = "vitest"

[runner.wide]
command = ["pnpm", "exec", "vitest", "run", "--project", "admin-storybook-wide"]
cwd = "web"
judge = "vitest"

[runner.e2e]
command = ["pnpm", "exec", "playwright", "test"]
cwd = "web/apps/admin"
judge = "playwright"

