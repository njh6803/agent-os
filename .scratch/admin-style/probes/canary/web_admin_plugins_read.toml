# `.claude/rules/web-admin.md` 의 다시 읽다 실패하는 항목에 admin-style 티켓 02 가 더한 문장(결정 자리의 꺼짐 미리 알림이
# 읽는 목록을 누가 언제 읽는지)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(CLAUDE.md 작업 규약 3). 실험군은 규칙의
# paths 안(web/apps/admin/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다. 실험군의 파일은 고친 문장을 담지
# 않은 것을 골랐다.
# 최신 결과: 2026-10-27 이 PC, claude 2.1.302, 커밋 4f783dc0 위의 작업 트리에서 통과 4(실험군 3회차가 그 문장을 옮겼고,
# 대조군 1회차는 "없음"이었다). 원본은 저장소에 두지 않았다. 일지 2026-10-27-15.
# 돌리는 법: uv run python tools/canary.py .scratch/admin-style/probes/canary/web_admin_plugins_read.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 관리 화면 앱 규칙이 있으면, 서버 데이터를 다시 읽다 실패할 때를 다루는 항목에서 결정 자리의 꺼짐 미리 알림이 쓰는 목록을 누가 언제 읽어 넘기는지 말하는 문장을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 지시가 없으면 "없음"이라고만 답하라.
'''
expect = [
  "그 목록은 components/pages/RunPage가 결정 자리가 설 때만 읽어 넘긴다",
]
source = ".claude/rules/web-admin.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "web/apps/admin/components/molecules/FailureNotice.tsx"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
