# 티켓 01(패키지의 설정 아이콘, 가린 한 줄 입력, 기준 폭 셋)의 변이 표. 구현 뒤에 쓴 글 입력의 타입 테스트
# (`web/packages/ui/src/components/molecules/TextField.test-d.ts`)가 `type` 의 막음 셋을 무는지 본다 — 한 줄 변형이
# password 를 받는 것, 여러 줄 변형이 type 을 받지 않는 것, 그 막음을 지키는 여러 줄 변형의 `type?: never` 한
# 줄이다. 빨강의 판정은 `tools/mutate.py` 의 독스트링이다. 표지는 고른 사례의 파일·줄·오류 번호이고, 자리 표지를
# 넣어 변이마다의 실패 출력을 한 번 본 뒤 골랐다. 타입 테스트의 줄이 옮겨 가면 표지도 옮긴다.
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/admin-style/probes/textfield_type_mutations.toml
# 네트워크를 타지 않는다. `uv sync` 와 `pnpm -C web install` 이 된 체크아웃에서 돈다.

[runner.tsc]
command = ["pnpm", "exec", "tsc", "--noEmit", "-p", "packages/ui"]
cwd = "web"
judge = "tsc"

[[mutation]]
name = "여러 줄 변형의 type?: never 를 지우면 변수로 넘긴 사례의 지시문이 빈다"
runner = "tsc"
expect = "red"
diagnostic_in = "molecules/TextField.test-d.ts"
expect_output = ["TextField.test-d.ts(27,1): error TS2578"]

[[mutation.edit]]
file = "web/packages/ui/src/components/molecules/TextField.tsx"
old = '''
  /** 한 줄에만 있다. `<textarea>` 는 가리지 못한다. */
  type?: never;
'''
new = '''
'''

[[mutation]]
name = "여러 줄 변형이 type 을 받으면 두 사례의 지시문이 빈다"
runner = "tsc"
expect = "red"
diagnostic_in = "molecules/TextField.test-d.ts"
expect_output = ["TextField.test-d.ts(20,3): error TS2578", "TextField.test-d.ts(27,1): error TS2578"]

[[mutation.edit]]
file = "web/packages/ui/src/components/molecules/TextField.tsx"
old = '''
  type?: never;
'''
new = '''
  type?: "text" | "password";
'''

[[mutation]]
name = "한 줄 변형이 password 를 받지 않으면 빨갛다"
runner = "tsc"
expect = "red"
diagnostic_in = "molecules/TextField.test-d.ts"
expect_output = ["TextField.test-d.ts(13,3): error TS2322"]

[[mutation.edit]]
file = "web/packages/ui/src/components/molecules/TextField.tsx"
old = '''
  type?: "text" | "password";
'''
new = '''
  type?: "text";
'''
