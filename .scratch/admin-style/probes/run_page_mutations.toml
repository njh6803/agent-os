# 티켓 07(실행 하나 화면)의 변이 표. 페이지 시험의 새 단언(카드 머리의 시각, 이벤트 칸 제목의 개수, 머리의 에이전트·주체 줄,
# 재개 스트림이 서는 조건, 끊긴 알림의 자리)과 스토리의 단언(결정 칸의 위치, 이벤트 칸의 최대 폭, 끊긴 알림의 자리)은 구현과
# 함께 써서 빨강을 본 적이 없었다. 재개 스트림이 서는 조건은 양쪽(조각이 있을 때만, 늘)과 최종 사용자의 실행으로 깬다.
# 빨강의 판정은 `tools/mutate.py` 의 독스트링이다. 표지는 변이를 넣어 vitest 의 전체 출력을 한 번 본 뒤 고른 실패 머리의
# 메시지다. 스토리 변이 넷(넓은 폭의 결정 칸, 좁은 폭의 결정 칸 차례, 왼쪽 칸의 최대 폭, 좁은 폭의 끊긴 알림)은 받은
# 값이 픽셀이라, 표본 글이나 디자인 토큰을 바꾸면 수가 달라져 `표지 없음` 으로 멈춘다. 그때는 실패 출력을 다시 보고
# 수를 고친다. 넓은 폭의 결정 칸은 받은 값 0 까지만 적었다. 그 스토리 파일에서 0 을 받는 `toBeGreaterThanOrEqual` 은
# 결정 칸의 왼쪽 끝 하나다. 페이지 시험의 `to be null` 과 `+0` 표지는 `-t` 가 고른 시험에 그 단언이 하나뿐이다.
#
# 이 표가 덮지 않는 새 단언: 읽지 못한 프레임의 `h3`, 형식 1 줄, 스토리 StreamFrames·UnreadableFrame·EventsOnly·FormatOne
# 의 단언은 변이로 빨강을 보지 않았다.
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/admin-style/probes/run_page_mutations.toml
# 네트워크를 타지 않는다. `uv sync` 와 `pnpm -C web install` 이 되고 Playwright 의 chromium 이 깔린 체크아웃에서 돈다.

[runner.pages]
command = ["pnpm", "exec", "vitest", "run", "--project", "pages"]
cwd = "web"
judge = "vitest"

[runner.narrow]
command = ["pnpm", "exec", "vitest", "run", "--project", "admin-storybook-narrow"]
cwd = "web"
judge = "vitest"

[runner.wide]
command = ["pnpm", "exec", "vitest", "run", "--project", "admin-storybook-wide"]
cwd = "web"
judge = "vitest"

[[mutation]]
name = "카드 머리에서 시각을 빼면 카드 머리 시험이 빨갛다"
expect_output = ['+   "run_finished",']
runner = "pages"
tests = ["apps/admin/components/pages/RunPage.test.tsx", "-t", "카드 머리는 종류와"]
expect = "red"

