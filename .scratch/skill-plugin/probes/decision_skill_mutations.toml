# 티켓 04(관리 화면 스킬 켜고 끄기와 결정 미리보기)의 변이 표 4개. 구현 전부터 초록이던 시험 셋(고르지 않은 스킬이
# 꺼진 것, skills 가 빈 에이전트, 스킬 행이 표지)과 꺼진 것이 여럿일 때의 순서 시험이 빨강을 볼 수 있는지 잰다.
# 모델의 같은 표(.scratch/model-plugin/probes/decision_model_mutations.toml)를 본떴다. 돌리는 법:
# PYTHONUTF8=1 uv run python tools/mutate.py .scratch/skill-plugin/probes/decision_skill_mutations.toml

[runner.vitest]
command = ["pnpm", "exec", "vitest", "run"]
cwd = "web"
judge = "vitest"

[[mutation]]
name = "에이전트가 고르지 않은 스킬의 꺼짐도 센다"
runner = "vitest"
tests = ["apps/admin/components/pages/RunPage.decision.test.tsx", "-t", "에이전트가 고르지 않은 스킬이 꺼진 것은"]
expect = "red"
expect_output = ["not to contain '꺼진 플러그인'"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/RunDecision.tsx"
old = '''
          other.kind === "skill" && other.name === skill && "manifest" in other && !other.enabled,
'''
new = '''
          other.kind === "skill" && "manifest" in other && !other.enabled,
'''

[[mutation]]
name = "skills 를 보지 않고 고정한 이름의 꺼짐을 센다"
runner = "vitest"
tests = ["apps/admin/components/pages/RunPage.decision.test.tsx", "-t", "skills 가 빈 에이전트는"]
expect = "red"
expect_output = ["not to contain '꺼진 플러그인'"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/RunDecision.tsx"
old = '''
  for (const skill of row.manifest.skills) {
'''
new = '''
  for (const skill of ["answer-format"]) {
'''

[[mutation]]
name = "스킬 행이 표지여도 꺼짐으로 센다"
runner = "vitest"
tests = ["apps/admin/components/pages/RunPage.decision.test.tsx", "-t", "스킬의 행이 표지면"]
expect = "red"
expect_output = ["not to contain '꺼진 플러그인'"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/RunDecision.tsx"
old = '''
          other.kind === "skill" && other.name === skill && "manifest" in other && !other.enabled,
'''
new = '''
          other.kind === "skill" && other.name === skill && !other.enabled,
'''

[[mutation]]
name = "스킬을 매니페스트에 적힌 순서의 거꾸로 센다"
runner = "vitest"
tests = ["apps/admin/components/pages/RunPage.decision.test.tsx", "-t", "꺼진 것이 여럿이면"]
expect = "red"
expect_output = ["모델 sonnet, 스킬 answer-format, 스킬 brief"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/RunDecision.tsx"
old = '''
  for (const skill of row.manifest.skills) {
'''
new = '''
  for (const skill of [...row.manifest.skills].reverse()) {
'''

[[mutation]]
name = "스킬 조회가 종류를 보지 않아 같은 이름의 모델 행도 센다"
runner = "vitest"
tests = ["apps/admin/components/pages/RunPage.decision.test.tsx", "-t", "같은 이름의 꺼진 모델 행이"]
expect = "red"
expect_output = ["not to contain '꺼진 플러그인'"]

[[mutation.edit]]
file = "web/apps/admin/components/organisms/RunDecision.tsx"
old = '''
          other.kind === "skill" && other.name === skill && "manifest" in other && !other.enabled,
'''
new = '''
          other.name === skill && "manifest" in other && !other.enabled,
'''
