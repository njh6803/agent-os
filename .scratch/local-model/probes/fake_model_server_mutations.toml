# 가짜 모델 서버 픽스처(tests/adapters/fake_model_server.py)의 시험이 무엇을 재는지 변이로 본다.
# 티켓 04(.scratch/local-model/issues/04-fake-model-server-fixture.md)가 시험을 쓴 뒤 구현이 이미
# 초록이던 단언(연결의 셈, 기다림, 요청을 적는 차례, 끄기)에 구현을 되돌려 빨강을 본다.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/local-model/probes/fake_model_server_mutations.toml
# 표지는 고른 단언의 메시지에 값을 끼워 넣어, 그 단언이 빨개질 때만 찍힌다(시험 파일의 원문에는 없다).

[[mutation]]
name = "서버가 응답마다 연결을 닫는다"
tests = ["tests/adapters/test_fake_model_server.py::test_서버는_응답마다_연결을_닫지_않고_HTTP_1_1로_답한다"]
expect = "red"
expect_output = ["연결 유지: 버전 11, 닫음 True"]

[[mutation.edit]]
file = "tests/adapters/fake_model_server.py"
old = '                self.send_header("Content-Length", str(len(reply.body)))'
new = '''                self.send_header("Content-Length", str(len(reply.body)))
                self.send_header("Connection", "close")'''

[[mutation]]
