expect = "red"
expect_output = ["DID NOT RAISE ConnectionRefusedError"]

# `server_close()`만 뺀 첫 판은 시험이 초록이었다. 참조가 사라질 때 CPython이 소켓을 닫아 주어서라고
# 본다(어림이고 소켓이 닫히는 순간은 재지 않았다). 그래서 핸들이 서버를 계속 쥐게 해서 듣는 소켓이
# 실제로 열려 있게 한다.
[[mutation.edit]]
file = "tests/adapters/fake_model_server.py"
old = '        httpd, self._httpd = self._httpd, None'
new = '        httpd = self._httpd'

[[mutation.edit]]
file = "tests/adapters/fake_model_server.py"
old = '            httpd.server_close()'
new = '            pass'
