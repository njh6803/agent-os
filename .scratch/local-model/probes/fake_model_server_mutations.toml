expect = "red"
expect_output = ["끊은 직후 셈 (1, 1)"]

# 처리를 마친 연결을 응답을 짓자마자 센다(기다리기 전). 끝의 셈은 하지 않아 연결 하나가 한 번만 센다.
[[mutation.edit]]
file = "tests/adapters/fake_model_server.py"
