# `.claude/rules/core.md` 의 "거부는 실행을 끝내지 않는다" 항목과 실패 정책 항목에 더한 두 끝의 문장(도구 호출의 끝을 넘은 호출의
# 거부, 10을 넘는 턴의 끝을 준비 단계에서 거부하는 문구)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지
# (base-agent 티켓 01).
# 실험군은 규칙의 paths 안(src/agent_os/core/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-11-11, 이 PC의 base-agent 티켓 01 워크트리, claude 2.1.322, HEAD 377675eef 위의 커밋하지 않은 작업 트리). 실험군 셋이 두 문구를 글자 그대로 옮겼고 대조군은 "없음"이었다. "없음" 섞임 0.
# 돌리는 법: uv run python tools/canary.py .scratch/base-agent/probes/canary/core_rule_tool_call_limit.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 에이전트 매니페스트가 적는 두 가지 끝(턴의 수와 도구를 부르는 횟수)을 다루는
항목이 있으면 두 가지를 글자 그대로 옮겨라. (1) 도구를 부르는 횟수의 끝을 넘은 호출을 거부할 때 기록에 남는
문구가 시작하는 따옴표 안의 글. (2) 턴의 끝이 core의 상한을 넘는 값일 때 준비 단계가 내는 문구(백틱 안의 글).
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["도구 호출 횟수를 넘었다", "max_turns 가 루프 상한 10 을 넘는다"]
source = ".claude/rules/core.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/core/loop.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
