# 티켓 02(가짜 검색 서버 픽스처)의 시험 `tests/test_fake_doc_search.py`가 서버 모듈
# `tests/fake_doc_search_server.py`의 어디를 지키는지 변이로 본다. 시험은 서버 뒤에 쓴 것이라 빨강을
# 본 적이 없다. 표지는 단언에 실은 메시지의 값이 끼는 앞머리다. 값이 끼는 꼴이라 시험 파일의 원문에는
