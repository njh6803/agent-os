# 티켓 03(feature/03-commit-check-blocks-ticketless)과 04(feature/04-ci-checks-ticket-done)의 커밋
# 검사 변이. 형식은 tools/mutate.py 의 독스트링.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/ticket-for-every-pr/probes/check_ticket_mutations.toml
# tools/check_ticket.py 의 판정을 하나씩 깨서, 첫 판부터 초록이던 tests/tools/test_check_ticket.py 의
# 진짜 커밋 사례와 CI 사례가 빨개지는지 잰다. 표지는 그 시험의 `_막혔다`·`_지났다`·`_CI가_막았다`·
# `_CI가_지났다` 가 실패할 때만 내는 머리 문구다. 단언이 둘인 `_막혔다`·`_CI가_막았다` 는 둘째 단언이
# 실패해도 pytest 가 보이는 함수 소스에 첫 단언의 문구가 실리므로, 첫 단언이 실패할 때만 찍히는
# `AssertionError: ` 줄로 고른다(.claude/rules/probes.md 첫 항목).
# 체크아웃을 고치므로 도는 동안 그 체크아웃을 읽거나 고치지 않는다.

