# 티켓 03(feature/03-commit-check-blocks-ticketless)의 커밋 검사 변이. 형식은 tools/mutate.py 의 독스트링.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/ticket-for-every-pr/probes/check_ticket_mutations.toml
# tools/check_ticket.py 의 판정을 하나씩 깨서, 첫 판부터 초록이던 tests/tools/test_check_ticket.py 의
# 진짜 커밋 사례가 빨개지는지 잰다. 표지는 그 시험의 `_막혔다`·`_지났다` 가 실패할 때만 내는 머리 문구다.
# 체크아웃을 고치므로 도는 동안 그 체크아웃을 읽거나 고치지 않는다.

[[mutation]]
name = "판정 5 에서 브랜치의 티켓과 바꾼 티켓을 맞대지 않는다"
tests = ["tests/tools/test_check_ticket.py", "-k", "다른_번호의_티켓은"]
expect = "red"
expect_output = ["지나면 안 된다"]

