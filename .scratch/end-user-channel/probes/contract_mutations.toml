# 티켓 01(계약)의 변이 표. 구현 뒤에 쓴 테스트와 구현 전부터 초록이던 순서 가드가 빨강을 볼 수 있는지
# 잰다. 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/end-user-channel/probes/contract_mutations.toml

# --- core: 자기 실행 읽기와 재개의 판정 순서 ------------------------------------------------

[[mutation]]
name = "주체를 손상보다 먼저"
tests = ["tests/core/test_run.py", "-k", "손상된_트레이스는_다른_주체이고"]
expect = "red"

[[mutation.edit]]
file = "src/agent_os/core/run.py"
old = '''
    link = link_of(stored, run_id)
    check_record_rules(link)
    if link.started.principal != principal:
        raise DifferentPrincipal(f"실행 {run_id} 은 요청한 주체의 실행이 아니다")
'''
new = '''
    if stored.events and getattr(stored.events[0], "principal", principal) != principal:
        raise DifferentPrincipal(f"실행 {run_id} 은 요청한 주체의 실행이 아니다")
    link = link_of(stored, run_id)
    check_record_rules(link)
'''

[[mutation]]
