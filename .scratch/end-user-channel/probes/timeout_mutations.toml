# 티켓 03(실행 타임아웃)의 변이 표 11개. 구현 전부터 초록이던 가드와 빨강을 한 번만 본 배선이 빨강을 볼 수
# 있는지 잰다. 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/end-user-channel/probes/timeout_mutations.toml

# --- core: 범위와 결말 ---------------------------------------------------------------------

[[mutation]]
name = "재개가 시작 시각부터 시계 포트로 이어 센다"
tests = ["tests/core/test_run.py", "-k", "다시_세고"]
expect = "red"

[[mutation.edit]]
file = "src/agent_os/core/run.py"
old = '''
        conversation=resumption.conversation,
        model=model,
        tools=tools,
        trace=trace,
        clock=clock,
    )
    seconds = _timeout_of(timeout_seconds)
'''
new = '''
        conversation=resumption.conversation,
        model=model,
        tools=tools,
        trace=trace,
        clock=clock,
    )
    elapsed = (clock.now() - resumption.started.ts).total_seconds()
    seconds = _timeout_of(timeout_seconds) - elapsed
'''

[[mutation]]
name = "시작의 기한이 받은 값이 아니라 0"
tests = ["tests/core/test_run.py", "-k", "타임아웃_안에_끝나면"]
expect = "red"

[[mutation.edit]]
file = "src/agent_os/core/run.py"
old = '''
        conversation=conversation,
        model=model,
        tools=tools,
        trace=trace,
        clock=clock,
    )
    seconds = _timeout_of(timeout_seconds)
'''
new = '''
        conversation=conversation,
        model=model,
        tools=tools,
        trace=trace,
        clock=clock,
    )
    seconds = 0.0
'''

[[mutation]]
name = "결말을 쓴 뒤에도 실패를 덧붙인다"
tests = ["tests/core/test_run.py", "-k", "결말을_쓴_뒤"]
expect = "red"

[[mutation.edit]]
file = "src/agent_os/core/run.py"
