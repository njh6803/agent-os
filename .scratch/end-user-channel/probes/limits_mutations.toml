# 티켓 02(상한·백로그)의 변이 표. 구현 뒤에 쓴 테스트와 구현 없이도 초록이던 가드(정수가 아닌 전역
# 상한의 인자 오류 — 모르는 인자도 종료 코드 2 다)가 빨강을 볼 수 있는지 잰다. 셈(동시 실행의 세
# 범위, 결정, 시간당 창의 경계와 올림), 칸의 반환(실행 전 실패, 앱 종료, 반환과 흐름 닫기 사이),
# 구독 수(세는 자리, 줄이는 자리), 요청 글자 수, 백로그(크기, 넘친 흐름 닫기), 공용 층의 헤더,
# `serve` 의 배선이다. 가드 하나에 변이 하나를 따로 겨눈다 — `-k` 가 여럿을 고르면 하나만 빨개도
# 빨강이라 나머지가 재지 않은 채 지나간다.
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/end-user-channel/probes/limits_mutations.toml

# --- 셈 --------------------------------------------------------------------------------

