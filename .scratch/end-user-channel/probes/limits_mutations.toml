[[mutation.edit]]
file = "src/agent_os/channel/http/runs.py"
old = '''
            finally:
                if self._live.get(first.run_id) is live:
                    del self._live[first.run_id]
        finally:
            if seat is not None:
                self._quota.give_back(seat)
            live.close()
'''
new = '''
            finally:
                if self._live.get(first.run_id) is live:
                    del self._live[first.run_id]
                if seat is not None:
                    self._quota.give_back(seat)
        finally:
            live.close()
'''

[[mutation]]
name = "정상 종료에서만 칸을 돌려줌 — 앱 종료의 취소"
tests = ["tests/channel/http/test_end_user.py", "-k", "앱이_멈추며_취소한_실행도"]
expect = "red"

[[mutation.edit]]
file = "src/agent_os/channel/http/runs.py"
old = '''
                await _offer_all(first, events, live, first_index)
'''
new = '''
                await _offer_all(first, events, live, first_index)
                if seat is not None:
                    self._quota.give_back(seat)
                    seat = None
'''

[[mutation.edit]]
file = "src/agent_os/channel/http/runs.py"
old = '''
        finally:
            if seat is not None:
                self._quota.give_back(seat)
            live.close()
'''
new = '''
        finally:
            if seat is not None and failure.error is not None:
                self._quota.give_back(seat)
            live.close()
'''

# 이 변이가 재는 것은 "await 가 없다"가 아니라 "흐름이 닫힌 뒤 칸이 늦게 돌아오지 않는다"다. 그 사이의
# `sleep(0)` 하나는 끝을 본 받는 쪽의 응답이 몇 태스크를 지나 닫히는 동안 칸이 돌아와 초록일 수 있어,
# 늦음이 바깥에 보이도록 0.2초를 잔다.
[[mutation]]
name = "흐름을 닫은 뒤 await 하고 칸을 돌려줌"
tests = ["tests/channel/http/test_end_user.py", "-k", "연결이_끊겨도_칸은"]
expect = "red"

[[mutation.edit]]
file = "src/agent_os/channel/http/runs.py"
old = '''
        finally:
            if seat is not None:
                self._quota.give_back(seat)
            live.close()
'''
new = '''
        finally:
            live.close()
            await anyio.sleep(0.2)
            if seat is not None:
                self._quota.give_back(seat)
'''

