[[mutation]]
name = "구독 수를 줄이지 않음"
tests = ["tests/channel/http/test_end_user.py", "-k", "주체별_구독은_넷까지"]
expect = "red"

[[mutation.edit]]
file = "src/agent_os/channel/http/end_user.py"
old = '''
        finally:
            subscriptions.give_back(seat)
'''
new = '''
        finally:
            pass
'''

# 옛 모양은 칸을 응답의 제너레이터가 돌려준다. 라우트는 의존성의 칸을 받지 못하므로 같은 주체의 칸을
# 새로 지어 돌려준다(`give_back` 은 주체만 본다).
[[mutation]]
name = "구독 수를 응답의 제너레이터에서 줄임(옛 모양)"
tests = ["tests/channel/http/test_end_user.py", "-k", "응답이_막힌_채_떠난_구독도"]
expect = "red"

[[mutation.edit]]
file = "src/agent_os/channel/http/end_user.py"
old = '''
        seat = subscriptions.take(user)
        try:
            subscribed = first_step(user, RunId(run_id), last_event_id)
            try:
                yield subscribed
            finally:
                subscribed.close()
        finally:
            subscriptions.give_back(seat)
'''
new = '''
        seat = subscriptions.take(user)
        try:
            subscribed = first_step(user, RunId(run_id), last_event_id)
        except BaseException:
            subscriptions.give_back(seat)
            raise
        try:
            yield subscribed
        finally:
            subscribed.close()
'''

[[mutation.edit]]
file = "src/agent_os/channel/http/end_user.py"
old = '''
    async def subscribe_end_user_run(
        subscribed: Annotated[_Subscription, Depends(subscription)],
    ) -> AsyncIterator[EndUserItem | SkipJsonSchema[ServerSentEvent]]:
        async for frame in subscribed.frames():
            yield frame
'''
new = '''
    async def subscribe_end_user_run(
        subscribed: Annotated[_Subscription, Depends(subscription)],
        request: Request,
    ) -> AsyncIterator[EndUserItem | SkipJsonSchema[ServerSentEvent]]:
        try:
            async for frame in subscribed.frames():
                yield frame
        finally:
            user = _signed_in(request)
            subscriptions.give_back(Seat(principal=user.principal, issuer=user.site.issuer))
'''

[[mutation.edit]]
file = "src/agent_os/channel/http/end_user.py"
old = '''
    DEFAULT_REQUEST_CHARS,
    SubscriptionQuota,
'''
new = '''
    DEFAULT_REQUEST_CHARS,
    Seat,
    SubscriptionQuota,
'''

