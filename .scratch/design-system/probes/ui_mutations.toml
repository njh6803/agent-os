# design-system 티켓 01 의 변이 표. 스토리 테스트(뿌리 vitest 의 storybook 프로젝트)가 무엇을 재는지 변이로 본다.
# 구현 뒤에 쓴 스토리와 처음부터 초록이던 판정 스토리가 빨강을 볼 수 있는지, 그리고 미리보기의 afterEach 가 실제로
# 스토리 테스트를 실패시키는지(티켓의 수용 기준) 본다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-system/probes/ui_mutations.toml [이름 ...]
# 실제 chromium 이 Playwright 의 브라우저 캐시에 있어야 한다(docs/constitution/operations.md).
# 2026-10-22(design-reverse-sync 01): 명암비 계산이 `styles/contrast.ts` 로 옮겨 그 변이의 `file` 을 옮겼고, 표를 커밋하며
# design-refresh 가 컴포넌트와 토큰을 다시 지어 원문이 0번이 된 변이 열넷을 정리했다. 열은 지금 코드로 원문을 고쳤고(먹·
# 열 벌이던 Matrix 변이는 라이트 공통 블록·여덟 벌로, 주 버튼의 accent-hover 는 primary-hover 로), 넷은 뺐다. 위험 버튼의
# 테두리가 border 인 변이는 지금 그것이 정답이고 반대 꼴을 design-refresh 의 `theme_colors_mutations.toml` 이 잰다. 작은
# 버튼의 높이 변이는 버튼이 크기를 고르지 않게 되어 겨눌 자리가 없다. 버튼과 아이콘 버튼의 포커스 링이 accent 를 읽는
# 변이 둘은 공문 테마가 없어졌고 지금 여덟 벌 모두 accent 와 focus-ring 이 같은 값이라 계산값으로 가를 수 없다
# (`.claude/rules/web-design.md`. 포커스 링은 그 design-refresh 표의 "버튼의 포커스 링을 border 로 칠하면"이 잰다). 일지
# 2026-10-22-17.

[runner.stories]
command = ["pnpm", "exec", "vitest", "run", "--project", "storybook"]
cwd = "web"
judge = "vitest"

# --- 미리보기의 판정 자리 -------------------------------------------------------------------------------------

# 보통 스토리는 판정 태그가 없는 컴포넌트 스토리다. play 는 이 클래스를 보지 않으므로 빨강은 afterEach 의 것이다.
