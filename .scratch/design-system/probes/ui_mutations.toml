# design-system 티켓 01 의 변이 표. 스토리 테스트(뿌리 vitest 의 storybook 프로젝트)가 무엇을 재는지 변이로 본다.
# 구현 뒤에 쓴 스토리와 처음부터 초록이던 판정 스토리가 빨강을 볼 수 있는지, 그리고 미리보기의 afterEach 가 실제로
# 스토리 테스트를 실패시키는지(티켓의 수용 기준) 본다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-system/probes/ui_mutations.toml [이름 ...]
# 실제 chromium 이 Playwright 의 브라우저 캐시에 있어야 한다(docs/constitution/operations.md).

[runner.stories]
command = ["pnpm", "exec", "vitest", "run", "--project", "storybook"]
cwd = "web"
judge = "vitest"

# --- 미리보기의 판정 자리 -------------------------------------------------------------------------------------

# 보통 스토리는 판정 태그가 없는 컴포넌트 스토리다. play 는 이 클래스를 보지 않으므로 빨강은 afterEach 의 것이다.
[[mutation]]
name = "보통 스토리(버튼 셋의 320px)에 text-base 를 심으면 afterEach 의 클래스 판정이 빨갛게 한다"
runner = "stories"
tests = ["packages/ui/src/components/atoms/Button.stories.tsx", "-t", "버튼 셋을"]
expect = "red"

[[mutation.edit]]
file = "web/packages/ui/src/components/atoms/Button.stories.tsx"
old = '''
    <div data-sample="row" className="flex gap-2" style={{ width: 320 }}>
'''
new = '''
    <div data-sample="row" className="flex gap-2 text-base" style={{ width: 320 }}>
'''

[[mutation]]
name = "판정 스토리(RemFree)에 text-base 를 심어도 afterEach 가 빨갛게 한다"
runner = "stories"
tests = ["packages/ui/src/styles/DesignTokens.stories.tsx", "-t", "rem"]
expect = "red"

[[mutation.edit]]
file = "web/packages/ui/src/styles/DesignTokens.stories.tsx"
old = '''
  render: () => <p className="text-body">rem 0</p>,
'''
new = '''
