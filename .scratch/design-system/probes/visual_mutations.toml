# --- 미디어 특성 --------------------------------------------------------------------------------------------

# 첫 판은 [data-theme] 선택자 하나만 뺐는데 초록이었다. 데코레이터가 data-theme 을 단 문서 뿌리는 :root:not([data-mode])
# 에도 걸린다. 묶음 전체를 시스템 라이트에 걸어 라이트·다크가 모두 어긋나게 한다.
[[mutation]]
name = "시스템 다크 묶음이 라이트에 걸리면 시스템 모드의 문서 뿌리가 빨갛다"
