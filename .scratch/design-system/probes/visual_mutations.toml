# design-system 티켓 02 의 변이 표. 사진 비교(web/packages/ui/visual/)와 이미지 고정 테스트(web/tools/visual.test.ts)가
# 무엇을 재는지 변이로 본다. 사진 테스트는 정답이 없을 때 빨강을 봤고(일지 2026-10-07-03), 여기는 정답이 있는 상태에서
# 사진이 바뀐 그림을, 미디어 특성 테스트가 바뀐 값을, 가드가 자기 자리를 잡는지 본다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-system/probes/visual_mutations.toml [이름 ...]
# visual 러너는 정적 빌드부터 다시 지어 Docker 컨테이너에서 돈다(-g 로 좁힌 실행 하나에 십여 초였다. 손으로 봤다).
# Docker 와 판을 고정한 이미지가 있어야 한다. 정답 사진이 커밋돼 있어야 기준선이 초록이다.
# 2026-10-23(web-widget 03): 정적 빌드를 여는 길이 `visual/storybook.ts` 에서 위젯과 나눠 쓰는 `visual/index.ts` 로 옮겨
# 그 변이 둘의 `file` 과 원문(들여쓰기)을 옮겼다. 표를 고치며 design-refresh 가 테마와 스토리를 다시 지어 원문이 0번이 된
# 변이 일곱도 지금 코드로 고쳤다. 먹은 없어졌고 기본 테마는 녹청이며 주 버튼은 회색 900 바탕이라, 원색 변이는 녹청의
# `--gray-900` 을, `:root` 변이는 녹청 블록을 겨눈다. 올림 색은 `primary-hover`, judgment 태그는 군청 스토리, 모드 가드는
# `renderedAs`, 던지는 스토리는 작은 버튼이 없어져 아이콘을 단 버튼(`WithIcon`)이다. 일지 2026-10-23-50.

[runner.visual]
command = ["pnpm", "-C", "web", "visual"]
judge = "playwright"

[runner.image]
command = ["pnpm", "exec", "vitest", "run", "--project", "node"]
cwd = "web"
judge = "vitest"

