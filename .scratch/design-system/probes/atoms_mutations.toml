# design-system 티켓 03 의 변이 표. 상태 배지·진행 표시·카드의 스토리 테스트와 사진 비교가 무엇을 재는지 변이로 본다.
# 스토리는 컴포넌트보다 먼저 써서 빨갰지만 그 빨강은 모듈이 없어서였다(일지 2026-10-07-12). 단언마다의 빨강은 여기서 본다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/design-system/probes/atoms_mutations.toml [이름 ...]
# stories 러너는 실제 chromium 이 Playwright 의 브라우저 캐시에 있어야 하고(docs/constitution/operations.md), visual 러너는
# 정적 빌드부터 다시 지어 Docker 컨테이너에서 돈다(visual_mutations.toml 머리).

[runner.stories]
command = ["pnpm", "exec", "vitest", "run", "--project", "storybook"]
cwd = "web"
judge = "vitest"

[runner.visual]
command = ["pnpm", "-C", "web", "visual"]
judge = "playwright"

