# 대조. `max > 0` 의 갈래를 빼면 max 가 0 일 때 자른 값도 0 이라 폭이 `NaN%` 가 되는데, 브라우저가 그 폭을 버려 내용 없는
# 막대의 폭이 0 이 되므로 같은 그림이라고 본다. 그 어림이 맞으면 이 변이는 지난다. 갈래는 DOM 에 `NaN%` 를 쓰지 않으려고 둔다.
[[mutation]]
name = "max 가 0 일 때의 갈래를 빼도 막대의 폭이 0 이라 범위 밖 스토리가 지난다"
runner = "stories"
tests = ["packages/ui/src/components/atoms/Progress.stories.tsx", "-t", "끝 값을 넘는"]
expect = "green"

