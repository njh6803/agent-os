            f"앞 실행 {previous} 은 요청한 주체의 실행이 아니라 이어 갈 수 없다"
        )
    if not isinstance(link.last, RunFinished):
        raise NotContinuable(
            f"앞 실행 {previous} 은 끝나지 않아 이어 갈 수 없다: 상태 {run_status(link.last)}"
        )
'''
new = '''
