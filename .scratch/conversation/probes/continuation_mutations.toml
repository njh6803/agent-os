# 티켓 01의 가드가 실제로 무는지 변이로 본다(implement 스킬, 대기열 29). 이 티켓의 새 테스트는 구현 전에
# import 오류로만 빨갰고 단언 하나하나가 빨강을 본 적은 없어서, 판정 순서·멈추는 자리·표·조건의 가드를
# 하나씩 되돌려 그 단언이 무는지 본다. 사용: PYTHONUTF8=1 uv run python tools/mutate.py
# .scratch/conversation/probes/continuation_mutations.toml

[runner.vitest]
command = ["pnpm", "exec", "vitest", "run"]
cwd = "web"
judge = "vitest"

[runner.tsc]
command = ["pnpm", "exec", "tsc", "--noEmit", "-p", "packages/api-client"]
cwd = "web"
judge = "tsc"

[[mutation]]
name = "다른 주체보다 끝나지 않음을 먼저 본다"
