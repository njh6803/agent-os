# 티켓 03(모델의 접속 확인)의 변이 표. 구현과 같은 날 쓴 시험(`tests/adapters/test_model_check.py`)이
# 처음부터 초록이라, 결정마다 하나씩 되돌려 시험이 빨개지는지 본다. 되돌리는 결정은 재시도 끄기,
# 이유 글에 오류 글을 싣지 않기, 모델 객체의 헤더·프록시·주소를 따르기, 이름 견줌, 404의 갈래,
# 취소 전파, 주소의 사용자 정보 떼기, 빈 키로 요청하지 않기, 시간 초과를 연결 오류보다 먼저 가르기,
# 총 시간 기한, 확인용 클라이언트를 짓다 난 예외 바꾸기(제공사마다 하나)다.
# 변이마다 고른 단언이 그 까닭으로 빨개졌다는 표지(`expect_output`)를 단다. 빨강의 판정은
# `tools/mutate.py` 의 독스트링이다.
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/connection-check/probes/model_check_mutations.toml
# 네트워크를 타지 않는다(가짜 서버가 127.0.0.1 에서 받는다). `uv sync` 가 된 체크아웃에서 돈다.

