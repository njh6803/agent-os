# 동등 변이(대조). openai SDK 의 `models.list()` 가 돌려주는 쪽(`AsyncPage`)은 다음 쪽이 없어
# (`has_next_page` 가 늘 거짓), `async for` 로 읽어도 첫 쪽만 돈다. 그래서 "첫 쪽만 읽는다"는 결정은
# SDK 가 지키고 있어 이 코드를 바꿔서는 시험이 빨개지지 않는다. 시험은 서버가 받은 요청이 한 건이라는
# 사실로 그 결정을 고정하고, SDK 가 다음 쪽을 읽게 바뀌면 그때 빨개진다.

[[mutation]]
name = "다음 쪽까지 읽는다 — SDK 가 첫 쪽에서 멈춰 같다"
tests = ["tests/adapters/test_model_check.py"]
expect = "green"

[[mutation.edit]]
