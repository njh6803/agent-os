# `.claude/rules/web-admin.md` 에 connection-check 티켓 04 가 더한 항목(주기 읽기의 예외는 ADR 0063의 것과 플러그인 목록의
# 접속 확인 하나)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(CLAUDE.md 작업 규약 3). 실험군은 규칙의 paths
# 안(web/apps/admin/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다. 실험군의 파일은 고친 문장을 담지 않은 것을
# 골랐다.
# 최신 결과: 2026-11-24 이 PC, claude 2.1.325, 커밋 7770ac0c1 위의 작업 트리(connection-check 04)에서 통과 4(실험군 3회차가
# 그 문장을 글자 그대로 옮겼고, 대조군 1회차는 "없음"이었다). 원본은 저장소에 두지 않았다. 일지 2026-11-24-1652.
# 돌리는 법: uv run python tools/canary.py .scratch/connection-check/probes/canary/web_admin_periodic_read.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 관리 화면 앱 규칙이 있으면, 시간이 흐르는 것만으로 서버를 다시 부르지 않는다는 항목에서 그 예외가 무엇인지 말하는 문장을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 지시가 없으면 "없음"이라고만 답하라.
'''
expect = [
  "주기 읽기의 예외는 ADR 0063의 것과 플러그인 목록의 접속 확인 하나다",
]
source = ".claude/rules/web-admin.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "web/apps/admin/components/molecules/FailureNotice.tsx"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
