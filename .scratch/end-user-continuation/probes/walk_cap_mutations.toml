# 티켓 04(교환 수와 상한과 스레드)의 변이 표. 구현 뒤에 쓴 테스트(교환 수로 접힐 때의 글자 수 절반,
# 26번째 이어 가기, 상한의 관계)와 결정을 가르는 사례(앞 실행을 세는 자리, 상한을 판정들 뒤에 두는
# 자리, 재개와 이어 가기의 같은 수, 스레드로 보내는 범위, 취소되면 기다리기)가 빨강을 볼 수 있는지 하나씩
# 되돌려 본다. 변이마다 고른 단언이 그 까닭으로 빨개졌다는 표지(`expect_output`)를 단다. 빨강의 판정은
# `tools/mutate.py` 의 독스트링이다.
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/end-user-continuation/probes/walk_cap_mutations.toml
# 네트워크를 타지 않는다. `uv sync` 가 된 체크아웃에서 돈다. 스레드 변이는 루프 위에서 막힌 읽기마다
# 박동을 5초 기다려 그 몫이 길다.

