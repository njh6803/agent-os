[[mutation.edit]]
file = "src/agent_os/core/run.py"
old = '''run_sync(gather_continued, trace, previous_run, agent, principal)'''
new = '''run_sync(
            gather_continued, trace, previous_run, agent, principal, abandon_on_cancel=True
        )'''

# 재개의 첫 걸음에 await 가 들면 같은 실행에 동시에 온 둘째 결정이 첫째의 결정보다 먼저 일시정지를
# 읽는다(ADR 0014). 이어 간 실행의 재개만 그렇게 바꾼 구현은 이어 가지 않은 실행을 재개하는 채널의
# 동시 재개 테스트로는 초록이라(대조), core 의 이어 간 실행 동시 재개 테스트가 가른다.

