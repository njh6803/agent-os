[[mutation]]
name = "운영자 면도 손상을 덮는다"
tests = ["tests/channel/http/test_end_user.py", "-k", "손상된_남의_실행에_운영자_채널은"]
expect = "red"
expect_output = ["where 404 = <Response [404 Not Found]>.status_code"]

[[mutation.edit]]
file = "src/agent_os/http/errors.py"
old = '''
        case TraceDamagedBeforePrincipal():
            if operator:
                return _Failure(status=500, message=str(error))
            return _Failure(status=404, message=NOT_FOUND_MESSAGE)
'''
new = '''
        case TraceDamagedBeforePrincipal():
            return _Failure(status=404, message=NOT_FOUND_MESSAGE)
'''

[[mutation]]
name = "손상의 갈래가 기반 타입 뒤에 선다"
tests = ["tests/channel/http/test_end_user.py", "-k", "자기_실행의_손상도"]
expect = "red"
expect_output = ["where 500 = <Response [500 Internal Server Error]>.status_code"]

[[mutation.edit]]
file = "src/agent_os/http/errors.py"
old = '''
        case TraceDamagedBeforePrincipal():
            if operator:
                return _Failure(status=500, message=str(error))
            return _Failure(status=404, message=NOT_FOUND_MESSAGE)
        case PluginError():
            return _Failure(status=500, message=str(error) if operator else INTERNAL_MESSAGE)
'''
new = '''
        case PluginError():
            return _Failure(status=500, message=str(error) if operator else INTERNAL_MESSAGE)
        case TraceDamagedBeforePrincipal():
            if operator:
                return _Failure(status=500, message=str(error))
            return _Failure(status=404, message=NOT_FOUND_MESSAGE)
'''
