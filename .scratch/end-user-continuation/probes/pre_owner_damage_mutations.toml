'''

[[mutation]]
name = "최종 사용자 면이 손상을 덮지 않는다"
tests = ["tests/channel/http/test_end_user.py", "-k", "자기_실행의_손상도"]
expect = "red"
expect_output = ["where 500 = <Response [500 Internal Server Error]>.status_code"]

[[mutation.edit]]
file = "src/agent_os/http/errors.py"
old = '''
                return _Failure(status=500, message=str(error))
            return _Failure(status=404, message=NOT_FOUND_MESSAGE)
        case PluginError():
'''
