# `.claude/rules/sdk.md` 에 더한 항목(시작 이벤트의 바로가기와 실패 이벤트의 실패 원인, 값 집합)이 `paths` 에 맞는
# 파일을 Read 로 열 때 실리는지(end-user-continuation 티켓 01).
# 실험군은 규칙의 paths 안(src/agent_os/sdk/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 일지 2026-10-16-60). 그 뒤 셀프 리뷰가 원천의 본문을 고쳐 같은
# 날 사전 확인으로 갈음했다(일지 2026-10-16-60).
# 돌리는 법: uv run python tools/canary.py .scratch/end-user-continuation/probes/canary/sdk_rule_failure_cause.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 실패한 실행의 이벤트가 드는 원인 값을 다루는 항목이 있으면 세 가지를 글자 그대로
옮겨라. (1) 그 값 집합의 타입 이름. (2) 값이 몇 개인지. (3) 나열한 값 가운데 여덟째 값.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["FailureCause", "agent_code"]
source = ".claude/rules/sdk.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/sdk/json.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
