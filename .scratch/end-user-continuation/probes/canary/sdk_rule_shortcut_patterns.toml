# `.claude/rules/sdk.md` 의 바로가기 항목에 더한 문장(지도의 키·값 패턴은 core 의 기록 규칙이 본다)이 `paths` 에 맞는
# 파일을 Read 로 열 때 실리는지(end-user-continuation 티켓 03).
# 실험군은 규칙의 paths 안(src/agent_os/sdk/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-11-01, 이 PC의 model-plugin 티켓 01 워크트리, claude 2.1.312, 일지 2026-11-01-02).
# model-plugin 티켓 01 이 같은 파일의 종류별 칸 불릿과 모델 불릿을 고친 뒤 다시 돌렸다.
# 앞선 결과: 통과 4(2026-10-24, 이 PC, claude 2.1.302, 일지 2026-10-24-01). web-widget 티켓 02 가 같은 파일의
# `run()` 항목에 플러그인 작성자의 몫(에이전트를 돌리는 태스크)을 더한 뒤 다시 돌렸다.
# 돌리는 법: uv run python tools/canary.py .scratch/end-user-continuation/probes/canary/sdk_rule_shortcut_patterns.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 시작 이벤트의 바로가기(에이전트 이름에서 실행 식별자로 가는 지도)를 다루는 항목이
있으면, 그 지도의 키와 값이 패턴을 지키는지 보는 자리로 적힌 함수의 이름(백틱 안의 글)을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["check_record_rules"]
source = ".claude/rules/sdk.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/sdk/json.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
