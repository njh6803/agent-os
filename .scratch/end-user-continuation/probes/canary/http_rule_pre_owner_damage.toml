# `.claude/rules/http.md` 의 상태 코드 표 항목을 고친 문장(최종 사용자 경로끼리는 가르지 않는다, 그 밖의 PluginError 가
# 최종 사용자 면에서 500 고정 문구인 이유)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(end-user-continuation 티켓 05).
# 실험군은 규칙의 paths 안(src/agent_os/http/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-10-20, 이 PC, claude 2.1.302, 일지 2026-10-20-20).
# 돌리는 법: uv run python tools/canary.py .scratch/end-user-continuation/probes/canary/http_rule_pre_owner_damage.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 예외를 상태 코드로 옮기는 표를 다루는 항목이 있으면 두 가지를 글자 그대로 옮겨라.
(1) 그 항목에서 최종 사용자 면의 경로들 사이를 다룬 문장 하나. (2) 그 항목에서 최종 사용자 면이 그 밖의 PluginError 를
500 으로 내는 이유를 적은 괄호 안의 글.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["최종 사용자 면의 경로끼리는 가르지 않는다", "주체를 확인한 뒤라 숨길 남이 없고"]
source = ".claude/rules/http.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/http/paths.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
