# `.claude/rules/core.md` 의 대화 요약 항목과 이어 가기 항목에 더한 문장(교환 수 기준, 읽기 상한, 이어 가기 판정의
# 스레드 호출과 취소 때의 기다림)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(end-user-continuation 티켓 04).
# 실험군은 규칙의 paths 안(src/agent_os/core/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-11-08, 이 PC의 approval-rules 티켓 05 워크트리, claude 2.1.318, HEAD 778db404 위의 커밋하지 않은 작업 트리, 일지 2026-11-08-0112). 티켓 05 가 core.md 의 승인 게이트 항목·재개 항목·실패 정책(마스킹과 묻기의 충돌, 에이전트 표의 검사, 재개의 서버 대조, 준비 순서)과 sdk.md 의 승인 게이트 필드 항목을 고친 뒤 돌렸다.
# 앞선 결과: 통과 4(2026-11-06, 이 PC의 approval-rules 티켓 04 워크트리, claude 2.1.318, HEAD d0f5a195 위의 커밋하지 않은 작업 트리, 일지 2026-11-06-09). 티켓 04 가 core.md 의 승인 게이트·거부·재개 항목과 실패 정책의 준비 순서를 고친 뒤 다시 돌렸다.
# 앞선 결과: 통과 4(2026-11-06, 이 PC의 approval-rules 티켓 03 워크트리, claude 2.1.318, HEAD c974bea9 위의 커밋하지 않은 작업 트리, 일지 2026-11-06-06). 티켓 03 이 core.md 의 포트 표 ToolSource 행과 실패 정책에 같은 이름의 도구·서버 칸의 문장을 더한 뒤 다시 돌렸다.
