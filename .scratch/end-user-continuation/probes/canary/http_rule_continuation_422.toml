# `.claude/rules/http.md` 의 에러 문서 항목에 더한 문장(이어 가기 경로가 시작의 422 설명을 나눠 쓴다)이 `paths` 에 맞는
# 파일을 Read 로 열 때 실리는지(end-user-continuation 티켓 01).
# 실험군은 규칙의 paths 안(src/agent_os/http/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-11-28, 이 PC, claude 2.1.325, 일지 2026-11-28-1131-admin-login-ticket-13. admin-login 티켓 13 이 같은 규칙의 자격 항목과 운영자 경로 항목, 권한 항목, 계정 항목을 고친 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-11-27, 이 PC, claude 2.1.325, 일지 2026-11-27-1647-admin-login-ticket-06. admin-login 티켓 06 이 같은 규칙의 권한 표 항목(걸리는 라우터를 넷으로)과 에러 문서 항목(`/auth/set-password`의 403과 409 설명의 나눠 쓰는 라우트)과 공개 경로 항목(다섯)을 고친 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-11-26, 이 PC, claude 2.1.325, 일지 2026-11-26-2116-admin-login-ticket-04. admin-login 티켓 04 가 같은 규칙의 공개 경로 항목을 넷으로 고치고 갱신 라우트의 401 문서를 에러 문서 항목에 더한 뒤, 커밋하기 전의 작업 트리로 돌렸다) (두 변경을 합친 판으로는 다시 돌리지 않았다). 앞 판은 통과 4(2026-11-26, 이 PC, claude 2.1.325, 일지 2026-11-26-2151. admin-login 티켓 05 가 같은 규칙에 권한 표 항목과 쿠키로 시작한 실행의 계정 항목을 더하고 봉투 항목의 `forbidden` 문장을 고친 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-11-26, 이 PC, claude 2.1.325, 일지 2026-11-26-1553. admin-login 티켓 03 이 같은 규칙에 운영자 경로의 짧은 JWT 항목과 공개 경로 셋과 테스트 항목의 계정 저장소 문장을 더한 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-11-25, 이 PC, claude 2.1.325, 실험군은 `6b0646e80` 위의 커밋 전 작업 트리 셋, 대조군은 같은 체크아웃의 `paths` 밖 파일 하나. admin-login 티켓 01 이 `http.md`에 403 `forbidden`과 출처 검사를 더한 뒤 돌렸다). 앞 판은 통과 4(2026-11-25, 이 PC, claude 2.1.325, 일지 2026-11-25-1440. widget-admin-server 티켓 01 이 같은 규칙의 첫 항목(공용 배관은 `agent_os` 안이고 둘째 묶음은 자기 사본을 든다)에 한 줄을 더한 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-11-20, 이 PC, 일지 2026-11-20-1918. postgres-foundation 티켓 03 이 같은 규칙의 앱 조립·미들웨어 순서·테스트 항목에 데이터베이스 확인을 더한 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-11-16, 이 PC, 일지 2026-11-16-1447. release-image 티켓 09 가 같은 파일의 테스트 항목 괄호에 단독 배포 e2e 의 실행 조건을 더한 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-11-10, 이 PC, claude 2.1.318, 일지 2026-11-10-1459. pilot-portal 06 이 같은 파일의 "두 e2e" 괄호를 세 e2e 로 고친 뒤, 커밋하기 전의 작업 트리로 돌렸다). 앞 판은 통과 4(2026-10-24, claude 2.1.302, 일지 2026-10-24-10). web-widget 티켓 06 이 같은 규칙의 테스트 항목
# (실제 `serve` 를 띄우는 것들에 위젯 e2e 를 더했다)을 고친 뒤 커밋하기 전의 사본으로 다시 돌렸다.
# 돌리는 법: uv run python tools/canary.py .scratch/end-user-continuation/probes/canary/http_rule_continuation_422.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 라우트가 자기가 내는 에러를 문서에 적는 법을 다루는 항목이 있으면, 그 항목에서
최종 사용자의 이어 가기 경로를 말한 문장 하나를 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["본문과 상한이 같은 최종 사용자의 이어 가기 경로는 시작의 그 설명을 나눠 쓴다"]
source = ".claude/rules/http.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/http/paths.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
