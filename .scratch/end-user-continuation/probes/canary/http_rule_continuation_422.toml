# `.claude/rules/http.md` 의 에러 문서 항목에 더한 문장(이어 가기 경로가 시작의 422 설명을 나눠 쓴다)이 `paths` 에 맞는
# 파일을 Read 로 열 때 실리는지(end-user-continuation 티켓 01).
# 실험군은 규칙의 paths 안(src/agent_os/http/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-10-23, 이 PC, claude 2.1.302, 일지 2026-10-23-49). web-widget 티켓 01 이 같은 에러 문서 항목의
# 스트림 라우트 문장과 상한 문장을 고친 뒤 다시 돌렸다. 그 뒤 셀프 리뷰가 상태 코드 표 항목의 낱말 하나를 고쳐
# 사전 확인(`--preflight`)으로 갈음했다(2026-10-23, 같은 일지).
# 돌리는 법: uv run python tools/canary.py .scratch/end-user-continuation/probes/canary/http_rule_continuation_422.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 라우트가 자기가 내는 에러를 문서에 적는 법을 다루는 항목이 있으면, 그 항목에서
최종 사용자의 이어 가기 경로를 말한 문장 하나를 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["본문과 상한이 같은 최종 사용자의 이어 가기 경로는 시작의 그 설명을 나눠 쓴다"]
source = ".claude/rules/http.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/http/paths.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
