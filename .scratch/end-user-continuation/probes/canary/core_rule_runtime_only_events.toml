# `.claude/rules/core.md` 의 런타임만 내는 이벤트 항목에 더한 문장(에이전트의 제너레이터가 그 자리에서 닫힌다, 테스트
# 절의 이름)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(end-user-continuation 티켓 01).
# 실험군은 규칙의 paths 안(src/agent_os/core/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-11-08, 이 PC의 approval-rules 티켓 05 워크트리, claude 2.1.318, HEAD 778db404 위의 커밋하지 않은 작업 트리, 일지 2026-11-08-0112). 티켓 05 가 core.md 의 승인 게이트 항목·재개 항목·실패 정책(마스킹과 묻기의 충돌, 에이전트 표의 검사, 재개의 서버 대조, 준비 순서)과 sdk.md 의 승인 게이트 필드 항목을 고친 뒤 돌렸다.
# 앞선 결과: 통과 4(2026-11-06, 이 PC의 approval-rules 티켓 04 워크트리, claude 2.1.318, HEAD d0f5a195 위의 커밋하지 않은 작업 트리, 일지 2026-11-06-09). 티켓 04 가 core.md 의 승인 게이트·거부·재개 항목과 실패 정책의 준비 순서를 고친 뒤 다시 돌렸다.
# 앞선 결과: 통과 4(2026-11-06, 이 PC의 approval-rules 티켓 03 워크트리, claude 2.1.318, HEAD c974bea9 위의 커밋하지 않은 작업 트리, 일지 2026-11-06-06). 티켓 03 이 core.md 의 포트 표 ToolSource 행과 실패 정책에 같은 이름의 도구·서버 칸의 문장을 더한 뒤 다시 돌렸다.
# 앞선 결과: 통과 4(2026-11-06, 티켓 01 워크트리, claude 2.1.318, 일지 2026-11-06-05). 티켓 01 이 core.md 의 런타임 전용 항목에 적용 규칙·서버 칸의 예외를 더한 뒤 다시 돌렸다.
# 앞선 결과: 통과 4(2026-10-24, 이 PC, claude 2.1.302, 일지 2026-10-24-01). web-widget 티켓 02 가 같은 항목의 닫기
# 문장(에이전트를 돌린 태스크, 몸통의 태스크 그룹)을 고친 뒤 다시 돌렸다.
# 돌리는 법: uv run python tools/canary.py .scratch/end-user-continuation/probes/canary/core_rule_runtime_only_events.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 런타임만 낼 수 있는 이벤트를 다루는 항목이 있으면 두 가지를 글자 그대로 옮겨라.
(1) 그 항목에서 굵은 글씨로 적은 문장 하나. (2) 그 항목이 테스트가 있다고 가리킨 절의 이름(따옴표 안의 글).
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["에이전트의 제너레이터는 그 자리에서 닫힌다", "에이전트가 낸 실패 이벤트도 실패다"]
source = ".claude/rules/core.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/core/loop.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
