# `.claude/rules/core.md` 의 이어 가기 항목에 더한 문장(옛 대화는 지도 없음이 이어진다, 지도가 있을 때의 거슬러 읽기
# 함수)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(end-user-continuation 티켓 03).
# 실험군은 규칙의 paths 안(src/agent_os/core/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-10-20, 이 PC, claude 2.1.302). 첫 판의 지침에서는 굵은 문장이 3/3 실렸지만 함수 이름을 2/3이
# `_walk` 로 답했다(꼬리표 "거슬러 읽기(`_walk`)"가 옛 대화 쪽에만 붙어 있었다). 두 갈래를 대칭으로 고친 판이다.
# 돌리는 법: uv run python tools/canary.py .scratch/end-user-continuation/probes/canary/core_rule_shortcuts.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 이어 가기에서 시작 이벤트가 드는 에이전트별 지도를 다루는 항목이 있으면 두 가지를
글자 그대로 옮겨라. (1) 지도가 없는 옛 대화를 두고 굵은 글씨로 적은 문장 하나. (2) 지도가 있을 때 거슬러 읽기를 하는
함수의 이름(백틱 안의 글).
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["옛 대화는 지도 없음이 이어진다", "_follow"]
source = ".claude/rules/core.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "src/agent_os/core/loop.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
