# 티켓 03(바로가기)의 변이 표. 바로가기 검증 사례 가운데 여럿(없음, 손상, 다른 주체, 끝나지 않음,
# 순환, 덮는 끝을 못 만남)은 구현 전에도 옛 거슬러 읽기가 같은 PluginError 를 내 초록이었다. 새 경로
# (`_follow`)의 그 가드가 실제로 무는지 순환을 뺀 나머지를 하나씩 되돌려 본다. 순환 가드는 되돌리면
# 끝없이 돌아 시간 제한으로만 드러나고 `tools/mutate.py` 는 시간 초과를 오류로 세므로 넣지 않았다.
# 쓰기와 재개, 기록 규칙의 가드, 셀프 리뷰가 더한 판정 순서도 함께다. 변이마다 고른 단언이 그 까닭으로
# 빨개졌다는 표지(`expect_output`)를 단다. 빨강의 판정은 `tools/mutate.py` 의 독스트링이다.
#
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/end-user-continuation/probes/shortcuts_mutations.toml
# 네트워크를 타지 않는다. `uv sync` 가 된 체크아웃에서 돈다.

