# 대기열 160. tools/hook_line_separators.py 의 규칙 하나씩을 뺀 변이.
# 변이마다 빨개져야 할 테스트 하나로 `-k` 를 좁힌다. 엉뚱한 테스트의 빨강이 기대와 맞지 않게 하기 위해서다
# (docs/agents/issue-tracker.md 프로브와 근거 절, 대기열 144).
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/line_separators_hook_mutations.toml

[[mutation]]
name = "U+0085 를 보지 않는다"
tests = ["tests/tools/test_hook_line_separators.py", "-k", "커밋_전_검사와"]
expect = "red"

[[mutation.edit]]
file = "tools/hook_line_separators.py"
old = '''
    chr(0x0085): "NEXT LINE",
'''
new = '''
'''

[[mutation]]
name = "줄을 splitlines 로 센다"
tests = ["tests/tools/test_hook_line_separators.py", "-k", "줄은_개행으로만"]
expect = "red"

[[mutation.edit]]
file = "tools/hook_line_separators.py"
old = '''
    for lineno, line in enumerate(text.split("\n"), 1):
'''
new = '''
    for lineno, line in enumerate(text.splitlines(), 1):
'''

[[mutation]]
name = "열을 0부터 센다"
tests = ["tests/tools/test_hook_line_separators.py", "-k", "줄과_열을_알린다"]
expect = "red"

[[mutation.edit]]
file = "tools/hook_line_separators.py"
old = '''
        for column, character in enumerate(line, 1):
'''
new = '''
        for column, character in enumerate(line):
'''

[[mutation]]
name = "BOM 을 벗기지 않는다"
tests = ["tests/tools/test_hook_line_separators.py", "-k", "BOM_은_벗기고"]
expect = "red"

[[mutation.edit]]
file = "tools/hook_line_separators.py"
old = '''
        text = data.decode("utf-8-sig")
'''
new = '''
        text = data.decode("utf-8")
'''

[[mutation]]
name = "NUL 을 파일 전체에서 찾는다"
tests = ["tests/tools/test_hook_line_separators.py", "-k", "NUL_은_처음"]
expect = "red"

[[mutation.edit]]
file = "tools/hook_line_separators.py"
old = '''
    if b"\0" in data[:TEXT_PROBE]:
'''
new = '''
    if b"\0" in data:
'''

[[mutation]]
name = "UTF-8 로 읽히지 않는 파일을 바꿔 읽는다"
tests = ["tests/tools/test_hook_line_separators.py", "-k", "UTF8_이_아닌"]
expect = "red"

[[mutation.edit]]
file = "tools/hook_line_separators.py"
old = '''
    try:
        text = data.decode("utf-8-sig")
    except UnicodeDecodeError:
        return None
'''
new = '''
    text = data.decode("utf-8-sig", "replace")
'''

[[mutation]]
name = "Write·Edit 밖의 도구도 본다"
tests = ["tests/tools/test_hook_line_separators.py", "-k", "밖의_도구는"]
expect = "red"

[[mutation.edit]]
file = "tools/hook_line_separators.py"
old = '''
    if tool_name not in ("Write", "Edit"):
        return None
'''
new = '''
'''

[[mutation]]
name = "읽지 못하면 예외로 끝난다"
tests = ["tests/tools/test_hook_line_separators.py", "-k", "읽지_못하거나"]
expect = "red"

[[mutation.edit]]
file = "tools/hook_line_separators.py"
old = '''
    except OSError:
        return None
'''
new = '''
    except FileNotFoundError:
        return None
'''

[[mutation]]
name = "자리를 모두 적는다"
tests = ["tests/tools/test_hook_line_separators.py", "-k", "많으면_앞의"]
expect = "red"

[[mutation.edit]]
file = "tools/hook_line_separators.py"
old = '''
    shown = ", ".join(found[:SHOWN])
'''
new = '''
