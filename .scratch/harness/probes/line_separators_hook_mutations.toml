'''
new = '''
'''

[[mutation]]
name = "CRLF 의 CR 도 알린다"
tests = ["tests/tools/test_hook_line_separators.py", "-k", "홀로_선_CR"]
expect = "red"

[[mutation.edit]]
file = "tools/hook_line_separators.py"
old = '''
