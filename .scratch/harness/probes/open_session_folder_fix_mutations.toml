# open_session.ps1 이 화면의 폴더를 환경 버튼으로 고치는 길(harness 티켓 open-session-selects-repo-folder, 대기열 378·387.
# `Get-FolderEnvName`, `Select-FolderEnvNames`, `Select-ComposerFolder`, `Repair-ShownFolder`, `Send-Prompt` 의 연결)의 테스트가
# 무엇을 재는지 변이로 본다(여섯). 규칙 하나를 빼면 빨강이어야 한다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/open_session_folder_fix_mutations.toml
# 앞의 셋은 pwsh 서버로 순수 함수를 부르고, 나머지 셋은 스크립트 원문의 순서와 조건을 본다. 접근성 트리를 읽고 누르는
# 부분(`Select-ComposerFolder` 의 UIA 호출)은 시험이 없고, 실제 앱의 새 세션 화면에서 손으로 본 것이 있다(티켓의 "손으로 본 것").
# 표지는 시험 파일 원문에 없는 pytest 실패 요약 줄이다(`FAILED <파일>::<시험>`).

