[[mutation]]
name = "main.log 를 돌림 파일보다 먼저 준다"
tests = ["tests/tools/test_open_session.py", "-k", "읽을_로그"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''
    if ($null -ne $latest.RotatedWritten -and $latest.RotatedWritten -ge $Since) { $latest.Rotated }
    if ($latest.MainWritten -ge $Since) { $latest.Main }
'''
new = '''
    if ($latest.MainWritten -ge $Since) { $latest.Main }
    if ($null -ne $latest.RotatedWritten -and $latest.RotatedWritten -ge $Since) { $latest.Rotated }
'''

