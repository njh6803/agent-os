# open_session.ps1 의 남은 회귀 시험(대기열 17)이 무엇을 재는지 변이로 본다(스물다섯).
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/open_session_regression_mutations.toml
# 테스트는 파워셸 AST 에서 함수를 떼어 pwsh 로 부른다(tests/tools/test_open_session.py, ADR 0030). 규칙 하나를
# 빼면 빨강이어야 한다. 대소문자 변이(8번)는 윈도에서 빨강을 봤다. 대소문자를 가리는 파일 시스템(리눅스)에서는
# 그 이름의 폴더가 없어 옮기지 않으므로 초록일 것이다(코드를 읽은 어림이고 재지 않았다).

[[mutation]]
name = "전각 슬래시를 되돌리지 않는다"
tests = ["tests/tools/test_open_session.py", "-k", "전각_슬래시만 or 지시문_첫_줄로_시작할"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = "    if ($s -and [int][char]$s[0] -eq 0xFF0F) { return '/' + $s.Substring(1) }"
new = "    if ($false) { return '/' + $s.Substring(1) }"

[[mutation]]
name = "전각 슬래시를 어디서나 되돌린다"
tests = ["tests/tools/test_open_session.py", "-k", "전각_슬래시만"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = "    if ($s -and [int][char]$s[0] -eq 0xFF0F) { return '/' + $s.Substring(1) }"
new = "    if ($s) { return $s.Replace([string][char]0xFF0F, '/') }"

[[mutation]]
name = "줄 가운데의 같은 글도 화면으로 친다"
tests = ["tests/tools/test_open_session.py", "-k", "지시문_첫_줄로_시작할"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = "(Normalize-Slash $s).StartsWith($needle)"
new = "(Normalize-Slash $s).Contains($needle)"

