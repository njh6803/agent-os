# chore/push-behind-notice 의 푸시 전 뒤처짐 훅 변이. 형식은 tools/mutate.py 의 독스트링.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/push_behind_hook_mutations.toml
# tools/hook_push_behind_main.py 의 명령 판정과 뒤처짐 판정을 하나씩 깨서 그것을 지키는 테스트가 빨강이 되는지 잰다.
# 체크아웃을 고치므로 도는 동안 그 체크아웃을 읽거나 고치지 않는다.

