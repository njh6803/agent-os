# tools/mutate.py 의 종료 코드 판정과 출력의 표지(대기열 253), 빨강을 기대한 pytest 변이의 `-x`(대기열 231)에서
# 규칙 하나씩을 뺀 변이. 모두 tests/tools/test_mutate.py 를 빨갛게 해야 한다. 도구가 자기 자신을 고치므로 분리 임시
# 워크트리에서 그 워크트리의 도구로 돌린다(tools/mutate.py 의 제자리가 아닌 실행).
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/mutate_exit_markers_mutations.toml [번호 ...]

[[mutation]]
name = "exit 판정이 빨강 코드를 보지 않는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"

[[mutation.edit]]
file = "tools/mutate.py"
old = 'outcome: Outcome = "green" if exit_code == 0 else "red" if exit_code == red_exit else "error"'
new = 'outcome: Outcome = "green" if exit_code == 0 else "red"'

[[mutation]]
name = "exit 판정이 0 을 초록으로 읽지 않는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"

[[mutation.edit]]
file = "tools/mutate.py"
old = 'outcome: Outcome = "green" if exit_code == 0 else "red" if exit_code == red_exit else "error"'
new = 'outcome: Outcome = "red" if exit_code == red_exit else "error"'

[[mutation]]
name = "judge 가 exit 판정에 빨강 코드를 넘기지 않는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"

[[mutation.edit]]
file = "tools/mutate.py"
old = "            return _judge_exit(result.exit_code, text, judging.red_exit)"
new = "            return _judge_exit(result.exit_code, text, None)"

