expect = "red"
[[mutation.edit]]
file = "tools/hook_scratch_probe_rule.py"
old = '''    if Path(parts[-1] if parts else "").suffix not in SCRIPT_SUFFIXES:'''
new = '''    if not parts:'''

[[mutation]]
