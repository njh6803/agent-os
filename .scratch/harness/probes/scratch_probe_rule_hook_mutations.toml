# tools/hook_scratch_probe_rule.py(대기열 336)의 판정과 표지를 하나씩 깨는 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/scratch_probe_rule_hook_mutations.toml
# 끝의 하나는 대조군이다. 알림 문장의 끝 낱말은 어느 시험도 보지 않는다.

[[mutation]]
name = "scratchpad 토막의 자리를 claude 다음 셋째로 묶지 않는다"
tests = ["tests/tools/test_hook_scratch_probe_rule.py"]
expect = "red"
[[mutation.edit]]
file = "tools/hook_scratch_probe_rule.py"
old = '''        parts[index] == "claude" and parts[index + 3] == "scratchpad"'''
new = '''        parts[index] == "claude" and "scratchpad" in parts[index + 1 : -1]'''

[[mutation]]
name = "claude 토막을 요구하지 않는다"
tests = ["tests/tools/test_hook_scratch_probe_rule.py"]
expect = "red"
[[mutation.edit]]
file = "tools/hook_scratch_probe_rule.py"
old = '''        parts[index] == "claude" and parts[index + 3] == "scratchpad"'''
new = '''        parts[index + 3] == "scratchpad"'''

[[mutation]]
name = "대소문자를 가린다"
tests = ["tests/tools/test_hook_scratch_probe_rule.py"]
expect = "red"
[[mutation.edit]]
file = "tools/hook_scratch_probe_rule.py"
old = '''    parts = [part.casefold() for part in _SPLIT.split(path) if part]'''
new = '''    parts = [part for part in _SPLIT.split(path) if part]'''

[[mutation]]
name = "확장자를 보지 않는다"
