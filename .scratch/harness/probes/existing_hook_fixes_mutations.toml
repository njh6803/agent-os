# 대기열 246·252·284·296 의 판정을 하나씩 깨서 그 테스트가 빨개지는지 본다.
# 246 tools/hook_bash_commit_msg.py(이 훅의 저장소 밖이면 판정 스크립트를 띄우지 않는다),
# 252 tools/hook_bash_cd_outside.py(하위 폴더로 옮기는 cd 를 막는다),
# 284 tools/hook_grill_design_check.py(워크트리 경로 접두가 붙은 이름도 받는다),
# 296 tools/hook_push_delete_open_pr.py(값을 먹는 긴 옵션 표). 같은 296 의 tools/hook_journal_retro.py 몫(출력 파싱을 뗀 순번 대조)은
# 일지 이름이 시각 꼴이 되며(ADR 0045 결정 7) 순번 대조가 걷혀 변이 넷을 지웠다.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py <이 파일>

