# tools/hook_choice_facts.py(대기열 308)의 판정과 옮기기를 하나씩 깨는 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/choice_facts_hook_mutations.toml
# 끝의 하나는 대조군이다. 알림 문장의 끝 괄호는 어느 시험도 보지 않는다.

[[mutation]]
name = "도구 이름을 보지 않는다"
tests = ["tests/tools/test_hook_choice_facts.py"]
expect = "red"
[[mutation.edit]]
file = "tools/hook_choice_facts.py"
old = '''    if payload.get("tool_name") != TOOL:
        return None'''
new = '''    if payload.get("tool_name") is None:
        return None'''

