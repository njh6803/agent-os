# 대기열 232·262·272 의 판정(hook_journal_retro 의 이름 꼴 대조, hook_push_delete_open_pr, hook_user_settings_read)의 규칙 하나씩을 뺀 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/journal_number_and_guards_mutations.toml
# 훅의 main 이 이름 꼴 대조를 부르는 것은 순수 함수 테스트 밖이라 페이로드 표(tools/run_hooks.py)로 잰다. 빨강이 어긋남인지는
# 결과의 요약 줄("어긋남 N건")로 본다.

[runner.hooks]
command = ["uv", "run", "--no-sync", "python", "tools/run_hooks.py"]
judge = "pytest"

# --- hook_journal_retro 의 이름 꼴 대조(대기열 232, ADR 0045 결정 7) ---
[[mutation]]
name = "새 파일을 만든 Write 만 대 본다(결과의 type)"
tests = ["tests/tools/test_hook_journal_retro.py"]
expect = "red"
[[mutation.edit]]
file = "tools/hook_journal_retro.py"
old = '''        and response.get("type") == "create"'''
new = '''        and response.get("type") in ("create", "update")'''

[[mutation]]
name = "옮길 때 옛 파일의 이름을 바꾸라고 안내한다"
tests = ["tests/tools/test_hook_journal_retro.py"]
expect = "red"
expect_output = ["assert 'mv <옛> <새>' in"]
[[mutation.edit]]
file = "tools/hook_journal_retro.py"
old = '''        f" {RENAME_NOTE} 이 일지를 든 인용이 있으면 함께 고친다."'''
new = '''        " 이 일지를 든 인용이 있으면 함께 고친다."'''

[[mutation]]
name = "시각은 네 자리여야 한다"
tests = ["tests/tools/test_hook_journal_retro.py"]
expect = "red"
expect_output = ["assert None is not None"]
[[mutation.edit]]
file = "tools/hook_journal_retro.py"
old = '''STAMPED_NAME = re.compile(r"^\d{4}-\d{2}-\d{2}-\d{4}-.+\.md$")'''
new = '''STAMPED_NAME = re.compile(r"^\d{4}-\d{2}-\d{2}-\d+-.+\.md$")'''

[[mutation]]
name = "main 이 새 일지의 Write 에 이름 꼴 대조를 붙인다"
runner = "hooks"
expect = "red"
expect_output = ["어긋남 1건"]
[[mutation.edit]]
file = "tools/hook_journal_retro.py"
old = '''        contexts.append(name_context(file_path))'''
new = '''        contexts.append(None)'''

