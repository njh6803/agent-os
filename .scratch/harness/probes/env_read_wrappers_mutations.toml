[[mutation]]
name = "대조군: 값을 따로 받는 래퍼 옵션의 시험을 빼면 값을 벗기지 않아도 초록이다"
tests = ["tests/tools/test_hook_env_read.py"]
expect = "green"
[[mutation.edit]]
file = "tools/hook_env_read.py"
old = '''            index += _option_width(option, value_options)'''
new = '''            index += 1'''
[[mutation.edit]]
file = "tests/tools/test_hook_env_read.py"
old = '''        "nice --adjustment 5 cat .env",
        "timeout 5 column .env",
        "timeout -s KILL 5 rev .env",
        "env -i cat .env",
        "env -u HOME cat .env",
        "sudo -u root cat .env",
        "sudo -iu root cat .env",
        "sudo -uroot cat .env",
        "sudo --user root cat .env",
        "/usr/bin/env cat .env",
        "/usr/bin/time -v cat .env",
        "env -a x cat .env",
        "env --argv0 x cat .env",
        "exec -a x cat .env",
'''
new = '''        "timeout 5 column .env",
        "env -i cat .env",
        "sudo -uroot cat .env",
        "/usr/bin/env cat .env",
        "/usr/bin/time -v cat .env",
'''
