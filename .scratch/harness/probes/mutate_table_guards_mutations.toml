# tools/mutate.py 의 표 검증·힌트·시작 줄 알림·도는 표지(대기열 313·317·359·358)와 편집 훅
# tools/hook_edit_during_mutate.py 의 판정을 하나씩 빼는 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/mutate_table_guards_mutations.toml
# 이 도구 자신을 고치는 변이라 커밋한 뒤 다른 워크트리에서 그 워크트리의 도구로 돌린다(독스트링의 제자리가
# 아닌 실행). 표지는 그 변이를 잡는 시험의 이름이나 매개변수 id 이고, 판정 낱말뿐인 표지는 이 표가 더한
# 규칙이 거부한다.

