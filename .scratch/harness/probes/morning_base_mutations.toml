# chore/dev-base-tools 의 보고 도구 변이(ADR 0043). 형식은 tools/mutate.py 의 독스트링.
# 사용: uv run python tools/mutate.py .scratch/harness/probes/morning_base_mutations.toml
# PR 봇 첫 회차의 Minor 둘을 지키는 시험이 빨강이 되는지 잰다. 하나는 상대 경로 root 로 대기열을
# 읽을 때 통합 ref 를 작업 폴더를 옮기기 전에 정하는 것(tools/morning_sources.py), 다른 하나는
# 티켓 PR 의 브랜치에 hotfix/ 를 harness 티켓으로 읽는 것(tools/morning_collect.py)이다.
# 체크아웃을 고치므로 도는 동안 그 체크아웃을 읽거나 고치지 않는다.

[[mutation]]
name = "대기열의 통합 ref 를 작업 폴더를 옮긴 뒤에 정한다"
tests = ["tests/tools/test_morning_sources_base.py", "-k", "상대_경로의_root"]
expect = "red"
expect_output = ["{'dev-only.md': 'dev 에만 있다"]
[[mutation.edit]]
file = "tools/morning_sources.py"
old = '''    ref = integration_ref(root)
    try:
        with contextlib.chdir(root):
            return queue_open_rows.read_ref_folder(ref)'''
new = '''    try:
        with contextlib.chdir(root):
            return queue_open_rows.read_ref_folder(integration_ref(root))'''

[[mutation]]
name = "티켓 PR 의 브랜치에서 hotfix 를 harness 티켓으로 읽지 않는다"
tests = ["tests/tools/test_morning_collect.py", "-k", "chore_와_hotfix"]
expect = "red"
expect_output = ["[hotfix/x-x]"]
[[mutation.edit]]
file = "tools/morning_collect.py"
old = '''|(?:chore|hotfix)/(?P<harness>[\w.-]+))$"'''
new = '''|chore/(?P<harness>[\w.-]+))$"'''
