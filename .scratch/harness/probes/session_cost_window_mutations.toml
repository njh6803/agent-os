'''

# --- cost-state ---

[[mutation]]
name = "창이 없어도 기록 없는 세션의 cost-state를 버림"
tests = ["tests/tools/test_session_cost_window.py"]
expect = "red"
[[mutation.edit]]
file = "tools/session_cost_window.py"
old = '''    if since is None:
        return set(sessions)
'''
new = ""

[[mutation]]
name = "기록이 모두 창 안이어야 남김"
tests = ["tests/tools/test_session_cost_window.py"]
expect = "red"
[[mutation.edit]]
file = "tools/session_cost_window.py"
old = '''    return {sid for sid in sessions if any(in_window(ts, since) for ts in stamps.get(sid, ()))}
'''
new = '''    return {sid for sid in sessions if all(in_window(ts, since) for ts in stamps.get(sid, ()))}
'''
