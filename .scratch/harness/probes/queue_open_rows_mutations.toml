# chore/queue-open-rows-tool 의 열린 대기열 행 세기 변이(대기열 167). 형식은 tools/mutate.py 의 독스트링.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/queue_open_rows_mutations.toml
# tools/queue_open_rows.py 의 판정(닫힘, 회차, 대상과 인용, 칸 수, 결정표 조건, 종료 코드)을 하나씩 꺼서
# 그것을 지키는 테스트가 빨강이 되는지 잰다. 체크아웃을 고치므로 도는 동안 그 체크아웃을 읽거나 고치지 않는다.

