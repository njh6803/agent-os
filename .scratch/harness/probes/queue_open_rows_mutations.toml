# retro-queue-per-item 02(항목마다 파일 하나인 대기열 폴더)가 다시 썼다. 형식은 tools/mutate.py 의 독스트링.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/queue_open_rows_mutations.toml
# tools/queue_open_rows.py 의 판정(상태, 라벨 줄, 폴더 읽기, 회차, 대상과 인용, 사람 몫, 만료, 식별자,
# 찾기, --ref 폴더 읽기)을 하나씩 꺼서 그것을 지키는 테스트가 빨강이 되는지 잰다. 시험은
# tests/tools/test_queue_open_rows.py 이고, 이름 규칙과 라벨 줄을 저장소에서 보는
# tests/test_retro_queue_names.py 를 겨눈 둘이 있다. 체크아웃을 고치므로 도는 동안 그 체크아웃을
# 읽거나 고치지 않는다.
#
# 이 표의 옛 판(항목이 표의 행이던 때)은 줄이 사라진 변이를 새 도구의 같은 판정으로 옮겼다. 칸 수·이스케이프한
# 파이프·머리의 취소선을 걷는 변이는 판정이 없어져 뺐고, 폴더 읽기(README.md 제외, 하위 폴더와 .md 가
# 아닌 파일), 식별자 정렬, item_name 의 네 자리 채우기, 찾기의 경로 출력, --ref 의 폴더 읽기 변이를
# 더했다. `read_ref_folder` 의 `is_item_name` 거르기는 `read_items` 가 같은 거르기를 다시 하므로 끄면
# 결과가 같아(같은 값 변이) 표에 넣지 않았다. 표지는 고른 단언이 실패할 때만 나오는 문구다(.claude/rules/probes.md 첫 항목).

