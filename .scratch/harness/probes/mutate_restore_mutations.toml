# tools/mutate.py 의 되돌림 가드(대기열 77)에서 규칙 하나씩을 뺀다.
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/mutate_restore_mutations.toml

[[mutation]]
name = "가드를 뺀다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"

[[mutation.edit]]
file = "tools/mutate.py"
old = '''    if written is not None and _retrying(path.read_bytes, blocked) != written:'''
new = '''    if False:'''

[[mutation]]
name = "다른 쓰기를 알리고도 덮는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"

[[mutation.edit]]
file = "tools/mutate.py"
old = '''
    if written is not None and _retrying(path.read_bytes, blocked) != written:
        raise _WrittenMeanwhile
    _retrying(lambda: path.write_bytes(original), blocked)
    _drop_bytecode(path)'''
new = '''
    current = _retrying(path.read_bytes, blocked)
    _retrying(lambda: path.write_bytes(original), blocked)
    _drop_bytecode(path)
    if written is not None and current != written:
        raise _WrittenMeanwhile'''

[[mutation]]
name = "다른 쓰기를 알리지 않고 건너뛴다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"

[[mutation.edit]]
file = "tools/mutate.py"
old = '''            stuck.append(f"{relative} (변이가 든 동안 다른 쓰기가 들어와 덮지 않았다)")'''
new = '''            pass'''

[[mutation]]
name = "되돌릴 파일로 적은 편집 파일도 본다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"

[[mutation.edit]]
file = "tools/mutate.py"
old = '''
            if path not in rewritable:
                written[path] = mutated'''
new = '''
            written[path] = mutated'''

[[mutation]]
name = "쓰기 전에 쓴 것으로 적는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"

[[mutation.edit]]
file = "tools/mutate.py"
old = '''
            path.write_bytes(mutated)
            _drop_bytecode(path)
            if path not in rewritable:
                written[path] = mutated'''
new = '''
            if path not in rewritable:
                written[path] = mutated
            path.write_bytes(mutated)
            _drop_bytecode(path)'''

[[mutation]]
name = "쓰기에 성공한 파일만 쥔다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"

[[mutation.edit]]
file = "tools/mutate.py"
old = '''
    held = {path: original for path, (original, _) in files.items()}'''
new = '''
    held: dict[Path, bytes] = {}'''

[[mutation.edit]]
file = "tools/mutate.py"
old = '''
            _drop_bytecode(path)
            if path not in rewritable:'''
new = '''
            _drop_bytecode(path)
            held.setdefault(path, files[path][0])
            if path not in rewritable:'''

# 위 변이를, 쓰다 만 앞부분을 남기지 않는 리뷰 전의 테스트로 잰다. 그 테스트로는 지나간다. 같은 PR #115 의
# 리뷰 반영이 더한 `test_못_보는_것_앞_파일의_변이_쓰기가_실패하면_…` 도 처음부터 쥐지 않는 것을 잡아, 파일
# 전체로 재면 빨갛다(2026-10-12, 일지 2026-10-12-29). 그래서 그 테스트 하나만 고른다.
[[mutation]]
name = "쓰기에 성공한 파일만 쥔다(앞부분 없는 테스트)"
tests = ["tests/tools/test_mutate.py", "-k", "변이를_쓰지_못한_파일은"]
expect = "green"

[[mutation.edit]]
file = "tools/mutate.py"
old = '''
    held = {path: original for path, (original, _) in files.items()}'''
new = '''
    held: dict[Path, bytes] = {}'''

[[mutation.edit]]
file = "tools/mutate.py"
old = '''
            _drop_bytecode(path)
            if path not in rewritable:'''
new = '''
            _drop_bytecode(path)
            held.setdefault(path, files[path][0])
            if path not in rewritable:'''

