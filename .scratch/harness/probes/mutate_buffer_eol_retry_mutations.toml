# tools/mutate.py 의 줄 버퍼(대기열 259), 원문이 0번일 때 줄 끝의 까닭(대기열 264), 되돌리기의 재시도와 그 흔적
# (대기열 267), 판정 인자 묶기(PR #240 claude-review 의 보류)에서 규칙 하나씩을 뺀 변이. 모두 tests/tools/test_mutate.py
# 를 빨갛게 해야 하고, 빨간 시험의 이름을 표지로 본다. 내장 pytest 러너는 빨강을 기대한 변이에 `-x` 를 붙여 첫 실패
# 하나만 보이므로, 표지는 그 변이가 빨갛게 할 시험 가운데 파일 순서로 첫 것이다. 도구가 자기 자신을 고치므로 분리 임시
# 워크트리에서 그 워크트리의 도구로 돌린다(tools/mutate.py 의 제자리가 아닌 실행).
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/mutate_buffer_eol_retry_mutations.toml [번호 ...]

