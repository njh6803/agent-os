# tools/check_adr_pointers.py(대기열 97)의 판정 규칙과 배선을 하나씩 빼는 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/adr_pointer_check_mutations.toml
# 앞의 넷은 PR #124의 프로브가 실제로 겪은 자리다(번호 뒤 공백, 이력 절 밖의 ### 줄, 첫 판이 세지 않은
# `(바뀜: ADR NNNN)` 모양, 한 줄의 포인터 여럿). 이력 절의 경계 둘(제목이 정확히 `## 이력`, 다음 `##`에서 끝남)은
# 처음에 변이 하나("개정 이력 절은 이력이 아니다")로 쟀다가 초록으로 남았다. 절 단위로 추적하면 0006의
# Consequences는 어느 쪽이든 다시 본문이라, 개정 이력 절 안의 포인터와 이력 절 뒤의 절로 따로 잰다.
# 펜스·코드 스팬·번호 겹침·빈 디렉터리는 옮기는 판의 셀프 리뷰가 찾았다.

