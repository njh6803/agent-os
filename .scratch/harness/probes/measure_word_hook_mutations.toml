# tools/hook_measure_word.py(대기열 227)의 판정을 하나씩 깨는 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/measure_word_hook_mutations.toml
# 끝의 하나는 대조군이다. 알림 문장의 끝 낱말은 어느 시험도 보지 않는다.

[[mutation]]
name = "docs/adr 토막을 잇달아 요구하지 않는다"
tests = ["tests/tools/test_hook_measure_word.py"]
expect = "red"
[[mutation.edit]]
file = "tools/hook_measure_word.py"
old = '''    if any(folders[index : index + 2] == ["docs", "adr"] for index in range(len(folders) - 1)):'''
new = '''    if "adr" in folders:'''

[[mutation]]
name = "retro-queue.md 의 부모를 보지 않는다"
tests = ["tests/tools/test_hook_measure_word.py"]
expect = "red"
[[mutation.edit]]
file = "tools/hook_measure_word.py"
old = '''    if folders[-1] == ".scratch" and name == "retro-queue.md":'''
new = '''    if name == "retro-queue.md":'''

[[mutation]]
name = "프로브 README 에서 .scratch 조상을 요구하지 않는다"
tests = ["tests/tools/test_hook_measure_word.py"]
expect = "red"
[[mutation.edit]]
file = "tools/hook_measure_word.py"
old = '''    return name == "readme.md" and folders[-1] == "probes" and ".scratch" in folders[:-1]'''
new = '''    return name == "readme.md" and folders[-1] == "probes"'''

