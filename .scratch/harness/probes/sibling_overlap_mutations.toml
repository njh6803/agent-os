# tools/sibling_overlap.py(대기열 115·157·175·182·194·199·220·224·235·249·251·254·279·376)를 하나씩 깨는 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/sibling_overlap_mutations.toml
# 걸리는 시간: mutate.py 출력의 pytest 시간을 손으로 더하면 기준선과 변이 마흔둘이 1710초(번마다
# 33~55초)와 2046초(35~87초)였다(2026-10-12, 일지 2026-10-12-16). 예순둘로 늘린 뒤에는 3757초(번마다
# 41~112초. 같은 PC에서 다른 세션 둘이 돌았다)였다(2026-10-13, 일지 2026-10-13-30). 그 뒤 더한 둘은
# `--since` 로 골라 돌렸다. 대기열 235·249·251 로 더한 스물여덟은 그 셋의 시험만 `-k` 로 고르고, 코드가
# 옮겨 가 원문을 고친 넷과 함께 `--since origin/main` 으로 돌렸다. 기준선 둘이 77초, 변이 서른둘이
# 630초(고른 시험 9~22초, 전체 시험 60~76초)였다(2026-10-13, 일지 2026-10-15-15). 셀프 리뷰와 반박
# 검증으로 열을 더한 뒤 같은 `--since origin/main` 이 고른 마흔둘은 기준선 셋이 194초, 변이가 1017초(고른
# 시험 12~29초, 전체 시험 73~102초)였다(2026-10-14). 그 가운데 82는 원문을 옮길 때 `new` 의 들여쓰기를
# 두고 와 IndentationError 로 어긋났고, 고쳐 다시 돌린 값을 더했다. 그 뒤 인용 블록을 두는 갈래로
# 더한 둘(103·104)과 원문이 옮겨 간 79는 번호로 골라 돌렸다(2026-10-14). 합치기를 커밋하기 전의
# 대조를 고치며 더한 셋(105~107)과, 이 브랜치 쪽 계산에서 빠져 형제 쪽에만 걸리게 된 12도 번호로
# 골라 돌렸다(기준선 둘 66초, 변이 157초, 2026-10-14). PR 직전 버그 축을 반영하며 더한 일곱(108~114),
# 원문이 옮겨 간 73·74, 둘레 코드가 바뀐 75~88·93~104를 `--since HEAD` 와 번호로 골라 돌렸다(기준선
# 다섯 41초, 변이 서른다섯 411초, 2026-10-15). 그 가운데 95는 되쓰기 전의 읽기 확인이 빈 옛 자리를
# 걸러 초록이었고, 옛 자리에 다른 것이 든 시험을 더해 다시 돌려 빨강이었다. 합치기 중의 헌법 판을
# 고치며 더한 둘(115·116)은 번호로 골라 돌렸다(기준선 둘 76초, 변이 83초, 2026-10-15). 대기열 254·279 로
# 더한 스물하나(117~137), 원문이 옮겨 간 여섯(14·23·24·31·64·69), 둘레 코드가 바뀐 115·116 을
# `--since origin/main` 과 번호로 골라 돌렸다(기준선 아홉 143초, 변이 스물아홉 178초, 2026-10-16, 일지
# 2026-10-16-02). 그 가운데 129는 시험 입력에서 짧은 펜스 줄 뒤의 줄이 펜스를 다시 열어 초록이었고, 그
# 사이에 인용 줄을 두고 그 시험을 쓰는 125~130 을 다시 돌려 빨강이었다(기준선 하나 0.4초, 변이 3초).
# 셀프 리뷰를 반영하며 더한 넷(138~141)까지 같은 고르기로 다시 돌렸다(기준선 열하나 123초, 변이 서른셋
# 200초). 137은 비워 둔 문장의 문단을 빼게 된 뒤 그 변이를 잡던 입력이 결과를 바꾸지 못해 초록이었고,
# 그 판의 문단이 main 에 이미 있는 입력을 더해 그 시험을 쓰는 135~137·140 을 다시 돌려 빨강이었다. PR
# 직전 버그 축을 반영하며 더한 142와 원문이 옮겨 간 125까지 같은 고르기로 다시 돌려 서른넷 모두
# 기대대로였다(기준선 열둘 122초, 변이 163초, 2026-10-16). ticket-for-every-pr 티켓 01 로 더한 harness
# 티켓 스물여덟(151~178)과 코드가 옮겨 가 원문을 고친 여섯(27~29·73·74·88)은 `--since origin/main` 으로
# 돌렸다. 첫 회차는 27~29 의 기준선인 전체 시험이 600초 제한을 넘겨 변이를 넣지 못했다(같은 PC에서
# 나란히 연 세션들이 돌던 때다). 그 셋의 시험을 `-k` 로 좁혀 다시 돌려 기준선 열일곱 406초, 변이 서른넷
# 134초였다. 그 가운데 152는 고른 시험 둘 가운데 앞의 것이 먼저 빨개져(첫 실패에서 멈춘다) 표지인 뒤의
# 것이 돌지 않아 어긋났고, `-k` 를 표지의 시험 하나로 좁혀 다시 돌려 표지까지 빨강이었다(기준선 4초,
# 변이 5초). 서른넷 모두 기대대로다(2026-10-21, 일지 2026-10-22-05). 셀프 리뷰를 반영하며 원문을 고친
# 열하나(45·51·158·162·164·166·173·174·176~178)와 더한 열둘(179~190)을 두고, 151~190 의 표지를 시험
# 함수 이름에서 고른 단언이 실패할 때만 나오는 문구로 바꿨다(154·187 은 그 시험의 첫 단언이 stderr 도
# 싣게 고쳤다. 2로 끝난 까닭이 stderr 에만 있다). 같은 `--since origin/main` 이 고른 마흔여덟은 기준선
# 서른이 676초, 변이가 195초(0.6~19.8초)였고 모두 기대대로다(2026-10-22, 일지 2026-10-22-05). PR 직전
# 버그 축을 반영하며 원문을 고친 다섯(162·164·179·183·184. 179 는 원격에 브랜치가 있는 형제의 시험으로
# 옮겼고, 183 은 이름을 바꾼 시험을 고르게 고쳤다)과 더한 넷(191~194)을 번호로 골라 돌린 아홉은 기준선
# 다섯이 15초, 변이가 26초(0.6~5.4초)였고 모두 기대대로다(같은 날, 같은 일지). 시험을 고쳤으므로 그
# 커밋(20813a8e) 뒤에 표 전체를 돌려 변이 194 가 모두 기대대로였다. 기준선 쉰넷이 522초, 변이가
# 2460초(0.4~150.4초), 벽시계로 약 61분이었다(같은 날, 같은 일지). PR 봇 회차에서 티켓 이름 시험의
# 범위 단언을 번호 꼴로 세게 고치고(CodeRabbit) `Verdict` 를 키워드 인자로 짓게 바꾼 뒤(claude-review),
# 원문을 고친 165, 표지를 고친 190, 더한 195 와, 고친 시험 파일을 쓰는 나머지 189 를 번호로 골라
# 돌린 넷이 모두 기대대로다(같은 날, 같은 일지). 이 표에서 그 시험 파일을 쓰는 변이는 그 셋뿐이라
# 시험을 고친 몫의 전체 실행을 갈음한다.

