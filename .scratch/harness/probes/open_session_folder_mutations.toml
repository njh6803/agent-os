# open_session.ps1 의 새 세션 화면 폴더 확인(대기열 378. `Select-ShownFolders`, `Get-FolderMismatch`)의 테스트가 무엇을 재는지
# 변이로 본다(여덟). 규칙 하나를 빼면 빨강이어야 한다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/open_session_folder_mutations.toml
# 테스트는 파워셸 AST 에서 함수를 떼어 pwsh 로 부른다(tests/tools/test_open_session.py). 접근성 트리를 읽는 `Read-ShownFolders`
# 와 `Send-Prompt` 의 멈춤은 시험이 없다. 실제 앱의 새 세션 화면에서 손으로 본 것은 커밋하지 않은 스크래치 스크립트로 부른
# `Read-ShownFolders` 와 `Get-FolderMismatch` 이고, `Send-Prompt` 의 멈춤(`throw`)은 돌리지 않았다(일지 2026-10-20-34).

[[mutation]]
name = "378: 지시문의 줄도 폴더로 센다"
tests = ["tests/tools/test_open_session.py", "-k", "드라이브_경로만"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = ''' -and $lines -cnotcontains $_ }'''
new = ''' }'''

[[mutation]]
name = "378: 줄바꿈을 품은 글도 폴더로 센다"
tests = ["tests/tools/test_open_session.py", "-k", "드라이브_경로만"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''$_ -notmatch '[\r\n]' -and '''
new = ''''''

[[mutation]]
name = "378: 드라이브 뒤의 구분자를 보지 않는다"
tests = ["tests/tools/test_open_session.py", "-k", "드라이브_경로만"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''$_ -cmatch '^[A-Za-z]:\\' -and'''
new = '''$_ -cmatch '^[A-Za-z]:' -and'''

[[mutation]]
name = "378: 같은 글을 여러 번 든다"
tests = ["tests/tools/test_open_session.py", "-k", "드라이브_경로만"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''$lines -cnotcontains $_ } | Select-Object -Unique)'''
new = '''$lines -cnotcontains $_ })'''

[[mutation]]
name = "378: 보이는 폴더 가운데 하나만 맞아도 보낸다"
tests = ["tests/tools/test_open_session.py", "-k", "Folder_가_아니면"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''    if (@($paths | Where-Object { (& $norm $_) -ne $want }).Count -eq 0) { return $null }'''
new = '''    if (@($paths | Where-Object { (& $norm $_) -eq $want }).Count -gt 0) { return $null }'''

[[mutation]]
name = "378: 끝의 구분자와 슬래시를 고르지 않는다"
tests = ["tests/tools/test_open_session.py", "-k", "Folder_와_같으면"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''    $norm = { param($p) $p.Replace('/', '\').TrimEnd('\') }'''
new = '''    $norm = { param($p) $p }'''

[[mutation]]
name = "378: 대소문자를 가린다"
tests = ["tests/tools/test_open_session.py", "-k", "Folder_와_같으면"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''(& $norm $_) -ne $want }'''
new = '''(& $norm $_) -cne $want }'''

[[mutation]]
name = "378: 보이는 폴더가 없으면 확인 없이 보낸다"
tests = ["tests/tools/test_open_session.py", "-k", "Folder_가_아니면"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''    if ($paths.Count -eq 0) { return "새 세션 화면의 입력창 묶음에서 폴더 경로를 찾지 못했다. $tail" }'''
new = '''    if ($paths.Count -eq 0) { return $null }'''
