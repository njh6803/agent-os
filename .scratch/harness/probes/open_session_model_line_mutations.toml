# open_session.ps1 의 모델 줄 읽기(`Read-ModelLine`, `Get-EffortSteps`)의 테스트가 무엇을 재는지 변이로 본다(여덟).
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/open_session_model_line_mutations.toml
# 테스트는 파워셸 AST 에서 함수를 떼어 pwsh 로 부른다(tests/tools/test_open_session.py). 규칙 하나를 빼면 빨강이어야 한다.

[[mutation]]
name = "줄 머리가 아닌 곳의 모델: 도 줄로 본다"
tests = ["tests/tools/test_open_session.py"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = "    $lines = @($prompt -split \"`r?`n\" | Where-Object { $_.StartsWith('모델:') })"
new = "    $lines = @($prompt -split \"`r?`n\" | Where-Object { $_.Contains('모델:') })"

[[mutation]]
name = "줄이 둘이어도 첫 줄을 쓴다"
tests = ["tests/tools/test_open_session.py"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '    if ($lines.Count -gt 1) { throw "모델: 줄이 $($lines.Count)개다. 지시문 하나에 하나만 둔다." }'
new = '    if ($false) { throw "모델: 줄이 $($lines.Count)개다. 지시문 하나에 하나만 둔다." }'

[[mutation]]
name = "레벨의 대소문자를 가리지 않는다"
tests = ["tests/tools/test_open_session.py"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = "    if ($steps -cnotcontains $effort) {"
new = "    if ($steps -notcontains $effort) {"

[[mutation]]
name = "모델 이름이 비어도 읽는다"
tests = ["tests/tools/test_open_session.py"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = "    if (-not $model) { throw"
new = "    if ($false) { throw"

[[mutation]]
name = "레벨 뒤에 이유가 붙으면 읽지 못한다"
tests = ["tests/tools/test_open_session.py"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = "(?<effort>[A-Za-z]+)(?![A-Za-z])'"
new = "(?<effort>[A-Za-z]+)$'"

[[mutation]]
name = "노력 칸을 하나 밀어 준다"
tests = ["tests/tools/test_open_session.py"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = "Step = [array]::IndexOf($steps, $effort) }"
new = "Step = [array]::IndexOf($steps, $effort) + 1 }"

[[mutation]]
name = "여섯째 칸 Ultracode 를 레벨로 받는다"
tests = ["tests/tools/test_open_session.py"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = "function Get-EffortSteps { return @('low', 'medium', 'high', 'xhigh', 'max') }"
new = "function Get-EffortSteps { return @('low', 'medium', 'high', 'xhigh', 'max', 'ultracode') }"

[[mutation]]
name = "결정표 칸의 백틱을 벗기지 않는다"
tests = ["tests/tools/test_open_session.py"]
expect = "red"
[[mutation.edit]]
file = "tools/open_session.ps1"
old = "    $line = $lines[0].Replace('`', '')"
new = "    $line = $lines[0]"
