# chore/parallel-open-session 의 워크트리 가드와 keepalive 시간 예산 변이. 형식은 tools/mutate.py 의 독스트링.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/worktree_guards_mutations.toml
# 2026-10-05 워크트리 감사 반영에서 더한 가드를 하나씩 꺼서 그것을 지키는 테스트가 빨강이 되는지, 그리고
# keepalive 테스트가 기동 지연을 견디고 침묵이 없으면 빨강인지 잰다.
# conftest 가드의 테스트는 구현 뒤에 썼고, 나머지는 빨강을 본 뒤 구현했지만 같은 표에 둔다
# (일지 2026-10-05-05). 끝의 둘은 keepalive 테스트의 시간 예산이다. 기동 지연을 넣어도 초록이고
# 침묵을 없애면 빨강이다. 고치기 전의 테스트는 같은 지연에 세 번 모두 빨강이었다(손으로 봤다).

