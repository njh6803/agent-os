# tools/hook_midturn_korean.py(대기열 94)의 판정과 배선, tools/run_hooks.py 의 중간 문장 픽스처,
# tools/hook_bash_gate_pipe.py 의 게이트 목록에 든 훅 러너(대기열 95)를 하나씩 빼는 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/midturn_korean_mutations.toml
# 옮겨 온 산문 규칙은 Stop 훅과의 대조 테스트가 잡는다. 규칙 둘(인용 줄, 한글 자모)과 문턱 하나로 그
# 배선을 잰다. 기다림 변이는 둘이다. 루프를 돌지 않는 것은 "끝내 없으면" 테스트의 경과 시간 단언이 시점과
# 무관하게 잡는다. 루프 안의 다시 읽기만 뺀 것은 "기다리는 사이에 쓰인" 테스트 하나가 잡고, 그 테스트는
# 자식 훅이 기록이 붙기 전(상한의 4분의 1 안)에 처음 읽는다는 전제에 선다 — 더 느리게 뜨는 환경에서는
# 처음 읽을 때 이미 있어 초록이 될 수 있다.

