# tools/mutate.py --check 가 변이 표 여럿을 받아 pre-commit 에서 도는 배선(대기열 92)을 하나씩 빼는 변이.
# 도구가 자기 자신을 고친다(돌고 있는 프로세스는 이미 읽은 원본으로 돈다).
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/mutation_check_mutations.toml
# 마지막 변이(UTF-8 로 다시 열지 않음)는 파이프의 기본 인코딩이 UTF-8 이 아닌 곳(이 윈도우의 cp949)에서만
# 빨갛다. 로캘이 UTF-8 인 곳에서는 초록일 수 있다(그런 곳에서 재지는 않았다).

[[mutation]]
name = "읽지 못한 표에서 멈춘다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"
[[mutation.edit]]
file = "tools/mutate.py"
old = '''            lines.append(f"!! 변이 파일 오류: {error}")
            code = 2
'''
new = '''            out(f"!! 변이 파일 오류: {error}")
            return 2
'''

[[mutation]]
name = "줄에 표의 경로를 붙이지 않는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"
[[mutation.edit]]
file = "tools/mutate.py"
old = '''            out(f"{path}: {line}")'''
new = '''            out(line)'''

[[mutation]]
name = "마지막 표의 판정만 돌려준다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"
[[mutation.edit]]
file = "tools/mutate.py"
old = '''            code = max(code, check(read_spec(Path(path)), root=root, out=lines.append))'''
new = '''            code = check(read_spec(Path(path)), root=root, out=lines.append)'''

[[mutation]]
name = "표 여럿을 --check 없이도 받는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"
[[mutation.edit]]
file = "tools/mutate.py"
old = '''    if more_tables and (not checking or len(more_tables) != len(names)):'''
new = '''    if more_tables and len(more_tables) != len(names):'''

[[mutation]]
name = "표 여럿에 이름을 섞어도 받는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"
[[mutation.edit]]
file = "tools/mutate.py"
old = '''    if more_tables and (not checking or len(more_tables) != len(names)):'''
new = '''    if more_tables and not checking:'''

[[mutation]]
name = "표 하나의 원문 확인은 옛 길로 경로 없이 알린다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"
[[mutation.edit]]
file = "tools/mutate.py"
old = '''    if checking and len(more_tables) == len(names):'''
new = '''    if checking and more_tables and len(more_tables) == len(names):'''

[[mutation]]
name = "출력을 UTF-8 로 다시 열지 않는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"
[[mutation.edit]]
file = "tools/mutate.py"
old = '''        stream.reconfigure(encoding="utf-8")'''
new = '''        pass'''
