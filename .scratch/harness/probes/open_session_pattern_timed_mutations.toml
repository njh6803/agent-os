# open_session.ps1 의 `Invoke-PatternTimed` 를 재는 시험(tests/tools/test_open_session.py 의
# `test_패턴_호출은_제한_시간에_돌아오고_멈춘_호출을_센다`)이 무엇을 잡는지 변이로 본다(다섯). 대기열 306 에서
# 지연 0 사례의 제한을 30초로 넓히고 멈춘 사례를 20초 잡고 6초 상한으로 바꾼 뒤의 판이다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/open_session_pattern_timed_mutations.toml
# 표지는 pytest 의 `E` 줄에서만 나오는 값이다. 시험 코드 조각에는 상한이 이름(`within_ms`)으로만 보이고,
# 사례 id(`[20000-1-expand-hung-1-6000]`)에는 `<` 가 없다. 끝난 호출을 세는 변이는 `assert 1 == 0` 이
# 아니라 `where 1 = int('1')` 을 본다. 앞의 것은 pwsh 가 오류로 끝나 종료 코드 단언이 빨개져도 나온다
# (셀프 리뷰가 짚었다, 일지 2026-10-19-18). 표지를 맞바꾼 임시 표로 각 변이의 `E` 줄과, 종료 코드
# 단언이 빨개지는 변이의 출력에 그 표지가 없는 것을 손으로 봤다(같은 일지).

[[mutation]]
name = "멈춘 호출의 스레드 잡을 지운다"
tests = ["tests/tools/test_open_session.py", "-k", "패턴_호출은"]
expect = "red"
expect_output = ["< 6000"]
timeout = 180
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''
        $script:HungCalls++
        return "$action-hung"
'''
new = '''
        $script:HungCalls++
        Remove-Job $job -Force
        return "$action-hung"
'''

[[mutation]]
name = "제한 시간 없이 기다린다"
tests = ["tests/tools/test_open_session.py", "-k", "패턴_호출은"]
expect = "red"
expect_output = ["assert 'ok' == 'expand-hung'"]
timeout = 180
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''Wait-Job $job -Timeout $timeoutSec'''
new = '''Wait-Job $job'''

[[mutation]]
name = "받은 제한을 버리고 기본 8초로 기다린다"
tests = ["tests/tools/test_open_session.py", "-k", "패턴_호출은"]
expect = "red"
expect_output = ["< 6000"]
timeout = 180
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''Wait-Job $job -Timeout $timeoutSec'''
new = '''Wait-Job $job -Timeout 8'''

[[mutation]]
name = "멈춘 호출을 세지 않는다"
tests = ["tests/tools/test_open_session.py", "-k", "패턴_호출은"]
expect = "red"
expect_output = ["assert 0 == 1"]
timeout = 180
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''
        $script:HungCalls++
        return "$action-hung"
'''
new = '''
        return "$action-hung"
'''

[[mutation]]
name = "끝난 호출도 멈춘 호출로 센다"
tests = ["tests/tools/test_open_session.py", "-k", "패턴_호출은"]
expect = "red"
expect_output = ["where 1 = int('1')"]
timeout = 180
[[mutation.edit]]
file = "tools/open_session.ps1"
old = '''
        $out = Receive-Job $job -ErrorAction SilentlyContinue -ErrorVariable failed
'''
new = '''
        $script:HungCalls++
        $out = Receive-Job $job -ErrorAction SilentlyContinue -ErrorVariable failed
'''
