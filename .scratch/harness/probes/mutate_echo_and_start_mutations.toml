# tools/mutate.py 의 표지 메아리 확인(대기열 417)과 실행 표지의 시작 시각(대기열 449), 편집 훅
# tools/hook_edit_during_mutate.py 의 시작 시각 판정을 하나씩 빼는 변이(harness 티켓 011).
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/mutate_echo_and_start_mutations.toml
# 이 도구 자신을 고치는 변이라 커밋한 뒤 다른 워크트리에서 그 워크트리의 도구로 돌린다(독스트링의 제자리가
# 아닌 실행). 표지는 이 표가 더한 규칙대로 시험 원문에 없는 받은 값(도구의 출력 줄, 단언의 왼쪽 값)이다.
# 시작 시각을 읽는 리눅스 갈래(`/proc/<pid>/stat`)는 이 PC(윈도)에서 돌지 않아 변이를 두지 않는다. CI 의
# 리눅스가 `test_이_프로세스의_시작_시각은_읽힌다` 로 그 갈래를 돈다.

[[mutation]]
name = "고른 원문 확인이 메아리를 보지 않는다"
tests = ["tests/tools/test_mutate.py::test_고른_원문_확인은_시험_원문에_글자_그대로_있는_표지를_알린다"]
expect = "red"
expect_output = ["원문 확인: 변이 1 모두 원문이 한 번씩 있다"]
[[mutation.edit]]
file = "tools/mutate.py"
old = '''        return check_picked(selected, root=root, out=out)'''
new = '''        return check(selected, root=root, out=out)'''

