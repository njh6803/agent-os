# 대기열 72·293·300 의 판정을 하나씩 깨서 그 테스트가 빨개지는지 본다.
# 300 tools/hook_push_behind_main.py 와 tools/hook_push_delete_open_pr.py(도움말 `-h`·`--help` 는 푸시하지 않는다),
# 72 tools/hook_prompt_directive.py(손으로 붙여 넣은 지시문을 알아본다),
# 293 tools/hook_edit_during_commit.py(고친 파일의 체크아웃에서 도는 `git commit` 을 찾는다).
# 윈도의 PEB 자리를 깨는 변이 둘은 이 PC 에서만 빨갛다(리눅스는 `/proc` 길이 돈다).
# `runner.hooks` 는 훅 러너 전체를 돌려 페이로드 표가 main 의 배관을 잡는지 본다.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py <이 파일>

[runner.hooks]
command = ["uv", "run", "python", "tools/run_hooks.py"]
judge = "exit"
red_exit = 1

