# tools/hook_stop_korean.py(대기열 83)의 판정 규칙과 배선을 하나씩 빼는 변이, 그리고 러너가 그 훅 때문에 벗기는
# 환경 변수 하나.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/stop_korean_mutations.toml
# 문턱 둘은 경계 근처의 문장(막는 쪽 0.033 — 측정의 최고 0.041 바로 아래, 지나가는 쪽 0.391 — 측정에서 막지 않은
# 답 중 둘째로 낮다, 판정 하한의 여덟 글자 "Now merge.")을 테스트로 고정해 잰다.

