# next-session 결정표에 더한 출시 PR 줄(기능 계획의 끝 줄을 적은 커밋이 dev 에만 있고 열린 출시 PR 이 없으면 dev 를 main 에
# 올린다)이 새 세션에 실리는지(dev-release-pr-step 티켓, ADR 0043). 실험군은 이 워크트리, 대조군은 옛 판을 든 주 체크아웃이다.
# 이 PR 이 병합되기 전의 주 체크아웃에는 그 줄이 없다. 병합 뒤에 다시 돌리려면 병합 전 커밋을 `--control-commit` 으로 준다
# (README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-12, 이 PC, claude 2.1.322, 셀프 리뷰를 반영한 본문으로 다시 돌렸다. 실험군은 `4b02bbe29` 위의 커밋하지 않은 본문, 대조군은 `4b02bbe29`를 꺼낸 사본이고 "없음"이었다).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/dev_release_pr_step_decision_row.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문의 "다음 작업 결정표"에서, 첫째 칸(지금)에 `git log origin/main..origin/dev`로 시작하는 명령이 든 줄이 있으면 그 줄의 셋째 칸("시작 프롬프트")을 글자 그대로 옮기고,
그 줄의 첫째 칸 괄호 안에서 그 명령이 한 줄 이상 내는 것이 무엇을 뜻한다고 적었는지 구절도 글자 그대로 옮겨라. 그런 줄이 없으면 "없음"이라고만 답하라.
'''
expect = ["dev를 main에 올린다", "기능 계획의 끝 줄을 적은 커밋이 dev에만 있다"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
