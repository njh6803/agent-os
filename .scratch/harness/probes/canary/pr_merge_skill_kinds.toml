# 프로젝트 사본 pr-merge(project-pr-skills-dev)가 새 세션에 실리는지. 같은 이름의 사용자 수준 스킬이 가려서
# 이름을 달리했다(티켓 결과 1). 실험군은 이 워크트리, 대조군은 사본을 들이기 전의 커밋이다.
# 결과: 통과 4, "없음" 섞임 0(2026-11-12, 이 PC, claude 2.1.322, 실험군은 chore/dev-release-pr-step의 병합 커밋 `3b1eb606a`(4단계에 출시 PR 갈래를 더한 본문), 대조군 `--control-commit 4b02bbe29`, 일지 2026-11-12-1343).
#   대조군은 `Unknown skill: pr-merge` 로 본문을 못 읽어 "없음" 대신 못 읽었다고 답했다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 4b02bbe29 .scratch/harness/probes/canary/pr_merge_skill_kinds.toml <출력 디렉터리>
kind = "skill"
question = '''
pr-merge 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
그 본문에서 두 구절을 각각 글자 그대로 옮겨라.
1. 출시 PR과 되돌려 합치기 PR을 squash로 병합하면 안 되는 까닭을 적은 구절.
2. 병합 명령에 머리 브랜치를 지우는 플래그를 붙이지 않는 까닭 가운데, 그 플래그가 병합 뒤 작업 폴더에서 하는 일을 적은 구절.
본문에 그런 것이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["squash하면 두 브랜치에 같은 변경이 다른 커밋으로 남아 다음 합치기가 충돌한다", "그 플래그는 병합 뒤 작업 폴더에서 base 브랜치로"]
