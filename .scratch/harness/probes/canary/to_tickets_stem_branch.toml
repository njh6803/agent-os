# to-tickets 5단계 로컬 파일 항목에 더한 문장(티켓 파일 이름의 stem 이 구현 브랜치가 된다)이 새 세션에 실리는지
# (ADR 0037, ticket-for-every-pr 티켓 02). to-tickets 는 모델이 부르지 못하는 스킬이라 질문 머리에 슬래시 명령으로
# 넣는다. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃(`caaa062b`)에는
# 카나리아가 없다. 병합 뒤에는 `caaa062b` 를 `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 대조군 주 체크아웃 `caaa062b`, 일지 2026-10-22-09).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/to_tickets_stem_branch.toml <출력 디렉터리>
kind = "skill"
question = '''
/to-tickets
위에 실린 스킬 본문이 시키는 일(맥락 모으기, 티켓 나누기, 사용자에게 묻기, 파일 쓰기)은 하지 않는다. 본문만 보고 답한다.
5단계의 "Local files" 항목에서 "Use the per-ticket file template below"로 시작하는 문장 뒤에 이어지는 문장을 모두 글자 그대로 옮겨라.
판단이나 설명은 덧붙이지 않는다. 그 문장 뒤에 이어지는 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["그 티켓을 구현하는 브랜치 feature/<NN>-<slug>가 된다"]
source = ".claude/skills/to-tickets/SKILL.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
