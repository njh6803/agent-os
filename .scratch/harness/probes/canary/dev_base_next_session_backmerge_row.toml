# next-session 결정표 맨 위에 더한 줄(origin/dev 가 있고 main 의 끝 커밋이 dev 에 들어가지 않았으면 main 을 dev 에 되돌려
# 합친다)이 새 세션에 실리는지(dev-base-skills-docs 티켓, ADR 0043). 판정은 처음에 `git diff --quiet` 였고
# dev-release-pr-step 티켓이 `git merge-base --is-ancestor` 로 바꿨다(출시 PR 의 merge 커밋도 dev 가 품어야 main 의 strict 에 막히지 않는다).
# 실험군은 이 워크트리, 대조군은 옛 판을 든 주 체크아웃이다.
# 이 PR 이 병합되기 전의 주 체크아웃에는 그 줄이 없다. 병합 뒤에 다시 돌리려면 병합 전 커밋을 `--control-commit` 으로 준다
# (README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-12, 이 PC, claude 2.1.322, dev-release-pr-step 티켓이 판정을 바꾼 뒤, 실험군은 `4b02bbe29` 위의 커밋하지 않은 본문, 대조군은 `82e7a38fb`이고 "없음"이었다. 결정표에 같은 `--is-ancestor`가 든 줄이 둘이 되어 질문을 "`git fetch origin` 뒤로 시작하고 `--is-ancestor`가 1로 끝나는 조건"으로 좁혔다). 그 앞 판은 통과 4, "없음" 섞임 0(harness 티켓 dev-base-skills-docs). 첫 판은 질문이 "다음 단계" 칸을 물어 실패 3이었고(그 칸은 `되돌려 합치기` 한 마디다), "시작 프롬프트" 칸을 묻는 판이 통과했다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/dev_base_next_session_backmerge_row.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문의 "다음 작업 결정표"에서, 첫째 칸(지금)이 `git fetch origin` 뒤로 시작하고 `git merge-base --is-ancestor`가 1로 끝나는 조건이 든 줄이 있으면 그 줄의 셋째 칸("시작 프롬프트")을 글자 그대로 옮기고,
첫째 칸의 괄호 안에서 출시 PR의 merge 커밋을 dev가 품지 않은 경우를 어떻게 적었는지 그 구절도 글자 그대로 옮겨라. 그런 줄이 없으면 "없음"이라고만 답하라.
'''
expect = ["main을 dev에 되돌려 합친다", "출시 PR의 merge 커밋이 dev에 없다"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
