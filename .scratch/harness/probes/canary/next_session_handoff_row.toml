# next-session 에 더한 인계 줄과 "인계할 때" 1·3(인계하지 않는 때, 두 계기가 함께 올 때, 이어받을 상태)과 3단계의
# 스윕 갈래 조건(ADR 0033, token-usage 티켓 05)이 새 세션에 실리는지.
# 실험군은 이 워크트리, 대조군은 `checkout` 칸의 주 체크아웃이다. 이 명세를 들인 #276(05)이 병합되기 전에는 주 체크아웃의
#   옛 판에 인계 줄이 없었다. 병합된 뒤로는 주 체크아웃도 새 판이라, 아래 "돌리는 법"대로 `--control-commit`으로 꺼낸 옛
#   커밋이 대조군 자리다.
# 카나리아는 다섯이다. 같은 경계의 이어받을 상태 글자, 받은 범위가 경계에서 끝나는 예, 두 계기가 함께 올 때 이기는 줄,
# PR 연 뒤 새 세션이 시작하는 자리, 3단계의 스윕 도구를 치는 넓힌 조건.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-19, 이 PC, claude 2.1.302 — 러너가 찍은 커밋은 실험군 ebd09fbb(main과 같은
#   워크트리), 대조군 c689c9ce(인계 줄을 들인 #276보다 둘 앞의 #275 커밋을 `--control-commit`으로 꺼냈다), 일지
#   2026-10-19-07). 그 전 결과는 통과 4(2026-10-16, claude 2.1.300, 실험군·대조군 모두 e52e8da3, 일지 2026-10-16-63)다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit c689c9ce .scratch/harness/probes/canary/next_session_handoff_row.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
그 본문에서 다섯을 찾아 답하라. 본문에 없으면 그 물음에는 "없음"이라고만 답하라.
1. 단계 경계에서 인계 계기가 왔는데 넘기지 않고 잇는 때로, 이 세션을 연 지시문의 "이어받을 상태"가 어떤 글자로
   시작하는지가 적혀 있으면 그 글자를 그대로 옮겨라.
2. 같은 자리에서, 받은 요청 범위가 그 경계에서 끝나는 예로 든 괄호 안의 말을 그대로 옮겨라.
3. PR을 연 직후 두 계기가 함께 올 때 결정표의 어느 줄이 이긴다고 적혀 있으면 그 문장을 그대로 옮겨라.
4. "PR 연 뒤" 경계에서 넘길 때 새 세션이 무엇부터 한다고 적혀 있으면 그 말을 그대로 옮겨라.
5. "순서" 3단계에서 브랜치 이름을 정한 뒤 스윕 도구를 치는 조건 가운데, 결정표 칸의 값이 아닌 조건이 있으면 그
   괄호 안의 말을 그대로 옮겨라.
'''
expect = ["인계: <같은 경계>", "구현·리뷰·커밋까지를 받은", "인계 줄이 이긴다", "봇 회차)부터", "인계 줄, 끊는 줄"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
