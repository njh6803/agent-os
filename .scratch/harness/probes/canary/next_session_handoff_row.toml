# next-session 에 더한 인계 줄과 "인계할 때" 1·3(인계하지 않는 때, 두 계기가 함께 올 때, 이어받을 상태)과 3단계의
# 스윕 갈래 조건(ADR 0033, token-usage 티켓 05)이 새 세션에 실리는지.
# 실험군은 이 워크트리, 대조군은 `checkout` 칸의 주 체크아웃이다. 이 명세를 들인 #276(05)이 병합되기 전에는 주 체크아웃의
#   옛 판에 인계 줄이 없었다. 병합된 뒤로는 주 체크아웃도 새 판이라, 아래 "돌리는 법"대로 `--control-commit`으로 꺼낸 옛
#   커밋이 대조군 자리다.
# 카나리아는 다섯이다. 같은 경계의 이어받을 상태 글자, 받은 범위가 경계에서 끝나는 예, 두 계기가 함께 올 때 이기는 줄,
# PR 연 뒤 새 세션이 시작하는 자리, 3단계의 스윕 도구를 치는 넓힌 조건.
# 옮기기 전 결과: 통과 4, "없음" 섞임 0(2026-10-19, 이 PC, claude 2.1.302 — 러너가 찍은 커밋은 실험군 ebd09fbb(main과 같은
#   워크트리), 대조군 c689c9ce(인계 줄을 들인 #276보다 둘 앞의 #275 커밋을 `--control-commit`으로 꺼냈다), 일지
#   2026-10-19-07). 그 전 결과는 통과 4(2026-10-16, claude 2.1.300, 실험군·대조군 모두 e52e8da3, 일지 2026-10-16-63)다.
# 2026-10-29 harness 027 이 본문을 `handoff.md` 로 옮겨 하위 파일 갈래(`skill_body = "files"`)로 바꿨다.
#   대조군은 옮기기 전 커밋 `37759ef2` 을 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 1(2026-10-29, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `37759ef2`), 대조군 `--control-commit 37759ef2`, 일지 2026-10-29-02).
#   섞인 회차는 실험군 1/3이다. 1번 물음에 "없음."이라 쓴 뒤 같은 줄에서 `handoff.md` 를 읽고 `인계: <같은 경계>` 를 옮겼다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 37759ef2 .scratch/harness/probes/canary/next_session_handoff_row.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 단계 경계에서 인계 계기를 받은 세션이 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
1. 인계 계기가 왔는데 넘기지 않고 잇는 때로, 이 세션의 지시문의 "이어받을 상태"가 어떤
글자로 시작하는지가 적혀 있으면 그 글자를 그대로 옮겨라.
2. 같은 자리에서, 받은 요청 범위가 그 경계에서 끝나는 예로 든 괄호 안의 말을 그대로 옮겨라.
3. PR을 연 직후 두 계기가 함께 올 때 어느 줄이 이긴다고 적혀 있으면 그 문장을 그대로
옮겨라.
4. "PR 연 뒤" 경계에서 넘길 때 새 세션이 무엇부터 한다고 적혀 있으면 그 말을 그대로
옮겨라.
'''
expect = ["인계: <같은 경계>", "구현·리뷰·커밋까지를 받은", "인계 줄이 이긴다", "봇 회차)부터"]
source = ".claude/skills/next-session/handoff.md"
skill = "next-session"
skill_body = "files"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
