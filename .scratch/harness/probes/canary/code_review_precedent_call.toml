# code-review 4단계 주장 검증 목록의 코드의 동작 항목(대기열 305)과 6단계 1의 새 문장을 PR 직전 리뷰에 넘기는 문장(대기열 260)이 새 세션에 실리는지.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(dbcdc6d)이다. 처음 돌릴 때 주 체크아웃이 그 판이었다.
#   주 체크아웃이 앞으로 가도 원천 파일을 바꾸지 않은 동안은 같은 대조군이다. 판을 고정하려면 `--control-commit dbcdc6d` 를 준다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판의 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 대조군은 주 체크아웃 `dbcdc6d`, 실험군은 `dbcdc6d` 위의 커밋 전 변경, 일지 2026-10-16-45).
#   셀프 리뷰 반영(6단계 1 문장의 대상과 근거)과 PR 직전 bug-perf-review 반영(CLI 갈래 문장)은 같은 날 사전 확인으로 갈음했다(일지 2026-10-16-45).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/code_review_precedent_call.toml <출력 디렉터리>
#   병합 뒤: uv run python tools/canary.py --control-commit dbcdc6d .scratch/harness/probes/canary/code_review_precedent_call.toml <출력 디렉터리>
kind = "skill"
question = '''
code-review 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(리뷰, 서브에이전트)은 하지 않고 본문만 읽는다.
본문에서 다음 둘을 각각 글자 그대로 한 문장씩 옮겨라.
1) 4단계 주장 검증 목록에서, 문서가 코드가 어떻게 동작하는지 서술할 때 리뷰어가 무엇을 하는지 적은 항목의 첫 문장.
2) 6단계의 1에서, 반영하며 새로 쓴 사실 문장을 다음 리뷰에 어떻게 넘기는지 적은 문장.
본문에 그런 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = [
    "그 함수를 불러 서술의 경계 입력",
    "브리프에 밀 주장으로 나열해",
]
source = ".claude/skills/code-review/SKILL.md"
skill = "code-review"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
