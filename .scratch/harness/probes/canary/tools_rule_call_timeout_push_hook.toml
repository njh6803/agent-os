# `.claude/rules/tools.md` 에 더한 것(기다리는 도구의 외부 호출 시간 제한 항목과 그 손자 프로세스 문장, 훅 시간 문단의
# `hook_push_behind_main` 과 그 시간)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(일지 2026-10-13-44).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 셋이다. 시간 제한 항목이 드는 선례의 상수 이름, 명령 위치의 `git push` 에서만 git 을 띄우는 훅이 그 밖의
# 명령에서 쓴 시간의 범위, 출력을 버리는 호출의 함수 이름(PR 직전 리뷰 뒤에 더한 문장).
# 훅 이름은 카나리아가 아니다. 커밋하지 않은 훅 파일이 세션의 git status 에 실려, 둘째 판의 대조군이 셋 모두 "없음"
#   이라 답하고도 설명에 그 이름을 적어 실패로 판정됐다.
# 첫 판(훅 이름을 넣은 셋): 통과 4(2026-10-13, 이 PC, claude 2.1.296, 커밋하기 전의 작업 트리 — 러너가 찍은 커밋은
#   47013fc, 일지 2026-10-13-44).
# 최신 결과(지금의 셋): 통과 4(2026-10-13, 같은 PC와 판, 커밋하기 전의 작업 트리 — 러너가 찍은 커밋은 85b5947).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_call_timeout_push_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 둘을 찾아 답하라. 읽은 파일의 코드에서 추측하지 않는다.
1. 기다리거나 되풀이하는 도구가 부르는 외부 명령의 시간 제한을 말하는 항목이 있으면, 그 항목이 선례로 드는 상수
   이름을 백틱 안의 글자 그대로 옮겨라. 그런 항목이 없으면 "없음"이라고만 답하라.
2. 명령 위치의 `git push` 에서만 git 을 띄운다고 적힌 훅이 있으면, 그 훅의 이름과, 그 훅이 그 밖의 명령에서 쓴
   시간의 범위를 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
3. 출력을 붙잡은 호출이 손자 프로세스 때문에 시간 제한을 넘긴다는 문장이 있으면, 그 문장이 출력을 버리는 예로 드는
   함수 이름을 백틱 안의 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["CALL_TIMEOUT", "167~177ms", "quiet_git"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
