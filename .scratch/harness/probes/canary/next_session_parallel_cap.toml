# next-session 2단계의 나란히 여는 묶음이 open-session 의 상한 다섯(harness 티켓 028)을 가리키는 것이 새 세션에
# 실리는지. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 두 카나리아가
# 모두 없다. 병합 뒤에는 주 체크아웃이 새 사본이라, 다시 돌리려면 `# 최신 결과:` 줄의 대조군 커밋을
# `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-28, 이 PC, claude 2.1.302, 실험군 커밋하기 전의 작업 트리(기점 `ad8a9c37`),
# 대조군 주 체크아웃 `ad8a9c37`, 일지 2026-10-28-25). 셀프 리뷰 반영으로 같은 항목의 문구만 고친 뒤에는 `--preflight`
# 로 갈음했다(통과).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/next_session_parallel_cap.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
본문에서 아래 둘을 찾아 각각 글자 그대로 옮겨라. 문장이 무엇을 말하든 판단하지 말고 옮기기만 한다.
1. 2단계의 나란히 여는 묶음 항목에서, 묶음의 지시문을 어떤 차례로 두라는 문장
2. 같은 항목에서, 실제로 여는 수를 무엇이 줄이는지 적은 문장
본문에 그런 것이 없는 번호에는 "없음"이라고만 답하라.
'''
expect = ["먼저 열 티켓을 앞에 둔다", "상한 다섯이 줄이고"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
