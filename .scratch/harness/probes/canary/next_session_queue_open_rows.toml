# next-session 결정표의 하네스 chore 배치 줄이 열린 대기열 항목을 세는 도구(대기열 167)를 가리키는 문장이 새 세션에
# 실리는지. 실험군은 이 워크트리, 대조군은 옛 판 `15c81d24` 이다(그 판에는 두 카나리아가 모두 없다). 돌릴 때는
# `--control-commit 15c81d24` 를 준다(README `canary/` 행).
# retro-queue-per-item 티켓 02 가 대기열을 항목마다 파일 하나인 폴더로 옮기며 도구의 종료 1 문장(라벨 줄이 빠진 항목 파일)을
# 둘째 카나리아로 더하고 질문 2 를 더했다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-07, 이 PC, claude 2.1.318, 대조군 `--control-commit 15c81d24`, 실험군은 `e423281a`,
#   retro-queue-per-item 티켓 02, 일지 2026-11-07-02). 셀프 리뷰 반영이 더한 문장(번호는 앞의 0을 떼고 맞댄다)을 묻는 물음 3을
#   더해 셋으로 돌렸고, 대조군은 세 물음 모두 "없음"이었다.
# 그 전 결과: 통과 4, "없음" 섞임 1(2026-11-07 같은 날 물음 둘로, 실험군은 `288686a5` 위의 커밋하지 않은 본문). 섞임 하나는
#   1회차가 물음 1에 "없음"이라 쓴 뒤 같은 답에서 그 문장을 옮기고 "없음은 문장이 없다는 뜻이 아니다"라고 바로잡은 것이다.
# 그 전전 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 대조군 주 체크아웃 `15c81d24`, 일지 2026-10-16-30).
#   셀프 리뷰가 결정표 문장을 고친 뒤 카나리아와 질문을 바꿔 다시 돌린 결과다. 실험군 3회차의 "없음" 섞임은 답이
#   그 문장을 옮긴 뒤 "없음으로 답하지 않았다"고 덧붙인 것이다.
# 2026-10-20: ADR 0036(chore/hook-census)이 그 문장을 같은 줄의 "시작 프롬프트" 칸으로 옮겨 질문의 칸을 고쳤다.
#   고친 질문으로는 돌리지 않았다. 위 결과는 옛 질문("지금(병합 뒤)" 칸의 마지막 문장)의 것이다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 15c81d24 .scratch/harness/probes/canary/next_session_queue_open_rows.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽고 셋을 답하라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
결정표에서 다음 단계가 "하네스 chore 배치"인 줄을 찾아라.
1) 그 줄의 "시작 프롬프트" 칸에서 도구 출력의 인용 묶음을 어떻게 보라는지 적은 문장을 글자 그대로 옮겨라.
2) 그 줄의 맨 앞 칸에서, 열린 대기열 항목을 세는 도구가 종료 코드 1로 끝나면 어떻게 하라고 적은 구절을 글자 그대로 옮겨라.
3) 결정표 위 "순서" 2의 "실행 중 세션 확인"에서, 시작 프롬프트에 든 항목의 식별자를 번호로 맞댈 때 앞의 0을 어떻게 다루라고 적은 문장을 글자 그대로 옮겨라.
그 칸이나 절에 그런 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = [
  "괄호 안에 든 진짜 대상이 있는지 본다",
  "종료 1이면 출력의 라벨 줄이 빠진 항목 파일을 고친 뒤 다시 세고",
  "번호는 앞의 0을 떼고 맞대어 `573`과 `0573`을 같은 항목으로 본다",
]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../.."
