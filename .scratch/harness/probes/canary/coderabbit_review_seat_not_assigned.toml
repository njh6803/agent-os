# coderabbit-review 정의 1단계가 `Seat: not assigned`에서 종료하지 않고 3으로 가라고 고친 문장(harness 티켓
# coderabbit-review-seat-not-assigned, 대기열 578)이 새 세션의 서브에이전트에 실리는지. 실험군은 이 워크트리, 대조군은 바뀌기 전 판
# (`origin/main` 의 778db404)이다. 주 체크아웃도 처음에는 그 판이지만 병합 뒤에는 새 사본이라 처음부터 `--control-commit 778db404` 로
# 준다(README `canary/` 행). agent_tools 는 실험군 정의의 tools 줄과 같은 집합이어야 한다(러너의 agent_problems).
# 최신 결과: 통과 4(2026-11-08, 이 PC, 러너는 이 워크트리의 `tools/canary.py`, 대조군은 `--control-commit 778db404` 로 꺼낸 임시
# 워크트리, 실험군은 `778db404` 위의 커밋 전 변경, 출력의 집계 줄과 답을 손으로 읽었다). 대조군은 옛 문장("그 사실만 보고하고
# 종료한다")을 옮겼고, 실험군 셋은 새 문장의 앞 두 문장을 옮겼다.
# 그 뒤 셀프 리뷰가 1단계의 판정 기준 문구("끝까지 도는지")와 3단계의 항목을 고쳐 사전 확인(`--preflight`)으로 갈음했다(2026-11-08).
# 묻는 문장("값이 `not assigned`여도 종료하지 않고 3으로 간다")은 그대로다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 778db404 .scratch/harness/probes/canary/coderabbit_review_seat_not_assigned.toml <출력 디렉터리>
kind = "agent"
agent = "coderabbit-review"
agent_tools = ["Bash", "Read", "Grep", "Glob"]
question = '''
coderabbit-review 서브에이전트를 Agent 도구로 한 번만 불러라. 서브에이전트에게 줄 프롬프트는 아래 단락 그대로다.

도구를 하나도 쓰지 마라. 파일을 읽지 말고, 지금 네 지시문(시스템 프롬프트)에 적힌 것만 보고 답한다. 절차 1단계에서 `coderabbit auth status` 출력의 `Seat:` 줄 값이 `not assigned`일 때 무엇을 하라고 적은 문장이 있으면 그 문장을 끝까지 글자 그대로 옮겨라. 그런 문장이 없으면 '없음'이라고만 적어라.

서브에이전트의 답을 고치거나 줄이지 말고 그대로 전하라.
'''
expect = ["값이 `not assigned`여도 종료하지 않고 3으로 간다"]
source = ".claude/agents/coderabbit-review.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
