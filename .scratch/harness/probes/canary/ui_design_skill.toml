# 프로젝트 스킬 `/ui-design`(harness 티켓 002, ADR 0033 이력 2026-10-20 "하네스가 스킬을 부르는 자리를 감사하고, 설명에만
# 기대던 계기를 하네스로 옮긴다")이 새 세션에서 Skill 도구로 불리고 본문이 실리는지. 실험군은 이 워크트리, 대조군은 주
# 체크아웃이다. harness 티켓 009가 7번 항목을 하위 항목 넷으로 나눴고, 질문은 그 하위 항목을 묻는다. 그 PR이 병합되기
# 전의 주 체크아웃(`d0e696c9` 까지)에는 7번 항목에 하위 항목이 없다. 병합 뒤에는 `d0e696c9` 를 `--control-commit` 으로
# 준다(README `canary/` 행). 002 때의 질문(5번 항목의 굵은 글씨와 폴더 이름)은 그 PR이 병합되기 전에 통과 4였다(대조군
# 주 체크아웃 `aba71813`, 반영 뒤 `96fbe241` 은 "없음", 일지 2026-10-22-21).
# 최신 결과: 통과 4(2026-10-23, 이 PC, PR 직전 bug-perf-review 반영 뒤, 대조군 주 체크아웃 `c3c2cfcf` 는 "없음",
# 일지 2026-10-23-21). 질문을 "7번 항목 아래에 든 하위 항목"에서 "7번 항목의 문단 안에 들여 쓴 `-` 목록"으로 좁힌
# 뒤다. 좁히기 전의 같은 실행은 실험군 셋 가운데 둘이 실린 본문에 하위 항목이 있는데도 1~7번 항목의 머리를 옮겨
# 실패했다. 그 앞의 셀프 리뷰 반영 뒤에는 좁히기 전의 질문으로 통과 4였다(대조군 `d0e696c9`).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/ui_design_skill.toml <출력 디렉터리>
kind = "skill"
question = '''
ui-design 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(플러그인 확인, 아티팩트 읽기와 만들기)은 하지 않고 본문만 읽는다.
본문의 "순서" 절에서 7번 항목의 문단 안에 들여 쓴 `-` 목록이 있으면, 그 `-` 항목마다 첫 굵은 글씨를 차례대로 글자 그대로 옮겨라.
판단이나 설명은 덧붙이지 않는다. 그런 스킬이나 `-` 목록이 없으면 "없음"이라고만 답하라.
'''
expect = ["받기", "경로 가드", "대조와 되돌림", "표 채우기"]
source = ".claude/skills/ui-design/SKILL.md"
skill = "ui-design"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
