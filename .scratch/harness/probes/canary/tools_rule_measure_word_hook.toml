# `.claude/rules/tools.md` 의 훅별 시간 항목에 더한 Write·Edit 문장(대기열 227, `hook_measure_word`)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지(일지 2026-10-19-06).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 새 훅의 괄호 설명과, 넷째·다섯째 훅의 시간을 함께 적은 말이다. 둘 다 이 PR 이 더한 글에만 있다.
# 훅 이름은 git 상태의 바뀐 경로에도 들어 고르지 않았다.
# 첫 판은 규칙 파일의 첫 제목과 괄호 설명을 한 물음에 묶어 물었고, 실험군 세 번이 모두 "없음"이었다(2026-10-19, 이 PC,
#   일지 2026-10-19-06). 통과한 `tools_rule_edit_during_commit.toml` 처럼 번호 둘로 나눠 자리를 짚게 고쳤다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-19, 이 PC, 셀프 리뷰를 반영한 커밋하기 전의 작업 트리 — 러너가 찍은 커밋은
#   ebd09fbb, 일지 2026-10-19-06).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_measure_word_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 둘을 찾아 답하라. 읽은 파일의 코드에서 추측하지 않는다.
1. Write·Edit 에 붙는다고 적힌 PostToolUse 훅들을 나열한 문장이 있으면, 그 나열에서 다섯째로 이름이 든 훅을 두고
   뒤의 괄호 안에 적은 설명을 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
2. 같은 괄호 안에서 넷째 훅과 다섯째 훅의 시간을 함께 두고 적은 말을 글자 그대로 옮겨라. 그런 말이 없으면 "없음"이라고만 답하라.
'''
expect = ["입력의 글만 보고 파일을 열지 않는다", "둘 다 시간은 재지 않았고"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
