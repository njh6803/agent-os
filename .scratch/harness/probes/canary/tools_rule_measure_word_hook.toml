# `.claude/rules/tools.md` 의 훅별 시간 항목에 더한 Write·Edit 문장(대기열 227, `hook_measure_word`)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지(일지 2026-10-28-07).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. `hook_measure_word` 항목의 설명과, `hook_scratch_probe_rule` 부터 `hook_probe_citing_doc` 까지 훅의 시간을
# 함께 적은 말이다. 처음 판에서 둘 다 이 PR 이 더하거나 고친 글에만 있었다. 훅 이름은 git 상태의 바뀐 경로에도 들어 고르지 않았다.
# 첫 판은 규칙 파일의 첫 제목과 괄호 설명을 한 물음에 묶어 물었고, 실험군 세 번이 모두 "없음"이었다(2026-10-19, 이 PC,
#   일지 2026-10-28-07). 통과한 `tools_rule_edit_during_commit.toml` 처럼 번호 둘로 나눠 자리를 짚게 고쳤다.
# 2026-10-28 에 origin/main 을 합치며 나열이 여덟으로 늘어(probe_conclusion·journal_evidence·ui_design·web_edit_check)
#   이 훅이 아홉째가 됐고, 시간의 말도 "둘 다"에서 "여섯 다"로 바뀌어 물음과 카나리아를 그에 맞췄다.
# 2026-11-01 에 harness 티켓 035 가 열째 훅(`hook_probe_citing_doc`)을 같은 괄호에 더해 시간의 말이 "여섯 다"에서 "일곱 다"로,
#   넷째부터 아홉째까지가 열째까지로 바뀌어 물음 2 와 카나리아 둘째 조각을 그에 맞췄다. 물음 1 은 그대로다(아홉째는 이 훅).
# 2026-11-05 에 harness 티켓 042 가 시간 항목을 이벤트·도구마다 하위 항목으로 나누고 훅을 서수 대신 이름으로 부르게 해, 물음 둘이
#   서수 대신 훅 이름(`hook_measure_word`, `hook_scratch_probe_rule` 부터 `hook_probe_citing_doc` 까지)으로 묻고 둘째 카나리아가
#   "일곱 다 시간은 재지 않았고"에서 "일곱 훅 모두 시간은 재지 않았고"로 바뀌었다.
# 최신 결과: 통과 4, 실패 0, "없음" 섞인 통과 0(2026-11-05, 이 PC, claude 2.1.318, 러너가 찍은 커밋 77bb7c59 위의 커밋하지 않은 판,
#   대조군은 두 물음 모두 "없음", 일지 2026-11-05-05, harness 티켓 042).
# 그 전 결과: 통과 4, 실패 0, "없음" 섞인 통과 0(2026-11-01, 이 PC, claude 2.1.312(돌린 뒤 `claude --version` 으로 봤다), 러너가 찍은 커밋 544381ea 위의
#   커밋하지 않은 판, 일지 2026-11-01-09). 그 전: 통과 4, 실패 0, "없음" 섞인 통과 0(2026-10-28, 이 PC, claude 2.1.302, PR #297 이 이 PR 을 합친 작업 트리,
#   러너가 찍은 커밋 43a00c99, 일지 2026-10-28-08). 그 전 결과도 통과 4였다(고친 물음, 러너가 찍은 커밋 ee93101a, 일지 2026-10-28-07).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_measure_word_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 둘을 찾아 답하라. 읽은 파일의 코드에서 추측하지 않는다.
1. Write·Edit 에 붙는다고 적힌 PostToolUse 훅들 가운데 `hook_measure_word` 를 설명한 항목이 있으면, 그 항목이 이 훅에 대해
   파일을 어떻게 한다고 적은 말을 글자 그대로 옮겨라. 그런 항목이 없으면 "없음"이라고만 답하라.
2. 같은 훅들의 항목 가운데 `hook_scratch_probe_rule` 부터 `hook_probe_citing_doc` 까지 훅의 시간을 함께 두고 적은 말을
   글자 그대로 옮겨라. 그런 말이 없으면 "없음"이라고만 답하라.
'''
expect = ["입력의 글만 보고 파일을 열지 않는다", "일곱 훅 모두 시간은 재지 않았고"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
