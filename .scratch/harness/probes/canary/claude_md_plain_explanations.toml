# CLAUDE.md 원칙 절에 더한 쉬운 말 규칙(일지 2026-10-15-14)이 새 세션에 실리는지. CLAUDE.md 는 매 세션 실리므로
# 규칙 갈래의 모양만 빌린다. 두 갈래 모두 같은 README.md 를 읽고 체크아웃만 다르다.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(983bf49)이다. 옛 판에는 카나리아가 없다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판을 따로 꺼낸다(README `canary/` 행).
# 워크트리 세션에는 주 체크아웃의 `CLAUDE.md`가 실리지 않아(`.scratch/harness/probes/claude_md_parent.py`,
# 대기열 171) 실험군의 통과는 워크트리 사본이 실렸다는 뜻이다.
# 최신 결과: 통과 4(2026-10-15, 이 PC, claude 2.1.300, 실험군은 커밋 전 작업 트리, 대조군 `983bf49`, 일지 2026-10-15-14). main을 합친 뒤 일지 인용의 번호를 옮겨 사전 확인으로 갈음했다(2026-10-15, claude 2.1.300).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   git worktree add --detach ../../../../agent-canary-983bf49 983bf49
#   uv run python tools/canary.py .scratch/harness/probes/canary/claude_md_plain_explanations.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 프로젝트 지시의 "원칙" 절에서, 사람에게 보이는 글을 어떻게 쓰는지 적은 항목을 글자 그대로 옮겨라.
읽은 파일에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["쉬운 말과 구체적인 장면", "고르면 실제로 바뀌는 것"]
source = "CLAUDE.md"

[[arm]]
name = "워크트리"
role = "experiment"
target = "README.md"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../../../agent-canary-983bf49"
target = "README.md"
