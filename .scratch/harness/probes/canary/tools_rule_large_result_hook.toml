# `.claude/rules/tools.md` 의 훅별 시간 항목에 더한 큰 결과 알림 문장(티켓 06, `hook_large_result` 와 그 시간)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지.
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 셋이다. 규칙 파일의 첫 제목, 그 훅이 하는 일을 적은 조각, 새로 잰 Read 알림 시간의 범위.
# 훅 이름은 커밋 제목에 있어(세션에 실리는 git 상태) 카나리아로 쓰지 않는다.
# 최신 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 갈래 커밋 820f237c, 일지 2026-10-16-67).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_large_result_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 파일 가운데 훅 한 번의 시간을 훅마다 적은 문단이 있으면, 그 문단에서 도구 결과의 글자 수를 세는 훅과 그 훅의 Read 알림 시간을 적은 문장을 찾는다.
그런 문장이 있으면,
그 문장이 든 지시 파일의 첫 `#` 제목, 그 훅이 무엇을 세는지 적은 조각, 그 Read 알림 시간의 범위를 적은 조각을 각각 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["하네스 규칙", "결과 객체의 글자 수만 세고", "329~752ms"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
