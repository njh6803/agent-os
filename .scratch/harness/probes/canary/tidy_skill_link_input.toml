# tidy-checkouts 스킬의 "하지 않는 것" 표에서 지우는 길을 고치는 행에 더한 것(반박 입력의 링크, 대기열 116·278)이
# 새 세션에 실리는지. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃(b4335124)에는
# 두 카나리아가 모두 없다. 병합 뒤에는 주 체크아웃이 새 사본이라, 다시 돌리려면 `--control-commit b4335124` 를 준다
# (README `canary/` 행).
# 최신 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 대조군 주 체크아웃 b4335124, 커밋하기 전의 작업 트리. 대조군은 옛 줄을
#   옮겼다, 일지 2026-10-16-16).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/tidy_skill_link_input.toml <출력 디렉터리>
kind = "skill"
question = '''
tidy-checkouts 스킬을 Skill 도구로 불러 본문을 읽고 둘을 답하라.
1. "하지 않는 것" 표에서 이 스킬이나 그 도구의 지우는 길을 고치고 커밋하는 행의 "대신" 칸이 반박에 쓰라고 드는 입력을
   괄호 안의 글자 그대로 옮겨라.
2. 같은 칸의 마지막 괄호가 드는 대기열 번호를 글자 그대로 옮겨라.
본문에 그런 행이나 괄호가 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["지우는 자리 안의 링크", "116·278"]
source = ".claude/skills/tidy-checkouts/SKILL.md"
skill = "tidy-checkouts"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
