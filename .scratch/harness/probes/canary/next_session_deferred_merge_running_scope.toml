# next-session에 더한 문장(대기열 234·268·283)이 새 세션에 실리는지. 뒤로 넘긴 봇 지적을 일지 "다음"에도 적기,
# 병합은 묻지 않기, 실행 중 세션이 맡은 대기열 행을 시작 프롬프트 검색으로 빼기와 열기 직전의 재확인.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판에는 다섯 카나리아가 모두 없다.
# 최신 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 1단계의 2와 2단계를 하위 항목으로 나눈 미커밋 본문, 대조군
#   `--control-commit 9116978f`, 일지 2026-10-16-20).
#   3·4·5의 질문 자리와 5의 기대를 새 항목 이름에 맞춘 판이다. 그 뒤 PR 직전 리뷰를 반영해 1단계의 2와 4단계의 문구를
#   고친 것은 사전 확인으로 갈음했다(일지 2026-10-16-20).
#   그 앞: 통과 4(2026-10-16, claude 2.1.300, 실험군 커밋 `87b080d7`, 대조군 옛 판 `9116978f`, 일지 2026-10-16-18).
#   그 뒤 PR 직전 리뷰를 반영해 1단계의 2(푸시, 일지만 푸시한 회차)와 2단계(`prState`, 견주지 못할 때)에 문장을 더한 것은
#   사전 확인으로 갈음했다(2026-10-16, 일지 2026-10-16-18).
#   질문 2의 단계 번호는 대기열 341 이 일지를 병합 길 앞으로 옮겨 3 에서 4 로 바꿨다(다시 돌리지 않았다. 대조군인 주 체크아웃이
#   이미 다섯 카나리아를 든 판이라 대조가 서지 않는다, 일지 2026-10-22-11).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/next_session_deferred_merge_running_scope.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
그 본문에서 다섯 구절을 각각 글자 그대로 옮겨라.
1. 순서 1단계의 2(봇 회차)에서, 보류한 지적의 일을 PR 코멘트 밖에도 적어야 하는 조건을 말하는 구절.
2. 순서 1단계의 4(병합 길)에서, 병합하기 전에 사용자의 뜻을 물을지에 관해 적은 문장.
3. 순서 2단계의 "실행 중 세션 확인" 항목에서, 굵은 이름 바로 뒤에 무엇을 빼라고 적은 첫 문장.
4. 같은 항목의 "찾기"에서, 어떤 도구로 무엇을 찾으라고 하는지 적은 구절.
5. 순서 4단계에서, `open-session`을 돌리기 직전에 2단계의 어느 항목을 다시 하라고 적은 문장.
본문에 그런 것이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = [
  "보류 이유가 그 일을 뒤의 작업으로 넘기는 것이면",
  "병합할지는 사용자에게 묻지 않는다",
  "이미 도는 세션이 맡은 대기열 행도 뺀다",
  "search_session_transcripts로 시작 프롬프트:를 찾는다",
  "2단계의 2(실행 중 세션 확인)를 한 번 더 한다",
