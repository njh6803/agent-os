# `.claude/rules/tests.md` 에 더한 항목(`tests/tools/` 의 pwsh 시험 본문은 CI 의 리눅스 pwsh 에서도 돈다, 대기열 281)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지.
# 실험군은 규칙의 paths 안(tests/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 그 항목이 선례로 드는 상수 이름 둘이다.
# 첫 판(길 하나, 카나리아 `_PATTERN_TIMED`): 통과 4(2026-10-16, 이 PC, claude 2.1.300, 커밋하기 전의 작업 트리. 러너가 찍은
#   커밋은 b4335124, 일지 2026-10-16-16). 셀프 리뷰가 같은 파일의 `_FOCUS` 를 반례로 들어 길을 둘로 적었다.
# 최신 결과: 통과 4(2026-10-16, 같은 PC와 판, 셀프 리뷰를 반영한 커밋하기 전의 작업 트리. 러너가 찍은 커밋은 b4335124,
#   일지 2026-10-16-16).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tests_rule_pwsh_linux.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, pwsh 시험 본문이 윈도 전용 형식에 기댈 때 어떻게 하라는 항목이 있으면,
그 항목이 선례로 드는 상수 이름을 모두 백틱 안의 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["_PATTERN_TIMED", "_FOCUS"]
source = ".claude/rules/tests.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tests/test_plugins_boundary.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
