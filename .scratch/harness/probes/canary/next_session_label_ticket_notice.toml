# next-session "지시문 형식" 절(지금 `directive.md` 의 `## 형식`) 끝 문단의, 라벨을 바꾸면 첫 턴 훅이 무엇을 내는지 적은 문장(티켓
# .scratch/ticket-for-every-pr/issues/05-first-turn-ticket-notice.md 가 "예외 없이 침묵"을 티켓 알림으로 고쳤다)이
# 새 세션에 실리는지. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 옛 문장이
# 있다. 병합 뒤에 다시 돌리려면 `# 최신 결과:` 줄의 대조군 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 옮기기 전 결과: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 실험군 `e62eb052` 위의 커밋 전 작업 트리, 대조군 주 체크아웃
# `c47bedce` 는 옛 문장 "예외 없이 침묵"을 옮겼다, 일지 2026-10-22-29).
# 2026-10-29 harness 027 이 본문을 `directive.md` 로 옮겨 하위 파일 갈래(`skill_files`)로 바꿨다.
#   대조군은 옮기기 전 커밋 `37759ef2` 을 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-29, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `37759ef2`), 대조군 `--control-commit 37759ef2`, 일지 2026-10-29-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 37759ef2 .scratch/harness/probes/canary/next_session_label_ticket_notice.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 다음 작업의 지시문을 낼 때 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
1. 형식 절에서 새 세션의 UserPromptSubmit 훅이 지시문을 알아보는 법을 적은 문단을 찾고, 그
문단에서 라벨을 바꾸면 그 훅이 무엇을 하는지 적은 문장을 글자 그대로 옮겨라.
2. 형식 절의 코드 블록에서 "브랜치:"로 시작하는 줄 바로 다음 줄을 글자 그대로 옮겨라.
'''
expect = ["지시문 없이 연 세션의 티켓 알림", "<low|medium|high|xhigh|max>"]
source = ".claude/skills/next-session/directive.md"
skill = "next-session"
skill_files = true

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
