# `.claude/rules/probes.md` 끝에 더한 항목(프로브의 결론을 명세·ADR·서브에이전트 정의의 근거 문장으로 옮길 때도 셋째 항목을 대 본다.
# 프로브 낱말을 더한 Write·Edit 는 `tools/hook_probe_citing_doc.py` 가 짚는다, 대기열 540, harness 티켓 035)이 `paths`
# (`.scratch/**/probes/**`)에 맞는 파일을 Read 로 열 때 실리는지.
# 실험군은 이 명세를 부른 체크아웃의 프로브 파일, 대조군은 항목을 더하기 전 판(544381e, origin/main)의 같은 파일이다.
# 카나리아는 더한 항목에만 있는 조각 둘이다. 훅 파일 이름은 git 상태의 새 파일 경로에도 들어(사전 확인이 막았다) 고르지 않았다.
# 최신 결과: 통과 4, 실패 0, "없음" 섞인 통과 0(2026-11-01, 이 PC, claude 2.1.312(돌린 뒤 `claude --version` 으로 봤다), 러너가 찍은 커밋 544381ea 위의
#   커밋하지 않은 판, 대조군 544381e 는 "없음", 일지 2026-11-01-09).
# 앞선 두 판은 더한 문장이 셋째 항목(긴 한 줄) 한가운데에 있었다. 둘 다 실험군 셋 가운데 둘이 통과하고 하나가 "없음"이라 답해 실패였다
# (2026-11-01, 이 PC, 질문이 묻는 자리만 둘째 판에서 좁혔고, 대조군은 "없음"). 스트림 원본에는 실린 규칙의 본문이 없어 규칙이 실리지 않은
# 것인지 긴 항목에서 문장을 놓친 것인지는 가르지 못했다. 그래서 문장을 짧은 독립 항목으로 옮기고 질문을 그 항목에 맞췄다.
# 돌리는 법: 워크트리 루트에서
#   uv run python tools/canary.py --control-commit 544381e .scratch/harness/probes/canary/probes_rule_citing_doc_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 프로브의 결론을 명세·ADR·서브에이전트 정의의 근거 문장으로 옮길 때를 말하는 항목이 있으면,
그 항목이 어떤 편집에 어느 훅이 짚는다고 적은 문장을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 그 자리에 "없음"이라고만 적어라.
'''
expect = ["프로브 낱말을 더한 Write·Edit", "짚는다(대기열 540)"]
source = ".claude/rules/probes.md"

[[arm]]
name = "워크트리"
role = "experiment"
target = ".scratch/harness/probes/commit_msg_hook/time_hook.py"

[[arm]]
name = "옛-판"
role = "control"
target = ".scratch/harness/probes/commit_msg_hook/time_hook.py"
