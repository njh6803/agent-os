# `.claude/rules/tests.md` 의 리눅스 항목을 일반 조항으로 올리며 더한 예(시험이 쓰는 스크립트에는 실행 권한을 준다,
# 대기열 318)가 `paths` 에 맞는 파일을 Read 로 열 때 실리는지.
# 실험군은 규칙의 paths 안(tests/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 그 예가 선례로 드는 함수 이름과 권한 값이다. 읽는 파일에는 둘 다 없다.
# 최신 결과: 통과 4(2026-10-19, 이 PC, claude 2.1.302, 커밋하기 전의 작업 트리. 러너가 찍은 커밋은 a89ec15c).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tests_rule_linux_exec_bit.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 시험이 쓰는 git 훅 스크립트의 실행 권한을 어떻게 하라는 항목이 있으면,
그 항목이 선례로 드는 함수 이름과 그 함수가 치는 호출을 모두 백틱 안의 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["committing_repository", "chmod(0o755)"]
source = ".claude/rules/tests.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tests/test_plugins_boundary.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
