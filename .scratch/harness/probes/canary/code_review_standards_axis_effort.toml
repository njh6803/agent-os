# code-review 4단계의 표준 축 모델과 노력(언제나 sonnet·high, ADR 0033, 티켓 token-usage 07)이 새 세션에 실리는지.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(30b9f37)이다. 옛 판은 소스 없는 diff에서 모델만 내리고 노력을 주지 않는다.
# 최신 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 대조군 `30b9f37b`, 일지 2026-10-16-50). main(#269)을 합친 뒤 사전 확인으로 갈음(2026-10-16, 일지 2026-10-16-50).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 30b9f37 .scratch/harness/probes/canary/code_review_standards_axis_effort.toml <출력 디렉터리>
kind = "skill"
question = '''
code-review 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(리뷰, 서브에이전트)은 하지 않고 본문만 읽는다.
4단계에서 Standards 서브에이전트를 띄울 때 주라고 한 노력(effort) 값과, 그 값을 주는 조건을 적은 문장을 글자 그대로 옮겨라.
이어서 같은 4단계에서 Spec 서브에이전트에 모델과 노력을 어떻게 하라고 하는지 적은 문장을 글자 그대로 옮겨라.
본문이 Standards 서브에이전트에 노력 값을 주라고 하지 않으면 "없음"이라고만 답하라.
'''
expect = ["`effort: high`", "whatever kind of change the diff is", "Give the Spec sub-agent neither"]
source = ".claude/skills/code-review/SKILL.md"
skill = "code-review"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
