# `.claude/rules/tools.md` 의 훅 시간 문단에 더한 인계 훅 둘의 시간(token-usage 티켓 05, 일지 2026-10-16-57)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지.
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 셋이다. 트랜스크립트를 열지 않는 길의 둘째 회차 범위, Stop 의 문턱 아래 두 회차 범위.
# 훅 이름은 카나리아가 아니다. 커밋하지 않은 훅 파일이 세션의 git status 에 실린다(tools_rule_call_timeout_push_hook.toml).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-16, 이 PC, claude 2.1.300, 커밋하기 전의 작업 트리 — 러너가 찍은 커밋은
#   e52e8da3, 일지 2026-10-16-57). 셀프 리뷰를 반영하며 원천의 본문만 고친 것은 같은 PR·같은 판에서 사전 확인으로
#   갈음했다(같은 일지).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_handoff_hooks.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 둘을 찾아 답하라. 읽은 파일의 코드에서 추측하지 않는다.
1. 단계 경계가 아닌 호출에서는 트랜스크립트를 열지 않는다고 적힌 PostToolUse 훅이 있으면, 그 길에서 잰 시간 범위
   둘을 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
2. Stop 에 턴마다 더 붙어 트랜스크립트 끝을 읽는다고 적힌 훅이 있으면, 문턱 아래(침묵)에서 잰 시간 범위 둘을 글자
   그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["250~260ms", "319~732ms", "265~328ms"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
