# implement 에 더한 티켓 맞추기 문단(받은 티켓을 첫 편집에서 in-progress 로, 번호를 받아 쓴 티켓 뒤에 번호 도구를
# 다시 치기, PR 을 열기 전에 done, ADR 0037, ticket-for-every-pr 티켓 02)이 새 세션에 실리는지. implement 는 모델이
# 부르지 못하는 스킬이라 질문 머리에 슬래시 명령으로 넣는다. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이
# 병합되기 전의 주 체크아웃(`caaa062b`)에는 카나리아가 없다. 병합 뒤에는 주 체크아웃이 새 사본이라, 다시 돌리려면
# `caaa062b` 를 `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 대조군 주 체크아웃 `caaa062b`, 일지 2026-10-22-09).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/implement_ticket_status.toml <출력 디렉터리>
kind = "skill"
question = '''
/implement
위에 실린 스킬 본문이 시키는 일(브랜치, 워크트리, 구현)은 하지 않는다. 본문만 보고 답한다.
1) 본문에서 받은 티켓의 상태 줄을 처음 바꾸는 때와 방법을 적은 문장을 글자 그대로 옮겨라.
2) 본문에서 번호를 받아 티켓 파일을 쓴 뒤에 할 일을 적은 문장을 글자 그대로 옮겨라.
3) 본문에서 티켓의 상태 줄을 마지막으로 바꾸는 때를 적은 문장을 글자 그대로 옮겨라.
판단이나 설명은 덧붙이지 않는다. 본문에 그런 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = [
  "첫 편집으로 그 Status:를 in-progress로 바꿔 첫 커밋에 싣는다",
  "그 직후에 uv run python tools/sibling_overlap.py를 다시 친다",
  "PR을 열기 전에 티켓을 done으로 바꿔 커밋한다",
]
source = ".claude/skills/implement/SKILL.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
