하나, 3에서 워크트리를 판정할 때 루트에서 치는 명령 전체.
둘, 2에서 당긴 커밋이 이 스킬 파일을 바꿨을 때 Read 로 무엇을 열어 어디부터 따르는지 적은 문장.
