# `.claude/rules/tools.md` 의 계기 훅과 막는 훅 항목에서 막는 훅의 첫 사건 예외를 손상으로 좁힌 문장(ADR 0036)이 `paths` 에
# 맞는 파일을 Read 로 열 때 실리는지(일지 2026-10-20-09). 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다.
# 둘 다 이 체크아웃이다.
# 최신 결과: 통과 4(2026-10-20, 이 PC, claude 2.1.302, 두 갈래 모두 `5e7fa88d` 위의 커밋 전 작업 트리, 일지 2026-10-20-09).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_damage_exception.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시에서, 막는 훅이 지침 없이 첫 사건에서 더해지는 예외를 적은 문장을 찾아 글자 그대로 옮겨라.
파일을 읽을 때 함께 실린 규칙 파일도 지시로 센다.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["손상(retro 4단계의 정의"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
