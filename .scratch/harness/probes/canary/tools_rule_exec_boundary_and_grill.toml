# `.claude/rules/tools.md` 에 고친 둘(지우거나 덮어쓰는 도구 항목 바로 뒤에 뗀 실행하는 훅·도구 항목, 훅 시간 문단의 grill 훅
# 문장)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(대기열 299·302, 일지 2026-10-16-29).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 새 항목이 선례로 드는 함수 이름 하나, grill 훅 문장의 괄호에 든 워크트리 세션의 꼴. 둘 다 이 체크아웃의
#   `CLAUDE.md`·`README.md`·헌법 원칙·실험군이 읽는 파일·다른 rules 와 주 체크아웃의 `CLAUDE.md` 에는 없다(grep 으로 셌다).
#   origin/main 의 최근 커밋 제목 다섯에도 없다.
# 첫 판: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 커밋하기 전의 작업 트리, 두 갈래 모두 커밋 027a1dfc, 일지 2026-10-16-29).
# 최신 결과: 통과 4(2026-10-16, 같은 PC와 판, 셀프 리뷰를 반영한 커밋하기 전의 작업 트리, 두 갈래 모두 커밋 027a1dfc,
#   일지 2026-10-16-29). 반영이 새 항목의 머리 문장과 grill 문장의 짜임을 바꿔 사전 확인으로 갈음하지 않았다.
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_exec_boundary_and_grill.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 둘을 찾아 답하라. 읽은 파일의 코드에서 추측하지 않는다.
1. 경로로 고른 것을 실행하는 훅과 도구를 커밋 전에 반박해 보라는 항목이 있으면, 그 항목이 선례로 드는 함수 셋을 백틱 안의
   글자 그대로 옮겨라. 그런 항목이 없으면 "없음"이라고만 답하라.
2. Skill 호출에 붙는 훅이 계기를 내는 스킬 이름의 꼴을 적은 문장이 있으면, 그 문장의 괄호 안에 든 워크트리 세션의 꼴을
   백틱 안의 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["_linked_worktree", ".claude/worktrees/<이름>:grill-with-docs"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
