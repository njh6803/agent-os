# `.claude/rules/tools.md` 의 훅 시간 문단에 더한 것(편집 도구 셋에 붙는 변이 중 편집 훅이 무엇을 보는지)이 `paths` 에
# 맞는 파일을 Read 로 열 때 실리는지(대기열 358, 일지 2026-10-19-27).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 그 훅이 무엇만 본다고 적은 구절이다. 시간은 재지 않아 수가 없다.
# 훅 이름은 카나리아가 아니다. 커밋하지 않은 훅 파일이 세션의 git status 에 실린다(tools_rule_call_timeout_push_hook.toml).
# 최신 결과: 통과 4(2026-10-19, 이 PC, claude 2.1.302, 두 갈래 모두 커밋 a60e2ddd 위의 커밋하지 않은 작업 트리, 일지
#   2026-10-19-27).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_edit_during_mutate.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 답하라. 읽은 파일의 코드에서 추측하지 않는다.
Write·Edit·NotebookEdit 에 붙는다고 적힌 PostToolUse 훅 가운데 `tools/mutate.py` 의 표지를 찾는 훅이 있으면, 그 훅이
표지를 찾은 뒤 무엇만 본다고 적혔는지 그 구절을 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["표지의 pid가 살았는지만 본다"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
