# grilling에 더한 문단(결정이 절차를 바꾸면 합의 요약 전에 그 절차의 중간으로 들어오는 갈래를 밟는다, 대기열 396)이 새 세션에
# 실리는지. 카나리아는 그 문단의 첫 문장과 갈래 목록의 한 조각이다.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(6bd52b06)이다. 옛 판에는 카나리아가 없다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판의 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 대조군 `--control-commit 6bd52b06` 은 "없음" 둘, 실험군은 `6bd52b06` 위의
#   커밋 전 변경, 일지 2026-10-22-07).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 6bd52b06 .scratch/harness/probes/canary/grilling_entry_branches.toml <출력 디렉터리>
kind = "skill"
question = '''
grilling 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(인터뷰, 질문)은 하지 않고 본문만 읽는다.
본문에서 다음 둘을 각각 글자 그대로 옮겨라.
1) 결정이 에이전트가 따르는 절차를 바꿀 때, 합의 요약을 올리기 전에 할 일을 적은 문장(처음부터 마침표까지).
2) 그 바로 뒤 문장이 나열한 것 가운데 넷째.
본문에 그런 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["그 절차의 중간으로 들어오는 갈래를 하나씩 밟는다", "규약이 면제하는 단계"]
source = ".claude/skills/grilling/SKILL.md"
skill = "grilling"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../../../agent-canary-6bd52b06"
