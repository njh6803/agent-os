# `.claude/rules/tools.md` 에 더한 것(입력에서 고른 값을 남기는 도구의 허용 목록 항목, 지우는 도구 항목의 다른 견줌 문장,
# 기다리는 도구 항목의 시간 제한 검사)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(대기열 321·361·342).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 셋이다. 허용 목록 항목이 드는 선례 함수, 견줌을 한 함수로 모은 선례 함수, 시간 제한 없는 호출을 잡는 함수.
# 셋 다 파일 이름이 아니라 커밋하기 전의 작업 트리에서 돌려도 세션의 git status 에 실리지 않는다.
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_allowlist_comparisons_timeout_check.toml <출력 디렉터리>
# 최신 결과: 통과 4(2026-10-19, 이 PC, claude 2.1.302, 갈래 커밋 43a59020 위의 커밋하지 않은 판, 일지 2026-10-19-28).
# 셀프 리뷰 반영으로 원천 본문의 문구를 고친 뒤 사전 확인(`--preflight`)으로 갈음했다(2026-10-19, 일지 2026-10-19-28).
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 셋을 찾아 답하라. 읽은 파일의 코드에서 추측하지 않는다.
1. 입력에서 값을 골라 지우지 않는 저장소에 남기는 도구를 어느 쪽으로 지으라는 항목이 있으면, 그 항목이 선례로 드는
   함수 이름을 백틱 안의 글자 그대로 옮겨라. 그런 항목이 없으면 "없음"이라고만 답하라.
2. 지우거나 덮어쓰는 도구의 반박 시험이 판정을 깨는 입력을 찾았을 때 그 입력을 어디에 더 넣어 보라는 문장이 있으면,
   그 문장 뒤에 견줌을 한 함수로 모은 선례로 드는 함수 이름을 백틱 안의 글자 그대로 옮겨라. 그런 문장이 없으면
   "없음"이라고만 답하라.
3. 기다리거나 되풀이하는 도구가 부르는 외부 명령의 시간 제한을 말하는 항목이 있으면, 그 항목이 시간 제한 없는 호출을
   잡는다고 드는 함수 이름을 백틱 안의 글자 그대로 옮겨라. 그런 함수가 없으면 "없음"이라고만 답하라.
'''
expect = ["program_of", "same_branch", "calls_without_timeout"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
