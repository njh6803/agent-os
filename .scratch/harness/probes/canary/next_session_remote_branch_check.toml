# next-session "워크트리에서 병합할 때" 3(원격 정리)을 원격 브랜치가 없는지 보는 것으로 바꾼 것(대기열 497)이 새 세션에 실리는지.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판 3은 브랜치를 지우는 명령이라 세 카나리아가 모두 없다.
# 최신 결과: 통과 4(2026-10-28, 이 PC, PR 직전 리뷰를 반영한 워크트리 사본. `f4a6074c` 위의 커밋하지 않은 고침이었고
# 그 고침을 `64ee0233`으로 커밋했다. 대조군 주 체크아웃 `8e43dd2c`, 일지 2026-10-28-21). 실험군 셋이 `refs/heads/<브랜치>`를 든 새 명령을 옮겼다. 셀프 리뷰 전의 판
# (카나리아 둘)과 셀프 리뷰를 반영한 판(`5ccb51a0` 위, claude 2.1.302)도 통과 4였다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/next_session_remote_branch_check.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
그 본문의 "워크트리에서 병합할 때" 절의 3(원격 정리)에서 세 가지를 각각 글자 그대로 옮겨라.
1. 그 단계가 처음 치라는 명령 둘.
2. 원격에 그 브랜치가 아직 있고 PR이 병합됐을 때 무엇이 일어난 것인지와 할 일을 적은 문장.
3. 원격에 브랜치가 있는지 판정하지 못했을 때 쓰는 한 줄의 머리.
본문에 그런 것이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["--exit-code", "자동 삭제가 늦거나 돌지 않은 것이라", "원격 브랜치 미확인"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
