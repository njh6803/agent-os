# `.claude/rules/tools.md` 의 훅 시간 문단에 더한 것(새 일지 Write 에 도구를 자식으로 돌리는 훅의 등록 제한, 지우는 푸시를
# 막는 훅의 시간, 사용자 설정 출력을 막는 훅의 Read 시간)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(대기열 232·262·272,
# 일지 2026-10-16-21).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 셋이다. 새 일지 Write 의 등록 제한, 열린 PR 머리 지우기의 시간 범위, Read 에서 잰 시간 범위.
# 훅 이름은 카나리아가 아니다. 커밋하지 않은 훅 파일이 세션의 git status 에 실린다(tools_rule_call_timeout_push_hook.toml).
# 최신 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 커밋하기 전의 작업 트리 — 러너가 찍은 커밋은 96010123, 일지
#   2026-10-16-21). 셀프 리뷰를 반영하며 원천의 본문 문구만 고쳐(카나리아 셋은 그대로) 같은 PR·같은 판에서 사전 확인
#   (`--preflight`)으로 갈음했다. 통과 1.
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_guard_hooks.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 셋을 찾아 답하라. 읽은 파일의 코드에서 추측하지 않는다.
1. 새 일지 파일을 만든 Write 에서 다른 도구를 자식으로 돌린다고 적힌 문장이 있으면, 그 등록의 시간 제한을 글자 그대로
   옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
2. 열린 PR 의 머리 브랜치를 지우는 푸시에서 잰 시간의 범위가 적힌 문장이 있으면, 그 범위를 글자 그대로 옮겨라. 그런
   문장이 없으면 "없음"이라고만 답하라.
3. 파일을 열지 않고 경로만 푼다고 적힌 훅이 있으면, 그 훅을 Read 에서 잰 시간의 범위를 글자 그대로 옮겨라. 그런 문장이
   없으면 "없음"이라고만 답하라.
'''
expect = ["45초", "315~335ms", "181~191ms"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
