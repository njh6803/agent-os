# `.claude/rules/tools.md` 의 훅별 시간 항목에 더한 Skill 문장(대기열 250, `hook_security_review_journal`)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지(일지 2026-10-19-14).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 규칙 파일의 첫 제목과 새 훅이 계기를 내는 때의 설명이다. 훅 이름은 git 상태의 바뀐 경로에도 들어 고르지 않았다.
# 최신 결과: 통과 4(2026-10-19, 이 PC, claude 2.1.302, 러너는 `ebd09fb`의 `tools/canary.py`, 일지 2026-10-19-14).
# 실험군 둘의 `"없음" 섞임` 표시는 답이 옮긴 규칙 문장의 `(매처 없음)` 때문이고, 대조군은 "없음"만 답했다.
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_security_review_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, Skill 도구 호출에 붙는 훅들을 적은 문장이 있으면,
그 문장이 든 지시 파일의 첫 `#` 제목과, 내장 `security-review` 를 부를 때만 계기를 내는 훅이 무엇을 하라는 계기를 내는지 적은 구절을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["하네스 규칙", "그 보고를 다 쓴 턴에 일지로 옮기라는 계기를 낸다"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
