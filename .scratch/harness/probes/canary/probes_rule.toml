# `.claude/rules/probes.md` 가 `paths`(`.scratch/**/probes/**`)에 맞는 파일을 Read 로 열 때 실리는지(대기열 223).
# 실험군은 규칙의 paths 안(하위 폴더까지 든 프로브 파일), 대조군은 같은 `.scratch/` 의 paths 밖(plan.md)을 읽는다.
# 둘 다 이 체크아웃이다. 대조군을 `.scratch/` 안에 두어 glob 이 `.scratch/` 전체로 넓게 맞지 않는지도 본다.
# 카나리아는 둘이다. 규칙 파일의 첫 제목과, 표지 없는 회차가 있을 때 종료 코드를 어떻게 두는지의 조각이다.
# 최신 결과: 통과 4(2026-10-28, 이 PC, claude 2.1.302, 두 갈래 모두 `5ccb51a0` 위의 커밋하지 않은 판, 일지 2026-10-28-31). 셀프 리뷰가 규칙 셋째 항목을 고친 뒤 사전 확인으로 갈음했다(2026-10-28, 일지 2026-10-28-31).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/probes_rule.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 측정 스크립트에서 재려는 상황이 났다는 표지가 없는 회차가 하나라도 있을 때
그 스크립트의 종료 코드를 어떻게 두라는 문장이 있으면, 그 문장이 든 지시 파일의 첫 `#` 제목과,
종료 코드를 어떻게 두라는 조각을 각각 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["프로브 규칙", "탐침의 종료 코드를 0으로 두지 않는다"]
source = ".claude/rules/probes.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = ".scratch/harness/probes/commit_msg_hook/time_hook.py"

[[arm]]
name = "paths-밖"
role = "control"
target = ".scratch/plan.md"
