# `.claude/rules/tools.md` 의 훅 시간 문단에 더한 것(편집 도구 셋에 붙는 커밋 중 편집 훅의 시간 둘)이 `paths` 에 맞는 파일을
# Read 로 열 때 실리는지(대기열 293, 일지 2026-10-16-39).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 프로세스를 훑지 않는 길의 시간 범위와 훑는 길의 시간 범위.
# 훅 이름은 카나리아가 아니다. 커밋하지 않은 훅 파일이 세션의 git status 에 실린다(tools_rule_call_timeout_push_hook.toml).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_edit_during_commit.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 둘을 찾아 답하라. 읽은 파일의 코드에서 추측하지 않는다.
1. Write·Edit·NotebookEdit 에 붙는다고 적힌 PostToolUse 훅 가운데 프로세스를 읽는 훅이 있으면, 그 훅이 프로세스를
   훑지 않는 길에서 잰 시간의 범위를 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
2. 같은 훅이 프로세스를 훑는 길에서 잰 시간의 범위를 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["231~757ms", "325~667ms"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
