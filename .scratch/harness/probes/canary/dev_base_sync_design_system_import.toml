# sync-design-system 들이기(`import.md`)가 주 체크아웃의 브랜치 조건을 `main` 으로 못 박지 않고 루트 브랜치(`origin/dev` 가 있으면
# dev, 없으면 main)로 적은 문장이 새 세션에 실리는지(dev-base-skills-docs 티켓, ADR 0043). 실험군은 이 워크트리, 대조군은
# 옛 판을 든 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 그 문장이 없다. 병합 뒤에 다시 돌리려면 병합 전 커밋을
# `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-12, 이 PC, claude 2.1.322, 실험군은 `cd77e4096` 위의 커밋하지 않은 본문, 대조군은 주 체크아웃 `cd77e4096`, harness 티켓 dev-base-skills-docs).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/dev_base_sync_design_system_import.toml <출력 디렉터리>
kind = "skill"
question = '''
sync-design-system 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 웹에서 고친 디자인을 저장소로 들이는 일(들이기)을 다루는 하위 파일로 가리키는 것을 Read로 열고, 아래를 그 파일에서만 찾는다.
스킬 본문(SKILL.md)에 든 글은 옮기지 않는다. 본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
"주 체크아웃의 루트 브랜치다"로 시작하는 항목에서, `git branch --show-current`가 어떤 브랜치여야 하는지 설명한 구절을 글자 그대로 옮겨라.
'''
expect = ["루트 브랜치, 곧 origin/dev가 있으면 dev, 없으면 main"]
source = ".claude/skills/sync-design-system/import.md"
skill = "sync-design-system"
