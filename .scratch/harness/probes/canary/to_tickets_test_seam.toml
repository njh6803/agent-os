# to-tickets 5단계에 더한 옮기는 테스트의 이음매 확인(대기열 106)이 새 세션에 실리는지. to-tickets 는 모델이
# 부르지 못하는 스킬이라 질문 머리에 슬래시 명령으로 넣는다.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판에는 카나리아가 없다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/to_tickets_test_seam.toml <출력 디렉터리>
kind = "skill"
question = '''
/to-tickets
위에 실린 스킬 본문이 시키는 일(맥락 모으기, 저장소 탐색, 티켓 쓰기, 질문)은 하지 않는다. 본문만 보고 답한다.
본문의 5단계에서, 다른 사람이 제안한 테스트 문장을 티켓에 옮길 때 무엇을 확인하라고 적은 문장을 글자 그대로 옮겨라.
본문에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["지금 이음매(주입되는 포트, 시계)로 잴 수 있는지 코드로 본다"]
source = ".claude/skills/to-tickets/SKILL.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
