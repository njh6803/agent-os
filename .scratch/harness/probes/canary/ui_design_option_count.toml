# 프로젝트 스킬 `/ui-design`이 harness 티켓 033에서 고친 본문(와이어프레임 차례를 조건으로 두고, 안의 수 규칙을
# `docs/agents/issue-tracker.md` 화면 디자인 절에 두며, 고르기의 선택 화면이 안마다 선택지 하나를 담는다)을 새
# 세션에서 싣는지. 실험군은 이 워크트리, 대조군은 바뀌기 전 커밋 `8f0e5f81`이다(`--control-commit 8f0e5f81`).
# 그 커밋의 5번 항목은 "5~6을 와이어프레임으로"라 사이에 든 말이 없고, 6번 항목 첫 문장의 괄호에는
# "안마다 선택지 하나"가 없다.
# 최신 결과: 통과 4(2026-10-31, 이 PC, claude 2.1.312, 대조군 `8f0e5f81`은 둘 다 "없음", 일지 2026-10-31-05).
# 첫 판은 1번 물음의 카나리아를 `docs/agents/issue-tracker.md`로 골랐다가, 그 글이 대조군 본문에도 있고 바뀐 경로
# 이름이라 러너가 돌리기 전에 막았다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 8f0e5f81 .scratch/harness/probes/canary/ui_design_option_count.toml <출력 디렉터리>
kind = "skill"
question = '''
ui-design 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(플러그인 확인, 아티팩트 읽기와 만들기)은 하지 않고 본문만 읽는다.
두 가지를 차례대로 글자 그대로 옮겨라.
1. "순서" 절 5번 항목에서 "5~6을"과 그 뒤 처음 나오는 "와이어프레임으로" 사이에 든 말. 둘이 붙어 있어 사이에 든 말이 없으면 "없음".
2. "순서" 절 6번 항목 첫 문장의 괄호 안에서 "질문 하나에 화면 하나와" 바로 뒤에 오는 말을 쉼표 앞까지. 그 말이 없으면 "없음".
판단이나 설명은 덧붙이지 않는다. 그런 스킬이 없으면 "없음"이라고만 답하라.
'''
expect = ["그 차례에 든 화면의", "안마다 선택지 하나"]
source = ".claude/skills/ui-design/SKILL.md"
skill = "ui-design"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "바뀌기-전"
role = "control"
checkout = "../../.."
