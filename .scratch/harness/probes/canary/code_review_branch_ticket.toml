# code-review 2단계의 명세 출처에 더한 셋째 항목(브랜치가 가리키는 티켓 파일, 기능 티켓이면 그 디렉터리의 spec.md 도)이
# 새 세션에 실리는지(ADR 0037, ticket-for-every-pr 티켓 02). 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이
# 병합되기 전의 주 체크아웃(`caaa062b`)에는 카나리아가 없다. 병합 뒤에는 `caaa062b` 를 `--control-commit` 으로 준다
# (README `canary/` 행).
# 최신 결과: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 대조군 주 체크아웃 `caaa062b`, 일지 2026-10-22-09).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/code_review_branch_ticket.toml <출력 디렉터리>
kind = "skill"
question = '''
code-review 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(diff 보기, 서브에이전트 띄우기, 리뷰)은 하지 않고 본문만 읽는다.
본문에서 "Look for the originating spec"으로 시작하는 문장 아래 번호 목록의 셋째 항목을 글자 그대로 옮겨라.
판단이나 설명은 덧붙이지 않는다. 본문에 그런 목록이 없으면 "없음"이라고만 답하라.
'''
expect = [
  "브랜치가 가리키는 티켓 파일",
  "그 기능 디렉터리의 spec.md도 명세다",
]
source = ".claude/skills/code-review/SKILL.md"
skill = "code-review"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
