# CLAUDE.md 교정 루프의 셋째 줄(새 검사·훅·지침 문장은 같은 실수의 세 번째나 손상 한 번에 더한다, ADR 0036)이 새 세션에
# 실리는지(일지 2026-10-20-07). CLAUDE.md 는 매 세션 실리므로 규칙 갈래의 모양만 빌린다. 두 갈래 모두 같은 pyproject.toml 을
# 읽고 체크아웃만 다르다. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 카나리아가
# 없다. 워크트리 세션에는 주 체크아웃의 `CLAUDE.md`가 실리지 않아(`.scratch/harness/probes/claude_md_parent.py`, 대기열 171)
# 실험군의 통과는 워크트리 사본이 실렸다는 뜻이다. 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판을 `--control-commit` 으로 준다
# (README `canary/` 행).
# 최신 결과: 통과 4(2026-10-20, 이 PC, claude 2.1.302, 대조군 주 체크아웃 `be04b6e1`, 일지 2026-10-20-07).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/claude_md_addition_threshold.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 프로젝트 지시의 "교정 루프" 절에서, 새 검사·훅·지침 문장을 언제 더하는지 적은 문장을 글자 그대로 옮겨라.
읽은 파일에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["같은 실수의 세 번째이거나 손상이 한 번 났을 때 더한다"]
source = "CLAUDE.md"

[[arm]]
name = "워크트리"
role = "experiment"
target = "pyproject.toml"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
target = "pyproject.toml"
