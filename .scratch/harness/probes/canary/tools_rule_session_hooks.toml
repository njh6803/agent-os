# `.claude/rules/tools.md` 의 훅별 시간 항목에서 고친 SessionStart 문장(클라우드 세션의 훅이 git 훅 설치와
# pnpm 을 차례로 기다리는 것, 새로 본 3.5초)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(일지 2026-10-07-10).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 셋이다. 규칙 파일의 첫 제목, 클라우드 세션에서 기다리는 두 설치의 조각, 새로 더한 시간 조각.
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_session_hooks.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 세션이 시작되거나 이어질 때 붙는 훅이 클라우드 세션에서 무엇을 기다리는지 적은 문장이 있으면,
그 문장이 든 지시 파일의 첫 `#` 제목, 그 문장에서 클라우드 세션이 기다리는 것을 적은 조각, 그 훅을 부른 시간 가운데 `.venv`를 치운 뒤의 값을 적은 문장을 각각 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["하네스 규칙", "`uv run pre-commit install`과 pnpm을 차례로 기다리며", "uv 캐시가 찬 채 약 3.5초"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
