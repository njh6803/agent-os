# next-session 지시문 형식에 더한 "모델" 줄과 결정표의 "모델" 칸(ADR 0029)이 새 세션에 실리는지.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판에는 두 카나리아가 모두 없다.
# 최신 결과: 통과 4(2026-10-12, 이 PC, claude 2.1.296, 일지 2026-10-12-37).
# 2026-10-29 harness 027 이 지시문 형식을 `directive.md` 로 옮겨 "모델" 줄 물음과 그 기대를 뺐다. 그 기대는
#   `directive.md` 를 원천으로 둔 `next_session_label_ticket_notice.toml` 의 기대에 든다. 남은 결정표 물음은
#   SKILL.md 에 그대로 있어 사전 확인만 했다(대조군인 옮기기 전 커밋도 그 칸을 들어 대조가 서지 않는다).
# 2026-10-31 harness 031 이 이 `expect` 의 글을 `directive.md` 2 의 잇는 지시문으로 고쳐 써 지금 원천에는 없다. 그 뒤의
#   확인은 `next_session_continue_ladder.toml` 과 `next_session_ladder_rows.toml` 이 한다. 이 명세는 기록으로 둔다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/next_session_model_line.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
그 본문의 다음 작업 결정표에서 "작업을 마치지 못한 채 끊는다" 행의 맨 끝 칸을 글자 그대로 옮겨라.
본문에 그런 것이 없으면 "없음"이라고만 답하라.
'''
expect = ["남은 것이 PR 반영·병합뿐이면"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
