# 더한 문장(대기열 341)이 새 세션에 실리는지. 카나리아는 그 문장의 두 조각이다.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(6bd52b06)이다. 옛 판에는 그 문장이 없고 일지가 4, 병합 길이 3이다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판의 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 옮기기 전 결과: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 대조군 `--control-commit 6bd52b06` 은 "없음", 실험군은 `6bd52b06` 위의
#   커밋 전 변경, 일지 2026-10-22-11).
# 2026-10-29 harness 027 이 본문을 `merge.md` 로 옮겨 하위 파일 갈래(`skill_body = "files"`)로 바꿨다.
#   대조군은 옮기기 전 커밋 `37759ef2` 을 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-29, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `37759ef2`), 대조군 `--control-commit 37759ef2`, 일지 2026-10-29-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 37759ef2 .scratch/harness/probes/canary/next_session_journal_before_merge.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 PR을 연 세션이 병합까지 마칠 때 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
일지 항목에서, 단계를 닫는 세션이 회고와 "다음"까지 마친 일지를 언제 푸시하라고 적은
문장을 찾아 처음부터 마침표까지 글자 그대로 옮기고, 그 바로 뒤 문장도 처음부터 첫
쉼표까지 글자 그대로 옮겨라.
'''
expect = ["4(병합 길)의 `headRefOid` 대조 전에 푸시한다", "늦어도 마지막 봇 회차의 커밋에 싣고"]
source = ".claude/skills/next-session/merge.md"
skill = "next-session"
skill_body = "files"

[[arm]]
name = "워크트리"
