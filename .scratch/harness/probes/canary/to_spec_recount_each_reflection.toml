# to-spec 3단계에서 서두의 수를 다시 세는 때를 셀프 리뷰 뒤에서 병합 전의 반영마다로 넓힌 문장(대기열 207)이
# 새 세션에 실리는지. to-spec 은 모델이 부르지 못하는 스킬이라 질문 머리에 슬래시 명령으로 넣는다.
# 실험군은 이 워크트리, 대조군은 바뀌기 전 판이다. 이 PR 안에서는 주 체크아웃(`c1903e0`)이 그 판이다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 그 커밋을 `--control-commit` 으로
# 준다(README `canary/` 행).
# 첫 판의 2번은 "그 때에 셀프 리뷰 말고 무엇이 드는지"를 물었고, 실험군 한 회차가 셀프 리뷰를 든 차례 문장을
# 옮겨 통과 3·실패 1이었다. 그래서 차례 문장은 답이 아니라고 밝혔다.
# 최신 결과: 통과 4(2026-10-12, 이 PC, claude 2.1.296, 대조군 주 체크아웃 `c1903e0`, 일지 2026-10-12-43).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/to_spec_recount_each_reflection.toml <출력 디렉터리>
kind = "skill"
question = '''
/to-spec
위에 실린 스킬 본문이 시키는 일(저장소 탐색, 명세 쓰기, 질문)은 하지 않는다. 본문만 보고 답한다.
1) Process 의 3단계에서, 서두에 적은 수를 언제 다시 세어 고치라고 적은 문장을 글자 그대로 옮겨라.
2) 같은 3단계에서, 그 다시 세는 때에 셀프 리뷰 밖의 어떤 리뷰 반영이 드는지 적은 문장을 글자 그대로 옮겨라. 할 일의 차례(셀프 리뷰, 수 세기, 승인, 커밋)를 늘어놓은 문장은 답이 아니다.
본문에 그런 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["병합 전에 본문을 고치는 반영마다", "PR 봇 회차(같은 절 3)의 반영도 그 반영이다"]
source = ".claude/skills/to-spec/SKILL.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
