# `.claude/rules/tools.md` 에 더한 둘(하류처럼 읽는 막는 훅 항목 끝의 자기 파서 문장, 못 보는 것 항목 끝의 막는 대상
# 문장)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(대기열 291·292, 일지 2026-10-16-24).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이고, 둘 다 그 항목에만 있고 이 체크아웃의 `CLAUDE.md`·`README.md`·헌법 원칙·실험군이 읽는 파일·다른
#   rules 에는 없는 글이다(grep 으로 셌다). origin/main 의 최근 커밋 제목 다섯에도 없다.
# 최신 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, PR 직전 리뷰를 반영한 커밋 전의 작업 트리, 두 갈래 모두 커밋 f24a9317,
#   일지 2026-10-16-24). 첫 판은 커밋 60ae59cc 위에서 통과 4였다.
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_parser_texts_and_intent.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 둘을 찾아 답하라. 읽은 파일의 코드에서 추측하지 않는다.
1. 막는 훅의 자기 파서가 하류를 다 따르지 못하는 자리를 다루는 문장이 있으면, 그 문장과 바로 뒤 문장이 보라고 한 글을
   모두 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
2. 막는 훅의 독스트링 머리에 막는 대상을 적으라는 문장이 있으면, 그 문장이 든 일부러 하는 우회의 예를 괄호 안의 글자
   그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["벗기지 않은 글", "한 글자씩"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
