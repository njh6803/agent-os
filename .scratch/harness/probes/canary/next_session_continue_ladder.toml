# next-session `directive.md` 2의 잇는 지시문과 사다리(ADR 0029 이력 2026-10-31, harness 031)가 새 세션에 실리는지.
# 같은 티켓을 잇는 지시문(끊는 줄, 인계 줄)의 모델을 내는 지시문의 "다음 단계" 줄로 고르고, 막혀서 넘길 때만 사다리로 한 단계
# 올리는 규칙이다. 옛 칸 문장(스윕 갈래, 열린 PR 유무, Fable 갈래)을 기대하던 `next_session_model_line.toml`,
# `next_session_fable_cut_row.toml`, `next_session_handoff_fable.toml`의 그 자리를 이 명세와 `next_session_handoff_model.toml`이 잇는다.
# 실험군은 이 워크트리, 대조군은 스윕 도구를 지우기 전 커밋 `f01ce1e9`이다.
# 첫 결과: 물음 넷(1~4)으로 통과 4, "없음" 섞임 3(2026-10-31, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은
#   본문(러너가 찍은 커밋은 `f01ce1e9`), 대조군 `--control-commit f01ce1e9`, 일지 2026-10-31-03). 섞임 셋은 모두 1번 답이 옮긴
#   원문 구절에 든 `없음`(`그 줄이 없거나 없음이면`)이다(원본 로그를 손으로 봤다). 대조군은 네 물음 모두 "없음"이었다.
#   그 뒤 셀프 리뷰가 규칙 이름(이어 가기 → 잇는 지시문)과 2의 문장을 고쳐 물음 5~8을 더했다. 다시 돈 결과는 아래 줄이다.
# 둘째 결과: 물음 여덟으로 통과 4, "없음" 섞임 3(2026-10-31, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문,
#   대조군 `--control-commit f01ce1e9`, 일지 2026-10-31-03). 섞임 셋은 모두 1번 답이다. 둘은 옮긴 원문 구절에 든 `없음`이고,
#   하나는 "없음."이라고 쓴 뒤 같은 구절을 옮겼다(러너 출력의 답을 손으로 봤다). 대조군은 여덟 물음 모두 "없음"이었다.
#   그 뒤 PR 직전 `bug-perf-review`가 사다리의 올리는 기준(잇는 값만 보면 리뷰 반영에서 막힌 구현 세션보다 낮은 모델이 받는다)과
#   `get_session`의 `model` 꼴을 짚어 2를 고치고 물음 9~10을 더했다. 다시 돈 결과는 아래 줄이다.
# 최신 결과: 물음 열로 통과 4, 실패 0, "없음" 섞임 3(2026-10-31, 이 PC, claude 2.1.312, 실험군 커밋 `0e716068` 위의 커밋하지 않은 본문, 대조군
#   `--control-commit f01ce1e9`, 일지 2026-10-31-03). 섞임 셋은 모두 1번 답이다. 둘은 옮긴 원문 구절의 `없음`이고 하나는 "없음."이라고
#   쓴 뒤 같은 구절을 옮겼다. 대조군은 열 물음 모두 "없음"이었다. 한 회차가 2번에 `2의 잇는 지시문`을 답해, 줄 끝에서 두 표지가
#   놓이는 자리를 문구로 정하고 `--preflight`로 갈음했다(러너 출력의 답을 손으로 봤다).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit f01ce1e9 .scratch/harness/probes/canary/next_session_continue_ladder.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 지시문의 형식과 칸마다의 규칙을 적은 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
1. 같은 티켓을 잇는 지시문의 모델을 고를 때, "다음 단계"가 구현이면 어떻게 한다고 적혀 있으면 그 구절을
그대로 옮겨라.
2. 이 세션이 막혀서 모델을 올렸을 때 "모델" 줄 끝에 적는 말을 그대로 옮겨라.
3. 막힌 것에 들지 않는 넘김을 적은 문장을 그대로 옮겨라.
4. 티켓이 바뀌면 모델을 어디서 다시 고른다고 적혀 있으면 그 문장을 그대로 옮겨라.
5. 1번과 같은 자리에서 "다음 단계"가 PR 반영·병합일 때 고르는 값을 적은 구절을 그대로 옮겨라.
6. 1번과 같은 자리에서 "다음 단계"가 설계 인터뷰나 명세일 때 고르는 값을 적은 구절을 그대로 옮겨라.
7. 앞 세션이 사다리로 올린 값이 그대로 가는 경우를 적은 문장을 그대로 옮겨라.
8. 그 "다음 단계" 값을 끊을 때와 인계할 때 무엇에 따라 정한다고 적혀 있으면 그 구절을 그대로 옮겨라.
9. 막혀서 사다리로 올릴 때 무엇을 기준으로 올린다고 적혀 있으면 그 구절을 그대로 옮겨라.
10. 1번의 괄호에서 `get_session`이 보이는 `model` 값을 "모델" 줄에 어떻게 적는다고 적혀 있으면 그 구절을 그대로 옮겨라.
'''
expect = [
  "구현이면 이 세션의 지시문 \"모델\" 줄의 값을 그대로 잇는다",
  "막혀 한 단계 올렸다",
  "컨텍스트가 차서 넘기는 것은 막힌 것이 아니다",
  "티켓이 바뀌면 결정표의 칸에서 다시 시작한다",
  "`PR 반영·병합`이면 `Sonnet 5.5 / high`",
  "설계 인터뷰나 명세면 `Fable 5.1 / xhigh`",
  "사다리로 올린 값이 그대로 가는 것은 구현을 이을 때뿐이다",
  "끊든 인계하든 `handoff.md` 인계 줄의 \"다음 단계\" 항목대로 정한다",
  "그 값과 이 세션의 값(구현을 이을 때 읽는 그 자리) 가운데 사다리에서 높은 쪽",
  "모델 메뉴의 이름 `Opus 5.5`로 바꿔 적는다",
]
