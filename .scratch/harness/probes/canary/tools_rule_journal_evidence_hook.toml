# `.claude/rules/tools.md` 의 훅별 시간 항목에 더한 여섯째 Write·Edit 훅의 설명(대기열 445, `hook_journal_evidence`)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지(harness 티켓 010).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 규칙 파일의 첫 제목과 여섯째 훅의 설명이다. 훅 이름은 git 상태의 새 파일에도 들어 고르지 않았다.
# 최신 결과: 통과 4(2026-10-26, 이 PC, claude 2.1.302, 러너가 찍은 커밋 92b61458 위의 커밋하지 않은 판, 일지 2026-10-27-06).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_journal_evidence_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, Write·Edit 도구 호출 뒤(PostToolUse)에 붙는 훅들을 나열한 문장이 있으면,
그 문장이 든 지시 파일의 첫 `#` 제목과, 그 문장이 여섯째 훅이 무엇을 볼 때 무엇을 만든다고 적은 설명을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["하네스 규칙", "일지일 때만 표지 파일 하나를 만든다"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
