# `.claude/rules/tools.md` 의 못 보는 것 항목에 더한 문장(항목마다 그 입력을 테스트로 고정하고, 거짓 음성과
# 거짓 양성을 각각 어떻게 단언하는지)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(대기열 187).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 셋이다. 규칙 파일의 첫 제목, 항목마다 할 일의 조각, 놓치는 것을 단언하는 조각. 질문은 바뀐 본문을
# 드러내지 않게 항목과 테스트를 잇는 문장들을 통째로 옮기게 한다.
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_unseen_pinned.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 훅과 검사의 독스트링에 적는 "못 보는 것" 항목을 테스트와 어떻게 잇는지 적은 문장이 있으면,
그 지시가 든 파일의 첫 `#` 제목과 그 문장들을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["하네스 규칙", "그 입력을 테스트 하나로 고정한다", "지나간다고"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
