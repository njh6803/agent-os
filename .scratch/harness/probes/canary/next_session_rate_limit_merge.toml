# next-session에 더한 claude-review 계정 한도 빨강의 병합 길(대기열 165)이 새 세션에 실리는지.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판에는 두 카나리아가 모두 없다.
# 옮기기 전 결과: 통과 4(2026-10-13, 이 PC, claude 2.1.296, 1단계를 하위 항목으로 나눈 뒤, 대조군 옛 판 `4d34bee`, 일지 2026-10-13-35).
#   그 앞: 통과 4(2026-10-12, 이 PC, claude 2.1.296, 일지 2026-10-12-35). 그 뒤 1단계 새 문장의 주어를
#   `/git-pr-merge`로 밝혀 적은 것과, PR 직전 리뷰를 반영해 "워크트리에서 병합할 때" 1에 `UNSTABLE`을, 그 절의 "끝:"에
#   "4를 거쳤으면"을 더한 것은 사전 확인으로 갈음했다(2026-10-12, 일지 2026-10-12-35).
# 2026-10-29 harness 027 이 본문을 `merge.md` 로 옮겨 하위 파일 갈래(`skill_files`)로 바꿨다.
#   대조군은 옮기기 전 커밋 `37759ef2` 을 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-29, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `37759ef2`), 대조군 `--control-commit 37759ef2`, 일지 2026-10-29-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 37759ef2 .scratch/harness/probes/canary/next_session_rate_limit_merge.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 PR을 연 세션이 병합까지 마칠 때 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
1. "워크트리에서 병합할 때" 절의 1(확인)에서, `gh pr checks`의 실패에 붙은 예외를 적은
구절을 글자 그대로 옮겨라.
2. 병합 길 항목에서, 주 체크아웃의 병합 스킬(`/git-pr-merge`)이 멈추는 경우를 다룬 문장을
글자 그대로 옮겨라.
3. 같은 항목에서, 병합하기 전에 사용자의 뜻을 물을지에 관해 적은 문장을 글자 그대로
옮겨라.
'''
expect = ["claude-review가 계정의 주간 사용량 한도로만 빨가면 실패로 세지 않고", "실패가 claude-review의 계정 한도뿐이면", "병합할지는 사용자에게 묻지 않는다"]
source = ".claude/skills/next-session/merge.md"
skill = "next-session"
skill_files = true

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
