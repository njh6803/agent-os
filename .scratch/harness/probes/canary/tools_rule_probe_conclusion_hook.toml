# `.claude/rules/tools.md` 의 훅별 시간 항목에 더한 Write·Edit 훅 `hook_probe_conclusion` 의 설명(대기열 346)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지(일지 2026-10-20-34).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 규칙 파일의 첫 제목과 그 훅의 설명이다. 훅 이름은 git 상태의 새 파일에도 들어 고르지 않았다.
# 2026-11-05 에 harness 티켓 042 가 시간 항목을 하위 항목으로 나눠 "다섯째 훅"의 설명이 `hook_probe_conclusion` 항목이 됐다.
#   물음을 훅 이름으로 고쳤다.
# 최신 결과: 통과 4, 실패 0, "없음" 섞인 통과 0(2026-11-08, 이 PC, 러너가 찍은 커밋 dd1c0190 위의 커밋하지 않은 판,
#   대조군은 "없음", harness 티켓 probe-conclusion-fixed-path-in-probe-file). 단언(expect)은 제목과 첫 문장 둘뿐이라 대기열 535 가
#   더한 둘째 문장이 실렸는지는 이 결과가 보이지 않는다. claude 판은 이 줄을 쓰며 적어 두지 않았다.
# 그 전 결과: 통과 4, 실패 0, "없음" 섞인 통과 0(2026-11-05, 이 PC, claude 2.1.318, 러너가 찍은 커밋 77bb7c59 위의 커밋하지 않은 판,
#   대조군은 "없음", 일지 2026-11-05-05, harness 티켓 042).
# 그 전의 전 결과: 통과 4(2026-10-20, 이 PC, claude 2.1.302, 러너가 찍은 커밋 77ecd319 위의 커밋하지 않은 판, 일지 2026-10-20-34).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_probe_conclusion_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, Write·Edit 도구 호출 뒤(PostToolUse)에 붙는 훅 `hook_probe_conclusion` 을 설명한 항목이 있으면,
그 항목이 든 지시 파일의 첫 `#` 제목과, 그 항목이 이 훅이 무엇을 볼 때 무엇을 만든다고 적은 설명을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["하네스 규칙", "프로브 README일 때만 표지 파일 하나를 만든다"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
