kind = "skill"
question = '''
grilling 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(인터뷰, 질문)은 하지 않고 본문만 읽는다.
본문에서 다음 둘을 각각 글자 그대로 한 문장씩 옮겨라.
1) 선택지 설명에 넣는 사실을 확인하지 못했을 때 할 일을 적은 문장.
2) 사용자의 답을 다른 자리로 옮길 때 무엇을 옮기는지 적은 문장.
본문에 그런 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["확인하지 못한 사실은 설명에 어림이라고 적는다", "라벨과 함께 고른 선택지의 설명을 글자 그대로 옮기고"]
