# code-review 4단계 주장 검증 7(근거의 종류)에 더한 웹 요약(대기열 124)이 새 세션에 실리는지.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(a8e349c)이다. 옛 판에는 카나리아가 없다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판의 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4(2026-10-12, 이 PC, claude 2.1.296, 대조군 `a8e349c`, 일지 2026-10-12-27).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit a8e349c .scratch/harness/probes/canary/code_review_web_summary.toml <출력 디렉터리>
kind = "skill"
question = '''
code-review 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(리뷰, 서브에이전트)은 하지 않고 본문만 읽는다.
4단계에서 두 축 브리프에 넣는 주장 검증 목록 가운데, 근거의 종류를 다루는 항목을 글자 그대로 옮겨라.
본문에 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["어림·웹 요약(WebFetch가 준 수와 인용)이 측정이나 원문처럼 적혔으면 낸다"]
source = ".claude/skills/code-review/SKILL.md"
skill = "code-review"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../../../agent-canary-a8e349c"
