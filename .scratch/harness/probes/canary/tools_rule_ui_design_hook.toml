# `.claude/rules/tools.md` 의 Write·Edit 훅 목록에 더한 디자인 폴더 계기 훅의 문장(harness 티켓 002)이 `tools/` 의 파일을
# Read 로 열 때 실리는지. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃(`aba71813`)에는
# 카나리아가 없다. 병합 뒤에는 `aba71813` 을 `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 대조군 주 체크아웃 `aba71813` 은 "없음", 일지 2026-10-22-15).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_ui_design_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, Write·Edit 에 붙는 PostToolUse 훅들을 차례로 설명하는 문장에서 "여섯째도"로 시작하는
괄호 속 문장을 글자 그대로 옮겨라. 읽은 파일에서 추측하지 않는다. 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["기능의 디자인 폴더 아래일 때만 표지 파일 하나를 만든다"]
source = ".claude/rules/tools.md"

[[arm]]
name = "워크트리"
role = "experiment"
target = "tools/sibling_overlap.py"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
target = "tools/sibling_overlap.py"
