# `.claude/rules/tools.md` 의 Write·Edit 훅 목록에 더한 디자인 폴더 계기 훅의 문장(harness 티켓 002)이 `tools/` 의 파일을
# Read 로 열 때 실리는지. 처음 판은 실험군이 이 워크트리, 대조군이 주 체크아웃(`aba71813`, `--control-commit`)이었다. 지금 판은
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 2026-11-05 에 harness 티켓 042 가 시간 항목을 하위 항목으로 나눠 "일곱째도"로 시작하는 괄호가 `hook_ui_design` 항목이 됐다. 물음을
#   훅 이름으로 고쳤다. 그 문장은 이 PR 전의 main 에도 있으므로 대조군은 주 체크아웃 대신 규칙의 paths 밖(README.md)을 읽는다.
# 최신 결과: 통과 4, 실패 0, "없음" 섞인 통과 0(2026-11-05, 이 PC, claude 2.1.318, 러너가 찍은 커밋 77bb7c59 위의 커밋하지 않은 판,
#   대조군은 "없음", 일지 2026-11-05-05, harness 티켓 042).
# 그 전 결과: 통과 4(2026-10-26, 이 PC, claude 2.1.302, 일지 훅이 여섯째로 들어 질문을 "일곱째도"로 고친 판. 실험군 커밋
# 92b61458 위의 커밋하지 않은 판, 대조군 `--control-commit aba71813` 은 "없음", 일지 2026-10-27-06).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_ui_design_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, Write·Edit 에 붙는 PostToolUse 훅 `hook_ui_design` 을 설명한 항목에서 그 훅이 경로를 보고
언제 표지 파일을 만든다고 적은 구절을 글자 그대로 옮겨라. 읽은 파일에서 추측하지 않는다. 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["기능의 디자인 폴더 아래일 때만 표지 파일 하나를 만든다"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/sibling_overlap.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
