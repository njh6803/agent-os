# `.claude/rules/tools.md` 의 훅별 시간 항목에 더한 Bash 의 넷째 PostToolUse 훅 설명(대기열 501, `hook_journal_evidence`)과
# 다섯째 훅 설명(대기열 431, `hook_pyright_unchecked_path`)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(harness 티켓 019와
# `pyright-unchecked-path-hook`). 질문과 `expect` 는 다섯째를 더하며 훅마다의 설명을 모두 옮기게 고쳤다.
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 규칙 파일의 첫 제목과 Bash 에 더 붙는 훅의 설명이다. 훅 이름은 git 상태의 바뀐 파일에도 들어 고르지 않았다.
# 최신 결과: 통과 4(2026-11-11, 이 PC, claude 2.1.322, 러너가 찍은 커밋 f64dfe41c 위의 커밋하지 않은 판, 훅 둘을 옮기게 고친 질문과 expect 로, 일지 2026-11-11-1050-pyright-unchecked-path-hook). 이전: 통과 4(2026-10-28, claude 2.1.302, 커밋 7d27ae45, 일지 2026-10-28-14).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_journal_evidence_bash.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, Bash 도구 호출 뒤(PostToolUse)에 붙는 훅의 수를 센 문장이 있으면,
그 문장이 든 지시 파일의 첫 `#` 제목과, 그 문장이 Bash 에만 더 붙는다고 든 훅마다 무엇을 볼 때 무엇을 만든다고 적은 설명을 모두 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = [
    "하네스 규칙",
    "명령 글만 보고 일지를 쓰는 꼴일 때만 표지 파일 하나를 만드는",
    "분석하지 않는 경로를 준 명령일 때만 표지 파일 하나를 만드는",
]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
