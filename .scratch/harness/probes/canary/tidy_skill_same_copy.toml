# 대조군이 새 사본이면 러너가 막는지. 막히는 것이 기대다. 실험군은 이 워크트리, 대조군은 주 체크아웃이다.
# 처음(주 체크아웃이 cbb6a6c)에는 돌린 뒤의 대조군 판정이 잡았고(종료 1), 원천 확인(대기열 133) 뒤로는 돌리기
# 전에 대조군 사본의 원천에 카나리아가 있다며 막는다(종료 2). 카나리아 낱말 EnterWorktree 는 "부르는 곳"
# 줄이 없는 옛 판(9a7821b)의 잠금 절에도 있어, 주 체크아웃이 그 판이어도 막힌다. 카나리아가 바뀐 본문에만
# 있는 글이 아니어서다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/tidy_skill_same_copy.toml <출력 디렉터리>
kind = "skill"
question = '''
tidy-checkouts 스킬을 Skill 도구로 불러 본문을 읽어라.
그 본문의 "부르는 곳" 절에서, 워크트리에서 병합한 세션이 연 새 세션이 첫 턴에 이 스킬을 어느 도구보다 먼저 부른다고 하는지,
그 도구의 이름을 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["EnterWorktree"]
source = ".claude/skills/tidy-checkouts/SKILL.md"
skill = "tidy-checkouts"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
