# 대조군이 새 사본이면 러너가 실패로 보는지(대조군 판정의 실제 실행). 실패가 기대다.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 2026-10-07 에 주 체크아웃을 origin/main(cbb6a6c)으로
# 당긴 뒤라 두 사본의 tidy-checkouts 가 같다. 주 체크아웃이 다른 브랜치면 결과가 달라진다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/tidy_skill_same_copy.toml <출력 디렉터리>
kind = "skill"
question = '''
tidy-checkouts 스킬을 Skill 도구로 불러 본문을 읽어라.
그 본문의 "부르는 곳" 절에서, 워크트리에서 병합한 세션이 연 새 세션이 첫 턴에 이 스킬을 어느 도구보다 먼저 부른다고 하는지,
그 도구의 이름을 글자 그대로 옮겨라. 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["EnterWorktree"]
skill = "tidy-checkouts"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
