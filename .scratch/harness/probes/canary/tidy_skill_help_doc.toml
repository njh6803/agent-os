# tidy-checkouts 스킬 3에 더한 문장(독스트링은 도구의 `--help` 로 보고 도구 파일은 Read 로 열지 않는다,
# 대기열 271)이 새 세션에 실리는지. 실험군은 이 체크아웃, 대조군은 바뀌기 전 커밋이다. 대조군 칸에는
# 체크아웃을 두지 않아, `--control-commit` 없이 돌리면 사전 확인이 대조군 사본의 카나리아로 막는다.
# 최신 결과: 통과 4(2026-10-19, 클라우드 컨테이너, claude 2.1.303, 대조군 바뀌기 전 커밋 `b146831`,
# 셀프 리뷰를 반영해 스킬 3에 거르는 문장을 더한 판으로 다시 돌렸다, 일지 2026-10-19-14).
# 돌리는 법: 이 체크아웃 루트에서
#   uv run python tools/canary.py --control-commit <바뀌기 전 커밋> .scratch/harness/probes/canary/tidy_skill_help_doc.toml <출력 디렉터리>
kind = "skill"
question = '''
tidy-checkouts 스킬을 Skill 도구로 불러 본문을 읽어라. 본문이 시키는 일(git, 도구 실행, 세션 조회)은 하지 않는다. 본문만 보고 답한다.
그 본문의 3에서 두 가지를 글자 그대로 옮겨라.
하나, 판정 도구의 독스트링을 볼 때 치는 명령 전체.
둘, 그 명령 바로 뒤에서 도구 파일과 상수를 각각 어떻게 보라고 적은 문장.
판단이나 설명은 덧붙이지 않는다. 본문 3에 그런 명령이나 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["tools/tidy_checkouts.py --help", "Read로 열지 않고 상수는 Grep으로 본다"]
source = ".claude/skills/tidy-checkouts/SKILL.md"
skill = "tidy-checkouts"

[[arm]]
name = "실험군"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
