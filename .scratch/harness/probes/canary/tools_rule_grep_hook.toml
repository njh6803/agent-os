# `.claude/rules/tools.md` 의 훅별 시간 항목에 더한 Grep 문장(대기열 145, `hook_grep_omitted` 와 그 시간)이
# `paths` 에 맞는 파일을 Read 로 열 때 실리는지(일지 2026-10-13-63).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 셋이다. 규칙 파일의 첫 제목, 훅 이름, 새로 잰 시간의 범위.
# 최신 결과: 통과 4(2026-10-13, 이 PC, claude 2.1.296, 일지 2026-10-13-63).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_grep_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, Grep 도구 호출 뒤(PostToolUse)에 붙는 훅과 그 훅 한 번의 시간을 적은 문장이 있으면,
그 문장이 든 지시 파일의 첫 `#` 제목, 그 훅의 이름, 그 시간의 범위를 적은 조각을 각각 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["하네스 규칙", "hook_grep_omitted", "258~523ms"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
