# `.claude/rules/probes.md` 셋째 항목(해석은 갈래로 가른 뒤에 일반화한다)에 더한 계기 훅의 포인터와 그 까닭(대기열 346)이
# `paths`(`.scratch/**/probes/**`)에 맞는 파일을 Read 로 열 때 실리는지(일지 2026-10-20-34).
# 실험군은 이 명세를 부른 체크아웃의 프로브 파일, 대조군은 포인터를 더하기 전 판(77ecd319)의 같은 파일이다.
# 카나리아는 포인터 문장에만 있는 조각 둘이다. 훅 파일 이름은 git 상태의 새 파일에도 들어 고르지 않았다.
# 최신 결과: 통과 4(2026-10-28, 이 PC, claude 2.1.302, 실험군 `5ccb51a0` 위의 커밋하지 않은 판·대조군 77ecd319, 일지 2026-10-28-31). 셀프 리뷰가 규칙 셋째 항목을 고친 뒤 사전 확인으로 갈음했다(2026-10-28, 일지 2026-10-28-31). 그 전: 통과 4(2026-10-26, 이 PC, claude 2.1.302, 실험군 커밋 45e489b1·대조군 77ecd319, 일지 2026-10-26-09).
# 2026-10-28(claude 2.1.302, 실험군 `7d27ae45` 위의 커밋하지 않은 판, 일지 2026-10-28-12, 대조군 77ecd319)에 두 번 돌렸다. 대조군은 두 번 다 통과였고,
# 실험군 여섯 회차 가운데 셋은 통과, 셋은 Sonnet 5.5 의 안전 장치 거절(`API Error: … safeguards flagged`)로
# 답을 내지 못했다. 거절은 측정이 아니다. 그날 바꾼 것은 규칙의 첫 항목이고 이 명세가 묻는 셋째 항목은 아니다.
# 대조군은 첫 물음에 "없음"이라 답하고 둘째 물음에는 항목 안 대기열 179 사례의 다른 문장을 옮겼다.
# `--control-commit` 없이 돌리면 대조군이 새 사본이라 카나리아를 옮겨 실패한다(같은 일지).
# 돌리는 법: 워크트리 루트에서
#   uv run python tools/canary.py --control-commit 77ecd319 .scratch/harness/probes/canary/probes_rule_conclusion_hook.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 탐침이 고른 해석을 일반화하기 전에 갈래로 가르라는 항목이 있으면,
그 항목이 프로브 README 를 고칠 때 무엇이 얼마마다 이 항목을 짚는다고 적은 문장과,
그 까닭으로 이 항목을 어긴 결론이 어떻게 잡혔다고 적은 문장을 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 그 자리에 "없음"이라고만 적어라.
'''
expect = ["세션·에이전트마다 한 번 이 항목을 짚는다", "이 항목을 어긴 결론이 세 번 리뷰에서야 잡혔다"]
source = ".claude/rules/probes.md"

[[arm]]
name = "워크트리"
role = "experiment"
target = ".scratch/harness/probes/commit_msg_hook/time_hook.py"

[[arm]]
name = "옛-판"
role = "control"
target = ".scratch/harness/probes/commit_msg_hook/time_hook.py"
