# next-session "인계할 때"에 더한 곁 세션의 인계하지 않는 때(대기열 328), 일지 경로의 칸(대기열 330), 잠금 풀기
# 단계(대기열 326)가 새 세션에 실리는지.
# 실험군은 이 워크트리, 대조군은 옛 판이다. 대조군은 `--control-commit 80b3cce` 로 꺼낸다(그 판에는 `expect`의 세 문구가
# 모두 없다). 병합 뒤에도 같은 커밋을 준다.
# 최신 결과: 통과 4 · 실패 0 · "없음" 섞인 통과 0(2026-10-19, 이 PC, 실험군 3/3 · 대조군 1/1. 일지 2026-10-18-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 80b3cce .scratch/harness/probes/canary/next_session_handoff_batch.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(지시문 내기, 세션 열기)은 하지 않고 본문만 읽는다.
1) "인계할 때" 절의 1(인계하지 않는 때)에서, 다른 세션이 연 세션을 알아보는 값을 적은 괄호를 글자 그대로 옮겨라.
2) "인계할 때" 절의 3(지시문)에서 일지 파일의 경로를 어디에 적으라고 하는지 적은 문장을 글자 그대로 옮겨라.
3) "인계할 때" 절의 4(넘기기 전에)에서 백그라운드 작업 멈추기와 열기 사이에 오는 항목의 이름(굵은 글씨)을 옮겨라.
본문에 그런 문장이나 항목이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["parentSessionId", "그 경계 문장 끝에 일지 파일의 경로를 적는다", "잠금 풀기"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../.."
