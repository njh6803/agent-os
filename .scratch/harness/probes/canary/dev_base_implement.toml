# implement 스킬의 "지시문이 없어도 주 체크아웃에서 브랜치를 따지 않고 EnterWorktree 로 간다" 조건이 주 체크아웃의 브랜치를 `main` 으로
# 못 박지 않고 루트 브랜치(main 이나 dev)로 적은 문장이 새 세션에 실리는지(dev-base-skills-docs 티켓, 셀프 리뷰 표준 축 7번, ADR 0043).
# implement 는 모델이 부르지 못하는 스킬이라 질문 머리에 슬래시 명령으로 넣는다. 실험군은 이 워크트리, 대조군은 옛 판을 든 주 체크아웃이다.
# 이 PR 이 병합되기 전의 주 체크아웃에는 옛 문장(`main도 이 티켓의 브랜치도 아니거나, main인데`)만 있다. 병합 뒤에 다시 돌리려면 병합 전
# 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 2(2026-11-12, 이 PC, 실험군은 `cd77e4096` 위의 커밋하지 않은 본문, 대조군은 주 체크아웃 `cd77e4096`, harness 티켓
#   dev-base-skills-docs). 섞인 둘은 "없음"으로 시작했다가 같은 답에서 정정하며 새 구절 `루트 브랜치(main이나 dev. 정하는 법은 tidy-checkouts)`을
#   옮긴 회차이고, 셋 모두 새 문구를 옮겼다(답을 손으로 읽었다). 대조군은 "없음"이었다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/dev_base_implement.toml <출력 디렉터리>
kind = "skill"
question = '''
/implement
위에 실린 스킬 본문이 시키는 일(브랜치, 워크트리, 구현)은 하지 않는다. 본문만 보고 답한다.
본문의 첫 문단에서, 지시문이 없어도 주 체크아웃에서 브랜치를 따지 않고 EnterWorktree로 가는 조건 가운데
`git branch --show-current`의 값이 무엇도 아니라고 적은 구절을 괄호 안의 설명까지 글자 그대로 옮겨라. 없으면 "없음"이라고만 답하라.
'''
expect = ["루트 브랜치(main이나 dev. 정하는 법은"]
source = ".claude/skills/implement/SKILL.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
