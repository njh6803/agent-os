# `.claude/rules/probes.md` 에 더한 문장들(대기열 248·269·290)이 그 규칙의 `paths`(`.scratch/**/probes/**`)에 맞는 파일을
# Read 로 열 때 실리는지. 248은 하위 프로세스 출력을 이어 읽는 탐침의 항목, 269는 인자 폴더를 지우는 프로브의 항목(둘 다
# 끝에 더했다), 290은 첫 항목에 더한 변이 표지를 고르는 문장이다.
# 실험군은 규칙의 paths 안(하위 폴더까지 든 프로브 파일), 대조군은 같은 `.scratch/` 의 paths 밖(plan.md)을 읽는다.
# 둘 다 이 체크아웃이다.
# 카나리아는 넷이다. 248 항목이 파이썬 탐침에게 출력을 읽으라고 드는 클래스 이름, 269 항목이 선례로 드는 파일 이름, 290
# 문장이 표지의 예로 든 둘째 것, 첫 항목이 회차를 세라고 드는 클래스 이름이다. 첫째와 넷째는 대기열 339 가 두 항목의 읽기와
# 셈을 `tools/probe_kit.py` 로 옮기며 바꾸고 더했다(전에는 248 항목이 읽기를 괄호로 풀어 쓴 조각 "읽는 스레드와 큐" 였다).
# 규칙 파일의 첫 제목은 이 PR의 커밋 제목에도 있어 세션에 실리는 git 상태로 새므로 카나리아로 쓰지 않는다
# (커밋한 뒤 사전 확인이 막았다, 일지 2026-10-16-22).
# 첫 판(제목까지 카나리아 넷)의 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 셀프 리뷰 전 규칙의 커밋 전 워크트리 사본).
# 그다음 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, PR 직전 리뷰를 반영한 규칙의 커밋 전 워크트리 사본, 두 갈래 모두 커밋 f1cda261, 일지 2026-10-16-22).
# 최신 결과: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 대기열 339 로 카나리아 넷이 된 판, 두 갈래 모두 `6bd52b06` 위의 커밋 전
# 작업 트리, 대조군은 "없음" 넷, 일지 2026-10-22-11). 셀프 리뷰가 다섯째 항목의 일지 번호를 고친 뒤 사전 확인으로
# 갈음했다(2026-10-22, 일지 2026-10-22-11).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/probes_rule_stream_delete_marker.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 다음 네 곳을 찾아라.
(가) 하위 프로세스가 끝나기 전에 그 출력을 이어 읽는 탐침에게, 파이썬 탐침이면 출력을 무엇으로 읽으라는 문장.
(나) 인자로 받은 폴더를 지우는 프로브를 다루는 항목. 그 항목은 사례로 든 프로브 파일의 지금 판을 선례라 부른다.
(다) 변이의 표지를 고를 때 고른 단언이 실패할 때만 나오는 문구를 고르라는 문장.
(라) 표지가 없는 회차를 측정이 아니라고 세라는 항목에서, 파이썬 탐침이면 그 셈을 무엇으로 하라는 문장.
있으면 (가)가 드는 클래스 이름, (나)가 선례라 부르는 파일의 이름(폴더 경로를 뺀 것),
(다)가 그런 문구의 예로 괄호에 든 것 가운데 둘째, (라)가 드는 클래스 이름을 각각 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 곳이 없으면 그 물음에는 "없음"이라고만 답하라.
'''
expect = ["LineReader", "worktree_duplicate_checkout.sh", "값까지 든 `Received:` 줄", "Rounds"]
source = ".claude/rules/probes.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = ".scratch/harness/probes/commit_msg_hook/time_hook.py"

[[arm]]
name = "paths-밖"
role = "control"
target = ".scratch/plan.md"
