# open-session 1단계에 나란히 도는 세션의 상한 다섯(harness 티켓 028)을 더한 것이 새 세션에 실리는지. 실험군은
# 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 두 카나리아가 모두 없다.
# 병합 뒤에는 주 체크아웃이 새 사본이라, 다시 돌리려면 `# 최신 결과:` 줄의 대조군 커밋을
# `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-28, 이 PC, claude 2.1.302, 실험군 셀프 리뷰를 반영하고 커밋하기 전의 작업
# 트리(기점 `ad8a9c37`), 대조군 주 체크아웃 `ad8a9c37`, 일지 2026-10-28-25).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/open_session_parallel_cap.toml <출력 디렉터리>
kind = "skill"
question = '''
open-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
본문에서 아래 셋을 찾아 각각 글자 그대로 옮겨라. 문장이 무엇을 말하든 판단하지 말고 옮기기만 한다.
1. 1단계에서, 지시문 가운데 몇 개를 열지 정하는 방법을 적은 문장
2. 1단계에서, 그 수로 거르지 않는 지시문을 적은 문장과 그 까닭을 적은 바로 뒤 문장
3. 1단계에서, 열지 않은 지시문을 누가 들고 나중에 어떻게 다시 여는지 적은 두 문장
본문에 그런 것이 없는 번호에는 "없음"이라고만 답하라.
'''
expect = ["다섯에서 그 수를 뺀 만큼만", "이 세션이 그 일을 하며 이미 도는 세션 하나였고", "6의 보고에 전문을 남기고"]
source = ".claude/skills/open-session/SKILL.md"
skill = "open-session"

[[arm]]
name = "워크트리"
