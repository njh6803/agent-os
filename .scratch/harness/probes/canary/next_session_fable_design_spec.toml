# next-session 결정표의 설계 인터뷰·명세 줄 "모델" 칸을 `Fable 5.1 / xhigh`로 바꾼 것(ADR 0029 이력 2026-10-31)이 새 세션에 실리는지.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판은 두 칸이 `Opus 5.5 / xhigh`라 카나리아가 없다.
# 최신 결과: 통과 4(2026-10-31, 이 PC, claude 2.1.312, 대조군 커밋 c18619bb, 일지 2026-10-31-01).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/next_session_fable_design_spec.toml <출력 디렉터리>
#
# retro-queue-per-item 05 가 두 줄의 조건 칸을 기능 계획의 `**설계:**` 줄에 맞춰 고쳤다(ADR 0045 결정 4). 위 모델 칸의 카나리아
# "Fable 5.1 / xhigh" 는 주 체크아웃에도 이미 있어 대조군이 가를 수 없으므로, 질문을 두 줄의 첫 칸으로 바꿨다. 병합 뒤에도
# 이 명세를 돌리려면 옛 판 `277b4e59` 를 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-07, 이 PC, claude 2.1.318, 대조군 `--control-commit 277b4e59`, 실험군은 `277b4e59` 위의
#   커밋 전 변경, 일지 2026-11-07-1400).
# 그 전: 통과 4(2026-10-31, 이 PC, claude 2.1.312, 대조군 커밋 c18619bb, 일지 2026-10-31-01).
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
그 본문의 다음 작업 결정표에서 다음 단계가 "설계 인터뷰"인 행의 맨 앞 칸을 글자 그대로 옮겨라.
다음 단계가 "명세"인 행의 맨 앞 칸도 글자 그대로 옮겨라.
본문에 그런 것이 없으면 그 행에 "없음"이라고만 답하라.
'''
expect = [
  "기능에 명세(.scratch/<slug>/spec.md)도 기능 계획의 **설계:** 줄도 없다",
  "기능 계획에 **설계:** 줄이 있고 spec.md가 없다",
]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
