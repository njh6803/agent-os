# `.claude/rules/tools.md` 에 더한 것(시간 제한 항목의 스레드 잡 문장, 지우거나 덮어쓰는 도구 항목의 링크 입력과 그
# 선례)이 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(대기열 278·282).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 스레드 잡 항목이 선례로 드는 변수 이름, 링크 자체만 지우는 선례의 함수 이름.
# 첫 판(1의 카나리아가 `[Environment]::Exit`): 통과 4(2026-10-16, 이 PC, claude 2.1.300, 커밋하기 전의 작업 트리. 러너가
#   찍은 커밋은 b4335124, 일지 2026-10-16-16). 흔한 pwsh API 라 사전 지식으로 맞힐 수 있어 셀프 리뷰 뒤 바꿨다.
# 최신 결과: 통과 4(2026-10-16, 같은 PC와 판, 셀프 리뷰를 반영한 커밋하기 전의 작업 트리. 러너가 찍은 커밋은 b4335124,
#   일지 2026-10-16-16).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_thread_job_and_links.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데에서 둘을 찾아 답하라. 읽은 파일의 코드에서 추측하지 않는다.
1. pwsh 의 스레드 잡으로 시간을 끊을 때 시간을 넘긴 잡을 어떻게 다루라는 항목이 있으면, 그 항목이 선례로 드는 함수와
   함께 드는 변수 이름을 백틱 안의 글자 그대로 옮겨라. 그런 항목이 없으면 "없음"이라고만 답하라.
2. 지우거나 덮어쓰는 도구를 커밋 전에 반박해 보라는 항목이 있으면, 그 항목이 링크를 따라가지 않고 링크 자체만
   지우는 선례로 드는 함수 이름을 백틱 안의 글자 그대로 옮겨라. 그런 항목이 없으면 "없음"이라고만 답하라.
'''
expect = ["$script:HungCalls", "delete_path"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
