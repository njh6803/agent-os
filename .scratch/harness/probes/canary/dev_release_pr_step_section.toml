# next-session merge.md 에 dev-release-pr-step 티켓이 더한 "출시 PR" 절(전제 확인의 push 실행 고르기, 열린 출시 PR 이어받기)이
# 새 세션에 실리는지. 결정표 줄(SKILL.md)은 dev_release_pr_step_decision_row.toml 이 묻는다. 실험군은 이 워크트리,
# 대조군은 옛 판을 든 주 체크아웃이다.
# 이 PR 이 병합되기 전의 주 체크아웃에는 그 절이 없다. 병합 뒤에 다시 돌리려면 병합 전 커밋을 `--control-commit` 으로 준다
# (README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-12, 이 PC, claude 2.1.322, 실험군은 `4b02bbe29` 위의 커밋하지 않은 본문, 대조군은 `4b02bbe29`를 꺼낸 사본이고 두 물음 모두 "없음"이었다). 첫 판은 둘째 물음의 기대 문구(`gh pr view <번호> --json headRefOid`)가 대조군 본문에도 있어 명세 오류로 아무것도 돌리지 않고 끝났고(종료 2), 대조군에 없는 구절로 바꾸자 돌았다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/dev_release_pr_step_section.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 PR을 병합할 때 여는 파일 하나를
Read로 열고, 아래 두 물음을 그 파일의 "출시 PR" 절에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 그 절이 없으면 그 물음에 "없음"이라고만 답하라.
1. "전제 확인" 1번의 `gh run list` 명령에서 push로 일어난 실행만 고르는 옵션을 글자 그대로 옮겨라.
2. "이어받기" 단락이 출시 PR의 번호와 `headRefOid`를 PR을 연 직후 어디에 적어 두라고 하는지, 그 구절을 글자 그대로 옮겨라.
'''
expect = ["--event push", "일지에 적어 두고"]
source = ".claude/skills/next-session/merge.md"
skill = "next-session"
skill_body = "files"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
