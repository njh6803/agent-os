# `.claude/rules/probes.md` 셋째 항목(해석은 갈래로 가른 뒤에 일반화한다)에 더한 양성 대조의 한 꼴(다른 날의 결과를
# 설명하는 측정은 그때의 입력을 글자 그대로 다시 넣는 갈래를 먼저 둔다)이 `paths`(`.scratch/**/probes/**`)에 맞는
# 파일을 Read 로 열 때 실리는지(대기열 506, 일지 2026-10-28-31).
# 실험군은 규칙의 paths 안(변이 표), 대조군은 같은 `.scratch/` 의 paths 밖(plan.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 더한 문장의 머리 조각과, 그 까닭 문장의 끝 조각이다.
# 최신 결과: 통과 4는 둘째 `expect`를 바꾸기 전 판의 실행이다(2026-10-28, 이 PC, claude 2.1.302, 두 갈래 모두 `5ccb51a0` 위의 커밋하지 않은 판, 일지 2026-10-28-31). 지금 판의 둘째 `expect`는 셀프 리뷰가 까닭 문장과 사례를 고치며 그 문장의 조각으로 바꾼 것이고, 실행 없이 사전 확인으로만 갈음했다(2026-10-28, 일지 2026-10-28-31).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/probes_rule_replay_original_input.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 지난날 일어난 거부나 실패를 설명하려는 측정에서 무엇을 먼저 두라는 문장이 있으면,
그 문장과, 그것이 같은 결과를 다시 내지 못하면 무엇을 뜻한다고 적은 문장을 각각 글자 그대로 옮겨라.
읽은 파일의 내용에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["글자 그대로 다시 넣는 갈래를 양성 대조로 먼저 둔다", "같은 입력에도 결과가 갈리는 것이라"]
source = ".claude/rules/probes.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = ".scratch/model-rerun/probes/rerun_hidden_mutations.toml"

[[arm]]
name = "paths-밖"
role = "control"
target = ".scratch/plan.md"
