# to-tickets 템플릿 뒤 문단의 경로 규칙을 저장소 관행에 맞춘 문장(대기열 400)이 새 세션에 실리는지. to-tickets 는 모델이
# 부르지 못하는 스킬이라 질문 머리에 슬래시 명령으로 넣는다.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(6bd52b06)이다. 옛 판의 그 문단은 원본 문언(경로를 피한다)이다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판의 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# retro-queue-per-item 05 가 넘긴 것을 적는 자리를 "받는 기능 행" 에서 "받는 기능의 기능 계획 본문" 으로 고쳐 둘째 물음과
# 카나리아를 더했다.
# 최신 결과: 통과 4(2026-11-07, 이 PC, claude 2.1.318, 대조군 `--control-commit 6bd52b06`, 실험군은 `277b4e59` 위의 커밋 전 변경,
#   일지 2026-11-07-1400). 첫 판은 둘째 물음이 카나리아가 든 문장 바로 뒤 문장을 옮기라고 하지 않아 실험군 셋이 실패했고(통과 1·실패 3),
#   물음을 고친 뒤 통과했다.
# 그 전: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 대조군 `--control-commit 6bd52b06` 은 "없음", 실험군은 `6bd52b06` 위의
#   커밋 전 변경, 일지 2026-10-22-11).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 6bd52b06 .scratch/harness/probes/canary/to_tickets_path_rule.toml <출력 디렉터리>
kind = "skill"
question = '''
/to-tickets
위에 실린 스킬 본문이 시키는 일(맥락 모으기, 저장소 탐색, 티켓 쓰기, 질문)은 하지 않는다. 본문만 보고 답한다.
본문의 티켓 템플릿 바로 뒤 문단에서, 티켓에 적는 경로 가운데 적어도 되는 것을 말하는 문장을 처음부터 마침표까지 글자 그대로
옮겨라. 그 문단에 적어도 되는 경로를 말하는 문장이 없으면 "없음"이라고만 답하라.
또 본문에서 명세나 리뷰가 다른 티켓·기능에 넘긴 것을 받는 기능의 어디에 적으라고 하는지 말하는 문장을 찾아, 그 문장과 바로 뒤에
이어지는 한 문장까지 두 문장을 처음부터 마침표까지 글자 그대로 옮겨라. 그런 문장이 없으면 그 자리에 "없음"이라고만 답하라.
'''
expect = [
  "명세가 정한 고칠 자리의 경로는 적는다",
  "기능 계획의 한 줄 요약은 전체 계획 표의 내용 칸이 되므로 넘긴 것은 요약이 아니라 본문에 둔다",
]
source = ".claude/skills/to-tickets/SKILL.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../../../agent-canary-6bd52b06"
