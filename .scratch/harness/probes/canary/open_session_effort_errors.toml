# open-session 3단계가 모델·노력 오류로 멈추는 경우의 목록을 새 앱(2.37337.1.0)의 노력 하위 메뉴에 맞게 고친 것(ADR 0029 이력
# 2026-10-16)이 새 세션에 실리는지. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 두
# 카나리아가 모두 없다(옛 목록은 슬라이더를 말한다).
# 병합 뒤에는 주 체크아웃이 새 사본이라, 다시 돌리려면 `# 최신 결과:` 줄의 대조군 커밋을
# `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-16, 이 PC, claude 2.1.300, 대조군 주 체크아웃의 옛 판 `df705c17`, 일지 2026-10-16-04).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/open_session_effort_errors.toml <출력 디렉터리>
kind = "skill"
question = '''
open-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
그 본문의 3단계에서 `page=` 뒤에 모델이나 노력을 말하는 오류로 멈추는 경우를 적은 괄호를 찾아, 그 괄호 안의 글을
글자 그대로 옮겨라. 괄호 안이 무엇을 말하든 판단하지 말고 옮기기만 한다. 본문에 그런 괄호가 없으면 "없음"이라고만 답하라.
'''
expect = ["노력 하위 메뉴가 열리지 않았다", "모델 버튼의 글이 모델과 노력보다 적다"]
source = ".claude/skills/open-session/SKILL.md"
skill = "open-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
