# bug-perf-review 정의의 보고 절에 더한 도구 호출 예산(대기열 169)이 새 세션의 서브에이전트에 실리는지.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판(0c72596)에는 두 카나리아가 모두 없고,
# 옛 정의의 tools 줄은 새 판과 같아 대조군에서도 서브에이전트가 돈다. 병합 뒤에 다시 돌리려면 옛 판을
# `git worktree add --detach` 로 꺼내 대조군의 checkout 으로 준다(spec_reviewer_agent.toml 의 머리말).
# 실리는지만 본다. 예산을 지켜 턴 한도 전에 보고하는지는 다음 PR 직전 리뷰에서 본다(일지 2026-10-12-14).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/bug_perf_review_budget.toml <출력 디렉터리>
kind = "agent"
agent = "bug-perf-review"
agent_tools = ["Bash", "Read", "Grep", "Glob"]
question = '''
bug-perf-review 서브에이전트를 Agent 도구로 한 번만 불러라. 서브에이전트에게 줄 프롬프트는 아래 단락 그대로다.

도구를 하나도 쓰지 마라. 파일을 읽지 말고, 지금 네 지시문(시스템 프롬프트)에 적힌 것만 보고 답한다. "보고 형식" 절의 제목 바로 아래 첫 문단을 글자 그대로 옮겨라. 그 첫 문단이 오탐을 어디에 적는지 말하는 문장으로 시작하면 '없음'이라고만 적어라.

서브에이전트의 답을 고치거나 줄이지 말고 그대로 전하라.
'''
expect = ["도구 호출이 40번에 이르면", "대기열 169"]
source = ".claude/agents/bug-perf-review.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
