# bug-perf-review 정의의 보고 절에 더한 도구 호출 예산(대기열 169)이 새 세션의 서브에이전트에 실리는지.
# 실험군은 이 워크트리, 대조군은 169 문단이 없는 옛 판이다. 169 의 PR(#184)에서는 주 체크아웃이 그 옛 판이었다.
# 그 PR 이 병합된 뒤로는 주 체크아웃에도 카나리아가 있어 러너의 원천 확인이 막으므로, 옛 판을
# `git worktree add --detach` 로 꺼내 대조군의 checkout 으로 준다(spec_reviewer_agent.toml 의 머리말).
# agent_tools 는 실험군 정의의 tools 줄과 같은 집합이어야 한다(러너의 agent_problems). 옛 판의 tools 에는 대기열
# 188 이 더한 TaskStop 이 없지만 본 세션 도구의 부분집합이라 대조군의 서브에이전트도 돈다(subagent_task_stop.py 의
# 대조군).
# 실리는지만 본다. 예산을 지켜 턴 한도 전에 보고하는지는 다음 PR 직전 리뷰에서 본다(일지 2026-10-12-14).
# 첫 판의 질문은 "보고 형식 절 제목 바로 아래 첫 문단"을 묻고 그것이 오탐 문장으로 시작하면 '없음'이라 하게
# 했다. 문단을 고친 뒤 다시 돌리자 실험군 한 회차의 서브에이전트가 도구 없이 '없음'이라 답했다(같은 실험군의 둘은
# 새 문단을 옮겼다). 그래서 문단을 자리가 아니라 내용(턴 한도)으로 가리킨다.
# 최신 결과: 통과 4(2026-10-12, 이 PC, claude 2.1.296, 대조군 주 체크아웃의 옛 판 `bd72bae`, 일지 2026-10-12-14).
# 그 뒤 agent_tools 에 TaskStop 을 더했고 정의 대조만 다시 봤다(일지 2026-10-12-18).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/bug_perf_review_budget.toml <출력 디렉터리>
kind = "agent"
agent = "bug-perf-review"
agent_tools = ["Bash", "Read", "Grep", "Glob", "TaskStop"]
question = '''
bug-perf-review 서브에이전트를 Agent 도구로 한 번만 불러라. 서브에이전트에게 줄 프롬프트는 아래 단락 그대로다.

도구를 하나도 쓰지 마라. 파일을 읽지 말고, 지금 네 지시문(시스템 프롬프트)에 적힌 것만 보고 답한다. "보고 형식" 절 안에 턴 한도를 말하는 문단이 있으면 그 문단 전체를 끝의 괄호까지 글자 그대로 옮겨라. 그 절에 그런 문단이 없으면 '없음'이라고만 적어라.

서브에이전트의 답을 고치거나 줄이지 말고 그대로 전하라.
'''
expect = ["도구 호출이 40번에 이르면", "대기열 169"]
source = ".claude/agents/bug-perf-review.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
