# implement 의 끝 전체 실행에 더한 구절(끝의 전체는 ruff 둘과 `tools/run_checks.py` 다, 대기열 334)이 새 세션에
# 실리는지. implement 는 모델이 부르지 못하는 스킬이라 질문 머리에 슬래시 명령으로 넣는다. 실험군은 이 워크트리,
# 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 카나리아가 없다. 병합 뒤에는 주 체크아웃이 새
# 사본이라, 다시 돌리려면 바뀌기 전 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 대조군의 본문에도 그 구절 뒤에 한국어 문장("red가 예상보다 넓으면 …")이 있어, 대조군은 "없음"이 아니라 그 문장을 답한다.
# 최신 결과: 2026-10-19 두 번 돌아 실험군 6회차 가운데 4회차 통과, 대조군 2회차 모두 기대대로 갈렸다. 실패 둘은 "없음"이고
# 입력 토큰 합이 통과 회차와 3토큰 안쪽(21,548~21,551)라 본문은 실렸고, 생각(thinking) 없이 곧바로 답한 회차다
# (이벤트 열을 손으로 견줬다. 일지 2026-10-19-01).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/implement_full_checks_runner.toml <출력 디렉터리>
# 병합 뒤에는 `--control-commit 9220d4a6` 을 더한다.
kind = "skill"
question = '''
/implement
위에 실린 스킬 본문이 시키는 일(브랜치, 워크트리, 구현)은 하지 않는다. 본문만 보고 답한다.
"the full test suite once at the end"가 든 문단에서, 그 구절 바로 뒤에 이어지는 한국어 문장 하나를 글자 그대로 옮겨라.
판단이나 설명은 덧붙이지 않는다. 그 구절 바로 뒤에 한국어 문장이 없거나 그 구절이 본문에 없으면 "없음"이라고만 답하라.
'''
expect = ["uv run python tools/run_checks.py"]
source = ".claude/skills/implement/SKILL.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
