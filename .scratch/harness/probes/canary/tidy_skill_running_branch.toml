# tidy-checkouts 스킬 3의 체크아웃되지 않은 로컬 브랜치 문장에 더한 판정 3의 제목(대기열 286)이 새 세션에 실리는지.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판에는 두 카나리아가 모두 없다.
# 그 PR 이 병합된 뒤에 다시 돌리면 주 체크아웃에도 카나리아가 있으므로, 옛 판의 커밋을 `--control-commit` 으로 준다.
# 최신 결과: 통과 4(2026-10-19, 이 PC, claude 2.1.302, 대조군 주 체크아웃 `a7d93133`, 일지 2026-10-19-09).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/tidy_skill_running_branch.toml <출력 디렉터리>
kind = "skill"
question = '''
tidy-checkouts 스킬을 Skill 도구로 불러 본문을 읽어라. 3에서 체크아웃되지 않은 로컬 브랜치를 다루는 문장들 가운데 두 가지를 글자 그대로 옮겨라.
하나, 그 브랜치를 판정할 때 어느 판정을 보는지 판정 번호로 적은 문장.
둘, 지울 것으로 판정됐는데도 남기는 경우를 적은 문장(끝의 괄호까지).
본문에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["판정 1과 판정 3의 제목을 본다", "대기열 286"]
source = ".claude/skills/tidy-checkouts/SKILL.md"
skill = "tidy-checkouts"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
