# `.claude/rules/probes.md` 의 "아직 커밋하지 않은 프로브 파일은 Edit 도구로 고친다" 항목이
# `paths`(`.scratch/**/probes/**`)에 맞는 파일을 Read 로 열 때 실리는지(일지 2026-10-23-18 회고 1).
# 실험군은 규칙의 paths 안(변이 표), 대조군은 같은 `.scratch/` 의 paths 밖(plan.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 항목의 머리 문장 끝과, 그 까닭 문장의 조각이다.
# 최신 결과: 통과 4(2026-10-28, 이 PC, claude 2.1.302, 두 갈래 모두 `5ccb51a0` 위의 커밋하지 않은 판, 일지 2026-10-28-20). 셀프 리뷰가 규칙 셋째 항목을 고친 뒤 사전 확인으로 갈음했다(2026-10-28, 일지 2026-10-28-20).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/probes_rule_uncommitted_edit.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 아직 커밋하지 않은 측정 파일을 어떤 도구로 고치라는 문장이 있으면,
그 문장과 그렇게 하라는 까닭을 각각 글자 그대로 옮겨라.
읽은 파일의 내용에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["Edit 도구로 고친다", "미추적 파일은 git으로 되살릴 수 없다"]
source = ".claude/rules/probes.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = ".scratch/model-rerun/probes/rerun_hidden_mutations.toml"

[[arm]]
name = "paths-밖"
role = "control"
target = ".scratch/plan.md"
