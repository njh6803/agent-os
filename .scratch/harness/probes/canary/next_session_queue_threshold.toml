# next-session 결정표의 하네스 chore 배치 줄이 말하는 회차 문턱(다섯)과 더하는 항목의 묶음 문턱이 새 세션에 실리는지
# (retro-queue-per-item 티켓 01, ADR 0036 이력 2026-11-06). 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이
# 병합되기 전의 주 체크아웃에는 다섯이 없다. 병합 뒤에 다시 돌리려면 `# 최신 결과:` 줄의 대조군 커밋을
# `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4(2026-11-07, 이 PC, 대조군 주 체크아웃 `819782eb`. 대조군은 "회차 3 이상인 항목"과 "세 번째 전이면"을 옮겼다).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/next_session_queue_threshold.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽고 둘을 답하라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
결정표에서 다음 단계가 "하네스 chore 배치"인 줄을 찾아라.
1) "지금(병합 뒤, 또는 끊을 때)" 칸에서 대기열의 열린 항목이 몇 회차 이상이어야 하는지 적은 구절을 글자 그대로 옮겨라.
2) "시작 프롬프트" 칸에서 더하는 항목(새 훅·검사·문장)을 언제까지 묶지 않는지 적은 구절을 글자 그대로 옮겨라.
그 줄에 그런 구절이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["회차 5 이상인 항목(사람 몫은 뺀다)", "다섯 번째 전이면 묶지 않는다"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
