# next-session 3단계(지금 `directive.md` 6)가 주 체크아웃 미갱신일 때 워크트리 사본의 병합 절을 Read로 여는 까닭(대기열 189)을 적은 문장이
# 새 세션에 실리는지. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 그 문장이
# 없다. 병합 뒤에 다시 돌리려면 `# 최신 결과:` 줄의 대조군 커밋을
# `--control-commit` 으로 준다(README `canary/` 행).
# 옮기기 전 결과: 통과 4(2026-10-13, 이 PC, claude 2.1.296, 대조군 주 체크아웃 `4814568`, 일지 2026-10-13-59).
#   셀프 리뷰가 그 문장의 계기 구절을 고친 뒤와, PR 리뷰 첫 회차가 그 구절을 줄인 뒤에는 사전 확인(`--preflight`)으로
#   갈음했다(2026-10-13, 같은 일지).
# 2026-10-29 harness 027 이 본문을 `directive.md` 로 옮겨 하위 파일 갈래(`skill_body = "files"`)로 바꿨다.
#   대조군은 옮기기 전 커밋 `37759ef2` 을 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-29, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `37759ef2`), 대조군 `--control-commit 37759ef2`, 일지 2026-10-29-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 37759ef2 .scratch/harness/probes/canary/next_session_worktree_copy_read.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 다음 작업의 지시문을 낼 때 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
칸마다 절의 주 체크아웃 미갱신 항목에서 "확인할 선행 조건" 칸에 적으라는 병합
문장(워크트리 사본의 next-session 병합 절을 Read로 열어 따른다는 문장)을 찾고, 그 뒤 두
문장 안에서 왜 Skill 도구가 아니라 Read로 여는지 까닭을 적은 문장을 글자 그대로 옮겨라.
'''
expect = ["끼어들어 기댈 수 없으므로 Read로 연다"]
source = ".claude/skills/next-session/directive.md"
skill = "next-session"
skill_body = "files"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
