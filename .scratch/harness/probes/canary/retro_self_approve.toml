# retro 4단계에 더한 후보의 판정(승인·기각·넘김)과 5단계에 더한 대기열 승인 칸의 표지가 새 세션에 실리는지
# (사용자 요청, 일지 2026-10-12-41).
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판(6b439aa)에는 두 카나리아가 모두 없다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판(6b439aa)을 `--control-commit` 으로 준다
# (README `canary/` 행).
# 최신 결과: 통과 4(2026-10-12, 이 PC, claude 2.1.296, 대조군 주 체크아웃 `6b439aa`, 일지 2026-10-12-41). 판정 셋을
# "사람 몫"이라 부른 셀프 리뷰 전의 판도 통과 4였다. PR 직전 리뷰 뒤 넘김 목록을 넓힌 것은 사전 확인으로 갈음했다
# (2026-10-12, 일지 2026-10-12-41). PR 봇 첫 회차 뒤 승인 조건과 반영할 때를 가른 것도 같다(2026-10-12, 일지 2026-10-12-41).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/retro_self_approve.toml <출력 디렉터리>
kind = "skill"
question = '''
retro 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(일지 읽기, 회고, 파일 쓰기)은 하지 않고 본문만 읽는다.
1) 본문의 4단계에서 후보를 몇 가지 판정으로 나누는지 적은 문장을 글자 그대로 옮겨라.
2) 본문의 5단계에서 대기열에 행을 적을 때 승인 칸을 무엇으로 시작하라고 적은 문장을 글자 그대로 옮겨라.
본문에 그런 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["판정은 승인, 기각, 넘김의 셋이고", "승인 칸은 자체 승인 <날짜>로 시작한다"]
source = ".claude/skills/retro/SKILL.md"
skill = "retro"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
