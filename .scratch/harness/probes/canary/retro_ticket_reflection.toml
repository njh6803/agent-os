# retro 4단계에 더한 회고 반영 줄(지금 PR 의 티켓에 수용 기준 한 줄, 면제 PR 이면 harness 티켓)과 5단계에 더한 티켓
# 경로로 닫기가 새 세션에 실리는지(ADR 0037, ticket-for-every-pr 티켓 02). 실험군은 이 워크트리, 대조군은 옛 판
# `caaa062b` 이다(그 판에는 카나리아가 없다). 돌릴 때는 `--control-commit caaa062b` 를 준다(README `canary/` 행).
# retro-queue-per-item 티켓 02 가 대기열을 항목마다 파일 하나인 폴더로 옮기며 닫는 자리를 상태 줄 하나로 고쳐, 둘째
# 카나리아(`닫힘 (<티켓 경로 또는 브랜치>, …`)를 더하고 질문 2를 "항목"으로 고쳤다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-07, 이 PC, 대조군 `--control-commit caaa062b`, 실험군은 `288686a5` 위의 커밋하지 않은
#   본문, retro-queue-per-item 티켓 02). 대조군은 물음 1에 "없음", 물음 2에 옛 취소선 문장을 옮겼다(카나리아 없음).
# 그 전 결과: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 대조군 주 체크아웃 `caaa062b`, 일지 2026-10-22-09).
# 첫 판의 2번 질문은 취소선 문장의 "바로 다음 문장"을 물어, 실험군 두 회차가 새 문장을 건너뛰고 그 뒤의 "번호는
# 영구 식별자다" 문장을 옮겼다(통과 2·실패 2, 2026-10-22). 세 회차 모두 1번에 새 4단계 줄을 옮겨 새 사본은
# 실렸다. 닫힌 자리를 적는 법의 문장을 모두 옮기게 고쳤다. 셀프 리뷰가 회고 반영 줄을 종류별 목록 끝으로 옮겨
# 1번 질문이 고침 줄 다음 줄이 아니라 그 줄의 내용을 묻게 고치고 다시 돌렸다(2026-10-22).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit caaa062b .scratch/harness/probes/canary/retro_ticket_reflection.toml <출력 디렉터리>
kind = "skill"
question = '''
retro 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(일지 읽기, 회고, 파일 쓰기)은 하지 않고 본문만 읽는다.
1) 4단계 "반영할 때" 목록에서 이 세션에서 반영할 때 지금 PR의 티켓에 무엇을 더하는지 적은 줄을 글자 그대로 옮겨라.
2) 5단계에서 대기열 항목을 닫을 때 어디서 닫혔는지 적는 법을 다룬 문장을 모두 글자 그대로 옮겨라.
판단이나 설명은 덧붙이지 않는다. 본문에 그런 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = [
  "회고 반영: <한 것>, 일지 <파일>",
  "닫힘 (<티켓 경로 또는 브랜치>, <날짜>, <한 것>.",
  "브랜치 대신 그 티켓 경로를 적는다",
]
source = ".claude/skills/retro/SKILL.md"
skill = "retro"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
