# spec-reviewer 정의에 더한 세 문장(대기열 106·121·125)이 새 세션의 서브에이전트에 실리는지.
# 2026-10-12 에 손으로 지은 `spec_reviewer_agent.py` 를 `tools/canary.py` 의 에이전트 갈래로 옮긴 것이다
# (대기열 153). 질문은 그 스크립트의 것과 글자가 같다.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(58969f7)이다. 옛 판에는 카나리아가 없고, 옛 정의의
# tools 줄은 새 판과 같아 대조군에서도 서브에이전트가 돈다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판을 따로 꺼낸다. 대조군이 같은 58969f7 인 다른 명세 넷과 같은 자리를
# 쓴다(README `canary/` 행).
# 최신 결과: 통과 4(2026-10-12, 이 PC, claude 2.1.292, 대조군 `58969f7`, 일지 2026-10-12-06).
# 이 명세가 대신한 `spec_reviewer_agent.py` 는 지웠고 마지막 판은
#   git show 7a9e58f:.scratch/harness/probes/canary/spec_reviewer_agent.py
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   git worktree add --detach ../../../../agent-canary-58969f7 58969f7
#   uv run python tools/canary.py .scratch/harness/probes/canary/spec_reviewer_agent.toml <출력 디렉터리>
kind = "agent"
agent = "spec-reviewer"
agent_tools = ["Read", "Grep", "Glob", "Bash"]
question = '''
spec-reviewer 서브에이전트를 Agent 도구로 한 번만 불러라. 서브에이전트에게 줄 프롬프트는 아래 단락 그대로다.

도구를 하나도 쓰지 마라. 파일을 읽지 말고, 지금 네 지시문(시스템 프롬프트)에 적힌 것만 보고 답한다. 체크리스트 6번 항목의 마지막 세 문장, 체크리스트 7번 항목의 마지막 문장, 질문 1의 마지막 세 문장을 각각 글자 그대로 옮겨라. 지시문에 그런 문장이 없으면 그 자리에 '없음'이라고만 적어라.

서브에이전트의 답을 고치거나 줄이지 말고 그대로 전하라.
'''
expect = [
    "지금 이음매(주입되는 포트, 시계)로 잴 수 있는지 코드로 본다",
    "그 문구가 서는 조건",
    "넘긴 것마다 지금 잴 수 없는 이유를 명세에서 찾는다",
]
source = ".claude/agents/spec-reviewer.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../../../agent-canary-58969f7"
