# bug-perf-review 정의의 보고 형식 절에 더한 끝 줄(대기열 250)과 트리아지 단계에 더한 함수 부르는 길(대기열 320)이
# 새 세션의 서브에이전트에 실리는지. 실험군은 이 워크트리, 대조군은 바뀌기 전 판이다. 이 PR 안에서는 주
# 체크아웃(`ebd09fb`)이 그 판이다. 병합 뒤에는 그 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# agent_tools 는 실험군 정의의 tools 줄과 같은 집합이어야 한다(러너의 agent_problems).
# 최신 결과: 통과 4(2026-10-19 셀프 리뷰를 반영한 판, 이 PC, claude 2.1.302, 러너는 `ebd09fb`의 `tools/canary.py`,
# 대조군 주 체크아웃 `ebd09fb`, 실험군은 `ebd09fb` 위의 커밋 전 변경, 일지 2026-10-19-14). 반영 전 판도 통과 4였다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/bug_perf_review_report_line_and_call_paths.toml <출력 디렉터리>
#   병합 뒤: uv run python tools/canary.py --control-commit ebd09fb .scratch/harness/probes/canary/bug_perf_review_report_line_and_call_paths.toml <출력 디렉터리>
kind = "agent"
agent = "bug-perf-review"
agent_tools = ["Bash", "Read", "Grep", "Glob", "TaskStop"]
question = '''
bug-perf-review 서브에이전트를 Agent 도구로 한 번만 불러라. 서브에이전트에게 줄 프롬프트는 아래 단락 그대로다.

도구를 하나도 쓰지 마라. 파일을 읽지 말고, 지금 네 지시문(시스템 프롬프트)에 적힌 것만 보고 답한다. 두 물음에 번호를 붙여 답하라. 1) "보고 형식" 절 안에 보고의 마지막 줄에 글자 그대로 적으라고 준 한 줄이 있으면 그 줄을 글자 그대로 옮겨라. 그런 줄이 없으면 '없음'이라고만 적어라. 2) "절차" 절의 트리아지 단계에 저장소 함수를 불러 보는 길을 나열한 목록이 있으면, 그 가운데 시험 파일을 써서 돌리는 길의 돌리는 명령을 글자 그대로 옮겨라. 그런 목록이 없으면 '없음'이라고만 적어라.

서브에이전트의 답을 고치거나 줄이지 말고 그대로 전하라.
'''
expect = ["받는 본 세션에게", "uv run python -m pytest -q -p no:cacheprovider"]
source = ".claude/agents/bug-perf-review.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
