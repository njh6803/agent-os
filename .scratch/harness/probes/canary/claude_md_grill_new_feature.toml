# CLAUDE.md 작업 규약 1에 더한 문장(다음 작업 지시문 없이 새 기능을 시작하는데 `.scratch/<slug>/` 가 없으면 `grill-with-docs` 로
# 설계 인터뷰부터 한다)이 새
# 세션에 실리는지(ADR 0033 이력 2026-10-20 "하네스가 스킬을 부르는 자리를 감사하고, 설명에만 기대던 계기를 하네스로 옮긴다").
# CLAUDE.md 는 매 세션 실리므로 규칙 갈래의 모양만 빌린다. 두 갈래 모두 같은 pyproject.toml 을 읽고 체크아웃만 다르다. 실험군은
# 이 워크트리, 대조군은 주 체크아웃이다. 워크트리 세션에는 주 체크아웃의 `CLAUDE.md` 가 실리지 않아
# (`.scratch/harness/probes/claude_md_parent.py`, 대기열 171) 실험군의 통과는 워크트리 사본이 실렸다는 뜻이다. 병합 뒤에는 주
# 체크아웃이 새 사본이라 옛 판을 `--control-commit` 으로 준다(README `canary/` 행).
# retro-queue-per-item 05 가 계기를 "명세 폴더가 없으면" 에서 "명세도 기능 계획의 설계 줄도 없으면" 으로 고쳐(ADR 0045 결정 4),
# 질문의 말과 카나리아를 그 문장에 맞췄다. 옛 카나리아 "설계 인터뷰부터 한다" 는 주 체크아웃에도 있어 대조군이 가를 수 없다.
# 병합 뒤에 다시 돌리려면 옛 판 `277b4e59` 를 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-07, 이 PC, claude 2.1.318, 대조군 `--control-commit 277b4e59`, 실험군은 `277b4e59` 위의
#   커밋 전 변경, 일지 2026-11-07-1400).
# 그 전: 통과 4(2026-10-20, 이 PC, claude 2.1.302, 셀프 리뷰를 반영한 문장, 대조군 주 체크아웃 `30949cfc`, 일지 2026-10-20-35).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/claude_md_grill_new_feature.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 프로젝트 지시의 "작업 규약" 절에서, 새 기능을 시작하는데 설계를 마쳤다는 표지가 아직 없을 때 무엇을
먼저 하라는 문장을 글자 그대로 옮겨라.
읽은 파일에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["명세(.scratch/<slug>/spec.md)도 기능 계획의 **설계:** 줄도 없으면"]
source = "CLAUDE.md"

[[arm]]
name = "워크트리"
role = "experiment"
target = "pyproject.toml"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
target = "pyproject.toml"
