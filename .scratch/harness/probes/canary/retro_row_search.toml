#   uv run python tools/canary.py .scratch/harness/probes/canary/retro_row_search.toml <출력 디렉터리>
kind = "skill"
question = '''
retro 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(일지 읽기, 회고, 파일 쓰기)은 하지 않고 본문만 읽는다.
1) 본문의 5단계에서 대기열에 새 행을 쓰기 전에 같은 일을 다룬 행을 찾을 때 치라고 적은 명령을 글자 그대로 옮겨라.
2) 같은 문단에서 낱말에 남길 문자와 다른 문자로 바꿀 문자를 적은 문장을 글자 그대로 옮겨라.
3) 같은 문단에서 닫힌 행이 맞았을 때 한 번 더 찾으라고 적은 옵션과 그 인자를 글자 그대로 옮겨라.
본문에 그런 명령이나 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
