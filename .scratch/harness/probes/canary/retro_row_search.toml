# retro 5단계의 항목 찾기가 `tools/queue_open_rows.py --search` 를 치라고 적은 문장(대기열 425, harness 021)과, 새 항목을
# 영어 제목 파일로 쓰는 문장(retro-queue-per-item 티켓 02, ADR 0045 결정 1)이 새 세션에 실리는지. 실험군은 이 워크트리,
# 대조군은 옛 판 `7d27ae45` 이다(그 판에는 `expect` 의 네 문구가 모두 없다). 돌릴 때는 `--control-commit 7d27ae45` 를 준다.
# 이 명세의 이름은 대기열이 표였을 때의 "행 찾기"에서 왔고 파일 이름은 그대로 둔다(README `canary/` 행이 이 이름으로 가리킨다).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-07, 이 PC, claude 2.1.318, 대조군 `--control-commit 7d27ae45`, 실험군은 `e423281a`,
#   retro-queue-per-item 티켓 02, 일지 2026-11-07-02). 셀프 리뷰 반영이 더한 문장(끊긴 뒤나 압축 뒤의 회고가 새 제목을 짓기
#   전에 일지의 `## 회고` 절 식별자를 쓴다)을 묻는 물음 5를 더해 다섯 물음으로 돌렸고, 대조군은 다섯 물음 모두 "없음"이었다.
# 그 전 결과: 통과 4, "없음" 섞임 0(2026-11-07 같은 날 물음 넷으로, 실험군은 `288686a5` 위의 커밋하지 않은 본문).
# 그 전전 결과: 통과 4(2026-10-28 셀프 리뷰 반영 뒤 질문 셋으로, 이 PC, claude 2.1.302, 대조군 주 체크아웃 `7d27ae45`,
# 일지 2026-10-28-16).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 7d27ae45 .scratch/harness/probes/canary/retro_row_search.toml <출력 디렉터리>
kind = "skill"
question = '''
retro 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(일지 읽기, 회고, 파일 쓰기)은 하지 않고 본문만 읽는다.
1) 본문의 5단계에서 대기열에 새 항목을 쓰기 전에 같은 일을 다룬 항목을 찾을 때 치라고 적은 명령을 글자 그대로 옮겨라.
2) 같은 문단에서 낱말에 남길 문자와 다른 문자로 바꿀 문자를 적은 문장을 글자 그대로 옮겨라.
3) 같은 문단에서 닫힌 항목이 맞았을 때 한 번 더 찾으라고 적은 옵션과 그 인자를 글자 그대로 옮겨라.
4) 같은 문단에서 새 항목의 이름을 어떻게 지으라고 적은 문장을 글자 그대로 옮겨라.
5) 같은 문단에서, 끊긴 뒤나 압축 뒤에 다시 들어온 회고가 항목의 이름을 정할 때 따르라고 적은 문장을 글자 그대로 옮겨라.
본문에 그런 명령이나 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = [
  "queue_open_rows.py --search",
  "아무 글자에나 맞는 `.`으로 바꾼다",
  "--search <식별자>의",
  "다음 빈 번호를 받지 않고 그 사건을 가리키는 짧은 영어 제목으로 짓는다",
  "새 제목을 짓기 전에 이 일지의 `## 회고` 절이 적은 식별자를 그대로 쓰고",
]
source = ".claude/skills/retro/SKILL.md"
skill = "retro"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../.."
