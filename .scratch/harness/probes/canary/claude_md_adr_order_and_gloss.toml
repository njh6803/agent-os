# CLAUDE.md 작업 규약 5에 더한 ADR 승인의 차례(대기열 126)와 원칙 절에 더한 기술 개념 풀이(대기열 114)가
# 새 세션에 실리는지. CLAUDE.md 는 매 세션 실리므로 규칙 갈래의 모양만 빌린다. 두 갈래 모두 같은 README.md 를
# 읽고 체크아웃만 다르다.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판에는 두 카나리아가 모두 없다.
# 워크트리가 주 체크아웃 안에 있어 실험군에는 상위 폴더의 옛 `CLAUDE.md`도 함께 실릴 수 있다(재지 않았다).
# 그래서 실험군의 통과는 새 판이 실렸다는 뜻이지만, 실패는 옛 줄을 옮긴 것인지 원본의 답을 보고 가른다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/claude_md_adr_order_and_gloss.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 프로젝트 지시에서 다음 둘을 각각 글자 그대로 옮겨라.
1) "작업 규약" 목록에서 아키텍처 결정을 내렸을 때 할 일을 적은 항목.
2) "원칙" 절에서 사람에게 질문할 때 할 일을 적은 항목.
읽은 파일에서 추측하지 않는다. 실린 지시에 그런 항목이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["7의 셀프 리뷰를 반영한 뒤에 보여주고 승인을 받는다", "묻기 전에 무엇인가·잡아 주는 것·치르는 값으로 푼다"]
source = "CLAUDE.md"

[[arm]]
name = "워크트리"
role = "experiment"
target = "README.md"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
target = "README.md"
