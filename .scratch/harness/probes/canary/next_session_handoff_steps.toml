# next-session "인계할 때"의 4·5(넘기기 전에의 제목 바꾸기와 그 거절, 압축 뒤 이어 할 때)가 새 세션에 실리는지
# (ADR 0033, token-usage 티켓 05). 제목이 이미 `(인계함)` 인 채 압축 뒤 이어 할 때와 제목 바꾸기가 거절될 때의 규칙이다.
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 주 체크아웃의 옛 판에는 그 절이 없다.
# 카나리아는 셋이다. 바꾼 제목의 모양, 거절되면 열지 않는 까닭, 압축 뒤 일지에서 찾는 줄.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-16, 이 PC, claude 2.1.300, 커밋하기 전의 작업 트리 — 러너가 찍은 커밋은
#   실험군·대조군 모두 e52e8da3, 대조군은 주 체크아웃, 일지 2026-10-16-63). 셀프 리뷰를 반영하며 원천의 본문만 고친 것은
#   같은 PR·같은 판에서 사전 확인으로 갈음했다(같은 일지).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/next_session_handoff_steps.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
그 본문에서 셋을 찾아 답하라. 본문에 없으면 그 물음에는 "없음"이라고만 답하라.
1. 세션 컨텍스트가 커서 새 세션에 넘기기 전에 이 세션의 제목을 바꾸라고 적혀 있으면, 바꿀 제목의 모양을 그대로 옮겨라.
2. 같은 자리에서, 그 제목 바꾸기가 거절되면 새 세션을 열지 않는다고 적혀 있으면 그 까닭의 문장을 그대로 옮겨라.
3. 넘기는 절차 도중 자동 압축이 온 뒤 이어 할 때 일지에서 찾는 줄이 적혀 있으면, 그 줄의 앞 글자(시각 앞까지)를
   그대로 옮겨라.
'''
expect = ["<브랜치> (인계함)", "실행 중 세션 확인에서 멈춘다", "open-session을 부른다"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
