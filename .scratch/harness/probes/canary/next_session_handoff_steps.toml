# next-session "인계할 때"의 4·5(넘기기 전에의 제목 바꾸기와 그 거절, 압축 뒤 이어 할 때)가 새 세션에 실리는지
# (ADR 0033, token-usage 티켓 05). 제목이 이미 `(인계함)` 인 채 압축 뒤 이어 할 때와 제목 바꾸기가 거절될 때의 규칙이다.
# 실험군은 이 워크트리, 대조군은 `checkout` 칸의 주 체크아웃이다. 이 명세를 들인 #276(05)이 병합되기 전에는 주 체크아웃의
#   옛 판에 그 절이 없었다. 병합된 뒤로는 주 체크아웃도 새 판이라, 아래 "돌리는 법"대로 `--control-commit`으로 꺼낸 옛
#   커밋이 대조군 자리다.
# 카나리아는 셋이다. 바꾼 제목의 모양, 거절되면 열지 않는 까닭, 압축 뒤 일지에서 찾는 줄.
# 옮기기 전 결과: 통과 4, "없음" 섞임 0(2026-10-19, 이 PC, claude 2.1.302 — 러너가 찍은 커밋은 실험군 ebd09fbb(main과 같은
#   워크트리), 대조군 c689c9ce(인계 줄을 들인 #276보다 둘 앞의 #275 커밋을 `--control-commit`으로 꺼냈다), 일지
#   2026-10-19-07). 그 전 결과는 통과 4(2026-10-16, claude 2.1.300, 실험군·대조군 모두 e52e8da3, 일지 2026-10-16-63)다.
# 2026-10-29 harness 027 이 본문을 `handoff.md` 로 옮겨 하위 파일 갈래(`skill_body = "files"`)로 바꿨다.
#   대조군은 옮기기 전 커밋 `37759ef2` 을 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-29, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `37759ef2`), 대조군 `--control-commit 37759ef2`, 일지 2026-10-29-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 37759ef2 .scratch/harness/probes/canary/next_session_handoff_steps.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 단계 경계에서 인계 계기를 받은 세션이 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
1. 넘기기 전에 이 세션의 제목을 바꾸라고 적혀 있으면, 바꿀 제목의 모양을 그대로 옮겨라.
2. 같은 자리에서, 그 제목 바꾸기가 거절되면 새 세션을 열지 않는다고 적혀 있으면 그 까닭의
문장을 그대로 옮겨라.
3. 넘기는 절차 도중 자동 압축이 온 뒤 이어 할 때 일지에서 찾는 줄이 적혀 있으면, 그 줄의
앞 글자(시각 앞까지)를 그대로 옮겨라.
'''
expect = ["<브랜치> (인계함)", "실행 중 세션 확인에서 멈춘다", "open-session을 부른다"]
source = ".claude/skills/next-session/handoff.md"
skill = "next-session"
skill_body = "files"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
