# next-session 1단계의 봇 회차에 더한 문장(claude-review가 계정 한도로 빨가면 tools/wait_ci.py 가 그 빨강을 실패로 세지
# 않고, 통과 줄에 한도로 리뷰 없음을 덧붙인다, 대기열 327)이 새 세션에 실리는지. 실험군은 이 워크트리, 대조군은 주
# 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 그 문장이 없다. 병합 뒤에 다시 돌리려면 `# 최신 결과:` 줄의 대조군
# 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 옮기기 전 결과: 통과 4(2026-10-19, 이 PC, claude 2.1.302, 실험군 미커밋 본문, 대조군 주 체크아웃 `655b19a8`, 일지
#   2026-10-19-03). 실험군 셋은 그 글을 옮겼고, 대조군은 "없음"을 답했다.
# 2026-10-29 harness 027 이 본문을 `merge.md` 로 옮겨 하위 파일 갈래(`skill_files`)로 바꿨다.
#   대조군은 옮기기 전 커밋 `37759ef2` 을 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-29, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `37759ef2`), 대조군 `--control-commit 37759ef2`, 일지 2026-10-29-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 37759ef2 .scratch/harness/probes/canary/next_session_ci_wait_review_limit.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 PR을 연 세션이 병합까지 마칠 때 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
봇 회차 항목의 대기에서, claude-review가 계정 한도로 빨갰을 때 대기 명령의 통과 줄에
덧붙는 글을 백틱 안의 글자 그대로 옮겨라.
'''
expect = ["계정 한도로 리뷰 없음(<한도 문구>)"]
source = ".claude/skills/next-session/merge.md"
skill = "next-session"
skill_files = true

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
