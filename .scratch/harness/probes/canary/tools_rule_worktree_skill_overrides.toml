# `.claude/rules/tools.md` 의 훅별 시간 항목에 더한 워크트리 스킬 사본 훅 문장(대기열 274, EnterWorktree 의 PostToolUse
# 와 그 시간)과, Skill 훅 문장의 괄호에 더한 그 이름의 상태(처음 판은 "그 훅이 돈 세션에서는 그 이름이 꺼져 있다", 일지
# 2026-10-20-01 뒤로는 CLI 세션에서는 꺼졌지만 이 PC의 앱 세션에서는 붙었다는 조각)가 `paths` 에 맞는 파일을 Read 로 열 때
# 실리는지.
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 넷이다. 규칙 파일의 첫 제목, 그 훅이 하는 일을 적은 조각, 쓰는 길의 시간 범위, Skill 훅 괄호의 새 조각.
# 훅 이름은 커밋 제목에 들 수 있어(세션에 실리는 git 상태) 카나리아로 쓰지 않는다.
# 최신 결과: 통과 4(2026-10-19, 이 PC, claude 2.1.302, 갈래 커밋 5f38d61 위의 커밋하지 않은 판, 일지 2026-10-20-01).
# 이전 결과: 통과 4(2026-10-19, 클라우드 컨테이너, claude 2.1.303, 갈래 커밋 a60e2dd 위의 커밋하지 않은 판, 일지 2026-10-19-14).
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_worktree_skill_overrides.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 파일 가운데 훅 한 번의 시간을 훅마다 적은 문단이 있으면, 그 문단에서 두 문장을 찾는다.
하나, 워크트리에 들어가는 도구(EnterWorktree)에 붙는 훅을 적은 문장.
둘, Skill 호출에 붙는 훅이 워크트리 세션이 부르는 경로를 단 스킬 이름을 다룬다고 적은 문장의 괄호.
그런 문장이 있으면,
그 문장들이 든 지시 파일의 첫 `#` 제목, 첫째 문장에서 그 훅이 무엇을 훑는지 적은 조각, 첫째 문장에서 쓰는 길의 시간 범위, 둘째 문장의 괄호 안에서 그 이름의 상태를 적은 조각을 각각 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["하네스 규칙", "들어간 워크트리의 스킬 폴더를 훑고", "66~108ms", "이 PC의 앱 세션에서는 붙었다"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
