#   그 앞: 통과 4(2026-10-13, 이 PC, claude 2.1.296, 1단계를 하위 항목으로 나눈 뒤, 대조군 옛 판 `4d34bee`, 일지 2026-10-13-35).
#   그 앞: 통과 4(2026-10-07, claude 2.1.292, 일지 2026-10-07-19).
# 2026-10-29 harness 027 이 본문을 `merge.md` 로 옮겨 하위 파일 갈래(`skill_files`)로 바꿨다.
#   대조군은 옮기기 전 커밋 `37759ef2` 을 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-29, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `37759ef2`), 대조군 `--control-commit 37759ef2`, 일지 2026-10-29-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 37759ef2 .scratch/harness/probes/canary/next_session_bot_rounds.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 PR을 연 세션이 병합까지 마칠 때 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
1. 봇 회차 항목에서 PR 봇 리뷰가 거듭될 때 어느 회차부터 어떤 등급의 지적만 고치는지 적은
구절을 글자 그대로 옮겨라.
2. 같은 자리에서 나머지 지적을 어디에 무엇과 함께 남기는지 적은 구절을 글자 그대로 옮겨라.
3. 같은 항목에서 보류한 지적의 일을 PR 코멘트 밖에도 적어야 하는 조건을 말하는 구절을
글자 그대로 옮겨라.
'''
expect = ["둘째 회차부터는 Critical·Major만 고치고", "보류 이유를 PR 코멘트에 남긴 뒤 병합한다", "보류 이유가 그 일을 뒤의 작업으로 넘기는 것이면"]
