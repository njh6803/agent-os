# grilling 라운드 문단에 더한 기술 개념 풀이의 자리(대기열 114)가 새 세션에 실리는지. 풀이의 원천은
# CLAUDE.md 원칙이고 그것은 `claude_md_adr_order_and_gloss.toml` 이 본다.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(58969f7)이다. 옛 판에는 카나리아가 없다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판의 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4(2026-10-12, 이 PC, claude 2.1.292, 대조군 `58969f7`, 일지 2026-10-12-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 58969f7 .scratch/harness/probes/canary/grilling_concept_gloss.toml <출력 디렉터리>
kind = "skill"
question = '''
grilling 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(인터뷰, 질문)은 하지 않고 본문만 읽는다.
본문에서 AskUserQuestion 호출 곁의 본문에 쓸 수 있는 것을 나열한 문장을 글자 그대로 옮겨라.
본문에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["질문에 처음 나오는 기술 개념의 풀이(CLAUDE.md 원칙)만 쓴다"]
source = ".claude/skills/grilling/SKILL.md"
skill = "grilling"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../../../agent-canary-58969f7"
