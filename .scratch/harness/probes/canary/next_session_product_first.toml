# next-session 결정표에 ADR 0036 이 고친 세 줄(chore 배치 줄의 같은 대상 파일 조건을 계기에서 뺀 문장, 하네스 chore PR
# 뒤에는 chore 를 잇지 않는 문장, "같은 주제가 남았다"의 남은 것을 좁힌 문장)이 새 세션에 실리는지(일지 2026-10-20-09).
# 실험군은 이 워크트리, 대조군은 옛 판 `be04b6e1` 이다(그 판에는 세 카나리아가 모두 없다). 돌릴 때는
# `--control-commit be04b6e1` 을 준다(README `canary/` 행).
# retro-queue-per-item 티켓 02 가 대기열을 항목마다 파일 하나인 폴더로 옮기며 셋째 카나리아를 "행"에서 "항목"으로 고쳤다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-07, 이 PC, 대조군 `--control-commit be04b6e1`, 실험군은 `288686a5` 위의 커밋하지 않은
#   본문, retro-queue-per-item 티켓 02). 첫 판은 통과 2·실패 2였다. 물음 2가 맨 앞 칸을 "기능의 티켓이 아니라 하네스 chore
#   PR이었고"로 불렀는데 HEAD 의 그 칸은 "기능의 티켓이 아니라 harness 티켓의 PR(`chore/<NNN>-<slug>`)이었고"로 이미 바뀐 뒤여서
#   모델이 "없음"이라 답했다(이 변경이 아니라 앞선 변경의 잔재다). 물음 2의 시작 문구를 고쳐 다시 돌렸다.
# 그 전 결과: 통과 4(2026-10-20, 이 PC, claude 2.1.302, 대조군 주 체크아웃 `be04b6e1`, 일지 2026-10-20-09).
#   같은 날 앞 판 셋은 질문이나 expect 가 어긋났다. 첫 판은 통과 4 가운데 "없음" 섞임 둘(물음 1의 "어디로" 칸과 물음 2의
#   "두 문장"에 헷갈렸다), 둘째 판은 통과 1·실패 3(물음 2를 대기열을 다룬 문장으로 좁히자 대기열이라는 말이 없는 카나리아를
#   모델이 뺐다), 셋째 판은 통과 3·실패 1(물음 2가 줄을 모호하게 짚어 한 회차가 chore 배치 줄을 골랐다). 그때마다 고쳤다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit be04b6e1 .scratch/harness/probes/canary/next_session_product_first.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽고 셋을 답하라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
1. "다음 작업 결정표"에서 "다음 단계" 열이 "하네스 chore 배치"인 줄을 찾아, 그 줄의 맨 앞 칸에서 "같은 대상 파일 셋
   이상"이라는 말이 든 문장을 글자 그대로 옮겨라.
2. 같은 표에서 맨 앞 칸이 "기능의 티켓이 아니라 harness 티켓의 PR"로 시작하는 줄을 찾아, 그 줄의 "시작 프롬프트"
   칸에서 대기열을 다룬 문장을 모두 글자 그대로 옮겨라.
3. 같은 표에서 맨 앞 칸이 "하네스·문서만 고친 PR이었고"로 시작하는 줄의 맨 앞 칸 전체를 글자 그대로 옮겨라.
본문에 그런 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = ["지금은 계기가 아니다", "대기열의 조건이 차 있어도 chore를 잇지 않는다", "그 PR을 하며 새로 찾아 대기열에 적은 항목은 아니다"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../.."
