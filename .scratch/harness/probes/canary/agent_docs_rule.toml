# `.claude/rules/agent-docs.md`(에이전트 문서를 쓰기 전에 `writing-for-agents` 를 부른다)가 `paths` 에 맞는 파일을 Read 로
# 열 때 실리는지(ADR 0033 이력 2026-10-20 "하네스가 스킬을 부르는 자리를 감사하고, 설명에만 기대던 계기를 하네스로 옮긴다").
# 실험군 둘은 스킬 파일과 `CLAUDE.md` 를 읽는다. `CLAUDE.md` 는 세션을 시작할 때도 실리므로, 대조군은 paths 밖(pyproject.toml)을
# 세 번 읽어 시작 때 실린 `CLAUDE.md` 가 규칙을 함께 싣지 않는지 본다. 셋 모두 이 체크아웃이다. 대조군이 "없음"이고 `CLAUDE.md`
# 갈래가 통과해야 `CLAUDE.md` 를 paths 에 남긴다. Read 없이 Edit 가 되면 그 갈래가 통과해도 고치는 세션에 실리지 않으므로, 그
# 쪽은 `.scratch/harness/probes/claude_md_edit_without_read.py` 가 잰다. 그래서 기대는 통과 4가 아니라 통과 9(실험군 여섯,
# 대조군 셋)다.
# 최신 결과: 통과 9(2026-10-20, 이 PC, claude 2.1.302, 셀프 리뷰를 반영하고 커밋하기 전의 워크트리 사본 `5fee4cd6` 위, 대조군
# 셋 모두 "없음", 일지 2026-10-20-35).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/agent_docs_rule.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데, 스킬·규칙·서브에이전트 정의처럼 에이전트가 읽는 문서를 쓰거나 고치기 전에
Skill 도구로 어떤 스킬을 부르라는 문장이 있으면, 그 문장이 든 지시 파일의 첫 `#` 제목과 그 스킬의 이름을
각각 글자 그대로 옮겨라.
읽은 파일에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["에이전트 문서 규칙", "writing-for-agents"]
source = ".claude/rules/agent-docs.md"

[[arm]]
name = "스킬-파일"
role = "experiment"
target = ".claude/skills/tdd/SKILL.md"

[[arm]]
name = "CLAUDE-md"
role = "experiment"
target = "CLAUDE.md"

[[arm]]
name = "paths-밖"
role = "control"
target = "pyproject.toml"
runs = 3
