# next-session 1단계에 더한 구절(일지 번호를 받으면 바로 파일을 만든다, 대기열 205. 범위를 넓힌 커밋을 푸시하기 전에 PR
# 본문을 먼저 고친다, 대기열 200)과 결정표 chore 배치 줄에 더한 조건(같은 대상 파일의 열린 항목 셋, 대기열 166)이 새
# 세션에 실리는지. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 세 카나리아가
# 모두 없다. 병합 뒤에는 주 체크아웃이 새 사본이라, 다시 돌리려면 `# 최신 결과:` 줄의 대조군 커밋을
# `--control-commit` 으로 준다(README `canary/` 행).
# 옮기기 전 결과: 통과 4(2026-10-13, 이 PC, claude 2.1.296, 1단계를 하위 항목으로 나눈 뒤, 대조군 옛 판 `4d34bee`, 일지 2026-10-13-35).
#   그 앞: 통과 4(2026-10-13, 이 PC, claude 2.1.296, 대조군 주 체크아웃의 옛 판 `80445cf`, 일지 2026-10-13-06).
#   같은 PR 안의 앞 판 넷(통과 4, 통과 3·실패 1, 통과 4, 통과 2·실패 2)과 그때마다 고친 질문·본문은 그 일지의 검사 절.
#   2026-10-13 PR 직전 버그 축 반영(200 문장의 순서와 expect 하나)은 `--preflight` 로 갈음했다(통과, 일지 2026-10-13-06).
# 셋째 물음(대기열 166의 조건)은 ADR 0036 이 그 조건을 chore 배치의 계기에서 빼 2026-10-19 에 걷었다. 위 결과의 셋째는 그
#   조건이 실리던 판의 것이다. 지금 판의 그 칸은 `next_session_product_first.toml` 이 본다(일지 2026-10-20-09).
# 2026-10-29 harness 027 이 본문을 `merge.md` 로 옮겨 하위 파일 갈래(`skill_body = "files"`)로 바꿨다.
#   대조군은 옮기기 전 커밋 `37759ef2` 을 `--control-commit` 으로 준다.
# 2026-11-07 retro-queue-per-item 04 가 첫째 물음을 일지 번호 받기에서 일지 이름 짓기(날짜·시각 명령, 번호를 받지 않는다)로
#   바꿨다. 둘째 물음의 문장은 이 변경 전 판(`9a1d8542`)에도 있어서 그 커밋을 대조군으로 주면 러너가 명세 오류로 막는다.
#   그래서 대조군은 `merge.md` 를 들이기 전 커밋 `37759ef2` 그대로 둔다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-07, 이 PC, claude 2.1.318, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `9a1d8542`), 대조군 `--control-commit 37759ef2`, 일지 2026-11-07-1047).
# 이름을 바꾸기 전 결과: 통과 4, "없음" 섞임 0(2026-10-29, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `37759ef2`), 대조군 `--control-commit 37759ef2`, 일지 2026-10-29-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 37759ef2 .scratch/harness/probes/canary/next_session_number_body_batch.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 PR을 연 세션이 병합까지 마칠 때 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
1. 일지 항목에서 일지 파일 이름의 앞부분을 Bash나 PowerShell의 날짜·시각 명령으로 짓고
번호는 받지 않는다고 적은 문장을 찾아, 그 문장 하나를 처음부터 마침표까지 글자 그대로 옮겨라.
2. PR 본문 항목에서 PR을 연 뒤 어떤 커밋을 푸시하면 PR의 무엇을 고치라는지 적은 문장을
글자 그대로 옮겨라.
'''
expect = ["`Get-Date -Format yyyy-MM-dd-HHmm`으로 짓고 번호는 받지 않는다", "넓힌 범위로 먼저 고친다"]
source = ".claude/skills/next-session/merge.md"
skill = "next-session"
skill_body = "files"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
