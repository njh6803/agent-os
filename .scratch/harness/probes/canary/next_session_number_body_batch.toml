# next-session 1단계에 더한 구절(일지 번호를 받으면 바로 파일을 만든다, 대기열 205. 범위를 넓힌 커밋을 푸시하기 전에 PR
# 본문을 먼저 고친다, 대기열 200)과 결정표 chore 배치 줄에 더한 조건(같은 대상 파일의 열린 항목 셋, 대기열 166)이 새
# 세션에 실리는지. 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 세 카나리아가
# 모두 없다. 병합 뒤에는 주 체크아웃이 새 사본이라, 다시 돌리려면 옛 판을 `git worktree add --detach` 로 꺼내 대조군의
# checkout 으로 준다(spec_reviewer_agent.toml 의 머리말).
# 최신 결과: 통과 4(2026-10-13, 이 PC, claude 2.1.296, 대조군 주 체크아웃의 옛 판 `80445cf`, 일지 2026-10-13-02).
#   같은 PR 안의 앞 판 넷(통과 4, 통과 3·실패 1, 통과 4, 통과 2·실패 2)과 그때마다 고친 질문·본문은 그 일지의 검사 절.
#   2026-10-13 PR 직전 버그 축 반영(200 문장의 순서와 expect 하나)은 `--preflight` 로 갈음했다(통과, 일지 2026-10-13-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/next_session_number_body_batch.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽고 셋을 답하라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
1. 1단계에서 `tools/sibling_overlap.py`의 `다음 빈 번호` 줄로 일지 번호를 받으라는 문장을 찾아, 그 문장 하나를
   처음부터 마침표까지 글자 그대로 옮겨라.
2. 1단계에서 PR을 연 뒤 어떤 커밋을 푸시하면 PR의 무엇을 고치라는지 적은 문장을 글자 그대로 옮겨라. 본문에 그런
   문장이 없으면 "없음"이라고만 답하라.
3. "다음 작업 결정표"에서 "다음 단계" 열이 "하네스 chore 배치"인 줄을 찾아, 그 줄의 맨 앞 칸(열 머리글이 "지금(병합
   뒤)"인 칸)에 든 글 전체를 글자 그대로 옮겨라.
'''
expect = ["다른 일보다 먼저 그 이름으로 머리 한 줄만 든 일지 파일을 만든다", "넓힌 범위로 먼저 고친다", "대상 파일이 같은 항목 셋 이상"]
source = ".claude/skills/next-session/SKILL.md"
skill = "next-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
