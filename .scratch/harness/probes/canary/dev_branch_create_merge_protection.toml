# next-session merge.md 의 "병합 방법" 절에 dev-branch-create 티켓이 고친 보호 설정 문단(자동 삭제 문서가 말하지 않는 것과
# 두 파일이 막는 삭제)이 새 세션에 실리는지. dev 의 보호 설정 파일 이름은 이 브랜치의 새 파일이라 세션의 git 상태에 실려
# 카나리아로 쓰지 못한다(러너가 거절했다). 실험군은 이 워크트리, 대조군은 옛 판을 든 주 체크아웃이다.
# 이 PR 이 병합되기 전의 주 체크아웃에는 그 문단의 두 값이 없다. 병합 뒤에 다시 돌리려면 병합 전 커밋을 `--control-commit` 으로
# 준다(README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-12, 이 PC, claude 2.1.322, dev-release-pr-step 티켓이 이 문단의 끝 문장을 고친 뒤, 실험군은 `4b02bbe29` 위의 커밋하지 않은 본문, 대조군은 `82297e614`). 그 앞 판은 통과 4(일지 2026-11-12-1148-dev-branch-create, 실험군은 `82297e614` 위의 본문).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/dev_branch_create_merge_protection.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 PR을 병합할 때 여는 파일 하나를
Read로 열고, 아래 두 물음을 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
1. "병합 방법" 절에서 출시 PR과 되돌려 합치기 PR의 보호 설정을 말하는 문단이 GitHub 자동 삭제 문서(웹 요약)에 대해 그 문서가 말하지 않는다고 적은 구절을 글자 그대로 옮겨라.
2. 같은 문단이 두 보호 설정 파일 모두 삭제를 막는다고 적으며 괄호 안에 든 설정 이름과 값을 글자 그대로 옮겨라.
'''
expect = ["어느 설정이 막는지는 말하지 않으며", "allow_deletions: false"]
source = ".claude/skills/next-session/merge.md"
skill = "next-session"
skill_body = "files"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
