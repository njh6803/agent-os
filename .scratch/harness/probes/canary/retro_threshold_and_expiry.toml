# retro 4단계에 더한 더하는 것의 문턱과 훅 발동 확인, 5단계에 더한 행의 종류와 만료(ADR 0036)가 새 세션에 실리는지
# (일지 2026-10-20-09).
# 실험군은 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 네 카나리아가 모두 없다.
# 병합 뒤에는 주 체크아웃이 새 사본이라, 다시 돌리려면 `# 최신 결과:` 줄의 대조군 커밋을 `--control-commit` 으로 준다
# (README `canary/` 행).
# 최신 결과: 통과 4(2026-10-20, 이 PC, claude 2.1.302, 대조군 주 체크아웃 `be04b6e1`, 일지 2026-10-20-09). 셀프 리뷰가
#   만료의 회차 세기를 고쳐 넷째 카나리아를 "가장 큰 회차에 하나를 더한 값이다"로, 둘째 질문을 "문턱을 지나면"으로 바꾼 뒤
#   다시 돌린 결과다. 그 전에 사전 확인이 첫 판의 둘째 카나리아(`tools/hook_report.py`)를 세션에 실리는 git 상태의 새 파일
#   경로에 있다고 막아 "뺄 후보"로 바꿨다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/retro_threshold_and_expiry.toml <출력 디렉터리>
kind = "skill"
question = '''
retro 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일(일지 읽기, 회고, 파일 쓰기)은 하지 않고 본문만 읽는다.
1) 본문의 4단계 "반영할 때"에서 더하는 것(새 훅·검사, 더하는 문장)을 언제 반영하는지 적은 문장을 글자 그대로 옮겨라.
2) 같은 4단계에서 새 훅·검사가 문턱을 지나면 그 전에 돌리라는 명령의 출력 가운데, 어느 줄에 든 훅을 빼자고 넘기라는지 그 줄의
   이름을 따옴표 안의 글자 그대로 옮겨라.
3) 본문의 5단계에서 같은 종류의 결함이 사례마다 다른 자리에서 나오는 행을 다룬 항목을 찾아, 세 번째 사례부터 어떻게 하는지
   적은 문장을 글자 그대로 옮겨라.
4) 본문의 5단계에서 만료한 행의 실수가 다시 일어나면 회차를 어떻게 세는지 적은 문장을 글자 그대로 옮겨라.
본문에 그런 문장이 없으면 그 번호에 "없음"이라고만 답하라.
'''
expect = [
    "같은 실수의 세 번째이거나 손상이 한 번 났을 때 반영한다",
    "뺄 후보",
    "세 번째 사례부터는 사례를 고치지 않는다",
    "가장 큰 회차에 하나를 더한 값이다",
]
source = ".claude/skills/retro/SKILL.md"
skill = "retro"

[[arm]]
name = "워크트리"
role = "experiment"

