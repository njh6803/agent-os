# `.claude/rules/tools.md` 가 `paths` 에 맞는 파일을 Read 로 열 때 실리는지(대기열 127).
# 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 둘이다. 문장 자체와, 그 문장이 놓인 자리(규칙 파일의 첫 제목)다.
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 `tools/` 의 식별자와 문자열·주석·독스트링의 언어를 정한 문장이 있으면,
그 문장이 든 지시 파일의 첫 `#` 제목과 그 문장을 각각 글자 그대로 옮겨라.
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["하네스 규칙", "식별자는 영문, 문자열·주석·독스트링은 한국어다"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
