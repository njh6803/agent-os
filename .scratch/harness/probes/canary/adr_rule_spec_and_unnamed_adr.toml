# `.claude/rules/adr.md` 첫 두 항목에 더한 문장(대기열 391·397)이 ADR 파일을 Read 로 열 때 실리는지. 하나는 명세가 ADR 본문의
# 사실을 거짓으로 만들 때 그 ADR 의 이력에 적을 것이고, 하나는 새 ADR 이 이름으로 들지 않은 ADR 을 찾는 길이다.
# 실험군은 두 문장을 언급하지 않는 ADR 하나를, 대조군은 같은 체크아웃의 paths 밖(pyproject.toml)을 읽는다.
# 최신 결과: 통과 4(2026-10-22, 이 PC, claude 2.1.302, 두 갈래 모두 `6bd52b06` 위의 커밋 전 작업 트리, 대조군은 "없음" 둘,
#   일지 2026-10-22-07).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/adr_rule_spec_and_unnamed_adr.toml <출력 디렉터리>
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 두 곳을 찾아 각각 글자 그대로 옮겨라.
1) 기능 명세가 정한 것이 아키텍처 결정 기록 본문의 사실을 거짓으로 만들 때, 그 기록의 이력에 무엇을 적으라고 하는지를 말하는 구절.
2) 새 결정 기록이 이름으로 들지 않은 다른 결정 기록의 본문도 보라며, 그 기록들을 무엇으로 찾으라고 하는지를 말하는 구절.
읽은 파일에서 추측하지 않는다. 실린 지시에 그런 곳이 없으면 그 물음에는 "없음"이라고만 답하라.
'''
expect = ["무엇이 바뀌었는지와 명세의 경로", "결정이 바꾸는 규약 문서의 절 이름과 경로"]
source = ".claude/rules/adr.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "docs/adr/0001-runtime-engine-behind-the-plugin-contract.md"

[[arm]]
name = "paths-밖"
role = "control"
target = "pyproject.toml"
