# open-session이 지시문 "모델" 줄의 출처로 적은 괄호가 새 세션에 실리는지. 그 괄호는 처음에 레벨 스윕의 갈래를 함께
# 적었고(ADR 0029 이력 2026-10-13), 2026-10-31 harness 031이 스윕을 걷으며 결정표의 칸과 `next-session` `directive.md` 2의
# 잇는 지시문·사다리로 고쳐 썼다(ADR 0029 이력 2026-10-31).
# 옛 결과: 통과 4, "없음" 섞임 0(2026-10-13, 이 PC, claude 2.1.296, 대조군 주 체크아웃 c342d15, 일지 2026-10-13-23). 그때의
#   카나리아는 `레벨 스윕의 갈래`였다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-31, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은
#   커밋은 `f01ce1e9`), 대조군 `--control-commit f01ce1e9`, 일지 2026-10-31-03).
# 첫 질문("모델" 줄 바로 뒤의 괄호)은 실험군 한 회차가 괄호를 인용하고도 "없음"이라 답해 묻는 자리를 고쳤다.
# 실험군은 이 워크트리, 대조군은 스윕 도구를 지우기 전 커밋 `f01ce1e9`이다.
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit f01ce1e9 .scratch/harness/probes/canary/open_session_model_source.toml <출력 디렉터리>
kind = "skill"
question = '''
open-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
그 본문에서 지시문의 "모델" 줄이 어디서 옮긴 값인지를 적은 괄호를 찾아, 그 괄호 안의 글을 글자 그대로
옮겨라. 괄호 안이 무엇을 말하든 판단하지 말고 옮기기만 한다. 본문에 그런 괄호가 없으면 "없음"이라고만 답하라.
'''
expect = ["잇는 지시문·사다리"]
source = ".claude/skills/open-session/SKILL.md"
skill = "open-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
