# next-session 1단계 3(일지. 대기열 341 전에는 4)의 번호 받기에 더한 2 갈래 문장(번호 대조 도구의 `할 일:` 줄을 따른다, 대기열 251)이 새 세션에 실리는지.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(55ba299)이다. 옛 판에는 그 갈래가 없다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판의 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 옮기기 전 결과: 통과 4(2026-10-13, 이 PC, claude 2.1.296, 대조군 `55ba299`, 실험군은 `55ba299` 위의 커밋 전 변경, 일지 2026-10-15-15).
#   셀프 리뷰 반영(문장을 "날짜가 오늘이 아닐 수 있다" 뒤로 옮겼다)은 같은 날 사전 확인으로 갈음했다(일지 2026-10-15-15).
# 2026-10-29 harness 027 이 본문을 `merge.md` 로 옮겨 하위 파일 갈래(`skill_files`)로 바꿨다.
#   대조군은 옮기기 전 커밋 `37759ef2` 을 `--control-commit` 으로 준다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-29, 이 PC, claude 2.1.312, 실험군은 이 워크트리의 커밋하지 않은 본문(러너가 찍은 커밋은 `37759ef2`), 대조군 `--control-commit 37759ef2`, 일지 2026-10-29-02).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit 37759ef2 .scratch/harness/probes/canary/next_session_overlap_exit_two.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 PR을 연 세션이 병합까지 마칠 때 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
일지 항목에서, 일지 번호를 받는 도구가 2로 끝나 번호 줄이 없을 때 할 일을 적은 문장을 찾아
처음부터 마침표까지 글자 그대로 옮겨라.
'''
expect = ["stderr의 `할 일:` 줄을 따른다"]
source = ".claude/skills/next-session/merge.md"
skill = "next-session"
skill_files = true

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../../../agent-canary-55ba299"
