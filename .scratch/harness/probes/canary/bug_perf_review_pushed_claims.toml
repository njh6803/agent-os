# bug-perf-review 정의 2단계에 더한 밀 주장 항목(대기열 260)이 새 세션의 서브에이전트에 실리는지.
# 실험군은 이 워크트리, 대조군은 바뀌기 전 판(dbcdc6d)이다. 이 PR 안에서는 주 체크아웃이 그 판이다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판의 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4(2026-10-16, 이 PC, claude 2.1.300, 대조군은 주 체크아웃 `dbcdc6d`, 실험군은 `dbcdc6d` 위의 커밋 전 변경, 일지 2026-10-16-37).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/bug_perf_review_pushed_claims.toml <출력 디렉터리>
#   병합 뒤: uv run python tools/canary.py --control-commit dbcdc6d .scratch/harness/probes/canary/bug_perf_review_pushed_claims.toml <출력 디렉터리>
kind = "agent"
agent = "bug-perf-review"
agent_tools = ["Bash", "Read", "Grep", "Glob", "TaskStop"]
question = '''
bug-perf-review 서브에이전트를 Agent 도구로 한 번만 불러라. 서브에이전트에게 줄 프롬프트는 아래 단락 그대로다.

도구를 하나도 쓰지 마라. 파일을 읽지 말고, 지금 네 지시문(시스템 프롬프트)에 적힌 것만 보고 답한다. "절차" 절 안에 부르는 쪽이 나열한 주장을 어떻게 다루는지 말하는 항목이 있으면 그 항목의 첫 문장을 글자 그대로 옮겨라. 그 절에 그런 항목이 없으면 '없음'이라고만 적어라.

서브에이전트의 답을 고치거나 줄이지 말고 그대로 전하라.
'''
expect = ["문장마다 근거와 대 본다"]
source = ".claude/agents/bug-perf-review.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
