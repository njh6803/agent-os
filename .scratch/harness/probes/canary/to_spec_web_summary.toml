# to-spec 3단계의 근거 문장 종류에 더한 웹 요약(대기열 124)이 새 세션에 실리는지.
# to-spec 은 모델이 부르지 못하는 스킬이라 질문 머리에 슬래시 명령으로 넣는다.
# 실험군은 이 명세를 부른 체크아웃, 대조군은 바뀌기 전 판(a8e349c)이다. 옛 판에는 카나리아가 없다.
# 병합 뒤에는 주 체크아웃이 새 사본이라 옛 판을 따로 꺼낸다(README `canary/` 행).
# 최신 결과: 통과 4(2026-10-12, 이 PC, claude 2.1.296, 대조군 `a8e349c`, 일지 2026-10-12-27).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   git worktree add --detach ../../../../agent-canary-a8e349c a8e349c
#   uv run python tools/canary.py .scratch/harness/probes/canary/to_spec_web_summary.toml <출력 디렉터리>
kind = "skill"
question = '''
/to-spec
위에 실린 스킬 본문이 시키는 일(저장소 탐색, 명세 쓰기, 질문)은 하지 않는다. 본문만 보고 답한다.
Process 의 3단계에서, 프로브를 두는 자리와 근거 문장의 종류를 어느 문서가 정하는지 적은 문장을 글자 그대로 옮겨라.
본문에 그런 문장이 없으면 "없음"이라고만 답하라.
'''
expect = ["어림, 웹 요약)"]
source = ".claude/skills/to-spec/SKILL.md"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "옛-판"
role = "control"
checkout = "../../../../agent-canary-a8e349c"
