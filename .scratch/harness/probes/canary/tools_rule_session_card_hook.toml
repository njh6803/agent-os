# `.claude/rules/tools.md` 훅 시간 문단에 더한 문장(티켓 ticket-for-every-pr 06, `hook_session_card`)이 `paths` 에 맞는 파일을
# Read 로 열 때 실리는지. 실험군은 규칙의 paths 안(tools/), 대조군은 밖(README.md)을 읽는다. 둘 다 이 체크아웃이다.
# 카나리아는 셋이다. 규칙 파일의 첫 제목, 세션 카드 도구에 붙는 PreToolUse 훅이 하지 않는 일의 구절, 그 훅의 시간을 어림한 값이다.
# 훅 이름은 카나리아로 쓰지 않는다. 이 브랜치의 새 파일 이름이라 세션에 실리는 git 상태에서 답이 올 수 있다.
# 돌리는 법: uv run python tools/canary.py .scratch/harness/probes/canary/tools_rule_session_card_hook.toml <출력 디렉터리>
# 최신 결과: 통과 4(2026-10-21, 이 PC, 두 갈래 모두 `303e8fb5` 위의 커밋 전 작업 트리, 대조군은 "없음" 셋). 그 앞의 한 번은 카나리아에
# 훅 이름을 두어 도구가 돌리기 전의 확인에서 멈췄다(위 둘째 줄).
kind = "rule"
question = '''
Read 도구로 `{target}` 파일 하나만 통째로 읽어라. 다른 파일은 읽지 않는다.
그 뒤 이 세션에 실린 지시 가운데 셋을 찾아 글자 그대로 옮겨라. 파일을 읽을 때 함께 실린 규칙 파일도 지시로 센다.
1) 훅마다 붙는 도구와 시간을 적은 문단이 든 지시 파일의 첫 `#` 제목.
2) 그 문단에서, 앱의 세션 카드 도구(`mcp__ccd_session__start_session`)에 붙는 PreToolUse 훅 가운데 매처가 그 도구인 훅이 무엇을 하고 무엇을 하지 않는지 적은 구절.
3) 그 훅의 시간을 어떻게 적었는지(잰 값이면 그 범위, 어림이면 그 어림의 값).
읽은 파일의 코드에서 추측하지 않는다. 실린 지시에 해당하는 문장이 없으면 그 물음에는 "없음"이라고만 답하라.
'''
expect = ["하네스 규칙", "파일도 자식도 열지 않는다", "약 0.2초"]
source = ".claude/rules/tools.md"

[[arm]]
name = "paths-안"
role = "experiment"
target = "tools/hook_env_read.py"

[[arm]]
name = "paths-밖"
role = "control"
target = "README.md"
