# next-session `directive.md` 2에 더한 레벨 스윕 멈춤(ADR 0029 이력 2026-10-31)이 새 세션에 실리는지.
# 실험군은 이 워크트리, 대조군은 그 문장이 없는 origin/main `c18619bb`이다. 스윕 도구를 걷는 chore 가 그 두 문장을 지우면
# 이 명세도 걷는다.
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-31, 이 PC, claude 2.1.312, 실험군 커밋 `5a141438`, 대조군 `--control-commit c18619bb`, 일지 2026-10-31-02). 표지는 모든 브랜치를 스윕 밖으로 본다는 고친 문장에만 있다. 고치기 전 판(`d80fb591`)의 `directive.md`에는 그 글자가 없다(전문을 읽어 봤다).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py --control-commit c18619bb .scratch/harness/probes/canary/next_session_sweep_stopped.toml <출력 디렉터리>
kind = "skill"
question = '''
next-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문이 상황마다 Read로 열라고 가리키는 하위 파일 가운데 다음 작업의 지시문을 낼 때 여는 파일 하나를
Read로 열고, 아래를 그 파일에서만 찾는다. 스킬 본문(SKILL.md)에 든 글은 옮기지 않는다.
본문이 그런 하위 파일을 가리키지 않거나 그 파일에 없으면 그 물음에 "없음"이라고만 답하라.
1. 칸마다 절의 모델 항목에 레벨 스윕을 멈췄다는 문장이 있으면, 지금 무엇을 옮기고 무엇을 건너뛰는지 적은 부분을
글자 그대로 옮겨라.
'''
expect = ["모든 브랜치를 `스윕 밖`으로 본다"]
source = ".claude/skills/next-session/directive.md"
skill = "next-session"
skill_body = "files"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
