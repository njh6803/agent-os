# tidy-checkouts 스킬이 "주 체크아웃이 따르는 브랜치"(origin/dev 가 있으면 dev, 없으면 main)를 정의한 문단이 새 세션에
# 실리는지(dev-base-skills-docs 티켓, ADR 0043. 그 문단의 굵은 머리는 harness 티켓 rename-workflow-terms 에서 옛 이름 "루트 브랜치"를 바꾼 것이다). 실험군은 이 워크트리, 대조군은 옛 판을 든 주 체크아웃이다. 이 PR 이 병합되기 전의
# 주 체크아웃에는 그 문단이 없다. 병합 뒤에 다시 돌리려면 병합 전 커밋을 `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-11-18, 이 PC, claude 2.1.325, 실험군은 `f13190072` 위의 커밋 전 작업 트리 셋, 대조군 `--control-commit cd77e4096` 하나, 일지 2026-11-18-1559). 용어집의 작업 규약 쪽 이름 셋을 바꾸며 원천을 고친 뒤 다시 돌렸다(harness 티켓 rename-workflow-terms). 그 뒤 셀프 리뷰가 원천 본문(물음이 묻는 문단 밖의 8행)을 고쳐, 같은 날 사전 확인(`--preflight --control-commit cd77e4096`)으로 갈음했다(일지 2026-11-18-1559).
# 그 전 결과: 통과 4, "없음" 섞임 0(2026-11-12, 이 PC, claude 2.1.322, 실험군은 `cd77e4096` 위의 커밋하지 않은 본문, 대조군은 주 체크아웃 `cd77e4096`, harness 티켓 dev-base-skills-docs).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/dev_base_tidy_root_branch.toml <출력 디렉터리>
kind = "skill"
question = '''
tidy-checkouts 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않는다.
본문에서 주 체크아웃이 어느 브랜치를 따르는지 정의한 문단(굵은 글씨로 시작하는 짧은 문단)을 찾아라. 그 문단을 여는 굵은 글씨 부분을 마침표까지 글자 그대로 옮기고,
`origin/dev`가 아직 없는 동안 어떻게 되는지 적은 문장도 글자 그대로 옮겨라. 그런 문단이 없으면 "없음"이라고만 답하라.
'''
expect = ["주 체크아웃이 따르는 브랜치.", "origin/dev가 없는 동안은 모든 곳이 지금처럼 main이다"]
source = ".claude/skills/tidy-checkouts/SKILL.md"
skill = "tidy-checkouts"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
