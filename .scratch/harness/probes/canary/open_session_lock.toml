# open-session 3단계와 "막히면"에 기계 전체의 열기 잠금(대기열 360, harness 티켓 014)을 더한 것이 새 세션에 실리는지. 실험군은
# 이 워크트리, 대조군은 주 체크아웃이다. 이 PR 이 병합되기 전의 주 체크아웃에는 세 카나리아가 모두 없다.
# 병합 뒤에는 주 체크아웃이 새 사본이라, 다시 돌리려면 `# 최신 결과:` 줄의 대조군 커밋을
# `--control-commit` 으로 준다(README `canary/` 행).
# 최신 결과: 통과 4, "없음" 섞임 0(2026-10-26, 이 PC, claude 2.1.302, 대조군 주 체크아웃의 옛 판 `92b61458`, 일지 2026-10-26-13).
# 돌리는 법: 워크트리 `.claude/worktrees/<이름>/` 루트에서
#   uv run python tools/canary.py .scratch/harness/probes/canary/open_session_lock.toml <출력 디렉터리>
kind = "skill"
question = '''
open-session 스킬을 Skill 도구로 불러 본문을 읽어라. 스킬이 시키는 일은 하지 않고 본문만 읽는다.
본문에서 아래 셋을 찾아 각각 글자 그대로 옮겨라. 문장이 무엇을 말하든 판단하지 말고 옮기기만 한다.
1. 3단계에서, 스크립트가 다른 세션의 열기와 겹치지 않으려고 쏘기 전에 잡는 것을 잡았을 때 출력에 끼는 줄의 모양
2. 3단계에서, 그것을 잡지 못했다는 오류로 멈췄을 때 이 세션이 할 일을 적은 문장
3. "막히면" 절에서, 지시문이 든 입력창을 찾지 못했거나 모델을 고르는 사이 지시문이 바뀌어 멈췄을 때 돌리라는 명령과 그 명령이 무엇으로 가르는지를 적은 문장
본문에 그런 것이 없는 번호에는 "없음"이라고만 답하라.
'''
expect = ["lock=<시각> waited=<기다린 초>s", "같은 파일로 한 번 다시 돌리고", "앱의 로그와 이 계정의 트랜스크립트로 가른다"]
source = ".claude/skills/open-session/SKILL.md"
skill = "open-session"

[[arm]]
name = "워크트리"
role = "experiment"

[[arm]]
name = "주-체크아웃"
role = "control"
checkout = "../../.."
