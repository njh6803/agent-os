# tools/mutate.py 의 변이마다 시간 제한(대기열 139)과 번호·--since 로 고르기(대기열 193)에서 규칙 하나씩을
# 뺀다. 새 시험은 없는 이름의 import(수집 오류)로만 빨갰거나 구현 뒤에 더해 빨강을 본 적이 없어 행동의
# 빨강을 여기서 본다.
# 도구가 자기 자신을 고친다(돌고 있는 프로세스는 이미 읽은 원본으로 돈다).
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/mutate_timeout_select_mutations.toml
# POSIX 의 프로세스 그룹 끝내기(`os.killpg`)는 이 윈도우에서 돌지 않아 변이로 재지 못한다. CI 의 리눅스
# pytest 가 그 길로 실제 러너 시험을 돈다.

[[mutation]]
name = "시간 제한을 넘긴 결과를 오류로 보지 않는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"
[[mutation.edit]]
file = "tools/mutate.py"
old = '''
    if result.timed_out_after is not None:
        return Verdict("error",'''
new = '''
    if False:
        return Verdict("error",'''

[[mutation]]
name = "변이의 시간 제한을 러너에 넘기지 않는다"
tests = ["tests/tools/test_mutate.py"]
expect = "red"
[[mutation.edit]]
file = "tools/mutate.py"
old = '''tests, mutation.timeout, runner)'''
new = '''tests, DEFAULT_TIMEOUT, runner)'''

