# 다른 프로세스가 교체하는 동안의 읽기 시험이 판정을 바꾼 뒤에도 재시도의 회귀를 잡는지, 판정 함수
# `_read_while_past_cap` 의 두 조건(까닭이 잠김, 상한을 다 쓴 뒤)이 시험으로 묶여 있는지 본다(ADR 0035).
# 돌리는 법: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/filesystem_read_retry_mutations.toml
# 앞의 넷은 윈도에서만 뜻이 있다. 리눅스는 교체가 원자적이라 PermissionError 가 없어 모두 초록이다.

[[mutation]]
name = "읽기 재시도를 없앤다"
tests = ["tests/adapters/test_filesystem.py", "-k", "다른_프로세스가_교체하는"]
expect = "red"
repeat = 3
expect_output = ["PluginError: 운영자 파일을 읽을 수 없다"]

[[mutation.edit]]
file = "src/agent_os/adapters/filesystem.py"
old = '''_RETRY_DELAYS = (0.001, 0.002, 0.004, 0.008, 0.016)'''
new = '''_RETRY_DELAYS = ()'''

# 이 사례가 잡지 못하는 회귀다. 윈도의 `time.sleep` 은 0.2ms 를 그보다 길게 자서 다섯 번의 실제 합이
# 수 ms 이고(`retry_sleep_floor.py --delays`, README 의 그 행), 부하가 없으면 막힘이 대개 그 안에 풀린다.
# 판정을 바꾸기 전에도 같다(아래 옛 판정의 변이). 상한의 크기를 못 박는 시험은 이 파일에 없다.
# 초록은 확률이다. 부하 없는 막힘의 가장 긴 것(5.2ms)이 다섯 번 쉰 합의 중앙(4.5ms)보다 길어, 막힘이
# 그 합보다 오래 가는 회차는 빨갛다. 그래서 첫 변이는 열 번 돌려 그 빈도를 결과로 남긴다.
[[mutation]]
name = "읽기 재시도의 간격을 0.2ms 다섯으로 줄인다"
tests = ["tests/adapters/test_filesystem.py", "-k", "다른_프로세스가_교체하는"]
expect = "green"
repeat = 10

[[mutation.edit]]
file = "src/agent_os/adapters/filesystem.py"
old = '''_RETRY_DELAYS = (0.001, 0.002, 0.004, 0.008, 0.016)'''
new = '''_RETRY_DELAYS = (0.0002, 0.0002, 0.0002, 0.0002, 0.0002)'''

[[mutation]]
name = "옛 판정으로 읽기 재시도의 간격을 0.2ms 다섯으로 줄인다"
tests = ["tests/adapters/test_filesystem.py", "-k", "다른_프로세스가_교체하는"]
expect = "green"
repeat = 3

