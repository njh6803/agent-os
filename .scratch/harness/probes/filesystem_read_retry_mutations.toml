# 아래 둘은 판정 시험을 하나씩만 고른다. 시험이 `pytest.raises` 하나뿐이라 그 실패 머리(DID NOT RAISE)가
# 고른 단언의 표지다. 두 변이를 손으로 넣어 실패 출력을 보고 골랐다.
