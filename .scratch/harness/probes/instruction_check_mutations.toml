# chore/instruction-loading-and-enforcement 의 지침 검사 변이. 형식은 tools/mutate.py 의 독스트링.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/instruction_check_mutations.toml
# 변이마다 한 줄씩 되돌려 그 줄을 지키는 테스트가 빨강이 되는지 잰다. 앞의 넷은 이 chore 의 것이다.
