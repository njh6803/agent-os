# tools/hook_grep_omitted.py(대기열 145)의 판정과 배선을 하나씩 깨는 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/grep_omitted_hook_mutations.toml
# 끝의 하나는 대조군이다. 디렉터리를 훑은 결과에는 경로가 붙어 있어 입력의 경로를 붙이는 갈래를 재지 못한다.
# 첫 판의 대조군은 시험 하나의 단언만 뺐는데, 셀프 리뷰 뒤 더한 표지 그대로인 줄의 시험도 경로를 재 빨개졌다.

[[mutation]]
name = "생략된 문맥 줄도 센다"
tests = ["tests/tools/test_hook_grep_omitted.py"]
expect = "red"
[[mutation.edit]]
file = "tools/hook_grep_omitted.py"
old = '''        if line != MARKER and not line.endswith(":" + MARKER):
            continue
        place = line.removesuffix(MARKER).removesuffix(":")'''
new = '''        context = "[Omitted long context line]"
        if line != MARKER and not line.endswith(":" + MARKER) and not line.endswith(context):
            continue
        place = line.removesuffix(MARKER).removesuffix(context).removesuffix(":")'''

