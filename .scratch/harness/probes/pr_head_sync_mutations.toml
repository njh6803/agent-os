# tools/hook_pr_head_sync.py(대기열 86)의 판정 규칙과 배선을 하나씩 빼는 변이.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/pr_head_sync_mutations.toml
# 배선 둘(main 이 로컬 판정을 gh 앞에 두는 것, 러너 픽스처의 푸시하지 않은 커밋)은 tools/run_hooks.py 를
# 러너로 돈다. 그 러너는 어긋남이 있으면 1 이라 판정은 pytest 의 것(종료 0·1)을 빌린다. gh 를 부르는 길은
# 네트워크라 변이로 재지 않는다.

[runner.hooks]
command = ["uv", "run", "--no-sync", "python", "tools/run_hooks.py"]
judge = "pytest"

[[mutation]]
name = "draft 로 되돌리는 --undo 도 잡는다"
tests = ["tests/tools/test_hook_pr_head_sync.py"]
expect = "red"
[[mutation.edit]]
file = "tools/hook_pr_head_sync.py"
old = '''
        if token == "--undo":
            return None
'''
new = '''
'''

