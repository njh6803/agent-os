# tools/mutate.py 의 `_quality_problems`(빨강을 기대했는데 표지가 없거나 pytest 의 단언 풀이 줄인 표지,
# 대기열 350·517, harness 티켓 041)에서 규칙 하나씩을 뺀 변이. 모두 tests/tools/test_mutate.py 의 새 시험을
# 빨갛게 해야 한다. 도구가 자기 자신을 고치므로 분리 임시 워크트리에서 그 워크트리의 도구로 돌린다.
#   PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/mutate_marker_quality_mutations.toml [번호 ...]

[[mutation]]
name = "표지 없는 빨강을 알리지 않는다"
tests = ["tests/tools/test_mutate.py", "-k", "표지를_뗀 or 표지가_없는 or 단언을_풀어 or 표지_품질 or 표지의_품질"]
expect = "red"
expect_output = ["AssertionError: 원문 확인: 변이 1 모두 원문이 한 번씩 있다"]

