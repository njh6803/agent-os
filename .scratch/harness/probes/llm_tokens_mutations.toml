# 대기열 113. `-m llm` 실행 끝에 트레이스 토큰 합계를 찍는 tools/llm_tokens.py 와 tests/conftest.py 의 변이.
# 변이마다 빨개져야 할 테스트 하나로 `-k` 를 좁힌다. 엉뚱한 테스트의 빨강이 기대와 맞지 않게 하기 위해서다
# (docs/agents/issue-tracker.md 프로브와 근거 절, 대기열 144).
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/llm_tokens_mutations.toml

[[mutation]]
name = "llm 마커를 보지 않는다"
tests = ["tests/test_conftest.py", "-k", "돌지_않으면"]
expect = "red"

