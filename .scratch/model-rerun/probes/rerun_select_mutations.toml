# 티켓 05(과제 고르기, `tools/rerun_select.py`)의 시험이 실제로 무는지 변이로 본다(implement 스킬,
# 대기열 29). 이 티켓은 구현을 시험보다 먼저 써서 시험이 처음부터 초록이었고, 갈림 하나하나는 빨강을
# 본 적이 없다. 티켓이 든 갈림(푼 티켓, 싼 조건, 되살리기, 날짜 바닥과 거슬러 채우기와 닿지 않은 행의
# 까닭, 숨은 시험 문턱, 크기 정렬의 동률, 파일럿과 본 측정의 층·씨앗·엇갈린 차례·갈래 계획, 회차 상한,
# 표의 칸과 끝 줄)과 바깥 층의 갈림(병합 기록 읽기의 첫 부모 줄·PR 번호 꼬리·BOM·둘 이상 푼 커밋, 자식
# 환경의 저장소 변수, git 호출의 시간 제한, 출력 자리의 폴더와 쓰기 실패, 본 측정 명령의 목록)을 하나씩
# 되돌린다. 표지는 고른 단언이 실패할 때만 나오는 문구다(`.claude/rules/probes.md` 첫 항목).
