# 티켓 04(회차의 자리, `tools/rerun_round.py`)의 시험이 실제로 무는지 변이로 본다(implement 스킬,
# 대기열 29). 이 티켓의 시험은 구현 전에 import 오류로만 빨갰고 판정 하나하나가 빨강을 본 적은 없어서,
# 뿌리의 머리 견줌과 상위의 .claude, 회차 폴더의 표지와 덮어쓰기 거부, bare 로 미는 것과 클론 대 보기,
