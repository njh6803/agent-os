# 티켓 07(게이트와 숨은 시험, `tools/rerun_gates.py`)의 시험이 실제로 무는지 변이로 본다(implement
# 스킬, 대기열 29). 이 티켓의 게이트 시험은 구현 전에 모듈이 없어 수집 오류로만 빨갰고, 갈림 하나하나는
# 빨강을 본 적이 없다. 티켓이 든 대상(결과 커밋만 보기, 게이트 셋과 그 몫, 시간 넘김, 숨은 시험의 셈과
# 시간 넘김, 덮기와 그 자리의 링크, 걷기와 링크 끊기, 자식 환경, 준비 실패)과 함께, 이 티켓이 고친 둘
# (회차 기록의 끝난 꼴 두 칸 `tools/rerun_files.py`의 `_check_end`, 04의 `SetupFailed` 불변식)과 모은
# 링크 끊기(`tools/tidy_checkouts.py`의 `cut_links`)를 하나씩 되돌린다. 표지는 고른 단언이 실패할 때만
# 나오는 문구다(`.claude/rules/probes.md` 첫 항목).
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/model-rerun/probes/rerun_gates_mutations.toml

