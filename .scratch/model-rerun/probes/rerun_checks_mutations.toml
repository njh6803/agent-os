# 티켓 09(측정 아님 가르기, `tools/rerun_checks.py`)의 시험이 실제로 무는지 변이로 본다(implement 스킬,
# 대기열 29). 계정(로그인, 계정 이름, 글자 그대로의 설정 폴더), 설정 폴더의 `env`, init(MCP, 플러그인
# source, 줄 판정), 모델(별칭, inherit, 본 세션의 노력, 서브에이전트의 synthetic, Agent 입력이 고른 모델,
# 하네스 모델), 셸 명령의 낱말 gh(커밋 메시지 떼기, 명령이 되는 메시지, heredoc 두 길, `--`), 경로(조각
# 경계, 자기 회차, 자기 세션 기록, 링크를 푼 꼴, Git Bash 꼴, 대신하는 이름, 경로 칸의 상대 경로, 글 칸),
# 쓰기 내용(`.md`, `tests/`), 거부된 호출, Skill 이름, 기록의 도구 이름, 한도(시각 하나라도 못 읽음,
# bool), 판정 차례, 사용률의 첫 값, 거부 수를 하나씩 되돌린다. 셀프 리뷰 반영에서 더한 것은 설정 폴더의
# 잘못을 측정 아님(설정)으로 적기, 세션마다의 Agent 입력 모델, 셸 예약어, 따옴표 없는 구분자의 `$(cat`,
# 홈 아래의 설정 폴더와 뿌리, 중괄호 경계, 쓰기 대상의 Git Bash 꼴, `Monitor`의 웹소켓 입력이다. 실제
# 프로세스 시험(허용 밖 init 에서 끄기)은 고르지 않는다. 줄 판정을 지우면 가짜가 init 뒤에 멈추는 600초를
# 기다린 뒤에야 빨개지고 자는 자식을 600초 남기기 때문이다(그 시험의 `hang=600`, `child=600`). 줄 판정의
# 변이는 값만 받는 시험이 보고, `drive`가 줄 판정에서 끄는 것은 `rerun_continue_mutations.toml`의 "줄
# 판정이 참이어도 읽기를 멈추지 않는다"가 30초 마감의 시험으로 본다.
# 표지는 고른 단언이 실패할 때만 나오는 값의 비교 문구나 단언의 메시지이고, 매개변수 시험은 실패한 사례의
# id 를 함께 든다. 첫 판은 표지를 없는 문구로 둔 판을 돌려 변이마다 실패 출력을 한 번 본 뒤
# 골랐다(`.claude/rules/probes.md` 의 표지 항목). 그 판에서 셋(서브에이전트의 synthetic, `--` 뒤의 `-m`,
# 접두가 붙은 Skill 이름)이 초록이어서 그 길을 밟는 사례를 시험에 더했다(일지 2026-10-23-51).
