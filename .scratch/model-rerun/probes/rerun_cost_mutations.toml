# 티켓 07(공식 단가, `tools/rerun_cost.py`)의 시험이 실제로 무는지 변이로 본다(implement 스킬, 대기열
# 29). 이 티켓의 공식 단가 시험은 구현 전에 모듈이 없어 수집 오류로만 빨갰고, 갈림 하나하나는 빨강을 본
# 적이 없다(대신 셈 이름의 정규화만 시험을 먼저 고쳐 빨강을 봤다). 티켓이 든 대상(응답을 한 번만 세기와
# 그 키, 출력이 가장 큰 usage, 캐시 쓰기의 두 배수와 남는 몫, Haiku 의 높은 단가와 그 경계, synthetic,
# 이름 꼬리, 대신 셈과 그 배수, subagents, 회차 합)을 하나씩 되돌린다. 표지는 고른 단언이 실패할 때만
# 나오는 문구다(`.claude/rules/probes.md` 첫 항목).
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/model-rerun/probes/rerun_cost_mutations.toml

