# 티켓 02(숨은 시험 가르기, `tools/rerun_hidden.py`)의 시험이 실제로 무는지 변이로 본다(implement
# 스킬, 대기열 29). 이 티켓의 시험은 구현 전에 모듈이 없어 수집 오류로만 빨갰고, 갈림 하나하나는 빨강을
# 본 적이 없다. 티켓이 든 대상(조건 2의 실패 종류 셋, 조건 3의 B 유무)과 함께 조건 1, 오류 요소, junit
# 의 나쁜 쪽 고르기, 바깥 층의 `git grep` 인자, 모음 오류 뒤 이어 돌기, 링크 끊기, 덮을 자리의 링크,
# 자식 환경 벗기기를 하나씩 되돌린다. 티켓 05가 실제 후보 표에서 찾은 NUL 나누기도 든다. 표지는 고른
# 단언이 실패할 때만 나오는 문구다(`.claude/rules/probes.md` 첫 항목).
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/model-rerun/probes/rerun_hidden_mutations.toml

