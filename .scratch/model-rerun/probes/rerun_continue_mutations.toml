# 티켓 08(이어 가기와 상한, `tools/rerun_continue.py`와 `tools/rerun_session.py`의 끄기)의 시험이 실제로
# 무는지 변이로 본다(implement 스킬, 대기열 29). 물음표 끝(빈 줄, 끝 공백, 전각), 인계 지시문 옮기기(머리
# 줄, 끝 줄, 덩이 고르기, 덩이가 없을 때), 다음 호출의 종류(같은 브랜치, B 뒤 커밋), 호출 앞의 끝(세션·
# 개입·예산의 경계), 호출 뒤의 끝(시간, 예산, init, 결과 없음, 멈춰 끈 호출, 끄지 못한 호출, 막는 판정의
# 차례), 예산의 쓴 몫, 개입의 `--resume`과 그 수, 인계의 새 세션과 지시문, 첫 줄의 연 저장소, 물으며
# 끝남, 지시문 담음, 끄기(명령 줄 확인, 읽지 못함, 나무째, 거두는 기다림의 마감, 멈춘 꼴, 끄지 않은
# 기록, 끈 세션의 표시, 러너가 끊김), 이어 부르는 명령, 호출 차례, 명령 줄 읽기(PEB 의 자리, NUL, 훅
# 사본과의 대조)를 하나씩 되돌린다. 나무째 끄기의 변이는 `taskkill` 줄이라 윈도에서만 뜻이 있다. POSIX 의 그룹
# 끄기(`start_new_session`, `os.killpg`)는 이 PC 에서 변이로 볼 수 없고 리눅스 CI 의 같은 시험(끈 뒤
# 가짜와 그 자식이 남지 않는다)이 본다.
# 표지는 고른 단언이 실패할 때만 나오는 값의 비교 문구나 단언의 메시지다. 첫 판은 표지를 없는 문구로
# 둔 판을 돌려 변이마다 실패 출력을 한 번 본 뒤 골랐다(`.claude/rules/probes.md` 의 표지 항목). 셀프
# 리뷰 반영에서 고치거나 더한 변이(멈춘 꼴 `Stop`, 덩이 고르기, 러너가 끊김)는 고른 단언의 꼴에서
# 표지를 고른 뒤 그 변이를 돌려 표지가 출력에 있는지 봤다(일지 2026-10-23-44).
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/model-rerun/probes/rerun_continue_mutations.toml

