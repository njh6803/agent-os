# 티켓 10(러너 명령, `tools/rerun_runner.py`)의 시험이 실제로 무는지 변이로 본다(implement 스킬, 대기열
# 29). 다시 띄우기의 판정(측정 아님, 판, 판을 올림, id, 오염의 둘째), 어림과 예산, 과제의 차례, 동시에
# 둘, 회차 번호(뿌리 아래 폴더), 한도의 기다림(돌던 동안, 다시 뜬 때), 오염의 다시 돌기, 측정 아님의
# 멈춤, 인계의 확인(돌던 동안, 다시 뜬 때), 사전 등록 해시, 끈 세션의 비용 대신 넣기, 기록의 게이트
# 이름, 죽은 회차(프로세스, 비용 대신 넣기), 판을 내린 러너의 id 갈래, 게이트를 돌지 못한 회차와 끄지
# 못한 호출 뒤의 멈춤을 하나씩 되돌린다.
# 표지는 표지를 없는 문구로 둔 판을 돌려 변이마다 실패 출력을 한 번 본 뒤 골랐다(`.claude/rules/probes.md`
