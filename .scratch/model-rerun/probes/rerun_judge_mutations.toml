# 티켓 03(다시 풀기 판정)의 시험이 실제로 무는지 변이로 본다(implement 스킬, 대기열 29). 티켓이
# 대상으로 든 후보 조건 셋과 결론 없음 셋, 구현 전에 우연히 초록이던 파일럿 빼기, 시험보다 먼저 지은
# 갈림(C_A가 0인 표본, U가 같을 때의 차례, 결론 없음의 탐색 머리), 명령 줄 입구의 갈림(시험이 import
# 오류로만 빨갰다), 쓰는 회차의 갈림과 탐색의 거르기를 하나씩 되돌려 고른 단언이 무는지 본다. 셀프
# 리뷰가 더한 갈림(표지가 둘 이상인 README, 회차가 없거나 목록에 없는 과제, 기록 꼴이 아닌 파일, 모듈로
# 띄우기, D에서 C로 올리는 짝)도 든다.
# 사용: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/model-rerun/probes/rerun_judge_mutations.toml

