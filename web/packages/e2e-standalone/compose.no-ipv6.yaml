# 시험만 쓰는 compose 덧씌움. IPv6 가 없는 환경을 흉내 낸다(release-image 명세 "프록시 설정"의 IPv6, 명세 검토 N2).
# 환경 변수 AGENT_OS_STANDALONE_NO_IPV6=1 일 때 준비(e2e/stack.ts)가 배포 파일 묶음의 compose.yaml 뒤에 얹는다.
# 컨테이너마다 커널의 IPv6 를 끈다. 프록시의 listen 이 IPv4 뿐이고 resolver 가 ipv6=off 라서 이 환경에서도 떠야 한다.
# PostgreSQL 은 이 덧씌움의 sysctl 아래에서도 로그에 IPv6 주소 `::` 를 듣는다고 찍고, 127.0.0.1 로 묻는 `pg_isready` 는
# 연결을 받는다고 답했다(고정한 이미지를 같은 sysctl 로 `docker run` 해 손으로 봤다. 이 덧씌움을 얹은 e2e 전체는 돌리지 않았다).
services:
  proxy:
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
  postgres:
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
  migrate:
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
  serve:
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
  admin:
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
  widget:
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
  portal:
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
