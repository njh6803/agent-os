# 시험만 쓰는 compose 덧씌움. 배포 파일 묶음의 compose.yaml 은 고치지 않고, 픽스처 플러그인(echo 에이전트)을 serve 의
# 플러그인 볼륨에 넣는 일회용 서비스 하나만 더한다. 준비(e2e/stack.ts)가 `up` 전에 `compose run --rm fixtures` 로 한 번
# 돌린다.
#
# 이 서비스는 serve 와 같은 이미지에 같은 볼륨을 같은 자리(/app/plugins)에 붙인다. 이름 있는 볼륨은 처음 붙을 때 한 번
# 이미지의 내용을 소유자째 복사하므로(명세 "플러그인 루트와 트레이스 폴더를 붙이는 것"), 이 서비스가 먼저 붙어도 볼륨은
# 이미지의 예시 플러그인과 uid 10001 소유로 채워지고, 그 위에 픽스처가 같은 사용자의 파일로 얹힌다. root 컨테이너나
# docker cp 로 먼저 쓰면 소유가 root 가 되어 serve 가 플러그인을 끄고 켜지 못한다.
#
# ./fixtures 는 준비가 배포 폴더 안에 쓴다. 경로는 첫 compose 파일(배포 폴더의 compose.yaml)의 폴더 기준이다.
services:
  fixtures:
    image: ${AGENT_OS_NAMESPACE}/agent-os-runtime:${AGENT_OS_VERSION}
    command: ["cp", "-r", "/fixtures/.", "/app/plugins/"]
    restart: "no"
    volumes:
      - plugins:/app/plugins
      - ./fixtures:/fixtures:ro
