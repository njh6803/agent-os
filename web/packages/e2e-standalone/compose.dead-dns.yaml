# 시험만 쓰는 compose 덧씌움. 프록시의 바깥 DNS 를 끊어, 아직 없는 컨테이너 이름을 물으면 Docker 의 내장 DNS 가 `Server failure` 를
# 돌려주게 한다(e2e/deployment.e2e.ts 의 "프록시가 serve 를 못 찾고 시작해도" 사례가 얹는다). 내장 DNS 는 자기가 모르는 이름을
# 바깥 DNS 로 넘기고, 바깥이 닿지 않으면 그 답을 돌려준다. 출시 PR 의 CI 에서 프록시가 시작할 때 serve 이름이 이 답을 받았다.
# 127.0.0.2 는 컨테이너 안에서 아무도 듣지 않는 주소라 질문은 바로 거절된다(손으로 봤다. 티켓 e2e-standalone-proxy-serve-resolve).
services:
  proxy:
    dns:
      - 127.0.0.2
