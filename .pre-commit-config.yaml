# 로컬 자동 검사. 같은 검사를 CI(.github/workflows/ci.yml)가 최종 판정한다. 헌법 "가드레일" 절.
# 클론 뒤 한 번: uv run pre-commit install  (pre-commit과 commit-msg 두 훅이 함께 깔린다)
#              pnpm -C web install         (없으면 web-verify 훅이 첫 커밋부터 빨갛다)
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: check-instructions
        name: instructions (rules paths와 그 glob, 훅 경로, CLAUDE.md 200줄, @ 임포트, 사본 센티널, 중첩 지침 파일)
        entry: uv run python tools/check_instructions.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-type-escapes
        name: type escapes (Any, cast, 타입 억제 주석 — 원칙 III)
        entry: uv run python tools/check_type_escapes.py
        language: system
        pass_filenames: false
        always_run: true
      # 다섯째 검증 명령. pyright·pytest 처럼 web 파일이 안 바뀐 커밋에서도 돈다. e2e 는 커밋마다 브라우저와
      # Next 빌드가 돌아 넣지 않는다(ADR 0021 이력).
      - id: web-verify
        name: web verify (단계는 web/package.json 의 verify — 원칙 III 의 TS 판정자가 든다)
        entry: pnpm -C web verify
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # 아래 두 검사는 받은 파일을 한 프로세스로(require_serial). 기본은 CPU 수만큼 나눠 uv 를 띄워 두세 배 느리다.
      # stages 는 커밋 메시지 파일(text)을 넘기지 않게 한다.
      - id: check-md-tables
        name: markdown tables (GFM 에서 표가 깨지는 자리 — 칸 수, 표 아래 빈 줄, 표가 못 된 머리 행 — 대기열 44)
        entry: uv run python tools/check_md_tables.py
        language: system
        types: [markdown]
        require_serial: true
        stages: [pre-commit]
      - id: check-line-separators
        name: line separators (날것 U+2028·U+2029·U+0085 — 대기열 22)
        entry: uv run python tools/check_line_separators.py
        language: system
        types: [text]
        require_serial: true
        stages: [pre-commit]
      # stages 를 적지 않은 always_run 훅은 commit-msg 단계에서 한 번 더 돈다(일지 2026-09-28-06 회고 2).
      - id: run-hooks
        name: hooks (tools/hook_payloads.toml 대로 발동·침묵 — 대기열 24)
        entry: uv run python tools/run_hooks.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: check-quotes
        name: quotes (스테이지된 .md의 더한 줄에서 20자 이상 따옴표 인용을 저장소와 대조 — 경고만, 대기열 42)
        entry: uv run python tools/check_quotes.py
        language: system
        files: \.md$
        verbose: true
      - id: commit-msg
        name: commit message (conventional commits)
        entry: uv run python tools/check_commit_msg.py
        language: system
        stages: [commit-msg]
