# 로컬 자동 검사. 같은 검사를 CI(.github/workflows/ci.yml)가 최종 판정한다. 헌법 "가드레일" 절.
# 클론 뒤 주 체크아웃에서 한 번: uv run pre-commit install  (pre-commit과 commit-msg 두 훅이 함께
#   깔린다. git 훅은 워크트리와 공유되고, 워크트리에서 치면 훅의 파이썬 경로가 그 워크트리로 덮인다)
# 체크아웃·워크트리마다: uv sync, pnpm -C web install --frozen-lockfile  (없으면 러너의 web-verify 가 첫
#   커밋부터 빨갛다)
# 기계마다 처음과 Playwright 판이 바뀔 때: pnpm -C web exec playwright install --only-shell chromium
#   (web-verify 의 스토리 테스트가 쓴다. 없으면 건너뛰지 않고 빨갛다)
default_install_hook_types: [pre-commit, commit-msg]
# 훅은 기본으로 커밋 직전에만 돈다. 커밋 메시지 훅만 commit-msg 단계다. 단계를 적지 않은 always_run 훅은
# commit-msg 단계에서 한 번 더 돌아 pyright·pytest 가 커밋마다 두 번이었다(대기열 118, 일지 2026-10-07-02).
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      # 파일을 고치지 않는 always_run 검사를 러너가 함께 띄운다. pre-commit 은 훅을 하나씩 돈다(ADR 0005
      # 이력 2026-10-07). 목록의 원천은 tools/run_checks.py 의 CHECKS 이고, 건너뛰기는 그 id 로
      # SKIP=pytest 처럼 한다. ruff 둘 뒤라 고친 파일을 본다. web-verify 는 web 파일이 안 바뀐 커밋에서도
      # 돈다. 파이썬 티켓이 openapi.json 을 바꾸면 생성물 최신성 단계가 빨개져 다시 생성한 타입이 같은
      # 커밋에 담긴다. e2e 는 커밋마다 브라우저와 Next 빌드가 돌아 넣지 않는다(ADR 0021 이력).
      - id: parallel-checks
        name: checks (tools/run_checks.py 의 CHECKS 를 함께 띄운다)
        entry: uv run python tools/run_checks.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
      # 아래 두 검사는 받은 파일을 한 프로세스로(require_serial). 기본은 CPU 수만큼 나눠 uv 를 띄워 두세 배 느리다.
      - id: check-md-tables
        name: markdown tables (GFM 에서 표가 깨지는 자리 — 칸 수, 표 아래 빈 줄, 표가 못 된 머리 행 — 대기열 44)
        entry: uv run python tools/check_md_tables.py
        language: system
        types: [markdown]
        require_serial: true
      - id: check-line-separators
        name: line separators (날것 U+2028·U+2029·U+0085 — 대기열 22)
        entry: uv run python tools/check_line_separators.py
        language: system
        types: [text]
        require_serial: true
      # 커밋에 든 변이 표만 본다. ruff 훅 뒤라 포맷이 고친 코드와 대조한다 — 변이를 돌린 뒤 ruff format 이
      # 코드를 고쳐 커밋한 표의 원문이 사라진 일이 있었다(대기열 92). 커밋에 들지 않은 옛 표는 썩어도 된다.
      - id: check-mutations
        name: mutation tables (커밋에 든 변이 표의 원문이 코드에 정확히 한 번 있는지 — tools/mutate.py --check, 대기열 92)
        entry: uv run python tools/mutate.py --check
        language: system
        files: _mutations\.toml$
        require_serial: true
      - id: check-quotes
        name: quotes (바뀐 .md가 HEAD에 더한 줄에서 20자 이상 따옴표 인용을 저장소와 대조 — 경고만, 대기열 42)
        entry: uv run python tools/check_quotes.py
        language: system
        files: \.md$
        verbose: true
      - id: commit-msg
        name: commit message (conventional commits)
        entry: uv run python tools/check_commit_msg.py
        language: system
        stages: [commit-msg]
