# 로컬 자동 검사. 같은 검사를 CI(.github/workflows/ci.yml)가 최종 판정한다. 헌법 "가드레일" 절.
# 클론 뒤 한 번: uv run pre-commit install  (pre-commit과 commit-msg 두 훅이 함께 깔린다)
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: check-instructions
        name: instructions (rules paths와 그 glob, 훅 경로, CLAUDE.md 200줄, @ 임포트, 사본 센티널)
        entry: uv run python tools/check_instructions.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-type-escapes
        name: type escapes (Any, cast, 타입 억제 주석 — 원칙 III)
        entry: uv run python tools/check_type_escapes.py
        language: system
        pass_filenames: false
        always_run: true
      # stages 를 적은 것은 러너만이다. 나머지 always_run 훅은 commit-msg 단계에서 한 번 더 돈다(일지 2026-09-28-06 회고 2).
      - id: run-hooks
        name: hooks (tools/hook_payloads.toml 대로 발동·침묵 — 대기열 24)
        entry: uv run python tools/run_hooks.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: check-quotes
        name: quotes (스테이지된 .md의 더한 줄에서 20자 이상 따옴표 인용을 저장소와 대조 — 경고만, 대기열 42)
        entry: uv run python tools/check_quotes.py
        language: system
        files: \.md$
        verbose: true
      - id: commit-msg
        name: commit message (conventional commits)
        entry: uv run python tools/check_commit_msg.py
        language: system
        stages: [commit-msg]
