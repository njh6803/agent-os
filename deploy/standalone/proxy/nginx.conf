# 프록시의 주 설정. 공식 nginx 이미지의 기본 설정을 바꿔 끼운 것이다.
# 공식 이미지는 root 가 아닌 사용자(uid 101)로 돌 때 pid 파일과 임시 폴더를 쓸 수 없는 자리에 두므로
# 모두 /tmp(compose 가 tmpfs 로 준다) 아래로 옮겼다. 사이트 설정은 같은 폴더의 site.conf 다.
# 고친 뒤에는 `docker compose exec proxy nginx -c /etc/agent-os/proxy/nginx.conf -t` 로 먼저 보고
# 같은 명령의 `-t` 를 `-s reload` 로 바꿔 다시 읽힌다.

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/agent-os/proxy/site.conf;
}
