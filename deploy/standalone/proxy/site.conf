# 프록시의 사이트 설정. http 문맥에 실린다(nginx.conf 가 include 한다).
# 밖으로 내보내는 경로는 허용 목록뿐이고 나머지는 404 다. 이 파일의 포트(8443, 8080)는 바꾸지 않는다.
# compose 가 443 과 80 을 그 둘로 발행한다.

# 뒷단의 이름은 Docker 내장 DNS 에서 다시 푼다. 컨테이너를 다시 만들어 주소가 바뀌어도 프록시를 다시 시작하지
# 않아도 닿는다. 안쪽 네트워크는 IPv4 뿐이라 A 레코드만 묻는다.
# 프록시는 serve 보다 먼저 떠서 시작할 때 serve 이름이 `Server failure` 를 받을 수 있다. 그 뒤 기본 설정에서는 다시 풀기까지
# 30초 가까이 걸려(valid 가 있어도 그랬다) serve 가 건강해진 뒤에도 그동안 502 다. resolver_timeout 을 2초로 줄이자 곧 풀렸다.
# 두 번 손으로 돌려 본 결과이고 nginx 소스로 확인한 것은 아니다(티켓 e2e-standalone-proxy-serve-resolve).
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream up_serve {
    zone up_serve 64k;
    server serve:8000 resolve;
}
upstream up_widget {
    zone up_widget 64k;
    server widget:3000 resolve;
}
upstream up_portal {
    zone up_portal 64k;
    server portal:3000 resolve;
}

# 토큰 끝점이면 접속 주소, 아니면 빈 값이다. 빈 열쇠의 요청은 세지 않는다. $uri 는 nginx 가 정규화한 경로다.
map $uri $portal_token_key {
    "~^/portal/sites/[^/]+/token$" $binary_remote_addr;
    default "";
}
limit_req_zone $portal_token_key zone=portal_token:10m rate=30r/m;

server_tokens off;

# 80 은 443 으로 넘기기만 한다.
server {
    listen 8080;
    server_name _;
    access_log /dev/stdout;

    return 308 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;
    access_log /dev/stdout;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # add_header 는 location 에 하나라도 적으면 server 의 것이 물려지지 않는다. location 에는 적지 않는다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 받은 값에 덧붙이지 않고 덮어쓴다.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    limit_req_status 429;

    # 모든 proxy_pass 는 upstream 이름에 URI 를 붙인 꼴이라 nginx 가 정규화한 경로를 넘긴다.
    location /end-user/ {
        proxy_pass http://up_serve/end-user/;
    }

    location = /widget {
        proxy_pass http://up_widget/widget;
    }
    location /widget/ {
        proxy_pass http://up_widget/widget/;
    }

    location = / {
        proxy_pass http://up_portal/;
    }
    # 토큰 끝점도 이 location 이다. 열쇠가 빈 요청(토큰 끝점이 아닌 경로)은 세지 않는다.
    location /portal/ {
        limit_req zone=portal_token burst=10 nodelay;
        proxy_pass http://up_portal/portal/;
    }

    location = /end-user {
        return 404;
    }
    location = /portal {
        return 404;
    }

    location / {
        return 404;
    }
}
