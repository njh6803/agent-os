# 위젯 미리보기 페이지 설정 틀. 위젯 미리보기 페이지 컨테이너만 이 폴더를 읽는다.
# host 와 port 는 바꾸지 않는다. 컨테이너 안에서 0.0.0.0:3000 에 서야 프록시가 닿는다.
schema_version = "1"

[portal]
# 프록시의 443으로 닿는 공개 출처. 사이트 파일의 allowed_origins 에도 들어 있어야 한다.
public_origin = "https://agent.example.com"
# 이 설정 파일이 있는 폴더 기준의 개인 키 경로. 앱 사용자(uid·gid 10001)가 읽을 수 있어야 한다.
private_key = "keys/portal.pem"
kid = "portal-1"
host = "0.0.0.0"
port = 3000

[[sites]]
name = "main"
issuer = "https://www.example.com"
agent = "assistant"
heading = "질문하기"
theme = "jacho"
assurance = "anonymous"
