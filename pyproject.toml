[project]
name = "agent-os"
version = "0.1.0"
description = "플러그인 기반 에이전트 런타임. an agent OS"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.0",
    "pydantic>=2.9",
]

[project.scripts]
agent-os = "agent_os.main:main"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "import-linter",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_os"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "DTZ", "TD"]
# TD003(이슈 링크)은 로컬 트래커라 대신 TD002의 괄호에 티켓 경로를 쓴다: TODO(first-slice/03): ...
ignore = ["TD003"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: LLM을 실제로 호출한다. 기본 실행에서 제외. uv run pytest -m llm 으로 돌린다",
]
# importlib 모드: tests/ 하위 디렉터리에 같은 파일명이 있어도 모듈명 충돌이 없다(선행 저장소 AAPP-32·37 함정)
addopts = "-m \"not llm\" --import-mode=importlib"

[tool.importlinter]
root_packages = ["agent_os"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "main -> server -> {channel | admin | adapters} -> core -> sdk (principle IV)"
type = "layers"
layers = [
    "agent_os.main",
    "(agent_os.server)",
    "agent_os.channel | agent_os.admin | agent_os.adapters",
    "agent_os.core",
    "agent_os.sdk",
]

[[tool.importlinter.contracts]]
name = "core knows no provider (constitution: ports and adapters)"
type = "forbidden"
source_modules = ["agent_os.core"]
forbidden_modules = ["langchain_anthropic", "langchain_mcp_adapters"]

[[tool.importlinter.contracts]]
name = "sdk knows no engine (ADR 0001)"
type = "forbidden"
source_modules = ["agent_os.sdk"]
forbidden_modules = ["langgraph", "langchain_core", "langchain_anthropic", "langchain_mcp_adapters"]
