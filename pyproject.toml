[project]
name = "agent-os"
version = "0.1.0"
description = "플러그인 기반 에이전트 런타임. an agent OS"
readme = "README.md"
requires-python = "==3.12.*"
# 원천은 docs/constitution/tech.md 의 스택 표다. anthropic SDK와 mcp는 직접 의존이 아니라
# langchain-anthropic 과 langchain-mcp-adapters 뒤에서 온다(ADR 0001). langgraph 는
# pyright strict 마찰로 뺐다(ADR 0001 의 2026-09-21 이력).
dependencies = [
    "langchain-core>=0.3",
    "pydantic>=2.9",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.1",
]

[project.scripts]
agent-os = "agent_os.main:main"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "import-linter",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_os"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "DTZ", "TD"]
# TD003(이슈 링크)은 로컬 트래커라 대신 TD002의 괄호에 티켓 경로를 쓴다: TODO(first-slice/03): ...
ignore = ["TD003"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ 의 순수 함수를 tests/tools/ 에서 import 하기 위해 저장소 루트를 경로에 둔다
pythonpath = ["."]
markers = [
    "llm: LLM을 실제로 호출한다. 기본 실행에서 제외. uv run pytest -m llm 으로 돌린다",
]
# importlib 모드: tests/ 하위 디렉터리에 같은 파일명이 있어도 모듈명 충돌이 없다(선행 저장소 AAPP-32·37 함정)
addopts = "-m \"not llm\" --import-mode=importlib"
# ADR 0007: 비동기 테스트는 async def 하나로 쓴다. 데코레이터도 마커도 없다
asyncio_mode = "auto"
# await 를 빼먹은 코루틴이 경고만 내고 초록으로 지나가지 않게 한다. 경고 전부를 올리지는 않는다
filterwarnings = [
    "error::RuntimeWarning",
    # await 누락은 GC 시점에 터져서 pytest가 unraisable 로 감싼다. 그것도 올려야 실제로 빨개진다
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.importlinter]
root_packages = ["agent_os"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "main -> server -> {channel | admin | adapters} -> core -> sdk (principle IV)"
type = "layers"
layers = [
    "agent_os.main",
    "(agent_os.server)",
    "agent_os.channel | agent_os.admin | agent_os.adapters",
    "agent_os.core",
    "agent_os.sdk",
]

[[tool.importlinter.contracts]]
name = "core knows no provider (constitution: ports and adapters)"
type = "forbidden"
source_modules = ["agent_os.core"]
forbidden_modules = ["langchain_anthropic", "langchain_mcp_adapters"]

[[tool.importlinter.contracts]]
name = "sdk knows no engine (ADR 0001)"
type = "forbidden"
source_modules = ["agent_os.sdk"]
forbidden_modules = ["langgraph", "langchain_core", "langchain_anthropic", "langchain_mcp_adapters"]
