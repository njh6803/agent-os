# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다.
# LLM 호출 테스트(-m llm)는 돌리지 않는다. 비용과 키 때문이며 수동으로 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # [DEBUG-seg] 종료 코드 139 탐침. 병합 전에 되돌린다. 변형마다 새 체크아웃에서 첫 pytest 를 본다.
    strategy:
      fail-fast: false
      matrix:
        variant: [fh, clean, lintimports, pyright, ruff]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: |
          set +e
          v="${{ matrix.variant }}"
          if [ "$v" = fh ] || [ "$v" = clean ] || [ "$v" = ruff ]; then
            uv run ruff check . >/dev/null; uv run ruff format --check . >/dev/null
          fi
          if [ "$v" = fh ] || [ "$v" = clean ] || [ "$v" = pyright ]; then
            uv run pyright >/dev/null
          fi
          if [ "$v" = fh ] || [ "$v" = clean ] || [ "$v" = lintimports ]; then
            uv run lint-imports >/dev/null
          fi
          if [ "$v" = fh ]; then
            PYTHONFAULTHANDLER=1 uv run pytest -q
            echo "[DEBUG-seg] $v first exit=$?"
          else
            uv run pytest -q
            echo "[DEBUG-seg] $v first exit=$?"
          fi
          if [ "$v" = clean ]; then
            find . -path ./.venv -prune -o -name __pycache__ -type d -prune -exec rm -rf {} +
            rm -rf .pytest_cache
            uv run pytest -q
            echo "[DEBUG-seg] $v after clean exit=$?"
          fi
          exit 1
