# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다.
# LLM 호출 테스트(-m llm)는 돌리지 않는다. 비용과 키 때문이며 수동으로 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      # [DEBUG-seg] 종료 코드 139 탐침. 병합 전에 되돌린다.
      # 원래 잡의 순서를 되살려 재현을 먼저 보고, 그 뒤 앞 단계가 남긴 것을 하나씩 지운다.
      - run: |
          set +e
          uv run pytest -q
          echo "[DEBUG-seg] A as-is exit=$?"
          PYTHONFAULTHANDLER=1 uv run pytest -q
          echo "[DEBUG-seg] B PYTHONFAULTHANDLER exit=$?"
          ls -a
          rm -rf .import_linter_cache
          uv run pytest -q
          echo "[DEBUG-seg] C without import_linter_cache exit=$?"
          rm -rf .ruff_cache
          uv run pytest -q
          echo "[DEBUG-seg] D without ruff_cache too exit=$?"
          exit 1
