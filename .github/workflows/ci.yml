# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다. 파이썬, web, 관리 화면 e2e(e2e), 위젯
# e2e(e2e-widget), 위젯 미리보기 페이지 e2e(e2e-portal), 단독 배포 e2e(e2e-standalone), 사진 비교(visual), 커밋·노트
# 검사(ticket)가 잡 여덟으로 함께 돌고, 필수 검사는 그 결과를 모으는 verify 하나다(ADR 0005, ADR 0021의 2026-10-01 이력 둘,
# ADR 0037, ADR 0024의 2026-10-24 이력, ADR 0050). 잡을 더하면 verify 의 needs 에 넣는다. 빠뜨리면 verify 가 빨갛다
# (참고 모드인 llm 잡만 예외다). 네 e2e 와 사진 비교는 pre-commit 에 없고 CI 에만 있다(ADR 0026).
# LLM 호출 테스트는 base 가 main 인 PR 과 main 푸시의 llm 잡만 돌린다(-m llm, -m llm_widget. ADR 0043). dev 로 가는 티켓 PR
# 에서는 비용과 키 때문에 돌리지 않고 손으로 돌린다. -m llm_portal 은 ADR 0043 이 꼽지 않아 이 잡에 싣지 않는다. -m llm_local 도
# 싣지 않는다. 모델 서버를 Runpod 에서 빌려야 해서 병합 전에 세션이 tools/llm_local.py 로 돌린다(ADR 0058). 그 잡은 참고
# 모드라 verify 의 needs 에 없고, 결과가 빨갛다고 병합을 막지 않는다(llm 잡 위의 주석). e2e-widget 은 AGENT_OS_WIDGET_LLM 을,
# e2e-portal 은 AGENT_OS_PORTAL_LLM 을 두지 않아 실제 모델을 부르는 Playwright 프로젝트 llm 이 서지 않는다.
# 체크아웃하는 잡은 모두 persist-credentials: false 다. 모두 PR 의 코드를 짓고 돌리는데 체크아웃 뒤에 github.com 을 상대로
# 한 git 명령(push, 인증된 fetch)이 없어서, 체크아웃 토큰을 .git/config 에 남기지 않는다(PR #158 의 CodeRabbit, CWE-522).
# 워크플로 하드닝은 zizmor 가 판정한다(ADR 0027, 설정은 .github/zizmor.yml). 빠뜨리면 artipacked 가, 서드파티 액션을 해시
# 대신 태그로 가져오면 unpinned-uses 가 python 잡을 빨갛게 한다. 자격 증명이 필요한 잡이 생기면 그 체크아웃 줄에
# `# zizmor: ignore[artipacked]` 와 까닭을 함께 둔다.
# 잡마다 timeout-minutes 를 둔다. 없으면 기본값 360분까지 매달린다. PR #195 의 visual 잡이 컨테이너 초기화에서 18분
# 넘게 멈췄다(대기열 204). 컨테이너 초기화도 잡의 스텝이라 잡의 제한에 든다고 본다(어림). 값은 최근 성공 실행의 잡별
# 최대의 네 배 이상으로 정했다. 잡이 자라 2026-11-24 에는 잰 잡 가운데 ticket·verify 를 뺀 다섯(python, web, e2e,
# visual, e2e-standalone)이 네 배에 못 미치고, python 의 값은 그 잡의 주석이 까닭을 적는다. 그 수치는
# .scratch/harness/probes/ci_job_durations.py 가 내고, 잰 결과는 같은 폴더 README 의 그 프로브 행에 둔다. 캐시를 놓친
# 설치가 얼마나 더 걸리는지는 재지 않은 어림의 여유다. 잡이 자라 제한에 닿으면 그 프로브를 다시 돌려 값을 고친다. 지난
# 실행이 없는 새 잡의 첫 값은 어림이고, 그 잡이 든 실행으로 프로브를 다시 돌려 고친다.
name: ci

# 개발 브랜치 dev 가 서면(ADR 0043) 티켓 PR 은 dev 로, 출시 PR(dev→main)과 핫픽스는 main 으로 간다. PR 은 base 를
# 가리지 않고 같은 검사 잡 여덟과 그 결과를 모으는 verify 가 돈다. 푸시는 main 과 dev 둘이다. base 가 main 인 PR 과 main
# 푸시에서만 실제로 더 도는 검사는 둘이다. LLM 호출 테스트의 llm 잡(ci-llm-job 티켓)과, 실제 이미지로 띄우는 compose e2e 인
# e2e-standalone 잡의 시험(release-image 티켓 09, ADR 0043 CI 분담)이다. e2e-standalone 은 그 밖의 PR 과 푸시에서도 잡 안에서
# 곧바로 성공으로 끝난다.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 인터프리터가 충돌해도 단서를 남긴다(대기열 36). PR #78 의 첫 실패 로그는 "545 passed" 뒤 종료 코드 139 뿐이었다.
  # pytest 의 faulthandler 는 세션이 끝나며 꺼지므로 PYTHONFAULTHANDLER 로 종료 중 충돌의 파이썬 쪽 스택을 찍고, 코어를
  # 남겨 실패하면 gdb 로 C 스택을 찍는다. core_pattern 은 시스템 전역이라 앞 스텝에서 바꾸고, ulimit -c 는 셸마다라
  # pytest 를 돌리는 그 스텝 안에서 건다. 일부러 충돌시켜 손으로 봤다(일지 2026-10-16-14). 종료 중 충돌은 파이썬 스택과 C
  # 스택이 둘 다 남았고, 테스트 도중의 충돌은 C 스택만 남았다(파이썬 스택은 pytest 가 붙잡은 stderr 에 갇힌 것으로
  # 본다. 어림). 코어 이름은 core.pytest.<pid> 였다. %e 가 스크립트 이름이 되므로 코어를 이름으로 거르지 않는다.
  python:
    # ubuntu-latest 가 2026-11-06 에 24.04(ripgrep 14.1.0)에서 26.04(15.1.0)로 넘어가 rg 14 의 동작을 가정한
    # tests/tools/test_hook_env_read_rg.py 가 깨졌다(.scratch/harness/issues/045-ci-python-runner-pin.md).
    runs-on: ubuntu-24.04
    # 15분이던 제한에 잡이 닿아 2026-11-24 에 dev 푸시와 PR 의 실행이 잇달아 취소됐다(대기열 ci-python-job-timeout-margin).
    # 성공한 실행 40개의 최대가 15.0분이라(.scratch/harness/probes/ci_job_durations.py) 머리 주석의 네 배면 60분이다.
    # 선택 화면에 올린 값은 25분이었고, 사용자가 멈춘 잡을 10분 늦게 끊는 대가를 보고 그 값을 골랐다
    # (.scratch/harness/issues/ci-python-job-timeout-25.md). 그 프로브는 성공한 실행만 세므로 15분을 넘겨 취소된 실행의
    # 실제 시간은 그 최대에 들지 않는다.
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
      # 데이터베이스 시험이 붙는 주소(tests/database.py). 개발 PC 의 테스트 컨테이너(compose.test.yaml)를 대신하는
      # 아래 service container 를 가리킨다. 값은 시험용이고 비밀이 아니다.
      AGENT_OS_TEST_DATABASE_URL: postgresql://agent_os:agent_os@127.0.0.1:5432/agent_os
    # 개발 PC 의 compose.test.yaml 과 같은 이미지(digest 가 같은지는 tests/test_postgres_image_pin.py 가 판정한다)와
    # 같은 상태 확인이다. 데이터 폴더는 메모리(tmpfs)에 둔다. 잡은 상태 확인이 정상이 된 뒤에 단계를 시작한다.
    services:
      postgres:
        # postgres:18 (Debian trixie)
        image: postgres@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
        env:
          POSTGRES_USER: agent_os
          POSTGRES_PASSWORD: agent_os
          POSTGRES_DB: agent_os
        ports:
          - 5432:5432
        options: >-
          --init
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -h 127.0.0.1 -U agent_os -d agent_os"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
          --health-start-period 30s
          --health-start-interval 2s
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      # tests/tools/test_hook_env_read_rg.py 가 실제 rg 를 띄운다. 러너 이미지에 없어 깐다(ADR 0038).
      - run: command -v rg > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ripgrep; }
      - run: sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - run: |
          ulimit -c unlimited || echo "::warning::ulimit -c 를 올리지 못해 코어가 남지 않는다."
          uv run pytest -q
      - run: uv run python tools/check_instructions.py
      - run: uv run python tools/check_type_escapes.py
      - run: uv run python tools/run_hooks.py
      - run: uv run zizmor --offline --strict-collection --config .github/zizmor.yml .
      - if: failure()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "코어 덤프가 없다."
            exit 0
          fi
          command -v gdb > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q gdb; }
          python=$(readlink -f .venv/bin/python)
          for core in "${cores[@]}"; do
            echo "::group::$core"
            gdb -batch -ex bt -ex "info sharedlibrary" "$python" "$core"
            echo "::endgroup::"
          done

  # web 워크스페이스. pnpm 판은 web/package.json 의 packageManager 가 정하고, 스토어를 락파일로 캐시한다.
  # verify 의 test 단계가 디자인 시스템의 스토리 테스트를 실제 chromium 에서 돌아(ADR 0026) 그 전에 브라우저를 깐다.
  # 모양은 e2e 잡과 같다. 헤드리스 셸 하나이고, Playwright 판이 같으면 캐시에서 되살리며, 시스템 의존성은 매번 깐다.
  # 브라우저가 없으면 스토리 테스트는 건너뛰지 않고 실패한다.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm -C web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web exec playwright install-deps chromium
      - run: pnpm -C web verify

  # e2e. 실제 serve 와 시작 래퍼로 띄운 관리 화면을 지난다. 준비(e2e/stack.ts)가 serve 를 uv 의 가상 환경으로 띄우므로
  # 파이썬과 web 을 둘 다 준비한다. 브라우저는 헤드리스 셸 하나이고, Playwright 판이 같으면 캐시에서 되살린다.
  # 시스템 의존성은 캐시에 들지 않아 매번 깐다. 브라우저가 없으면 e2e 는 건너뛰지 않고 실패한다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      # serve 는 표의 판이 맞는 데이터베이스가 있어야 뜬다. 준비(e2e/stack.ts)가 아래 service container 에 자기 데이터베이스를
      # 만든다. python 잡과 같은 이미지와 상태 확인이다(digest 는 tests/test_postgres_image_pin.py 가 판정한다).
      AGENT_OS_TEST_DATABASE_URL: postgresql://agent_os:agent_os@127.0.0.1:5432/agent_os
    services:
      postgres:
        # postgres:18 (Debian trixie)
        image: postgres@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
        env:
          POSTGRES_USER: agent_os
          POSTGRES_PASSWORD: agent_os
          POSTGRES_DB: agent_os
        ports:
          - 5432:5432
        options: >-
          --init
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -h 127.0.0.1 -U agent_os -d agent_os"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
          --health-start-period 30s
          --health-start-interval 2s
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm -C web/apps/admin exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web/apps/admin exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web/apps/admin exec playwright install-deps chromium
      - run: pnpm -C web/apps/admin exec playwright test

  # 위젯 e2e(web-widget 티켓 06). 실제 serve, 미끼 사이트 파일로 빌드하고 진짜 파일로 띄운 실제 위젯 Next, 둘을 한 출처 아래에 모으는 시험
  # 안의 중계를 지난다(준비는 web/apps/widget/e2e/stack.ts). 모양은 e2e 잡과 같다. 실제 nginx 는 쓰지 않는다. 그 설정은
  # web-widget 의 범위 밖이다(ADR 0024 의 2026-10-24 이력). timeout-minutes 는 지난 실행이 없는 첫 값이라 e2e 잡의 값을
  # 그대로 둔 어림이고, 이 잡이 든 실행으로 프로브를 다시 돌려 고친다(머리 주석).
  e2e-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      # e2e 잡과 같다. serve 가 붙을 데이터베이스를 준비(e2e/stack.ts)가 아래 service container 에 만든다.
      AGENT_OS_TEST_DATABASE_URL: postgresql://agent_os:agent_os@127.0.0.1:5432/agent_os
    services:
      postgres:
        # postgres:18 (Debian trixie)
        image: postgres@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
        env:
          POSTGRES_USER: agent_os
          POSTGRES_PASSWORD: agent_os
          POSTGRES_DB: agent_os
        ports:
          - 5432:5432
        options: >-
          --init
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -h 127.0.0.1 -U agent_os -d agent_os"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
          --health-start-period 30s
          --health-start-interval 2s
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm -C web/apps/widget exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web/apps/widget exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web/apps/widget exec playwright install-deps chromium
      - run: pnpm -C web/apps/widget exec playwright test

  # 위젯 미리보기 페이지 e2e(pilot-portal 티켓 06). 실제 serve, 미끼 사이트 파일로 빌드하고 진짜 파일로 띄운 실제 위젯 Next, 실제 위젯 미리보기 페이지, 셋을 한
  # 출처 아래에 모으는 시험 안의 중계를 지난다(준비는 web/apps/portal/e2e/stack.ts). 모양은 e2e-widget 과 같다. 이 잡이
  # ubuntu 에서 실제 위젯 미리보기 페이지를 띄우는 것이 Linux 확인이다(`stripTypeScriptTypes` 와 Tailwind CLI 자식 프로세스). timeout-
  # minutes 는 지난 실행이 없는 첫 값이라 e2e-widget 의 값을 그대로 둔 어림이다. 프로브의 `JOBS` 에는 아직 이 잡이 없다
  # (e2e-widget 도 없다). 이 잡이 든 실행이 생기면 `JOBS` 에 이 잡을 더하고 그 실행의 브랜치를 주어 프로브를 돌려 고친다
  # (머리 주석).
  e2e-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      # e2e 잡과 같다. serve 가 붙을 데이터베이스를 준비(e2e/stack.ts)가 아래 service container 에 만든다.
      AGENT_OS_TEST_DATABASE_URL: postgresql://agent_os:agent_os@127.0.0.1:5432/agent_os
    services:
      postgres:
        # postgres:18 (Debian trixie)
        image: postgres@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
        env:
          POSTGRES_USER: agent_os
          POSTGRES_PASSWORD: agent_os
          POSTGRES_DB: agent_os
        ports:
          - 5432:5432
        options: >-
          --init
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -h 127.0.0.1 -U agent_os -d agent_os"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
          --health-start-period 30s
          --health-start-interval 2s
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm -C web/apps/portal exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web/apps/portal exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web/apps/portal exec playwright install-deps chromium
      - run: pnpm -C web/apps/portal exec playwright test

  # 단독 배포 e2e(release-image 티켓 09). 저장소에서 이미지 다섯(serve, admin, widget, portal, widget-admin)을 짓고, 배포 파일 묶음
  # (tools/release.py bundle)을 풀어 compose 로 프록시와 함께 띄운 배치를 실제 브라우저로 지난다(준비는
  # web/packages/e2e-standalone/e2e/stack.ts). 이 잡이 ubuntu 에서 443, 80 에 발행하는 것이 실제 배치 확인이다.
  # ADR 0043 CI 분담에 따라 base 가 main 인 PR 과 main 푸시에서만 시험하고(dev 로 가는 티켓 PR 과 dev 푸시에서는 이미지
  # 다섯을 짓는 시간을 쓰지 않는다), 그 밖에서는 첫 스텝(gate)이 판정하고 나머지 스텝을 건너뛰어 잡은 안에서 곧바로 성공으로
  # 끝난다. 잡 자체를 if: 로 건너뛰지 않는 것은 건너뛴 잡을 verify 가 빨강으로 읽기 때문이다. 판정에 쓰는 값은 env 로 넘겨
  # run 에 식으로 펼치지 않는다(zizmor 의 템플릿 주입 판정, ADR 0027). 실제 모델 프로젝트 llm 은 AGENT_OS_STANDALONE_LLM 을
  # 두지 않아 서지 않는다(실제 모델 시험은 손으로 돌린다. docs/constitution/operations.md LLM 테스트). timeout-minutes 는
  # 시험까지 돈 실행 넷(44012310193, 44010835544, 43997051389, 43994723170)의 2.5~3.0분으로 정했다. 프로브의 `GATED` 가
  # 시험 스텝이 성공한 실행만 이 잡의 측정으로 센다(2026-11-17). 20분은 그 최대의 6배 남짓이고, 판 내기 첫 실행에서 캐시가
  # 빈 이미지 짓기 몫(release 의 build 8.3분에서 점검·올리기를 뺀 어림 5분 안팎)에 시험 3분을 더한 8분 안팎이 이 잡에 다시
  # 와도 넘지 않는다(어림. 이 잡의 캐시가 빈 실행은 재지 못했다. 8분 대비 여유가 2.5배다). 시험 실행이 더 쌓이면 프로브를
  # 다시 돌려 고친다(머리 주석). 이 측정은 이미지가 넷일 때의 것이다. 다섯째 이미지(widget-admin)는 이 PC에서 캐시 없이
  # 26초에 지어졌고(2026-11-26, 관리 화면 이미지는 163초) 이 PC의 시험 한 바퀴는 4.0분이었다. 그래서 20분의 여유는 5배
  # 남짓으로 줄었다고 어림하지만, CI 에서 다섯째 이미지를 더하고 시험까지 돈 실행은 아직 없으니 그 실행이 쌓이면 다시 잰다.
  e2e-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if { [ "$EVENT_NAME" = push ] && [ "$REF" = refs/heads/main ]; } || { [ "$EVENT_NAME" = pull_request ] && [ "$BASE_REF" = main ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main 으로 가는 PR 과 main 푸시가 아니라 시험하지 않는다."
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - if: steps.gate.outputs.run == 'true'
        run: uv python install 3.12
      - if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - if: steps.gate.outputs.run == 'true'
        run: pnpm -C web install --frozen-lockfile
      - id: playwright
        if: steps.gate.outputs.run == 'true'
        run: echo "version=$(pnpm -C web/packages/e2e-standalone exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.gate.outputs.run == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web/packages/e2e-standalone exec playwright install --with-deps --only-shell chromium
      - if: steps.gate.outputs.run == 'true' && steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web/packages/e2e-standalone exec playwright install-deps chromium
      - if: steps.gate.outputs.run == 'true'
        run: pnpm -C web/packages/e2e-standalone exec playwright test
      # 시험이 실패하면 test-results 를 남긴다. 시험 틀이 끝날 때(teardown)와 준비가 실패했을 때 compose.log(serve,
      # 프록시, 데이터베이스 컨테이너의 로그)를 거기에 쓴다. 실행기는 잡이 끝나면 사라지므로 올리지 않으면 실패 원인을
      # 볼 수 없다.
      - if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-standalone-test-results
          path: web/packages/e2e-standalone/test-results/
          retention-days: 14

  # 사진 비교(ADR 0026). 판을 고정한 Playwright 이미지를 잡의 컨테이너로 쓰고, 그 안에서 설치하고 Storybook 정적 빌드를
  # 지은 뒤 커밋한 정답 사진(web/packages/ui/visual/snapshots/)과 비교한다. 위젯과 관리 화면도 같은 컨테이너에서 자기 정적
  # 빌드를 짓고 자기 정답 사진(web/apps/widget/visual/snapshots/, web/apps/admin/visual/snapshots/)과 비교한다(web-widget
  # 티켓 03, admin-style 티켓 03). 이미지는 로컬 명령의 것과 같다(web/tools/visual.ts 의 IMAGE, visual.test.ts 가 본다).
  # --ipc=host 는 정답을 만든 로컬 컨테이너와 같은 조건이다. 네트워크는 설치에만 쓰고, 테스트는 정적 빌드 밖으로 나간
  # 요청이 하나라도 있으면 실패한다. 실패하면 실제 사진·정답·차이 그림을 패키지와 앱마다 아티팩트로 남긴다.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - id: install
        run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web/packages/ui run build-storybook
      - run: pnpm -C web/packages/ui exec playwright test -c visual/playwright.config.ts
      # 위젯과 관리 화면은 설치가 됐으면 앞의 비교가 실패해도 돈다. 패키지를 바꿔 앱의 사진도 바뀐 것을 한 번에 본다.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -C web/apps/widget run build-storybook
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -C web/apps/widget exec playwright test -c visual/playwright.config.ts
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -C web/apps/admin run build-storybook
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -C web/apps/admin exec playwright test -c visual/playwright.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: web/packages/ui/visual/test-results/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-widget-test-results
          path: web/apps/widget/visual/test-results/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-admin-test-results
          path: web/apps/admin/visual/test-results/
          retention-days: 14

  # 커밋 검사(tools/check_ticket.py, ADR 0037)를 PR 마다 한다. 훅을 깔지 않은 클론이나 훅을 건너뛴 커밋도 여기서
  # 잡히고, 가리키는 티켓의 Status: 가 done 인지도 본다. 판정과 입력은 그 도구의 독스트링 "CI" 가 원천이다. 체크아웃은
  # 기본(PR 의 병합 커밋)을 전체 이력으로 받는다. 머리 커밋을 체크아웃하지 않는 것은 규약 전에 딴 PR 의 머리에는 검사
  # 도구가 없어서다. 그래서 도구도 그 병합 커밋의 것이 돈다. 이 잡이 막는 것은 세션이 티켓을 빠뜨리거나 done 으로
  # 바꾸지 않은 실수이고, PR 이 이 도구나 이 워크플로를 고쳐 일부러 지나가는 길은 막지 않는다. python 잡이 PR 의 시험을
  # 돌리는 것과 같고, 그 변경은 PR 리뷰가 본다. base 쪽 도구를 돌리면 이 도구를 고친 PR 이 옛 판으로 판정받는다.
  # PR 의 값은 식으로 run 에 펼치지 않고 env 로 넘긴다(zizmor 의 템플릿 주입 판정, ADR 0027).
  # push 실행에서는 머리 브랜치가 비어 한 줄을 찍고 지나므로, verify 가 건너뛴 잡을 빨강으로 보는 것에 걸리지 않는다.
  # 도구는 표준 라이브러리만 써서 uv 없이 러너의 python3 으로 돈다. 출력에 PR 이 고른 브랜치·파일 이름이 실리므로
  # 도구를 부르기 전에 워크플로 명령을 멈추고 이 스텝 끝까지 다시 켜지 않는다. 토큰을 대입으로 받는 것은 uuidgen 이
  # 없을 때 빈 토큰으로 지나지 않고 그 자리에서 실패하게 하려는 것이다(bash -e 에서 echo 의 인자 안의 명령 치환은
  # 실패해도 이어진다). 근거는 GitHub 문서 "Stopping and starting workflow commands"
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands)이고, 2026-10-22 에 그 본문을
  # 내려받아 대 봤다. 토큰은 실행마다 무작위로 고유해야 하고, 문서의 ubuntu-latest 예시가 토큰을 uuidgen 으로 짓는다.
  # timeout-minutes 는 verify 와 같은 5 다. 처음의 어림 10 을, 이 잡이 든 첫 성공 실행(PR #355)을 잰 0.1분으로
  # 고쳤다(머리 주석의 프로브).
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          marker=$(uuidgen)
          echo "::stop-commands::$marker"
          python3 tools/check_ticket.py --ci
      # 노트 검사(tools/check_notes.py)가 PR 전체의 변경을 본다. PR 제목의 꼴, 느낌표와 upgrade/ 원고의 짝(제품
      # 마이그레이션 파일을 새로 더한 PR의 느낌표 포함), 기능 단락의 빠뜨림과 모양이다. 판정과 입력은 그 도구의 독스트링이 원천이다. 앞 스텝이 빨강이어도 돌아 두 결과를 함께 보인다.
      # PR 제목은 사람이 고치는 값이라 식으로 run 에 펼치지 않고 env 로만 넘긴다(zizmor 의 템플릿 주입 판정, ADR 0027).
      # 제목만 고친 실행은 pr-title.yml 이 맡는다(이 워크플로는 edited 에 돌지 않는다).
      - if: ${{ !cancelled() }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          marker=$(uuidgen)
          echo "::stop-commands::$marker"
          python3 tools/check_notes.py --ci

  # LLM 호출 테스트(-m llm, -m llm_widget). base 가 main 인 PR(dev→main, hotfix→main)과 main 푸시에서만 돌고, dev 로 가는
  # 티켓 PR 과 dev 푸시에서는 잡 수준 if 로 건너뛴다(ADR 0043 의 "CI 분담").
  # 참고 모드다. 이 잡은 verify 의 needs 에 없고 verify 의 차집합 예외에만 든다. 실제 모델의 답이 얼마나 흔들리는지 재기
  # 전에는 병합을 막지 않는다. needs 에 이으면 dev 로 가는 PR 에서 건너뛴 이 잡을 verify 가 빨강으로 본다. 막는 게이트로
  # 바꾸는 조건은 .scratch/harness/issues/ci-llm-job.md 끝에 적었다.
  # 키는 시크릿 ANTHROPIC_API_KEY 하나이고 두 pytest 스텝에만 env 로 준다. 설치와 체크아웃 스텝에는 주지 않으며 워크플로
  # 수준에도 두지 않는다. 포크 PR 에는 GitHub 이 시크릿을 보내지 않아 키 없이 돌면 시험이 실패하므로, 머리 저장소가 이
  # 저장소인 PR 만 돈다. 포크 PR 은 이 잡을 건너뛴다.
  # 모양은 e2e-widget 과 같다(위젯 시험이 pnpm 과 chromium 을 쓴다). 둘째 스텝은 첫째가 실패해도 돈다. 둘의 흔들림을
  # 따로 보기 위해서다. timeout-minutes 는 지난 실행이 없는 첫 값이다. 위젯 시험 하나의 제한이 10분(tests/test_widget_llm.py
  # 의 TIMEOUT)이고 설치가 3분쯤 드는 것으로 본 어림이다(재지 않았다). tests/test_assistant_llm.py 가 들어온 뒤로 이 PC 에서
  # -m llm 전체가 14분 46초였으므로(손으로 봤다, 일지 2026-11-12-2346) 그 시간에 위젯과 설치를 더해 25분에서 40분으로
  # 올렸다(이것도 어림이다. CI 의 러너로는 재지 않았다). 이 잡이 든 첫 실행으로 프로브를 다시 돌려 고친다(머리 주석).
  # 프로브의 JOBS 에는 아직 이 잡이 없다.
  llm:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      # 실제 serve 를 띄우는 시험(-m llm 의 test_main.py·test_assistant_llm.py 와 위젯 e2e 의 준비)이 붙는 데이터베이스다.
      # python 잡과 같은 이미지와 상태 확인이다.
      AGENT_OS_TEST_DATABASE_URL: postgresql://agent_os:agent_os@127.0.0.1:5432/agent_os
    services:
      postgres:
        # postgres:18 (Debian trixie)
        image: postgres@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
        env:
          POSTGRES_USER: agent_os
          POSTGRES_PASSWORD: agent_os
          POSTGRES_DB: agent_os
        ports:
          - 5432:5432
        options: >-
          --init
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -h 127.0.0.1 -U agent_os -d agent_os"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
          --health-start-period 30s
          --health-start-interval 2s
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 예시 MCP 서버(plugins/mcp/everything)가 실행 파일 이름으로 뜨므로 calc 예시를 실제 모델로 도는 두 스텝 앞에 전역으로 깐다.
      # 판은 서버 이미지에 깔 판과 같은 2.3.0이다(.scratch/release-image/spec.md 이미지의 구성).
      # zizmor 의 adhoc-packages 는 잠금 파일 밖의 설치를 가리킨다. 판을 정확히 고정했고, 이 저장소에는 이 패키지를 둘 잠금 파일이 없어 그 줄에서 무시한다.
      - run: npm install --global @modelcontextprotocol/server-everything@2.3.0  # zizmor: ignore[adhoc-packages] 판을 고정했고 잠금 파일이 없다
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm -C web/apps/widget exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web/apps/widget exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web/apps/widget exec playwright install-deps chromium
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest -m llm -q
      - if: ${{ !cancelled() }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest -m llm_widget -q

  # 필수 검사. 건너뛴 잡은 필수 검사여도 성공으로 보고되고(GitHub 문서), 앞 잡이 실패하면 needs 로 이은 잡은
  # 기본적으로 건너뛴다. 그래서 always() 로 언제나 돌고, needs 의 결과가 모두 success 일 때만 초록이다.
  # failure 뿐 아니라 cancelled 와 skipped 도 빨강이다.
  # needs 에 없는 잡은 필수 검사 밖에서 돈다. 그래서 같은 실행의 모든 시도(filter=all)의 잡 이름을 API 로 읽어, 자기
  # 밖의 잡이 needs 에 없으면 빨강이다. 지금 시도만 읽지 않는 것은, 실패한 잡만 다시 돌린 시도에서는 앞 시도의 잡이
  # 새 시도로 옮겨지는 중이라 목록에서 빠질 수 있기 때문이다. 잡에 name: 을 두지 않으므로 API 의 잡 이름이 잡 id 와
  # 같다. 읽은 목록에 verify 자신이 없으면(빈 목록이면) 비교할 것이 없어 조용히 초록이 되므로 그것도 빨강이다.
  # 일부러 필수 검사 밖에 둘 잡이 생기면 아래 차집합에 그 이름을 예외로 더한다. 지금 예외는 llm 하나다(참고 모드. 그 잡
  # 위의 주석). verify 뒤에 도는 잡(needs: [verify])은 첫 시도에서는 verify 가 도는 동안 목록에 없어 이 검사가 보지
  # 못하고, 순환이라 needs 에 넣을 수도 없다. 그런 잡은 필수 검사 밖이다(ADR 0021의 둘째 2026-10-01 이력, PR #119 실험).
  verify:
    if: always()
    needs: [python, web, e2e, e2e-widget, e2e-portal, e2e-standalone, visual, ticket]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          pages=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100")
          names=$(jq -c '[.[].jobs[].name] | unique' <<< "$pages")
          echo "이 실행의 잡: $names"
          if ! jq -e 'index("verify") != null' <<< "$names" > /dev/null; then
            echo "::error::잡 목록에 verify 가 없다. 목록을 읽지 못한 것이다."
            exit 1
          fi
          outside=$(jq -c --argjson needs "$NEEDS" '. - ["verify", "llm"] - ($needs | keys)' <<< "$names")
          if [ "$outside" != "[]" ]; then
            echo "::error::verify 의 needs 에 없는 잡: $outside. 필수 검사 밖에서 돈다."
            exit 1
          fi
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
