# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다.
# LLM 호출 테스트(-m llm)는 돌리지 않는다. 비용과 키 때문이며 수동으로 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # [DEBUG-seg] 종료 코드 139 탐침. 병합 전에 되돌린다. 변형마다 새 체크아웃에서 첫 pytest 를 본다.
    strategy:
      fail-fast: false
      matrix:
        variant: [control, direct, gdb, nocore, noadmin]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      # 방아쇠는 lint-imports 뒤의 첫 pytest 다(넷째 탐침). 변형마다 그 조건을 새로 세운다.
      - run: |
          set +e
          v="${{ matrix.variant }}"
          uv run lint-imports >/dev/null
          export PYTHONFAULTHANDLER=1
          case "$v" in
            control) uv run pytest -q; code=$? ;;
            direct) .venv/bin/python -m pytest -q; code=$? ;;
            gdb)
              sudo apt-get install -y -qq gdb >/dev/null 2>&1
              gdb -q -batch -ex "set pagination off" -ex run -ex "bt 60" -ex "info sharedlibrary" --args .venv/bin/python -m pytest -q > /tmp/gdb.log 2>&1
              code=$?
              grep -vE "^\.+ *\[|New Thread|Thread 0x.* exited|^\[Inferior" /tmp/gdb.log | tail -150 ;;
            nocore) uv run pytest -q --ignore=tests/core; code=$? ;;
            noadmin) uv run pytest -q --ignore=tests/test_server.py; code=$? ;;
          esac
          echo "[DEBUG-seg] $v exit=$code"
          exit 1
