# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다.
# LLM 호출 테스트(-m llm)는 돌리지 않는다. 비용과 키 때문이며 수동으로 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      # [DEBUG-seg] 종료 코드 139 탐침. 병합 전에 되돌린다.
      - run: |
          set +e
          PYTHONFAULTHANDLER=1 uv run pytest -q -p no:faulthandler 2>&1 | tail -120
          echo "[DEBUG-seg] 1 full with faulthandler exit=${PIPESTATUS[0]}"
          uv run pytest -q tests/channel/http/test_router.py 2>&1 | tail -3
          echo "[DEBUG-seg] 2 router only exit=${PIPESTATUS[0]}"
          uv run pytest -q --ignore=tests/channel/http/test_router.py 2>&1 | tail -3
          echo "[DEBUG-seg] 3 without router exit=${PIPESTATUS[0]}"
          git show 01b89fa:tests/channel/http/test_router.py > tests/channel/http/test_router_main.py
          uv run pytest -q tests/channel/http/test_router_main.py 2>&1 | tail -3
          echo "[DEBUG-seg] 4 main router tests on new code exit=${PIPESTATUS[0]}"
          rm tests/channel/http/test_router_main.py
          exit 1
