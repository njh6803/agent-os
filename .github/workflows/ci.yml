# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다.
# LLM 호출 테스트(-m llm)는 돌리지 않는다. 비용과 키 때문이며 수동으로 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # [DEBUG-seg] 종료 코드 139 탐침. 병합 전에 되돌린다. 변형마다 새 체크아웃에서 첫 pytest 를 본다.
    strategy:
      fail-fast: false
      matrix:
        variant: [full, dev, gceach, router, norouter, oldrouter]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      # 방아쇠는 lint-imports 뒤의 첫 pytest 다(넷째 탐침). 변형마다 그 조건을 새로 세운다.
      - run: |
          set +e
          v="${{ matrix.variant }}"
          uv run lint-imports >/dev/null
          export PYTHONFAULTHANDLER=1
          case "$v" in
            full) uv run pytest -q; code=$? ;;
            dev) PYTHONDEVMODE=1 uv run pytest -q; code=$? ;;
            gceach)
              mkdir -p /tmp/gcplug
              printf 'import gc\nimport pytest\n\n\n@pytest.fixture(autouse=True)\ndef _gc_each():\n    yield\n    gc.collect()\n' > /tmp/gcplug/gcplug.py
              PYTHONPATH=/tmp/gcplug uv run pytest -q -v -p gcplug > /tmp/gceach.log 2>&1; code=$?
              tail -40 /tmp/gceach.log ;;
            router) uv run pytest -q tests/channel/http/test_router.py; code=$? ;;
            norouter) uv run pytest -q --ignore=tests/channel/http/test_router.py; code=$? ;;
            oldrouter)
              git show 01b89fa:tests/channel/http/test_router.py > tests/channel/http/test_router.py
              uv run pytest -q; code=$? ;;
          esac
          echo "[DEBUG-seg] $v exit=$code"
          exit 1
