# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다.
# LLM 호출 테스트(-m llm)는 돌리지 않는다. 비용과 키 때문이며 수동으로 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      # [DEBUG-seg] 종료 코드 139 탐침. 병합 전에 되돌린다.
      # 한 스텝 안에서 파이프 없이 차례로. 변수를 하나씩만 바꾼다.
      - run: |
          set +e
          uv run pytest -q
          echo "[DEBUG-seg] A as-is exit=$?"
          uv run pytest -q
          echo "[DEBUG-seg] A2 as-is again exit=$?"
          uv run pytest -q > /tmp/b.log 2>&1
          echo "[DEBUG-seg] B redirected to file exit=$?"
          uv run pytest -q -p no:faulthandler
          echo "[DEBUG-seg] C no pytest faulthandler exit=$?"
          PYTHONFAULTHANDLER=1 uv run pytest -q
          echo "[DEBUG-seg] D PYTHONFAULTHANDLER exit=$?"
          uv run pytest -q tests/channel/http/test_router.py
          echo "[DEBUG-seg] E router only exit=$?"
          uv run pytest -q --ignore=tests/channel/http/test_router.py
          echo "[DEBUG-seg] F without router exit=$?"
          exit 1
