# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다.
# LLM 호출 테스트(-m llm)는 돌리지 않는다. 비용과 키 때문이며 수동으로 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # [DEBUG-seg] 종료 코드 139 탐침. 병합 전에 되돌린다. 변형마다 새 체크아웃에서 첫 pytest 를 본다.
    strategy:
      fail-fast: false
      matrix:
        variant: [control, strip, nogather, nomodel, nostored, no422]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      # 방아쇠는 lint-imports 뒤의 첫 pytest 다(넷째 탐침). 변형마다 그 조건을 새로 세운다.
      - run: |
          set +e
          v="${{ matrix.variant }}"
          uv run lint-imports >/dev/null
          export PYTHONFAULTHANDLER=1
          case "$v" in
            control) uv run pytest -q; code=$? ;;
            strip)
              sed -i 's/Annotated\[str, Field(min_length=1), AfterValidator(_trimmed)\]/Annotated[str, StringConstraints(strip_whitespace=True, min_length=1)]/; s/^from pydantic import AfterValidator, BaseModel, ConfigDict, Field$/from pydantic import AfterValidator, BaseModel, ConfigDict, Field, StringConstraints/' src/agent_os/channel/http/router.py
              grep -n "reason: Annotated" src/agent_os/channel/http/router.py
              uv run pytest -q; code=$? ;;
            nogather) uv run pytest -q -k "not 한_루프에서_동시에"; code=$? ;;
            nomodel) uv run pytest -q -k "not 거부하면_approval_denied and not 재개_스트림은_멈추기_전에 and not 재개가_다시_멈추면"; code=$? ;;
            nostored) uv run pytest -q -k "not 재개할_수_없는_실행은 and not 기록이_깨진_실행은 and not 재개_뒤_첫_호출이 and not 없는_실행에_결정을"; code=$? ;;
            no422) uv run pytest -q -k "not 결정의_모양이_틀리면 and not 결정에_승인자나_주체를 and not 패턴을_어기는_실행_식별자는"; code=$? ;;
          esac
          echo "[DEBUG-seg] $v exit=$code"
          exit 1
