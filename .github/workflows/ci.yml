# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다. 파이썬, web, e2e, 사진 비교(visual), 커밋
# 검사(ticket)가 잡 다섯으로 함께 돌고, 필수 검사는 그 결과를 모으는 verify 하나다(ADR 0005, ADR 0021의 2026-10-01 이력
# 둘, ADR 0037). 잡을 더하면 verify 의 needs 에 넣는다. 빠뜨리면 verify 가 빨갛다. e2e 와 사진 비교는 pre-commit 에
# 없고 CI 에만 있다(ADR 0026).
# LLM 호출 테스트(-m llm)는 돌리지 않는다. 비용과 키 때문이며 수동으로 돌린다.
# 체크아웃하는 잡은 모두 persist-credentials: false 다. 모두 PR 의 코드를 짓고 돌리는데 체크아웃 뒤에 github.com 을 상대로
# 한 git 명령(push, 인증된 fetch)이 없어서, 체크아웃 토큰을 .git/config 에 남기지 않는다(PR #158 의 CodeRabbit, CWE-522).
# 워크플로 하드닝은 zizmor 가 판정한다(ADR 0027, 설정은 .github/zizmor.yml). 빠뜨리면 artipacked 가, 서드파티 액션을 해시
# 대신 태그로 가져오면 unpinned-uses 가 python 잡을 빨갛게 한다. 자격 증명이 필요한 잡이 생기면 그 체크아웃 줄에
# `# zizmor: ignore[artipacked]` 와 까닭을 함께 둔다.
# 잡마다 timeout-minutes 를 둔다. 없으면 기본값 360분까지 매달린다. PR #195 의 visual 잡이 컨테이너 초기화에서 18분
# 넘게 멈췄다(대기열 204). 컨테이너 초기화도 잡의 스텝이라 잡의 제한에 든다고 본다(어림). 값은 최근 성공 실행의 잡별
# 최대의 네 배 이상이다. 그 수치는 .scratch/harness/probes/ci_job_durations.py 가 내고, 잰 결과는 같은 폴더 README 의
# 그 프로브 행에 둔다. 캐시를 놓친 설치가 얼마나 더 걸리는지는 재지 않은 어림의 여유다. 잡이 자라 제한에 닿으면 그
# 프로브를 다시 돌려 값을 고친다. 지난 실행이 없는 새 잡의 첫 값은 어림이고, 그 잡이 든 실행으로 프로브를 다시 돌려
# 고친다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 인터프리터가 충돌해도 단서를 남긴다(대기열 36). PR #78 의 첫 실패 로그는 "545 passed" 뒤 종료 코드 139 뿐이었다.
  # pytest 의 faulthandler 는 세션이 끝나며 꺼지므로 PYTHONFAULTHANDLER 로 종료 중 충돌의 파이썬 쪽 스택을 찍고, 코어를
  # 남겨 실패하면 gdb 로 C 스택을 찍는다. core_pattern 은 시스템 전역이라 앞 스텝에서 바꾸고, ulimit -c 는 셸마다라
  # pytest 를 돌리는 그 스텝 안에서 건다. 일부러 충돌시켜 손으로 봤다(일지 2026-10-16-14). 종료 중 충돌은 파이썬 스택과 C
  # 스택이 둘 다 남았고, 테스트 도중의 충돌은 C 스택만 남았다(파이썬 스택은 pytest 가 붙잡은 stderr 에 갇힌 것으로
  # 본다. 어림). 코어 이름은 core.pytest.<pid> 였다. %e 가 스크립트 이름이 되므로 코어를 이름으로 거르지 않는다.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
      - run: |
          ulimit -c unlimited || echo "::warning::ulimit -c 를 올리지 못해 코어가 남지 않는다."
          uv run pytest -q
      - run: uv run python tools/check_instructions.py
      - run: uv run python tools/check_type_escapes.py
      - run: uv run python tools/run_hooks.py
      - run: uv run zizmor --offline --strict-collection --config .github/zizmor.yml .
      - if: failure()
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "코어 덤프가 없다."
            exit 0
          fi
          command -v gdb > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q gdb; }
          python=$(readlink -f .venv/bin/python)
          for core in "${cores[@]}"; do
            echo "::group::$core"
            gdb -batch -ex bt -ex "info sharedlibrary" "$python" "$core"
            echo "::endgroup::"
          done

  # web 워크스페이스. pnpm 판은 web/package.json 의 packageManager 가 정하고, 스토어를 락파일로 캐시한다.
  # verify 의 test 단계가 디자인 시스템의 스토리 테스트를 실제 chromium 에서 돌아(ADR 0026) 그 전에 브라우저를 깐다.
  # 모양은 e2e 잡과 같다. 헤드리스 셸 하나이고, Playwright 판이 같으면 캐시에서 되살리며, 시스템 의존성은 매번 깐다.
  # 브라우저가 없으면 스토리 테스트는 건너뛰지 않고 실패한다.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm -C web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web exec playwright install-deps chromium
      - run: pnpm -C web verify

  # e2e. 실제 serve 와 시작 래퍼로 띄운 관리 화면을 지난다. 준비(e2e/stack.ts)가 serve 를 uv 의 가상 환경으로 띄우므로
  # 파이썬과 web 을 둘 다 준비한다. 브라우저는 헤드리스 셸 하나이고, Playwright 판이 같으면 캐시에서 되살린다.
  # 시스템 의존성은 캐시에 들지 않아 매번 깐다. 브라우저가 없으면 e2e 는 건너뛰지 않고 실패한다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm -C web/apps/admin exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web/apps/admin exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web/apps/admin exec playwright install-deps chromium
      - run: pnpm -C web/apps/admin exec playwright test

  # 사진 비교(ADR 0026). 판을 고정한 Playwright 이미지를 잡의 컨테이너로 쓰고, 그 안에서 설치하고 Storybook 정적 빌드를
  # 지은 뒤 커밋한 정답 사진(web/packages/ui/visual/snapshots/)과 비교한다. 이미지는 로컬 명령의 것과 같다(web/tools/visual.ts
  # 의 IMAGE, visual.test.ts 가 본다). --ipc=host 는 정답을 만든 로컬 컨테이너와 같은 조건이다. 네트워크는 설치에만 쓰고,
  # 테스트는 정적 빌드 밖으로 나간 요청이 하나라도 있으면 실패한다. 실패하면 실제 사진·정답·차이 그림을 아티팩트로 남긴다.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web/packages/ui run build-storybook
      - run: pnpm -C web/packages/ui exec playwright test -c visual/playwright.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: web/packages/ui/visual/test-results/
          retention-days: 14

  # 커밋 검사(tools/check_ticket.py, ADR 0037)를 PR 마다 한다. 훅을 깔지 않은 클론이나 훅을 건너뛴 커밋도 여기서
  # 잡히고, 가리키는 티켓의 Status: 가 done 인지도 본다. 판정과 입력은 그 도구의 독스트링 "CI" 가 원천이다. 체크아웃은
  # 기본(PR 의 병합 커밋)을 전체 이력으로 받는다. 머리 커밋을 체크아웃하지 않는 것은 규약 전에 딴 PR 의 머리에는 검사
  # 도구가 없어서다. PR 의 값은 식으로 run 에 펼치지 않고 env 로 넘긴다(zizmor 의 템플릿 주입 판정, ADR 0027).
  # push 실행에서는 머리 브랜치가 비어 한 줄을 찍고 지나므로, verify 가 건너뛴 잡을 빨강으로 보는 것에 걸리지 않는다.
  # 도구는 표준 라이브러리만 써서 uv 없이 러너의 python3 으로 돈다. 출력에 PR 이 고른 브랜치·파일 이름이 실리므로
  # 도구를 부르기 전에 워크플로 명령을 멈추고 이 스텝 끝까지 다시 켜지 않는다. 토큰을 대입으로 받는 것은 uuidgen 이
  # 없을 때 빈 토큰으로 지나지 않고 그 자리에서 실패하게 하려는 것이다(bash -e 에서 echo 의 인자 안의 명령 치환은
  # 실패해도 이어진다). 근거는 GitHub 문서 "Stopping and starting workflow commands"
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands)이고, 2026-10-22 에 그 본문을
  # 내려받아 대 봤다. 토큰은 실행마다 무작위로 고유해야 하고, 문서의 ubuntu-latest 예시가 토큰을 uuidgen 으로 짓는다.
  # timeout-minutes 는 verify 와 같은 5 다. 처음의 어림 10 을, 이 잡이 든 첫 성공 실행(PR #355)을 잰 0.1분으로
  # 고쳤다(머리 주석의 프로브).
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          marker=$(uuidgen)
          echo "::stop-commands::$marker"
          python3 tools/check_ticket.py --ci

  # 필수 검사. 건너뛴 잡은 필수 검사여도 성공으로 보고되고(GitHub 문서), 앞 잡이 실패하면 needs 로 이은 잡은
  # 기본적으로 건너뛴다. 그래서 always() 로 언제나 돌고, needs 의 결과가 모두 success 일 때만 초록이다.
  # failure 뿐 아니라 cancelled 와 skipped 도 빨강이다.
  # needs 에 없는 잡은 필수 검사 밖에서 돈다. 그래서 같은 실행의 모든 시도(filter=all)의 잡 이름을 API 로 읽어, 자기
  # 밖의 잡이 needs 에 없으면 빨강이다. 지금 시도만 읽지 않는 것은, 실패한 잡만 다시 돌린 시도에서는 앞 시도의 잡이
  # 새 시도로 옮겨지는 중이라 목록에서 빠질 수 있기 때문이다. 잡에 name: 을 두지 않으므로 API 의 잡 이름이 잡 id 와
  # 같다. 읽은 목록에 verify 자신이 없으면(빈 목록이면) 비교할 것이 없어 조용히 초록이 되므로 그것도 빨강이다.
  # 일부러 필수 검사 밖에 둘 잡이 생기면 아래 차집합에 그 이름을 예외로 더한다. verify 뒤에 도는 잡(needs: [verify])은
  # 첫 시도에서는 verify 가 도는 동안 목록에 없어 이 검사가 보지 못하고, 순환이라 needs 에 넣을 수도 없다. 그런 잡은
  # 필수 검사 밖이다(ADR 0021의 둘째 2026-10-01 이력, PR #119 실험).
  verify:
    if: always()
    needs: [python, web, e2e, visual, ticket]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          pages=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100")
          names=$(jq -c '[.[].jobs[].name] | unique' <<< "$pages")
          echo "이 실행의 잡: $names"
          if ! jq -e 'index("verify") != null' <<< "$names" > /dev/null; then
            echo "::error::잡 목록에 verify 가 없다. 목록을 읽지 못한 것이다."
            exit 1
          fi
          outside=$(jq -c --argjson needs "$NEEDS" '. - ["verify"] - ($needs | keys)' <<< "$names")
          if [ "$outside" != "[]" ]; then
            echo "::error::verify 의 needs 에 없는 잡: $outside. 필수 검사 밖에서 돈다."
            exit 1
          fi
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
