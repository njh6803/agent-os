# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다. 파이썬, web, e2e 가 잡 셋으로
# 함께 돌고, 필수 검사는 그 결과를 모으는 verify 하나다(ADR 0005, ADR 0021 이력). 잡을 더하면 verify 의 needs 에
# 넣는다. 빠뜨리면 verify 가 빨갛다. e2e 는 pre-commit 에 없고 CI 에만 있다.
# LLM 호출 테스트(-m llm)는 돌리지 않는다. 비용과 키 때문이며 수동으로 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -q
      - run: uv run python tools/check_instructions.py
      - run: uv run python tools/check_type_escapes.py
      - run: uv run python tools/run_hooks.py

  # web 워크스페이스. pnpm 판은 web/package.json 의 packageManager 가 정하고, 스토어를 락파일로 캐시한다.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web verify

  # e2e. 실제 serve 와 시작 래퍼로 띄운 관리 화면을 지난다. 준비(e2e/stack.ts)가 serve 를 uv 의 가상 환경으로 띄우므로
  # 파이썬과 web 을 둘 다 준비한다. 브라우저는 헤드리스 셸 하나이고, Playwright 판이 같으면 캐시에서 되살린다.
  # 시스템 의존성은 캐시에 들지 않아 매번 깐다. 브라우저가 없으면 e2e 는 건너뛰지 않고 실패한다.
  e2e:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm -C web/apps/admin exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web/apps/admin exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web/apps/admin exec playwright install-deps chromium
      - run: pnpm -C web/apps/admin exec playwright test

  # 필수 검사. 건너뛴 잡은 필수 검사여도 성공으로 보고되고(GitHub 문서), 앞 잡이 실패하면 needs 로 이은 잡은
  # 기본적으로 건너뛴다. 그래서 always() 로 언제나 돌고, needs 의 결과가 모두 success 일 때만 초록이다.
  # failure 뿐 아니라 cancelled 와 skipped 도 빨강이다.
  # needs 에 없는 잡은 필수 검사 밖에서 돈다. 그래서 같은 실행 시도의 잡 이름을 API 로 읽어, 자기 밖의 잡이 needs 에
  # 없으면 빨강이다. 잡에 name: 을 두지 않으므로 API 의 잡 이름이 잡 id 와 같다. 읽은 목록에 verify 자신이 없으면
  # (빈 목록이면) 비교할 것이 없어 조용히 초록이 되므로 그것도 빨강이다. 일부러 필수 검사 밖에 둘 잡이 생기면 아래
  # 차집합에 그 이름을 예외로 더한다. verify 뒤에 도는 잡(needs: [verify])은 verify 가 도는 동안 목록에 없어 이 검사가
  # 보지 못하고, 순환이라 needs 에 넣을 수도 없다. 그런 잡은 필수 검사 밖이다(ADR 0021 이력, PR #119 실험).
  verify:
    if: always()
    needs: [python, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '[.jobs[].name]')
          echo "이 실행의 잡: $names"
          if ! jq -e 'index("verify") != null' <<< "$names" > /dev/null; then
            echo "::error::잡 목록에 verify 가 없다. 목록을 읽지 못한 것이다."
            exit 1
          fi
          outside=$(jq -c --argjson needs "$NEEDS" '. - ["verify"] - ($needs | keys)' <<< "$names")
          if [ "$outside" != "[]" ]; then
            echo "::error::verify 의 needs 에 없는 잡: $outside. 필수 검사 밖에서 돈다."
            exit 1
          fi
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
