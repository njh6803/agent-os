# Claude Code Review. PR의 유일한 리뷰 봇. 담당은 유지보수성·경계.
# 보안·버그·성능은 PR 직전 CodeRabbit CLI가 본다.
# 역할 분담과 "초록 착시"는 docs/constitution/operations.md의 리뷰 파이프라인.
# 시크릿 CLAUDE_CODE_OAUTH_TOKEN은 사람이 `claude setup-token`으로 만들어 저장소 시크릿에 넣는다.
# 이 파일을 바꾼 PR에서는 토큰 검증에 실패해 리뷰 없이 초록이 될 수 있다(선행 저장소 실측).
# 워크플로 변경은 별도 PR로 먼저 병합한다.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 같은 PR에 푸시가 이어지면 앞선 리뷰를 취소한다. 낡은 diff에 코멘트가 달리는 것을 막는다.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 기본값은 Claude의 메시지를 숨긴다. 코멘트 없는 초록의 원인을 보려면 켜야 한다(PR #2 실측).
          show_full_output: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: >-
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "코드 리뷰 코멘트(요약 코멘트와 인라인 코멘트 모두)는 한국어로 쓴다. 코드 식별자, 파일 경로, 기술 용어는 원문 그대로 둔다. 리뷰를 시작하기 전에 저장소 루트의 CLAUDE.md와 그것이 임포트하는 docs/constitution/principles.md, CODING_STANDARDS.md, CONTEXT.md를 읽는다. 변경된 파일의 경로에 해당하는 .claude/rules/*.md가 있으면 함께 읽는다. 각 파일의 paths 프론트매터로 판단한다. 이 저장소는 2단계 리뷰 파이프라인을 쓰고 당신의 담당은 유지보수성과 경계다. 유지보수성은 CODING_STANDARDS.md의 리뷰 관점 넷만 다룬다. 이 추상화가 값을 하는가 / 이름이 CONTEXT.md의 용어를 반영하는가 / 이 모듈이 하나의 이유로만 바뀌는가 / 테스트가 행동을 검증하는가. CODING_STANDARDS.md의 판단 기준 위반도 지적한다. 경계는 원칙 IV 중 import-linter가 못 보는 것이다. LangGraph, LangChain, anthropic, mcp의 타입이 반환값이나 예외로 sdk, channel, admin에 새는지. sdk의 계약(이벤트, 매니페스트)이 바뀌었는데 schema_version, .claude/rules/sdk.md, ADR, 명세가 같이 바뀌지 않았는지. core의 포트 다섯 밖에 새 포트나 유스케이스 클래스가 생겼는지. 심각도는 CODING_STANDARDS.md의 분류를 쓰고 코멘트마다 [Critical] [Major] [Minor] [Nit] 태그를 단다. "리뷰하지 않는 것"(포맷, 린트, 타입 오류, import 경계, 생성물)은 CI가 담당하므로 코멘트하지 않는다. 보안과 성능은 PR 직전 CodeRabbit CLI가 담당하므로 코멘트하지 않는다. 단 Critical 등급의 보안 문제 (이벤트나 로그에 비밀이 실림, 검증 없는 코드 실행)는 예외로 [Critical] 태그를 달아 지적한다. 근거 없는 "~일 수 있다"는 쓰지 않는다. 지적이 없으면 없다고 짧게 쓴다."
