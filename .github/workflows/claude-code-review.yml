# Claude Code Review. PR 봇 둘 중 하나. 담당은 유지보수성·경계.
# 보안·버그·성능은 PR 직전 CodeRabbit CLI와 PR의 CodeRabbit이 본다.
# 역할 분담과 "초록 착시"는 docs/constitution/operations.md의 리뷰 파이프라인.
# 시크릿 CLAUDE_CODE_OAUTH_TOKEN은 사람이 `claude setup-token`으로 만들어 저장소 시크릿에 넣는다.
# 이 파일을 바꾼 PR에서는 액션이 리뷰를 건너뛰고 초록이 된다(PR #3 실측). 사유는 위 문서.
#
# 플러그인 대신 직접 프롬프트. 단일 에이전트가 요약 코멘트를 남기는 것이 완료 조건이고 뒤의 스텝이
# 그 코멘트를 검사한다. 이유는 위 문서의 리뷰 파이프라인.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 같은 PR에 푸시가 이어지면 앞선 리뷰를 취소한다. 낡은 diff에 코멘트가 달리는 것을 막는다.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Record start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 기본값은 Claude의 메시지를 숨긴다. 코멘트 없는 초록의 원인을 보려면 켜야 한다(PR #2 실측).
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰하고 요약 코멘트를 하나 남긴다. 한국어로 쓴다. 코드 식별자, 파일 경로, 기술 용어는 원문 그대로 둔다.

            절차. 이 턴 안에서 직접 읽고 직접 판단한다.
            1. `gh pr view $PR --json title,body`와 `gh pr diff $PR`로 설명과 diff를 읽는다.
            2. 저장소 루트의 CLAUDE.md와 그것이 임포트하는 docs/constitution/principles.md, CODING_STANDARDS.md, CONTEXT.md를 읽는다. 바뀐 파일의 경로에 해당하는 .claude/rules/*.md가 있으면 함께 읽는다. 각 파일의 paths 프론트매터로 판단한다.
            3. 담당은 유지보수성과 경계다. 유지보수성은 CODING_STANDARDS.md의 리뷰 관점 넷과 판단 기준을 적용한다. 경계는 원칙 IV 중 import-linter가 못 보는 것이다. LangGraph, LangChain, anthropic, mcp의 타입이 반환값이나 예외로 sdk, channel, admin에 새는지. sdk의 계약(이벤트, 매니페스트)이 바뀌었는데 schema_version, .claude/rules/sdk.md, ADR, 명세가 같이 바뀌었는지. core의 포트 다섯 밖에 새 포트나 유스케이스 클래스가 생겼는지.
            4. 심각도는 CODING_STANDARDS.md의 분류를 쓰고 지적마다 [Critical] [Major] [Minor] [Nit] 태그를 단다. 범위는 위 두 축뿐이다. CODING_STANDARDS.md의 "리뷰하지 않는 것"은 CI가, 보안과 성능은 PR 직전 CodeRabbit CLI가 맡는다. 예외 하나, Critical 등급의 보안 문제(이벤트나 로그에 비밀이 실림, 검증 없는 코드 실행)는 [Critical] 태그로 적는다. 지적은 근거를 댄 확정 진술로 쓴다.
            5. 완료 조건: 요약을 파일에 쓰고 `gh pr comment $PR --body-file <파일>`로 게시한다. 제목은 "## 코드 리뷰". 지적이 없으면 "지적 없음"과 무엇을 봤는지 두 줄. 파일과 행이 특정되는 지적은 mcp__github_inline_comment__create_inline_comment로 인라인 코멘트도 남길 수 있다. 코멘트가 게시된 것을 확인한 뒤 끝낸다.
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --max-turns 40

      - name: Fail when Claude left no comment
        # 초록 착시를 빨강으로. 실행 시작 뒤 생긴 claude[bot] 코멘트가 0개면 실패한다.
        # 워크플로 파일을 바꾼 PR은 액션이 건너뛰므로(위 5행) 이 검사도 건너뛴다.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STARTED_AT: ${{ steps.start.outputs.at }}
        run: |
          if gh pr diff "$PR" --name-only | grep -q '^\.github/workflows/'; then
            echo "워크플로 변경 PR: 액션이 건너뛰므로 검사도 건너뛴다"
            exit 0
          fi
          # --paginate는 페이지마다 배열을 따로 내므로 jq -s로 먼저 합친 뒤 센다
          count="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -s --arg t "$STARTED_AT" 'add | map(select(.user.login == "claude[bot]" and .created_at >= $t)) | length')"
          echo "claude[bot] 코멘트 (${STARTED_AT} 이후): ${count}"
          if [ "$count" = "0" ]; then
            echo "::error::Claude Code Review가 코멘트를 남기지 않았다. 초록이 리뷰를 뜻하지 않으므로 실패로 만든다."
            exit 1
          fi
